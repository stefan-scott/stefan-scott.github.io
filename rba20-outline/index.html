<script id="site-data" type="application/json">{"site_title":"Robotics 20 2025-26 T1","modules":[{"id":"gc4f6a1754b9c935275a2b9c0d27f7846","slug":"01-introduction-to-robotics","title":"Introduction to Robotics","order":1,"items":[{"id":"ge67bd54bfd04f1432e72cd67c7b2250c","kind":"file","title":"Robotics 2030 - first day syllabus presentation.pptx","nav_title":"Robotics 2030 - first day syllabus presentation.pptx","position":4,"published":true,"media_path":"media/web_resources/Robotics-2030-first-day-syllabus-presentation.pptx"},{"id":"gdeed403d6b1560b4ef9dbc392bf44e0a","kind":"file","title":"Course Outline - Robotics 20.doc","nav_title":"Course Outline - Robotics 20.doc","position":5,"published":true,"media_path":"media/web_resources/Course-Outline-Robotics-20.doc"},{"id":"gf0089868c4f2a5c847aea883fc920f33","kind":"page","title":"About Yourself","nav_title":"About Yourself","position":6,"published":true,"content_html":"<p><iframe src=\"https://docs.google.com/forms/d/e/1FAIpQLSfN9fCpmm4AROgZvLgdyHgVVlyuGTIbti38tO71XKAiJaA6sQ/viewform?embedded=true\" width=\"640\" height=\"2659\" loading=\"lazy\"></iframe></p>\n\n"}]},{"id":"gcfe1200dc6d7e0f26a0d4845cbd0d568","slug":"02-goto-websites","title":"GOTO Websites","order":2,"items":[{"id":"gecec04d953a9cb7e4b8f9bfb2234107a","kind":"weblink","title":"MakeCode Editor","nav_title":"MakeCode Editor","position":1,"published":true,"external_url":"https://makecode.microbit.org/"}]},{"id":"g74bc493f8960ba5ecd5f1813272a8f04","slug":"03-reference-material","title":"Reference Material","order":3,"items":[{"id":"g64ed97073835cc9604a9d013383686bf","kind":"page","title":"Component Handbook (slides)","nav_title":"Component Handbook (slides)","position":1,"published":true,"content_html":"<p><iframe src=\"https://docs.google.com/presentation/d/e/2PACX-1vRqO6xn8rtXSyZSPR9ZJcvmmY2DIwEJCfZ2WgM1fJzl2r_-5OpO-4-hpB0S2vUP8Ov2sQ33gwDvDxX3/pubembed?start=false&amp;loop=false&amp;delayms=3000\" width=\"960\" height=\"569\" loading=\"lazy\" allowfullscreen=\"allowfullscreen\" webkitallowfullscreen=\"webkitallowfullscreen\" mozallowfullscreen=\"mozallowfullscreen\"></iframe></p>\n\n"}]},{"id":"gb44d7e276abd5630686dacfe03064e17","slug":"04-microbit-getting-started","title":"Microbit - Getting Started","order":4,"items":[{"id":"gd33bde00f0c6aa20dcb8200b1330051d","kind":"assignment","title":"Micro:Bit Tutorial Set","nav_title":"Micro:Bit Tutorial Set","position":1,"published":true,"content_html":"<div class=\"item-meta\"><span class=\"meta-points\"><strong>Points:</strong> 5.0</span> &middot; <span class=\"meta-submission\"><strong>Submission type:</strong> online upload</span> &middot; <span class=\"meta-ext\"><strong>Allowed file types:</strong> hex,zip</span></div><p>For our first&nbsp;<em>on-your-own</em> Micro:bit projects, you'll work through&nbsp;<strong>five tutorials</strong> on the&nbsp;<strong>MakeCode</strong> website. Each is quite short, but the collection will give some practice to writing small programs.</p>\n<p>Navigate to <a href=\"https://makecode.microbit.org/\" target=\"_blank\">https://makecode.microbit.org/</a>&nbsp;</p>\n<p>&nbsp;</p>\n<p><span style=\"text-decoration: underline; font-size: 18pt;\"><strong>Tutorials to Complete:</strong></span></p>\n<ul>\n<li>Coin Flipper&nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp;- <em>listed under Games</em></li>\n<li>Blow Away <strong>OR</strong> Clap Lights (your choice)&nbsp; &nbsp; <em>- listed under Tutorials for the new Microbit (v2)</em></li>\n<li>RPS v2 &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp;<em>- listed under Games</em></li>\n<li>Snap the Dot &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp;<em>- listed under Games</em></li>\n<li>Pet Hamster&nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp;<em>- listed under Tutorials for the new Microbit (v2)</em></li>\n</ul>\n<p>&nbsp;</p>\n<p><span style=\"text-decoration: underline; font-size: 18pt;\"><strong>What to Submit:</strong></span></p>\n<p>When you complete each project, download the code to your computer as a .hex file.&nbsp; To complete this assignment submit your&nbsp;<strong>five .hex files&nbsp;</strong>here.<em> You may either attach all five files to your project submission, or you can ZIP them into a single file and submit that instead.</em></p>\n\n"},{"id":"g002b5b460acc9ebaf86705f493fd9ac8","kind":"assignment","title":"Security System Assignment","nav_title":"Security System Assignment","position":2,"published":true,"content_html":"<div class=\"item-meta\"><span class=\"meta-points\"><strong>Points:</strong> 10.0</span> &middot; <span class=\"meta-submission\"><strong>Submission type:</strong> online upload</span> &middot; <span class=\"meta-ext\"><strong>Allowed file types:</strong> hex</span></div><p><img src=\"media/web_resources/Uploaded-Media/microbit-security-logo.png\" alt=\"microbit security logo.png\" width=\"466\" height=\"257\" data-api-endpoint=\"https://canvas.instructure.com/api/v1/courses/12681309/files/311063188\" data-api-returntype=\"File\" loading=\"lazy\"></p>\n<p>For this assignment, you've been hired by a museum to design a simple&nbsp;<strong>security system</strong> for a display which is housed in a glass case on a pedastal. You'll implement it using the&nbsp;<strong>micro:bit</strong> and some of its&nbsp;<strong>onboard components.</strong>&nbsp;</p>\n<p><span style=\"font-size: 18pt;\"><strong><br>Project Requirements</strong></span></p>\n<p><span style=\"text-decoration: underline;\">1. Arm the System</span></p>\n<p>The system should have two possible states:&nbsp;<span style=\"background-color: #f8cac6;\"><strong>Armed</strong></span> and&nbsp;<span style=\"background-color: #bfedd2;\"><strong>Unarmed</strong></span></p>\n<p style=\"padding-left: 40px;\">Pressing&nbsp;<strong>Button A</strong> will&nbsp;set the security system state to&nbsp;<strong>Armed</strong></p>\n<ul>\n<li style=\"list-style-type: none;\">\n<ul>\n<li style=\"list-style-type: none;\">\n<ul>\n<li>When armed, it is possible to for the alarm to be triggered</li>\n</ul>\n</li>\n</ul>\n</li>\n</ul>\n<p style=\"padding-left: 40px;\">Pressing&nbsp;<strong>Button B</strong> will set the security system state to&nbsp;<strong>Disarmed</strong></p>\n<ul>\n<li style=\"list-style-type: none;\">\n<ul>\n<li style=\"list-style-type: none;\">\n<ul>\n<li>In this state, the alarmed can't be triggered. (Good for maintenance)</li>\n<li>If the alarm had been&nbsp;<strong>triggered,</strong> <em>disarming will also reset the alarm state.</em></li>\n</ul>\n</li>\n</ul>\n</li>\n</ul>\n<p>&nbsp;</p>\n<p><span style=\"text-decoration: underline;\">2. Movement Detection</span></p>\n<p style=\"padding-left: 40px;\">When the system is armed, it should be sensitive to movement. We'll think of the micro:bit as being attached to the glass display case. If the it can sense any movement, the alarm should be triggered.</p>\n<ul>\n<li style=\"list-style-type: none;\">\n<ul>\n<li>Use the <strong>acceleration (mg) strength</strong> value to measure any movement of your microbit<br><img src=\"media/web_resources/Uploaded-Media/accel-strength-image.png\" alt=\"accel strength image.png\" width=\"337\" height=\"59\" data-api-endpoint=\"https://canvas.instructure.com/api/v1/courses/12681309/files/311129048\" data-api-returntype=\"File\" loading=\"lazy\"><br>&nbsp; &nbsp; &nbsp; - try accessing this value from within a <strong>forever loop</strong> and printing it out in the Serial Monitor. Set the microbit down on a flat surface (LED grid up) and observe what value is being printed out. This is your <strong>AT REST</strong> value.<br><br><br></li>\n<li>Add some logic to your program that should be&nbsp;<em>continually running:</em></li>\n</ul>\n</li>\n</ul>\n<p style=\"padding-left: 80px;\">If the system is <strong>Armed:</strong></p>\n<p style=\"padding-left: 120px;\">If the acceleration reading is either <span style=\"background-color: #fbeeb8;\"><strong>50 higher</strong></span>&nbsp; &nbsp;or&nbsp; <span style=\"background-color: #fbeeb8;\"><strong>50 lower</strong></span>&nbsp; than your <strong>AT REST </strong>value<strong>,&nbsp; then Trigger the Alarm!</strong></p>\n<p>&nbsp;</p>\n<p><span style=\"text-decoration: underline;\">3. Alarm!!!</span></p>\n<p style=\"padding-left: 40px;\">The alarm state (triggered or not triggered) should be shown in two ways:</p>\n<ul>\n<li style=\"list-style-type: none;\">\n<ul>\n<li>Visually, display on the LED one of the following options:<br>\n<table style=\"border-collapse: collapse; width: 63.9476%; height: 251.65px;\" border=\"1\">\n<tbody>\n<tr style=\"height: 84.6px;\">\n<td style=\"width: 36.3315%; height: 84.6px;\"><img src=\"media/web_resources/Uploaded-Media/Security-System-System-Secure-DISARMED.png\" alt=\"Security System - System Secure - DISARMED.png\" width=\"308\" height=\"127\" data-api-endpoint=\"https://canvas.instructure.com/api/v1/courses/12681309/files/310780203\" data-api-returntype=\"File\" loading=\"lazy\"></td>\n<td style=\"width: 63.6292%; height: 84.6px;\">&nbsp;System Disarmed,&nbsp; Alarm Off</td>\n</tr>\n<tr style=\"height: 83.7px;\">\n<td style=\"width: 36.3315%; height: 83.7px;\"><img src=\"media/web_resources/Uploaded-Media/Security-System-System-Secure-OK.png\" alt=\"Security System - System Secure - OK.png\" width=\"301\" height=\"124\" data-api-endpoint=\"https://canvas.instructure.com/api/v1/courses/12681309/files/310780205\" data-api-returntype=\"File\" loading=\"lazy\"></td>\n<td style=\"width: 63.6292%; height: 83.7px;\">&nbsp;System Armed,&nbsp; &nbsp;Alarm Off</td>\n</tr>\n<tr style=\"height: 83.35px;\">\n<td style=\"width: 36.3315%; height: 83.35px;\"><img src=\"media/web_resources/Uploaded-Media/Security-System-System-Secure-ALARM.png\" alt=\"Security System - System Secure - ALARM.png\" width=\"305\" height=\"126\" data-api-endpoint=\"https://canvas.instructure.com/api/v1/courses/12681309/files/310780202\" data-api-returntype=\"File\" loading=\"lazy\"></td>\n<td style=\"width: 63.6292%; height: 83.35px;\">&nbsp;System Armed, Alarm Triggered</td>\n</tr>\n</tbody>\n</table>\n</li>\n<li>For sound, one of two sounds should be playing while the program is running:<br>\n<ul>\n<li>If the alarm is off, play a neutral/calm sound of your own design.\n<ul>\n<li>Volume should be set low for this sound.<br><br></li>\n</ul>\n</li>\n<li>If the alarm is triggered, play a sound (designed by you) that seems fitting to communicate that the alarm is going off.<br>\n<ul>\n<li>Volume can be raised for this sound.</li>\n</ul>\n</li>\n</ul>\n</li>\n</ul>\n</li>\n</ul>\n<p style=\"padding-left: 120px;\">&nbsp;</p>\n<p><strong><span style=\"font-size: 18pt;\">Tips</span></strong></p>\n<ul>\n<li>Adding Sound Blocks into a forever loop that is doing other things will slow it down quite a bit!&nbsp; You can create a&nbsp;<em>second forever loop</em> and use it to manage the sound code all on its own.\n<ul>\n<li>Adding multiple forever loops can introduce problems in larger more complex problems, but it will work for this project!<br><br></li>\n</ul>\n</li>\n<li>Think about what sort of information/data you want to keep track of (<em>one example might be whether or not the alarm has been triggered</em>).\n<ul>\n<li>Create one variable for each different piece of information needed to construct a solution.<br><img src=\"media/web_resources/Uploaded-Media/state-variable-ex-1.png\" alt=\"state variable ex 1.png\" width=\"230\" height=\"125\" data-api-endpoint=\"https://canvas.instructure.com/api/v1/courses/12681309/files/311171032\" data-api-returntype=\"File\" loading=\"lazy\"><br><img src=\"media/web_resources/Uploaded-Media/state-variable-ex-2.png\" alt=\"state variable ex 2.png\" width=\"315\" height=\"124\" data-api-endpoint=\"https://canvas.instructure.com/api/v1/courses/12681309/files/311171059\" data-api-returntype=\"File\" loading=\"lazy\"><br><img src=\"media/web_resources/Uploaded-Media/state-variable-ex-3-1.png\" alt=\"state variable ex 3-1.png\" width=\"318\" height=\"72\" data-api-endpoint=\"https://canvas.instructure.com/api/v1/courses/12681309/files/311171293\" data-api-returntype=\"File\" loading=\"lazy\"><br><br></li>\n</ul>\n</li>\n<li>Whenever a script is getting quite long or disorganized, consider making some&nbsp;<strong>functions</strong> to help tidy up your program!<br><br></li>\n</ul>\n<p><span style=\"font-size: 18pt;\"><strong>Submission</strong></span></p>\n<p style=\"padding-left: 40px;\">Before submitting, make sure to download your code and test on your actual micro:bit microcontroller.</p>\n<p style=\"padding-left: 40px;\">When you are sure you're complete:</p>\n<ul>\n<li style=\"list-style-type: none;\">\n<ul>\n<li style=\"list-style-type: none;\">\n<ul>\n<li>From MakeCode, click the&nbsp;<em>three dot menu</em>, and choose Download As File.&nbsp; &nbsp;This should provide you with the .hex file of your code</li>\n<li>Submit the completed .hex file here!</li>\n</ul>\n</li>\n</ul>\n</li>\n</ul>\n<p>&nbsp;</p>\n<p><span style=\"font-size: 18pt;\"><strong>Need Some Help?</strong></span></p>\n<p style=\"padding-left: 40px;\"><span style=\"font-size: 12pt;\">If you're feeling a bit lost or have one feature that is giving you trouble, below is a&nbsp;<em>walkthrough video</em> that presents a \"solve-it-together\" approach to this assignment. You can refer to part of the video, or the whole thing is necessary. Just make sure you've given the problem a fair shake on your own first!<br><br></span></p>\n<p><iframe title=\"YouTube video player\" src=\"https://www.youtube.com/embed/zDOjYn8oiO0?si=HRJ0KkjiMVkdPOXx\" width=\"560\" height=\"315\" loading=\"lazy\" allowfullscreen=\"allowfullscreen\" allow=\"accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share\"></iframe></p>\n<p>&nbsp;</p>\n<p>&nbsp;</p>\n<p>&nbsp;</p>\n\n"}]},{"id":"gd526b664d72f9c001bc8b01656bb24f8","slug":"05-microbit-alligator-clip-circuits","title":"Microbit - Alligator Clip Circuits","order":5,"items":[{"id":"g8126d49b5fdf23d14cef5468a9203a26","kind":"assignment","title":"Simple Traffic Lights","nav_title":"Simple Traffic Lights","position":1,"published":true,"content_html":"<div class=\"item-meta\"><span class=\"meta-points\"><strong>Points:</strong> 10.0</span> &middot; <span class=\"meta-submission\"><strong>Submission type:</strong> online upload</span></div><p data-start=\"65\" data-end=\"174\"><span style=\"font-size: 18pt;\"><strong data-start=\"65\" data-end=\"92\">Traffic Lights Project:<br></strong></span><br data-start=\"92\" data-end=\"95\"><em>Using an RGB LED, create a simple traffic light system.</em></p>\n<p data-start=\"176\" data-end=\"193\"><span style=\"font-size: 14pt;\"><strong data-start=\"176\" data-end=\"193\">Requirements:</strong></span></p>\n<p style=\"padding-left: 40px;\" data-start=\"195\" data-end=\"325\"><span style=\"text-decoration: underline;\">RGB LED<br></span><br data-start=\"206\" data-end=\"209\">Use an RGB LED as a simulated traffic light displaying <span style=\"background-color: #bfedd2; color: #000000;\"><strong data-start=\"264\" data-end=\"273\">green</strong>,</span> <span style=\"background-color: #fbeeb8;\"><strong data-start=\"275\" data-end=\"285\">yellow</strong></span>, and <span style=\"background-color: #f8cac6;\"><strong data-start=\"291\" data-end=\"298\">red</strong></span> with the following timing:</p>\n<ul>\n<li style=\"list-style-type: none;\">\n<ul>\n<li style=\"list-style-type: none;\">\n<ul>\n<li data-start=\"195\" data-end=\"325\">Green — 4 seconds</li>\n<li data-start=\"195\" data-end=\"325\">Yellow — 1 seconds</li>\n<li data-start=\"195\" data-end=\"325\">Red — 5 seconds</li>\n</ul>\n</li>\n</ul>\n</li>\n</ul>\n<p style=\"padding-left: 40px;\" data-start=\"392\" data-end=\"466\"><em data-start=\"392\" data-end=\"466\">The pattern should continue to repeat as long as the program is running.</em></p>\n<p style=\"padding-left: 40px;\" data-start=\"392\" data-end=\"466\">&nbsp;</p>\n<p style=\"padding-left: 40px;\" data-start=\"468\" data-end=\"573\"><span style=\"text-decoration: underline;\">Walk Light Button<br></span><br data-start=\"489\" data-end=\"492\"><em>Use the onboard <strong>\"Button A\"</strong> as the walk light button. When this is pressed:</em></p>\n<ul>\n<li style=\"list-style-type: none;\">\n<ul>\n<li style=\"list-style-type: none;\">\n<ul>\n<li data-start=\"468\" data-end=\"573\">Wait until the light is red</li>\n<li data-start=\"468\" data-end=\"573\">Display a “W” on the micro:bit LED Matrix to indicate it is safe to walk. This should last until the light changes green again\n<ul>\n<li data-start=\"468\" data-end=\"573\"><span style=\"font-family: inherit; font-size: 1rem;\">At that point (anytime the walk light isn’t active), display a “S” to indicate for pedestrians to stop.</span></li>\n</ul>\n</li>\n</ul>\n</li>\n</ul>\n</li>\n</ul>\n<p><span style=\"font-family: inherit; font-size: 1rem;\"><span style=\"font-size: 14pt;\"><strong data-start=\"176\" data-end=\"193\"><br>What to Submit:</strong></span></span></p>\n<p><span style=\"font-family: inherit; font-size: 12pt;\">For this project, please submit:</span></p>\n<ul>\n<li><span style=\"font-family: inherit; font-size: 12pt;\">a video of your circuit in action</span></li>\n<li><span style=\"font-family: inherit; font-size: 12pt;\">a .hex file of your&nbsp;<strong>code</strong></span></li>\n</ul>\n<p>&nbsp;</p>\n\n"},{"id":"gf8f720872c45c3ca49add3548fbaa72f","kind":"page","title":"Challenge: RGB Cycling","nav_title":"Challenge: RGB Cycling","position":2,"published":true,"content_html":"<h3 data-start=\"67\" data-end=\"92\"><span style=\"background-color: #c71f23; color: #ffffff;\"><strong data-start=\"71\" data-end=\"92\">NOTE:&nbsp;</strong></span><span style=\"color: #ffffff;\"><strong data-start=\"71\" data-end=\"92\"> </strong><em><span style=\"color: #000000; font-size: 12pt;\">for fall 2025, this project isn't graded. If you're able to complete, please show me your work in person or include your video with another assignment submission (whatever project is next)</span></em></span></h3>\n<p>&nbsp;</p>\n<h3 data-start=\"67\" data-end=\"92\"><strong data-start=\"71\" data-end=\"92\">RGB Color Cycling</strong></h3>\n<p data-start=\"94\" data-end=\"331\">We saw this week that we can dim an LED by using the <code data-start=\"147\" data-end=\"160\">analogWrite</code> instruction. If we choose a different dimmed amount to the <strong data-start=\"220\" data-end=\"225\">R</strong>, <strong data-start=\"227\" data-end=\"232\">G</strong>, and <strong data-start=\"238\" data-end=\"243\">B</strong> LEDs that are automatically mixed in the RGB LED, it can produce many different colors.</p>\n<p data-start=\"333\" data-end=\"421\"><em data-start=\"333\" data-end=\"421\">What if we wanted to cycle smoothly through the colors in the color wheel (see below).</em></p>\n<p data-start=\"423\" data-end=\"459\"><img src=\"media/web_resources/Uploaded-Media/color-wheel.png\" alt=\"color wheel.png\" width=\"384\" height=\"393\" data-api-endpoint=\"https://canvas.instructure.com/api/v1/courses/12681309/files/311988440\" data-api-returntype=\"File\" loading=\"lazy\"></p>\n<p data-start=\"461\" data-end=\"631\">Your task for this exercise is to write a program that cycles through the color wheel by applying different <strong data-start=\"569\" data-end=\"593\">dimming values (PWM)</strong> to the <strong data-start=\"601\" data-end=\"630\">red, green, and blue LEDs</strong>.</p>\n<blockquote data-start=\"633\" data-end=\"770\">\n<p data-start=\"635\" data-end=\"770\"><strong data-start=\"635\" data-end=\"644\">NOTE:</strong> For this exercise, the <strong data-start=\"668\" data-end=\"675\">RGB</strong> values should <span style=\"text-decoration: underline;\">never all be the same number at the same time</span> as this produces <strong data-start=\"736\" data-end=\"751\">white light</strong> at some intensity.</p>\n</blockquote>\n<h3 data-start=\"200\" data-end=\"234\"><strong data-start=\"204\" data-end=\"234\">How to approach this task:</strong></h3>\n<p data-start=\"236\" data-end=\"444\">There are several ways to do this (with slightly different results). One common approach is to think of a position on the color wheel as a <em data-start=\"375\" data-end=\"396\">position in degrees</em>. Each <em data-start=\"403\" data-end=\"410\">angle</em> should produce a different color.</p>\n<p data-start=\"446\" data-end=\"567\">Use the following graph to determine what the values of the <strong data-start=\"506\" data-end=\"513\">RGB</strong> values should be at each possible angle from 0 - 360:</p>\n<p data-start=\"569\" data-end=\"628\">&nbsp;</p>\n<p data-start=\"569\" data-end=\"628\"><img src=\"media/web_resources/Uploaded-Media/RGB-Color-Cycling-Chart.png\" alt=\"RGB Color Cycling Chart.png\" data-api-endpoint=\"https://canvas.instructure.com/api/v1/courses/12681309/files/311988770\" data-api-returntype=\"File\" loading=\"lazy\"></p>\n<p data-start=\"630\" data-end=\"812\">To determine the correct intensity value for a color when the graph is rising or falling, remember that you can use the <code data-start=\"750\" data-end=\"757\">map()</code> block to map a value from one number range to another.</p>\n<ul data-start=\"814\" data-end=\"1121\">\n<li data-start=\"814\" data-end=\"956\">\n<p data-start=\"816\" data-end=\"956\">For example, with the Green LED: when the position value is between 0 and 60, you'd want to remap that position value to the range 0 - 1023.</p>\n</li>\n<li data-start=\"957\" data-end=\"1121\">\n<p data-start=\"959\" data-end=\"1121\">For flat sections, there really isn’t any math to do. For example, when the position value is in between 60 and 180, the green value stays constant (set to 1023).</p>\n</li>\n</ul>\n<hr data-start=\"1123\" data-end=\"1126\">\n<h3 data-start=\"52\" data-end=\"95\"><strong data-start=\"56\" data-end=\"95\">An alternative (improved) solution:</strong></h3>\n<p data-start=\"97\" data-end=\"247\">The approach above works fairly well, but you'll likely notice some brightness spikes that occur in the LED as it cycles through the different values.</p>\n<p data-start=\"249\" data-end=\"433\">It is possible to use the <strong data-start=\"275\" data-end=\"283\">sine</strong> function to create smoother transitions, and create a <strong data-start=\"338\" data-end=\"352\">\"sine-bow\"</strong>. If you’re up for a slightly more mathy solution, I’d encourage you to try this!</p>\n<p data-start=\"435\" data-end=\"551\">You can find more information here:<br data-start=\"470\" data-end=\"473\"><strong data-start=\"473\" data-end=\"551\"><a class=\"inline_disabled\" href=\"http://basecase.org/env/on-rainbows\" target=\"_blank\" data-start=\"475\" data-end=\"549\">http://basecase.org/env/on-rainbows</a></strong></p>\n<ul data-start=\"553\" data-end=\"757\">\n<li data-start=\"553\" data-end=\"757\">\n<p data-start=\"555\" data-end=\"757\">Although this article’s author isn’t the original one to propose this technique, there is a link near the top to the original source. This article has some nice illustrations along with the explanation.</p>\n</li>\n</ul>\n<hr data-start=\"759\" data-end=\"762\">\n<h3 data-start=\"764\" data-end=\"779\"><strong data-start=\"768\" data-end=\"779\">Submit:</strong></h3>\n<p data-start=\"781\" data-end=\"806\">For this project, submit:</p>\n<ul data-start=\"808\" data-end=\"1055\">\n<li data-start=\"808\" data-end=\"1019\">\n<p data-start=\"810\" data-end=\"1019\">a video of your circuit in action. Recording LED light is quite tough to do; don’t worry about seeing the light in the LED itself, but instead see if you can reflect it on a nearby surface. See sample below:<br><img src=\"media/web_resources/Uploaded-Media/RGB-Color-Cycle-Animation.gif\" alt=\"RGB Color Cycle Animation.gif\" data-api-endpoint=\"https://canvas.instructure.com/api/v1/courses/12681309/files/311989036\" data-api-returntype=\"File\" loading=\"lazy\"></p>\n</li>\n<li data-start=\"1020\" data-end=\"1055\">\n<p data-start=\"1022\" data-end=\"1055\">a <code data-start=\"1024\" data-end=\"1030\">.hex</code> code file with your code</p>\n</li>\n</ul>\n<h3 data-start=\"67\" data-end=\"92\"><strong data-start=\"71\" data-end=\"92\"><br>Need Help Getting Started?</strong></h3>\n<p data-start=\"94\" data-end=\"331\">As usual, it's important to give each project an honest effort before looking for some extra help. If you've done that and need some assistance, check out this hint video for the RGB cycling activity:</p>\n<p><iframe title=\"YouTube video player\" src=\"https://www.youtube.com/embed/PjpLidPABJA?si=UmWw5qfSFbLT-z0S\" width=\"560\" height=\"315\" allowfullscreen=\"allowfullscreen\" allow=\"accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share\" loading=\"lazy\"></iframe></p>\n<p data-start=\"94\" data-end=\"331\">&nbsp;</p>\n\n"}]},{"id":"gd29aa9f4525027af7b2311a163758b31","slug":"06-microbit-edge-connector-and-crickit-circuits","title":"Microbit - Edge Connector and Crickit Circuits","order":6,"items":[{"id":"g3145d4be7fb28db2a7aed2d9833d9d37","kind":"assignment","title":"7-Segment Reaction Game","nav_title":"7-Segment Reaction Game","position":1,"published":true,"content_html":"<div class=\"item-meta\"><span class=\"meta-points\"><strong>Points:</strong> 10.0</span> &middot; <span class=\"meta-submission\"><strong>Submission type:</strong> online upload</span></div><p><span style=\"font-size: 14pt;\"><strong>Task</strong></span></p>\n<p>In this project, you'll demonstrate your&nbsp;<strong>circuit-building</strong><span>&nbsp;</span>and&nbsp;<strong>coding&nbsp;</strong>skills. The project is to make a circuit where:</p>\n<ul>\n<li>LEDs on a 7-segment display turn on one at a time with a set delay in between.</li>\n<li>This is a <span style=\"text-decoration: underline;\">reaction game</span>. The user aims to press a button at the moment that <strong>the number 7</strong> is displayed.</li>\n<li>After a certain number of points (5) are achieved, the game is won and an ending animation is played on the display.</li>\n</ul>\n<p>&nbsp;</p>\n<p><span style=\"font-size: 14pt;\"><strong>Instructions / Grading</strong></span></p>\n<p>For this project, all your instructions and grading details are in the following PDF.<span>&nbsp;</span><em>Please follow along carefully with the PDF to ensure you don't miss anything.</em></p>\n<p><a class=\"instructure_file_link instructure_scribd_file inline_disabled\" title=\"7-Segment Reaction Game.pdf\" href=\"media/web_resources/Uploaded-Media/7-Segment-Reaction-Game.pdf\" target=\"_blank\" data-canvas-previewable=\"false\">7-Segment Reaction Game.pdf</a>&nbsp;<br><br></p>\n<p>&nbsp;</p>\n<p><span style=\"font-size: 14pt;\"><strong>To Submit:</strong></span></p>\n<p>There are&nbsp;<strong>two things</strong><span>&nbsp;</span>you need to submit for this project.</p>\n<ol>\n<li>Your Completed Code\n<ul>\n<li>You can submit MakeCode .hex file<br><br></li>\n</ul>\n</li>\n<li>A video demonstrating your physical circuit&nbsp;<strong>with commentary</strong>\n<ul>\n<li>As you demonstrate all the ways your circuit can be used, include some commentary:\n<ul>\n<li>\"Hi, this is ______ and here is my 7-Segment Reaction circuit\"</li>\n<li>\"Look at how the game works and how amazing I am at it.\"</li>\n<li>and so on...</li>\n</ul>\n</li>\n</ul>\n</li>\n</ol>\n<p><em>Once you have all the files ready to hand in, click the blue<span>&nbsp;</span><strong>submit</strong><span>&nbsp;</span>button in the upper-right portion of this page. Next, attach all three files and press the button to submit<strong>.</strong></em></p>\n\n"},{"id":"gc8462dd2d493c46a61423d456ce6a723","kind":"assignment","title":"Dimmable LED Selector","nav_title":"Dimmable LED Selector","position":2,"published":true,"content_html":"<div class=\"item-meta\"><span class=\"meta-points\"><strong>Points:</strong> 0.0</span> &middot; <span class=\"meta-submission\"><strong>Submission type:</strong> none</span></div><p><span style=\"font-size: 18pt;\"><strong>Task</strong></span></p>\n<p>In this project, you'll demonstrate your&nbsp;<strong>circuit-building</strong> and&nbsp;<strong>coding&nbsp;</strong>skills. The project is to make a circuit where:</p>\n<ul>\n<li>1 of 4 <strong>LEDs</strong> is always on</li>\n<li>You can change which <strong>LED</strong> is on (moving up or down the line) using two <strong>pushbuttons</strong>.</li>\n<li>You can modify the brightness of the active LED by using a <strong>potentiometer</strong></li>\n</ul>\n<p>&nbsp;</p>\n<p><span style=\"font-size: 18pt;\"><strong>Instructions / Grading</strong></span></p>\n<p>For this project, all your instructions and grading details are in the following PDF. <em>Please follow along carefully with the PDF to ensure you don't miss anything.</em></p>\n<p><a class=\"instructure_file_link instructure_scribd_file inline_disabled\" title=\"Dimmable LED Selector Project.pdf\" href=\"media/web_resources/Uploaded-Media/Dimmable-LED-Selector-Project.pdf\" target=\"_blank\" data-canvas-previewable=\"false\" data-api-endpoint=\"https://canvas.instructure.com/api/v1/courses/12681309/files/313480120\" data-api-returntype=\"File\">Dimmable LED Selector Project.pdf</a><br><br><br></p>\n<p><span style=\"font-size: 18pt; background-color: #c71f23;\"><strong>To Submit:</strong></span></p>\n<p><span style=\"background-color: #c71f23;\">There are&nbsp;<strong>three things</strong> you need to submit for this project.</span></p>\n<ol>\n<li><span style=\"background-color: #c71f23;\">Screenshot of your TinkerCAD simulated circuit</span>\n<ul>\n<li><span style=\"background-color: #c71f23;\">While in TinkerCAD, press&nbsp;<strong>share</strong> in the upper-right and this will reveal a button to download the circuit image.</span><br><br></li>\n</ul>\n</li>\n<li><span style=\"background-color: #c71f23;\">Your Completed Code</span>\n<ul>\n<li><span style=\"background-color: #c71f23;\">You can submit your Arduino <strong>.ino&nbsp;</strong>file, or paste your tinkerCAD into a&nbsp;<strong>word processor / text editor</strong> and save a file to submit</span><br><br></li>\n</ul>\n</li>\n<li><span style=\"background-color: #c71f23;\">A video demonstrating your physical circuit&nbsp;<strong>with commentary</strong></span>\n<ul>\n<li><span style=\"background-color: #c71f23;\">As you demonstrate all the ways your circuit can be used, include some commentary:</span>\n<ul>\n<li><span style=\"background-color: #c71f23;\">\"Hi, this is ______ and here is my Dimmable LED Selector circuit\"</span></li>\n<li><span style=\"background-color: #c71f23;\">\"Notice how as I turn this potentiometer the LED becomes dim\"</span></li>\n<li><span style=\"background-color: #c71f23;\">and so on...</span></li>\n</ul>\n</li>\n</ul>\n</li>\n</ol>\n<p><span style=\"background-color: #c71f23;\"><em>Once you have all 3 files ready to hand in, click the blue <strong>submit</strong> button in the upper-right portion of this page. Next, attach all three files and press the button to submit<strong>.</strong></em></span></p>\n<p><span style=\"font-size: 18pt;\"><strong><br>Circuit Usage Example<br></strong></span></p>\n<p>The following animation shows the&nbsp;<strong>final operation</strong> of the simulated circuit (when your code is fully complete). You can compare how your program runs to this example to ensure you've completed all required base features. (<em>expert challenge features not shown in this demonstration)</em><strong></strong><strong></strong></p>\n<p><img src=\"media/web_resources/Dimmable-LED-Selector-Project2.gif\" alt=\"Example Animation\" data-api-endpoint=\"https://canvas.instructure.com/api/v1/courses/12681309/files/309399468\" data-api-returntype=\"File\" loading=\"lazy\"></p>\n\n"},{"id":"gb929559ee9c091faed5161146abb92e2","kind":"assignment","title":"Proximity Alarm Assignment","nav_title":"Proximity Alarm Assignment","position":3,"published":true,"content_html":"<div class=\"item-meta\"><span class=\"meta-points\"><strong>Points:</strong> 10.0</span> &middot; <span class=\"meta-submission\"><strong>Submission type:</strong> online upload</span></div><p>With an broadened array of components, including the <em>Ultrasonic Sensor</em> and <em>9g Servo</em>, create (and perform with) your own <strong>Proximity Alarm System. </strong>Use the following set of instructions:</p>\n<p><a class=\"instructure_file_link instructure_scribd_file inline_disabled\" title=\"A03 Proximity Alarm Project.pdf\" href=\"media/web_resources/Uploaded-Media/A03-Proximity-Alarm-Project.pdf\" target=\"_blank\" data-canvas-previewable=\"false\" data-api-endpoint=\"https://canvas.instructure.com/api/v1/courses/12681309/files/314949061\" data-api-returntype=\"File\">Proximity Alarm Project.pdf</a></p>\n<p><span style=\"font-size: 18pt;\"><strong>Grading:</strong></span></p>\n<p><span style=\"text-decoration: underline;\">9 marks:</span></p>\n<p style=\"padding-left: 40px;\">For 9/10, complete the basic circuit and <em>Base Features </em>as outlined in the pdf.</p>\n<p>&nbsp;</p>\n<p><span style=\"text-decoration: underline;\">1 Mark:</span></p>\n<p style=\"padding-left: 40px;\">Completing the Challenge Feature (Multi-purpose Dial) will earn the final 1/10. &nbsp;Details are also in the pdf above.</p>\n<p>&nbsp;</p>\n<p><span style=\"font-size: 18pt;\"><strong>To Submit:</strong></span></p>\n<p>There are&nbsp;<strong>two things</strong><span>&nbsp;</span>you need to submit for this project.</p>\n<ol>\n<li>Your Completed Code\n<ul>\n<li>You can submit MakeCode .hex file<br><br></li>\n</ul>\n</li>\n<li>A video demonstrating your physical circuit&nbsp;<strong>with commentary</strong>\n<ul>\n<li>As you demonstrate all the ways your circuit can be used, include some commentary:\n<ul>\n<li>\"Hi, this is ______ and here is my Proximity Alarm Assignment\"</li>\n<li>\"Look how moving this object can change the system from All Clear to Warning to Alarm\"</li>\n<li>and so on...</li>\n</ul>\n</li>\n</ul>\n</li>\n</ol>\n<p><em>Once you have all the files ready to hand in, click the blue<span>&nbsp;</span><strong>submit</strong><span>&nbsp;</span>button in the upper-right portion of this page. Next, attach all three files and press the button to submit<strong>.</strong></em></p>\n\n"},{"id":"g17ace43567fb9d2d61d55c1281700abd","kind":"assignment","title":"Beat:Box","nav_title":"Beat:Box","position":4,"published":true,"content_html":"<div class=\"item-meta\"><span class=\"meta-points\"><strong>Points:</strong> 0.0</span> &middot; <span class=\"meta-submission\"><strong>Submission type:</strong> none</span></div><p>Time to make a electromusical instrucment</p>\n<p><a class=\"instructure_file_link instructure_scribd_file inline_disabled\" title=\"A03b Beat Box Project.pdf\" href=\"media/web_resources/Uploaded-Media/A03b-Beat-Box-Project.pdf\" target=\"_blank\" data-canvas-previewable=\"false\">Beat Box Project.pdf</a></p>\n<p><span style=\"font-size: 18pt;\"><strong>Grading:</strong></span></p>\n<p><span style=\"font-size: 12pt;\">This semester this project is for practice and fun. Not being graded!</span></p>\n<p><span style=\"text-decoration: underline; background-color: #000000;\">9 marks:</span></p>\n<p style=\"padding-left: 40px;\"><span style=\"background-color: #000000;\">For 9/10, complete the basic circuit and <em>Base Features </em>as outlined in the pdf.</span></p>\n<p>&nbsp;</p>\n<p><span style=\"text-decoration: underline; background-color: #000000;\">1 Mark:</span></p>\n<p style=\"padding-left: 40px;\"><span style=\"background-color: #000000;\">Completing the Challenge Feature (Multi-purpose Dial) will earn the final 1/10. &nbsp;Details are also in the pdf above.</span></p>\n<p>&nbsp;</p>\n<p><span style=\"font-size: 18pt;\"><strong>To Submit:</strong></span></p>\n<p><span style=\"background-color: #000000;\">There are&nbsp;<strong>two things</strong>&nbsp;you need to submit for this project.</span></p>\n<ol>\n<li><span style=\"background-color: #000000;\">Your Completed Code</span>\n<ul>\n<li><span style=\"background-color: #000000;\">You can submit MakeCode .hex file</span><br><br></li>\n</ul>\n</li>\n<li><span style=\"background-color: #000000;\">A video demonstrating your physical circuit&nbsp;<strong>with commentary</strong></span>\n<ul>\n<li><span style=\"background-color: #000000;\">As you demonstrate all the ways your circuit can be used, include some commentary:</span>\n<ul>\n<li><span style=\"background-color: #000000;\">\"Hi, this is ______ and here is my Proximity Alarm Assignment\"</span></li>\n<li><span style=\"background-color: #000000;\">\"Look how moving this object can change the system from All Clear to Warning to Alarm\"</span></li>\n<li><span style=\"background-color: #000000;\">and so on...</span></li>\n</ul>\n</li>\n</ul>\n</li>\n</ol>\n<p><span style=\"background-color: #000000;\"><em>Once you have all the files ready to hand in, click the blue&nbsp;<strong>submit</strong>&nbsp;button in the upper-right portion of this page. Next, attach all three files and press the button to submit<strong>.</strong></em></span></p>\n\n"},{"id":"g99cf8af646c848d390955191d65d6bf5","kind":"assignment","title":"Fortune Machine","nav_title":"Fortune Machine","position":5,"published":true,"content_html":"<div class=\"item-meta\"><span class=\"meta-points\"><strong>Points:</strong> 10.0</span> &middot; <span class=\"meta-submission\"><strong>Submission type:</strong> online upload</span></div><p>This project will have you work with a <strong>Liquid Crystal Display</strong>&nbsp;as well as a <strong>variety of switches</strong> to create a&nbsp;<span style=\"text-decoration: underline;\">Fortune Telling Machine.</span></p>\n<p><a class=\"instructure_file_link instructure_scribd_file inline_disabled\" title=\"A04 Fortune Machine Project.pdf\" href=\"media/web_resources/Uploaded-Media/A04-Fortune-Machine-Project.pdf\" target=\"_blank\" data-canvas-previewable=\"false\">Fortune Machine.pdf</a></p>\n<p><span style=\"font-size: 18pt;\"><strong>Grading:</strong></span></p>\n<p><span style=\"text-decoration: underline;\">10 marks:</span></p>\n<p style=\"padding-left: 40px;\">For 10/10, complete the basic circuit and <em>Base Features </em>as outlined in the pdf.</p>\n<p>&nbsp;</p>\n<p><span style=\"font-size: 18pt;\"><strong>To Submit:</strong></span></p>\n<p>There are&nbsp;<strong>two things</strong><span>&nbsp;</span>you need to submit for this project.</p>\n<ol>\n<li>Your Completed Code\n<ul>\n<li>You can submit MakeCode .hex file<br><br></li>\n</ul>\n</li>\n<li>A video demonstrating your physical circuit&nbsp;<strong>with commentary</strong>\n<ul>\n<li>As you demonstrate all the ways your circuit can be used, include some commentary:\n<ul>\n<li>\"Hi, this is ______ and here is my Fortune Machine Project\"</li>\n<li>Be sure to demonstrate getting some random fortunes when the slide switch is OFF, and a lucky fortune when the switch is ON!</li>\n</ul>\n</li>\n</ul>\n</li>\n</ol>\n<p><em>Once you have all the files ready to hand in, click the blue<span>&nbsp;</span><strong>submit</strong><span>&nbsp;</span>button in the upper-right portion of this page. Next, attach all three files and press the button to submit<strong>.</strong></em></p>\n\n"},{"id":"g3469f07690db411c1b43c0b48fdf58ce","kind":"assignment","title":"Coin Grabber Game","nav_title":"Coin Grabber Game","position":6,"published":true,"content_html":"<div class=\"item-meta\"><span class=\"meta-points\"><strong>Points:</strong> 0.0</span> &middot; <span class=\"meta-submission\"><strong>Submission type:</strong> none</span></div><p>LCD Modules are usually used to display information to a user of a project: instructions, sensors readings, circuit status, etc...</p>\n<p>However, since it is a display component that we can control at a&nbsp;<em>pixel level</em> (with a particular extension), it should also be possible to create some <strong>custom \"characters\" </strong>and practice our coding skills in creating a simple game.</p>\n<p>&nbsp;</p>\n<p><span style=\"font-size: 18pt;\"><strong>Instructions:</strong></span></p>\n<p><a class=\"instructure_file_link instructure_scribd_file inline_disabled\" title=\"A04b Coin Grabber Game.pdf\" href=\"media/web_resources/Uploaded-Media/A04b-Coin-Grabber-Game.pdf\" target=\"_blank\" data-canvas-previewable=\"false\" data-api-endpoint=\"https://canvas.instructure.com/api/v1/courses/12681309/files/317197464\" data-api-returntype=\"File\">A04b Coin Grabber Game.pdf</a></p>\n<p>&nbsp;</p>\n<p><span style=\"font-size: 18pt;\"><strong>Sample Output:</strong></span></p>\n<p><img src=\"media/web_resources/Uploaded-Media/LCD-Coin-Grabber-Example.gif\" alt=\"LCD Coin Grabber Example.gif\" data-api-endpoint=\"https://canvas.instructure.com/api/v1/courses/12681309/files/319582024\" data-api-returntype=\"File\" loading=\"lazy\"></p>\n\n"}]},{"id":"g6ff03def4b3e2469898a20588eaee737","slug":"07-3d-modeling-and-design","title":"3D Modeling and Design","order":7,"items":[{"id":"g02c3576577cb15bd0720c0ba36d01294","kind":"page","title":"3D Modeling / CAD Demos 01","nav_title":"3D Modeling / CAD Demos 01","position":1,"published":true,"content_html":"<p>To support building some larger-scale projects, we'll need to develop/refine our ability to model objects digitally in 2D and 3D. In this mini-unit, we'll be using&nbsp;<strong>Autocad Inventor.&nbsp;</strong>Objects created in this environment can later be manufactured using the schools&nbsp;<strong>3D Printer.</strong></p>\n<p><span style=\"text-decoration: underline;\">Demo One:</span></p>\n<p>Please open the following PDF, which we will work through together as a class. Each shape will be extruded to a distance roughly 1/10 of the object's width (This measurement will vary across the three demo drawings).</p>\n<p><a class=\"instructure_file_link instructure_scribd_file\" title=\"Demo - 01.pdf\" href=\"media/web_resources/Demo-01.pdf\">Demo - 01.pdf</a></p>\n\n"},{"id":"gd82cec7fa662ca0dc4f7746e54a9237e","kind":"page","title":"CAD Exercise Pack 01","nav_title":"CAD Exercise Pack 01","position":2,"published":true,"content_html":"<p>Following our first class demo, <strong>create the three drawings</strong> dimensioned in the following file. Each 2D sketch should be extruded to a thickness roughly 1/10 of the object's width. One or more of the drawings in this pack <em>(randomly chosen by the instructor)</em> will be submitted later on for assessment.</p>\n<p><a class=\"instructure_file_link instructure_scribd_file\" title=\"Exercises - 01.pdf\" href=\"media/web_resources/Exercises-01.pdf\" data-api-endpoint=\"https://canvas.instructure.com/api/v1/courses/1676030/files/82396745\" data-api-returntype=\"File\">Exercises - 01.pdf</a></p>\n<p><span style=\"text-decoration: underline;\">Extra Information:</span></p>\n<p>The third drawing has 3 places where a circle is inside another circle. For 3D objects, this is typically a&nbsp;<strong>Counterbore, Countersink, or Spotface </strong>feature<strong>.&nbsp;</strong>We'll see as a class how to add a&nbsp;<strong>Counterbore&nbsp;</strong>feature in Inventor. For these three circles, you can assume the depth of the large circle will be&nbsp;<em>half of the overall object (Extrusion) thickness.</em></p>\n\n"},{"id":"g214df9262f88238fc0d83ea9a93ee66f","kind":"page","title":"3D Modeling / CAD Demos 02","nav_title":"3D Modeling / CAD Demos 02","position":3,"published":true,"content_html":"<p><span style=\"text-decoration: underline;\">Demo Two:</span></p>\n<p>In Demo Two, we'll look at creating 3D solids through both <strong>adding material</strong> and<strong> removing material</strong> (cuts). As well, we'll explore <strong>orthographic projections</strong>, and modeling based off of those types of representations.</p>\n<p><a class=\"instructure_file_link instructure_scribd_file\" title=\"Demo - 02.pdf\" href=\"media/web_resources/Demo-02.pdf\">Demo - 02.pdf</a></p>\n\n"},{"id":"g7e70282b8eef78374832da62fc56486c","kind":"page","title":"CAD Exercise Pack 02","nav_title":"CAD Exercise Pack 02","position":4,"published":true,"content_html":"<p>Following our second class demo, <strong>create the four drawings</strong> dimensioned in the following file. All the necessary measurements are included. Images are either represented as <strong>isometric</strong> (a pictorial form)or as an <strong>orthographic projection</strong> (individual drawings of <strong>front, top,</strong> and <strong>right</strong> views). One or more of the drawings in this pack <em>(randomly chosen by the instructor)</em>&nbsp;will be submitted later on for assessment.</p>\n<p><a class=\"instructure_file_link instructure_scribd_file\" title=\"Exercises - 02.pdf\" href=\"media/web_resources/Exercises-02.pdf\">Exercises - 02.pdf</a></p>\n<p>&nbsp;</p>\n\n"},{"id":"g980fe8592300f5815ab098f3a33171e6","kind":"assignment","title":"3D Modeling: Ultrasonic Bracket","nav_title":"3D Modeling: Ultrasonic Bracket","position":7,"published":true,"content_html":"<div class=\"item-meta\"><span class=\"meta-points\"><strong>Points:</strong> 10.0</span> &middot; <span class=\"meta-submission\"><strong>Submission type:</strong> online upload</span> &middot; <span class=\"meta-ext\"><strong>Allowed file types:</strong> ipt,gcode,bgcode</span></div><p>Now that we've had a bit of practice with 3D modeling, it's time to create a functional part for an upcoming project.&nbsp;</p>\n<p><img src=\"media/web_resources/3D-Modeling-Ultrasonic-Bracket.PNG\" alt=\"\" width=\"406\" height=\"377\" data-decorative=\"true\" data-api-endpoint=\"https://canvas.instructure.com/api/v1/courses/12681309/files/309399459\" data-api-returntype=\"File\" loading=\"lazy\"></p>\n<p>You will follow a&nbsp;<strong>set of plans</strong> (provided below) to design a bracket that will allow an <strong>ultrasonic sensor</strong> to be mounted onto a <strong>9g Servo</strong>. This will be used for a car project where the ultrasonic can turn and face several directions to look for upcoming obstacles. You'll also be able to add a&nbsp;<strong>Logo Design</strong> of your own so we can tell whose 3D printed part is whose.</p>\n<p><span style=\"font-size: 18pt;\"><strong><br>Task:</strong></span></p>\n<p>The following plans have split the dimension of the shape into&nbsp;<strong>four steps.</strong> While this isn't typically how objects are dimensioned (<em>normally we would place all dimension on an image of the final part</em>), it should make the digital design work straightforward even though we may be new to 3D modeling.</p>\n<p>Use these plans to model your 3D part: &nbsp;<a class=\"instructure_file_link instructure_scribd_file\" title=\"Ultrasonic Mount Project Dimensions (Rev 3).pdf\" href=\"media/web_resources/Uploaded-Media/Ultrasonic-Mount-Project-Dimensions-Rev-3-.pdf\" target=\"_blank\" data-canvas-previewable=\"false\" data-api-endpoint=\"https://canvas.instructure.com/api/v1/courses/12681309/files/309399533\" data-api-returntype=\"File\">Ultrasonic Mount Project Dimensions (Rev 3).pdf</a>&nbsp;&nbsp;</p>\n<p>&nbsp;</p>\n<p><span style=\"font-size: 18pt;\"><strong>Slicing:</strong></span></p>\n<p>Once your design work is done, the final step is to export and slice an STL file to prepare for printing. Follow along with this short video to export your part as an STL and then to use PrusaSlicer to prepare the GCODE that the printer will actually use.</p>\n<p><iframe src=\"https://www.youtube.com/embed/BXZ9ctsnHQo\" width=\"560\" height=\"315\" loading=\"lazy\" allowfullscreen=\"allowfullscreen\" allow=\"accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture\"></iframe></p>\n<p>&nbsp;</p>\n<p><span style=\"font-size: 18pt;\"><strong>Submission:</strong></span></p>\n<p><span style=\"font-size: 12pt;\">You must submit&nbsp;<strong>two things</strong> for this project.</span></p>\n<ol>\n<li><span style=\"font-size: 12pt;\">An <strong>Inventor Part file (.ipt)</strong>. This is the normal save format for the program. Keeps an editable version of your work, but&nbsp;<em>can't be directly 3D printed.<br><br></em></span></li>\n<li>A <strong>GCODE or BGCODE</strong> <strong>file</strong>.&nbsp; This file can be sliced and sent to the printer.&nbsp;<br><br><br><br><br>\n<table style=\"height: 636px; width: 99.9184%; border-collapse: collapse;\" border=\"0\">\n<tbody>\n<tr style=\"height: 387px;\">\n<td style=\"width: 50%; height: 387px;\">\n<p><img style=\"display: block; margin-left: auto; margin-right: auto;\" src=\"media/web_resources/3D-Modelin-Save-a-copy-as.PNG\" alt=\"\" data-decorative=\"true\" data-api-endpoint=\"https://canvas.instructure.com/api/v1/courses/12681309/files/309399466\" data-api-returntype=\"File\" loading=\"lazy\"></p>\n<p style=\"text-align: center;\"><em>Under the <strong>FILE</strong> menu,&nbsp; Save Copy As</em></p>\n</td>\n<td style=\"width: 50%; height: 387px;\">\n<p><img style=\"display: block; margin-left: auto; margin-right: auto;\" src=\"media/web_resources/3D-Modelin-STL-format.PNG\" alt=\"\" data-decorative=\"true\" data-api-endpoint=\"https://canvas.instructure.com/api/v1/courses/12681309/files/309399504\" data-api-returntype=\"File\" loading=\"lazy\"></p>\n<p style=\"text-align: center;\"><em>In the Save Copy As Dialogue, set the&nbsp;<strong>type</strong> to be&nbsp;</em><strong><em>ST</em>L</strong></p>\n</td>\n</tr>\n<tr style=\"height: 136px;\">\n<td style=\"width: 50%; height: 136px;\">\n<p><img style=\"display: block; margin-left: auto; margin-right: auto;\" src=\"media/web_resources/3D-Modelin-STL-options.PNG\" alt=\"\" data-decorative=\"true\" data-api-endpoint=\"https://canvas.instructure.com/api/v1/courses/12681309/files/309399440\" data-api-returntype=\"File\" loading=\"lazy\"></p>\n<p style=\"text-align: center;\"><em>Choose a name, but before saving, press&nbsp;<strong>Options</strong></em></p>\n</td>\n<td style=\"width: 50%; height: 136px;\">\n<p><img style=\"display: block; margin-left: auto; margin-right: auto;\" src=\"media/web_resources/3D-Modelin-units-millimeters.PNG\" alt=\"\" data-api-endpoint=\"https://canvas.instructure.com/api/v1/courses/12681309/files/309399227\" data-api-returntype=\"File\" loading=\"lazy\"></p>\n<p style=\"text-align: center;\"><em>Make sure that the units match what your drawing used. In this case, should be <strong>millimeter</strong></em></p>\n</td>\n</tr>\n</tbody>\n</table>\n</li>\n</ol>\n\n"},{"id":"g3fc29bbe128d7fcbbdd8bf63f48a9cdf","kind":"page","title":"3D Modeling Extra Challenge","nav_title":"3D Modeling Extra Challenge","position":8,"published":true,"content_html":"<p>For an extra challenge, you'll model a part from a servo-actuated claw.&nbsp;</p>\n<p><img src=\"media/web_resources/Gripper-Assembly-Sample.JPG\" alt=\"\" data-decorative=\"true\" data-api-endpoint=\"https://canvas.instructure.com/api/v1/courses/2417501/files/114629218\" data-api-returntype=\"File\" loading=\"lazy\"></p>\n<p><i>There are two parts you can model for an additional challenge with varying difficulty.</i></p>\n<p><strong>Easier - Base</strong></p>\n<p style=\"padding-left: 40px;\">Model the base for the robot arm. This is the piece that attaches to the 9g servo to, as well as the arms and gear system.&nbsp;</p>\n<p style=\"padding-left: 40px;\"><a class=\"instructure_file_link instructure_image_thumbnail\" title=\"Gripper Dimensions - Base v3.png\" href=\"media/web_resources/Gripper-Dimensions-Base.png\" data-api-endpoint=\"https://canvas.instructure.com/api/v1/courses/2417501/files/114629175\" data-api-returntype=\"File\">Base Dimensions</a></p>\n<p style=\"padding-left: 40px;\">&nbsp;</p>\n<p><strong>More Difficult - Geared Arm</strong></p>\n<p style=\"padding-left: 40px;\">The geared arm is a bit more challenging. Use the following dimensions for its construction.</p>\n<p style=\"padding-left: 40px;\"><a class=\"instructure_file_link instructure_image_thumbnail\" title=\"Gripper Dimensions - Geared Arm.png\" href=\"media/web_resources/Gripper-Dimensions-Geared-Arm.png\" data-api-endpoint=\"https://canvas.instructure.com/api/v1/courses/2417501/files/114629106\" data-api-returntype=\"File\">Geared Arm Dimensions</a></p>\n<p>&nbsp;</p>\n\n"}]},{"id":"g27ff8bcc6826a5c3a08158aca9432c1d","slug":"08-project-servo-marble-maze","title":"Project: Servo Marble Maze","order":8,"items":[{"id":"g31cd7d59f47e6fe9c074a3b6d4cf4601","kind":"assignment","title":"Mini-project: Servo Marble Maze","nav_title":"Mini-project: Servo Marble Maze","position":1,"published":true,"content_html":"<div class=\"item-meta\"><span class=\"meta-points\"><strong>Points:</strong> 10.0</span> &middot; <span class=\"meta-submission\"><strong>Submission type:</strong> online upload</span></div><p><img src=\"media/web_resources/Marble-Maze-Sample-Image.jpg\" alt=\"\" width=\"279\" height=\"199\" data-decorative=\"true\" data-api-endpoint=\"https://canvas.instructure.com/api/v1/courses/12681309/files/309399275\" data-api-returntype=\"File\" loading=\"lazy\"> <img src=\"media/web_resources/Marble-Maze-3D-Render.jpg\" alt=\"\" width=\"344\" height=\"196\" data-decorative=\"true\" data-api-endpoint=\"https://canvas.instructure.com/api/v1/courses/12681309/files/309399374\" data-api-returntype=\"File\" loading=\"lazy\"></p>\n<p>For this project, we'll combine the basics of&nbsp;<strong>Servo Motion</strong>,&nbsp;<strong>Joystick Control</strong>, and perhaps some&nbsp;<strong>Home-made Switches</strong> to create a&nbsp;<strong>Servo Marble Maze.&nbsp;</strong>You've likely seen an analog version of this game. This electronic version will allow the user to use a Joystick module to control the two axis of rotation to move a metal marble around the maze.&nbsp;</p>\n<p><span style=\"font-size: 18pt;\"><strong>Materials:</strong></span></p>\n<p><span style=\"text-decoration: underline; font-size: 14pt;\">Electronic / Misc Components</span></p>\n<ul>\n<li>2 x 9g Servo</li>\n<li>Joystick Module</li>\n<li>Jumper Cables</li>\n<li>Micro:bit and Crickit Board</li>\n<li>2 x M3 35mm machine Screws</li>\n<li>10 x M3 Nut</li>\n<li>Ball Bearing (1/2\" or 3/8\")</li>\n</ul>\n<p><span style=\"text-decoration: underline; font-size: 14pt;\"><br>Structure Components</span></p>\n<ul>\n<li>Cardboard Pieces\n<ul>\n<li>Side Base (2 types: Servo and Axle)</li>\n<li>Base Connector x2</li>\n<li>Outer Frame (Servo cutout x1,&nbsp; Centrepoint cutout x3)</li>\n<li>Inner Frame (w/ bump x2,&nbsp; &nbsp;w/ recess x2)</li>\n</ul>\n</li>\n<li>3D Printed Pieces\n<ul>\n<li>3D printed Outer Frame Corner Braces x4</li>\n<li>Plastic Washers x2</li>\n</ul>\n</li>\n</ul>\n<p>&nbsp;</p>\n<p><br>The construction of this project will be with cardboard. Most of the pieces will be pre-cut using the laser cutter. However, you'll design the actual maze pattern yourself. Assembly of these pieces will be with hot glue and tape.</p>\n<p><br><span style=\"font-size: 18pt;\"><strong>Step One - Maze Design:</strong></span></p>\n<p>The Maze itself will be in a <strong>16cm x 16cm</strong> box. Part of this activity will be to make a first design for&nbsp;<span style=\"text-decoration: underline;\">laser cutting / engraving.</span> Using the provided <a class=\"instructure_file_link inline_disabled\" title=\"Marble Maze Template.ipt\" href=\"media/web_resources/Uploaded-Media/Marble-Maze-Template.ipt\" target=\"_blank\" data-canvas-previewable=\"false\" data-api-endpoint=\"https://canvas.instructure.com/api/v1/courses/12681309/files/320107805\" data-api-returntype=\"File\">template here</a>, edit the \"Maze Layout\" sketch and using&nbsp;<strong>regular object lines&nbsp;</strong><em>(which can snap to the construction line template)</em> build up the design of your maze. No need to rush here; a good maze can allow you to achieve the optimal difficulty and enjoyment.&nbsp;&nbsp;<em>Make sure all the wall paths you make are fully closed as we will need to extrude them next...</em></p>\n<p>&nbsp; &nbsp; <img src=\"media/web_resources/Uploaded-Media/marble-maze-initial-maze-template.png\" alt=\"marble maze - initial maze template.png\" width=\"420\" height=\"230\" data-api-endpoint=\"https://canvas.instructure.com/api/v1/courses/12681309/files/320106237\" data-api-returntype=\"File\" loading=\"lazy\"> &nbsp; &nbsp; &nbsp;<img src=\"media/web_resources/Uploaded-Media/marble-maze-adding-lines.png\" alt=\"marble maze - adding lines.png\" width=\"437\" height=\"340\" data-api-endpoint=\"https://canvas.instructure.com/api/v1/courses/12681309/files/320106397\" data-api-returntype=\"File\" loading=\"lazy\"> &nbsp; &nbsp; <img src=\"media/web_resources/Uploaded-Media/marble-maze-plan-out-maze.png\" alt=\"marble maze - plan out maze.png\" width=\"346\" height=\"350\" data-api-endpoint=\"https://canvas.instructure.com/api/v1/courses/12681309/files/320106135\" data-api-returntype=\"File\" loading=\"lazy\"></p>\n<p>When you have finished designing the maze, finish your sketch and create an extrusion to give thickness to each maze wall.&nbsp;</p>\n<ul>\n<li>This will give you a visual preview of the maze in 3D</li>\n<li>More importantly, it will allow us to easily export the maze path&nbsp;<em>without the construction lines</em></li>\n</ul>\n<p><em><img src=\"media/web_resources/Uploaded-Media/marble-maze-extrude-maze-path.png\" alt=\"marble maze - extrude maze path.png\" width=\"1220\" height=\"517\" data-api-endpoint=\"https://canvas.instructure.com/api/v1/courses/12681309/files/320228694\" data-api-returntype=\"File\" loading=\"lazy\"></em></p>\n<p>&nbsp;</p>\n<p>To produce a&nbsp;<strong>dxf file&nbsp;</strong>(2D CAD export which can be used directly by the laser),&nbsp;<strong>RIGHT-CLICK on the top face of the maze walls and choose EXPORT FACE AS.</strong></p>\n<p><strong><img src=\"media/web_resources/Uploaded-Media/marble-maze-export-maze-face.png\" alt=\"marble maze - export maze face.png\" data-api-endpoint=\"https://canvas.instructure.com/api/v1/courses/12681309/files/320229002\" data-api-returntype=\"File\" loading=\"lazy\"></strong></p>\n<p><strong>Save the DXF file</strong> in our dropbox folder that you can easily access it from the laptop controlling the laser.</p>\n<p>&nbsp;</p>\n<p>&nbsp;</p>\n<p><strong><span style=\"font-size: 18pt;\">Step One (continued) - Laser Cut and Engrave:</span></strong></p>\n<p><span style=\"font-size: 12pt;\">Once you have this file complete and ready to go, it's time to laser and engrave. We want to <strong>cut </strong>the correct shape for the maze platform, and&nbsp;<strong>engrave</strong> the interior maze walls so we have a good guide. When the laptop and laser and free, go and&nbsp;<strong>import your .dxf</strong> file into&nbsp;<strong>Lightburn.</strong> A few settings that need to be set before lasering:</span><strong><span style=\"font-size: 18pt;\"><br></span></strong></p>\n<ul>\n<li><span style=\"font-size: 12pt;\">material thickness:&nbsp; 3mm</span></li>\n<li><span style=\"font-size: 12pt;\">Laser Power / Speed</span>\n<ul>\n<li><span style=\"font-size: 12pt;\">Engrave Pass <em>(maze walls only)</em>:</span>\n<ul>\n<li><span style=\"font-size: 12pt;\">Power: 5%&nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; Speed: 200 mm/s</span></li>\n</ul>\n</li>\n<li><span style=\"font-size: 12pt;\">Cut Pass<em> (outline only)&nbsp; &nbsp; </em>&nbsp; &nbsp;</span>\n<ul>\n<li><span style=\"font-size: 12pt;\">Power 100%&nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; Speed 15mm/s</span></li>\n</ul>\n</li>\n</ul>\n</li>\n</ul>\n<p><span style=\"background-color: #027634;\"><strong><span style=\"text-decoration: underline; color: #ffffff;\"><span style=\"font-size: 12pt; background-color: #027634;\">HINT:</span></span></strong></span><span style=\"font-size: 12pt;\"><strong><span style=\"color: #ffffff;\">&nbsp;</span></strong> Use the&nbsp;<strong>FRAME</strong> command before starting the laser; this allows you to see the working area (rectangle that fits around the part to be cut or engraved). If the frame looks correctly aligned, then it's time to hit&nbsp;<strong>start</strong> (check with me beforehand, though!)</span></p>\n<p><span style=\"font-size: 12pt;\"><strong><span style=\"color: #ffffff;\"><span style=\"background-color: #c71f23;\"><u>WARNING:</u></span></span>&nbsp;&nbsp;</strong>When you are running the laser, you must stay neary and keep an eye on the laser. There is always a chance that the laser will start a fire, and if not noticed it could turn into a much larger issue!</span></p>\n<p>&nbsp;</p>\n<p><strong><span style=\"font-size: 18pt;\">Step Two - Servo Selection (no Jitter!):</span></strong></p>\n<p>A common issue with some batches of small inexpensive servos is that that they can&nbsp;<strong>hunt</strong> for a target angle (shoot past the target, then switch directions and overshoot the other way, etc...) which can be more pronounced when the servo is attached to some sort of load (like the marble maze structure, for instance). However, not all servos have this issue, so before going forward, you should find&nbsp;<strong>two that have low jitter.</strong></p>\n<p>A test rig made up of part of the maze structure (see animations below) can allow you to quickly test a servo and look for jitter. In our class a test rig is set up, but it wouldn't be hard to built it yourself too if needed:</p>\n<ul>\n<li>assemble the frame as shown below and tape a&nbsp;<strong>servo horn</strong> to a medium-sized piece of cardboard\n<ul>\n<li>Some extra weight can be added here too</li>\n</ul>\n</li>\n<li>write simple program in Make:Code to have the servo&nbsp;<strong>sweep</strong> (move from 0 to 180,&nbsp; then back from 180 to 0, and repeat)</li>\n</ul>\n<p>Then for each servo you try with the test rig. If there is jitter, try another servo from our bin. Keep trying until you have two servos that <span style=\"text-decoration: underline;\">have low (or no) jitter.</span></p>\n<table style=\"border-collapse: collapse; width: 42.9509%; height: 277px;\" border=\"0\">\n<tbody>\n<tr>\n<td style=\"width: 50.037%;\"><img src=\"media/web_resources/Uploaded-Media/Servo-with-Jitter.gif\" alt=\"Servo with noticeable Jitter\" data-api-endpoint=\"https://canvas.instructure.com/api/v1/courses/12681309/files/320702736\" data-api-returntype=\"File\" loading=\"lazy\"></td>\n<td style=\"width: 49.9277%;\"><img src=\"media/web_resources/Uploaded-Media/Servo-with-no-Jitter-problem.gif\" alt=\"Servo moves quite smoothly through the sweep program\" data-api-endpoint=\"https://canvas.instructure.com/api/v1/courses/12681309/files/320702762\" data-api-returntype=\"File\" loading=\"lazy\"></td>\n</tr>\n<tr>\n<td style=\"width: 50.037%; text-align: center;\"><em>Servo with the Jitters</em></td>\n<td style=\"width: 49.9277%; text-align: center;\"><em>Smooth, Consistent movement; no Jitter issue.</em></td>\n</tr>\n</tbody>\n</table>\n<p>&nbsp;</p>\n<p><strong><span style=\"font-size: 18pt;\"><br>Step Two (continued) - Servo Calibration:</span></strong></p>\n<p>Once you have <strong>2 Quality Servos</strong> with no jitter, it is important to <strong>center both of your servos</strong> to 90 degrees. Write a quick program to do this, upload the code and <strong>run it with the crickit board powered on.</strong></p>\n<p><strong><img src=\"media/web_resources/Uploaded-Media/marble-maze-callibrate-servos.png\" alt=\"marble maze - callibrate servos.png\" width=\"600\" height=\"165\" data-api-endpoint=\"https://canvas.instructure.com/api/v1/courses/12681309/files/320106975\" data-api-returntype=\"File\" loading=\"lazy\"><br><br></strong></p>\n<p>Once you fix your servo into the maze pieces, it needs to be free to rotate in both directions. <em>If you forget to calibrate, your servo could be sitting at either end of its range, meaning you'd have to backtrack to remove and re-calibrate!<br></em><strong></strong></p>\n<p>&nbsp;</p>\n<p><strong><span style=\"font-size: 18pt;\">Step Three - Build Guide:</span></strong></p>\n<p>NOTE:&nbsp; Before getting into the build, please take note that the cardboard structure has been updated slightly, so the build guide will look slightly different than the current cut cardboard. The most notable changes are:</p>\n<ul style=\"list-style-type: disc;\">\n<li>Base and Side supports modified to use less material and to interlock <em>(and hopefully allow for better reuse of these parts for future classes)</em></li>\n<li>Inner and Out Frame pieces modified to have small amount of&nbsp;<strong>interlocking geometry</strong></li>\n</ul>\n<table style=\"border-collapse: collapse; width: 32.2132%;\" border=\"1\">\n<tbody>\n<tr>\n<td style=\"width: 100%;\"><img src=\"media/web_resources/Uploaded-Media/new-structure-partial-assembly.png\" alt=\"new structure - partial assembly.png\" width=\"684\" height=\"460\" data-api-endpoint=\"https://canvas.instructure.com/api/v1/courses/12681309/files/320107327\" data-api-returntype=\"File\" loading=\"lazy\"></td>\n</tr>\n<tr>\n<td style=\"width: 100%;\"><em>Gives a rough idea of how the main structure goes together.&nbsp; Missing are servos, screws and nuts. These elements are used in the same way as in the original design; go check out the build guide!</em></td>\n</tr>\n</tbody>\n</table>\n<p><br><br><br>The following guide shows a general procedure: <a class=\"instructure_file_link instructure_scribd_file\" title=\"Marble Maze Build Guide.pdf\" href=\"media/web_resources/Uploaded-Media/Marble-Maze-Build-Guide.pdf\" target=\"_blank\" data-canvas-previewable=\"false\" data-api-endpoint=\"https://canvas.instructure.com/api/v1/courses/12681309/files/309399224\" data-api-returntype=\"File\">Marble Maze Build Guide.pdf</a>&nbsp;&nbsp;</p>\n<p><em><br></em>If you'd like to see some photographic examples of some steps, this is the old build guide: <a href=\"https://learn.adafruit.com/tilt-controlled-marble-maze/build-the-maze\">Building the Maze</a></p>\n<ul>\n<li><em>Not all the steps match our design perfectly, so this should not be your primary guide. Use it only as a supplemental resource.</em></li>\n</ul>\n<p><strong><br>A video animation of the final assembly:<br></strong><em>Refer to this once you're on the final step in the build guide.</em><strong></strong></p>\n<p><em><iframe title=\"embedded content\" src=\"https://www.youtube.com/embed/setEePzhMxI\" width=\"560\" height=\"315\" loading=\"lazy\" allowfullscreen=\"allowfullscreen\" allow=\"accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture\"></iframe>&nbsp;</em></p>\n<p><span style=\"font-size: 12pt;\">&nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp;&nbsp;</span></p>\n<p><strong><span style=\"font-size: 18pt;\"><br>Step Four - Circuit:</span></strong></p>\n<p>The base circuit is fairly simple and will be shown below:</p>\n<p><img src=\"media/web_resources/Uploaded-Media/Marble-Maze-Crickit-Circuit.png\" alt=\"Marble Maze Crickit Circuit.png\" data-api-endpoint=\"https://canvas.instructure.com/api/v1/courses/12681309/files/320706417\" data-api-returntype=\"File\" loading=\"lazy\"></p>\n<p>&nbsp;</p>\n<p><strong><br><span style=\"font-size: 18pt;\">Step Five - Code:</span></strong></p>\n<p>Recall that the joystick module is really just a combination of&nbsp;<strong>two potentiometers</strong> and a&nbsp;<strong>pushbutton</strong>. For the base features of this project, you really just need to read the value of the&nbsp;<strong>x-potentiometer</strong> and&nbsp;<strong>map its value to the x-servo</strong> and then do the same for the&nbsp;<strong>y-potentiometer&nbsp;</strong>and&nbsp;<strong>y-servo.</strong></p>\n<p><img src=\"media/web_resources/Uploaded-Media/Marble-Maze-Code-Hint.png\" alt=\"Marble Maze Code Hint.png\" data-api-endpoint=\"https://canvas.instructure.com/api/v1/courses/12681309/files/320709847\" data-api-returntype=\"File\" loading=\"lazy\"></p>\n<p>&nbsp;</p>\n<p>However, depending on which side you chose to mount your servos, it is possible that this will give you&nbsp;<strong>contrary motion</strong>, where the servo moves opposite to the potentiometer rotation. You can easily fix this - the&nbsp;<strong>map()</strong> function can be given a <strong>decreasing&nbsp;</strong>range instead, where the first number in the range is high, and the second is low. Essentially this means a&nbsp;<em>low analog read value will map to a larger number,&nbsp; and a higher analog read value will map to a smaller number.</em></p>\n<p><img src=\"media/web_resources/Uploaded-Media/Marble-Maze-swap-range-order-in-map.png\" alt=\"Marble Maze - swap range order in map.png\" width=\"302\" height=\"81\" data-api-endpoint=\"https://canvas.instructure.com/api/v1/courses/12681309/files/320710000\" data-api-returntype=\"File\" loading=\"lazy\"></p>\n<p>&nbsp;</p>\n<p>Once you've got a variable holding your&nbsp;<strong>target angle</strong>, tell the appropriate servo to&nbsp;<span style=\"text-decoration: underline;\">go to that target angle:</span></p>\n<p><img src=\"media/web_resources/Uploaded-Media/Marble-Maze-servo-instruction.png\" alt=\"Marble Maze - servo instruction.png\" data-api-endpoint=\"https://canvas.instructure.com/api/v1/courses/12681309/files/320711061\" data-api-returntype=\"File\" loading=\"lazy\"></p>\n<p>&nbsp;</p>\n<p><br>After giving instructions to the servos, make sure to add a delay:</p>\n<p><img src=\"media/web_resources/Uploaded-Media/Marble-Maze-add-pause-block.png\" alt=\"Marble Maze - add pause block.png\" data-api-endpoint=\"https://canvas.instructure.com/api/v1/courses/12681309/files/320712086\" data-api-returntype=\"File\" loading=\"lazy\"></p>\n<p>&nbsp;</p>\n<ul>\n<li>This can ensure we don't flood the Crickit board with servo instructions!</li>\n<li>Try experimenting with different <strong>pause </strong>amounts and pay attention to how it changes the responsiveness of the joysticks. <strong>Tune this pause to what you consider the ideal amount.</strong></li>\n</ul>\n<p>&nbsp;</p>\n<p>&nbsp;</p>\n<p style=\"padding-left: 40px;\">&nbsp;</p>\n<p><span style=\"font-size: 24pt;\"><strong>Extensions </strong><span style=\"font-size: 14pt;\">(1/10)</span><strong>:</strong></span></p>\n<p style=\"padding-left: 40px;\">For this project, completing the base features correctly will earn a 9/10. To gain full marks, you'll need to do at least one of the following extensions:</p>\n<p style=\"padding-left: 40px;\">&nbsp;</p>\n<p style=\"padding-left: 40px;\"><span style=\"font-size: 18pt;\"><span style=\"text-decoration: underline;\">Add-on One</span>: Remote Tilt Controller</span></p>\n<p style=\"padding-left: 80px;\">&nbsp;Pair up with someone or borrow a second microbit from your instructor and use the second microbit as a&nbsp;<strong>tilt controller for the mable maze</strong></p>\n<ul>\n<li style=\"list-style-type: none;\">\n<ul>\n<li style=\"list-style-type: none;\">\n<ul>\n<li style=\"list-style-type: none;\">\n<ul>\n<li style=\"list-style-type: none;\">\n<ul>\n<li>Read in the&nbsp;<strong>x-tilt and y-tilt&nbsp;</strong>values from the second microbit, and then based off of these readings, send&nbsp;<strong>radio instructions</strong> to the base Micro:bit telling it how to drive the servos</li>\n<li>OPTIONAL 2-player mode:\n<ul>\n<li>one microbit reads&nbsp;<strong>x-tilt&nbsp;</strong>and controls&nbsp;<strong>one servo</strong></li>\n<li>another microbit reads&nbsp;<strong>y-tilt</strong> and controls <strong>the&nbsp;</strong><strong>other servo</strong></li>\n<li>two players must work together to solve the maze</li>\n</ul>\n</li>\n</ul>\n</li>\n</ul>\n</li>\n</ul>\n</li>\n</ul>\n</li>\n</ul>\n<p>&nbsp;</p>\n<p style=\"padding-left: 40px;\"><span style=\"font-size: 18pt;\"><span style=\"text-decoration: underline;\">Add-on Two</span>: Add Barriers</span></p>\n<p style=\"padding-left: 80px;\">&nbsp;For this feature, you'll tape 2 or 3 servos to the&nbsp;<strong>underside of the maze platform.</strong></p>\n<ul>\n<li style=\"list-style-type: none;\">\n<ul>\n<li style=\"list-style-type: none;\">\n<ul>\n<li style=\"list-style-type: none;\">\n<ul>\n<li style=\"list-style-type: none;\">\n<ul>\n<li>cut a slot lined up so that the <span style=\"text-decoration: underline;\">servo horn</span> can rotate up through the floor of the maze and block a corridor</li>\n<li>jittery servos can be used for this feature!</li>\n<li>control can be either:\n<ul>\n<li>manual (use push buttons to toggle the servos between <strong>blocking</strong> or&nbsp;<strong>retracted</strong> states</li>\n<li>automatic (use random delays to choose when each servo blocks (and for how long they block before retracting)</li>\n</ul>\n</li>\n</ul>\n</li>\n</ul>\n</li>\n</ul>\n</li>\n</ul>\n</li>\n</ul>\n<p>&nbsp;</p>\n<p style=\"padding-left: 40px;\"><span style=\"font-size: 18pt;\"><span style=\"text-decoration: underline;\">Add-on Three</span>: Joystick Assist Mode</span></p>\n<p style=\"padding-left: 80px;\">&nbsp;Raw data from the joystick module can be itself a bit jittery. Use software to clean up this input readings, specifically by implementing a&nbsp;<strong>low pass filter.</strong></p>\n<ul>\n<li style=\"list-style-type: none;\">\n<ul>\n<li style=\"list-style-type: none;\">\n<ul>\n<li style=\"list-style-type: none;\">\n<ul>\n<li style=\"list-style-type: none;\">\n<ul>\n<li>When reading the joystick module, we often will observerve small rapid fluctuations (noise).\n<ul>\n<li>A&nbsp;<strong>low pass filter</strong> tries to smooth out our joystick input by always aiming for a mixture of the&nbsp;<strong>current target</strong> and the <strong>new reading.</strong>\n<ul>\n<li>A smoothing factor is used to determine how much emphasis is given to each of the two components</li>\n<li>tuning this value will help balance&nbsp;<strong>smoothness of readings</strong> against&nbsp;<strong>responsiveness</strong></li>\n</ul>\n</li>\n</ul>\n</li>\n<li>add a potentiometer which can be used to control the&nbsp;<strong>smoothing factor</strong>\n<ul>\n<li>This should map to a value between 0 and 1, where:\n<ul>\n<li>0.1 very smooth</li>\n<li>0.5 medium smooth</li>\n<li>1 no smoothing</li>\n</ul>\n</li>\n</ul>\n</li>\n</ul>\n</li>\n</ul>\n</li>\n</ul>\n</li>\n</ul>\n</li>\n</ul>\n<p style=\"padding-left: 80px;\"><span style=\"text-decoration: underline;\">Expression:</span></p>\n<p style=\"padding-left: 120px;\"><strong>xFiltered = xFiltered + </strong>smoothingFactor * (rawReading - xFiltered)</p>\n<p style=\"padding-left: 120px;\"><em>** I can give some help on this in-person, if you'd like!</em></p>\n<p style=\"padding-left: 120px;\">&nbsp;</p>\n<p><span style=\"font-size: 24pt;\"><strong>To Submit:</strong></span></p>\n<p>For this project, there are two things to submit:&nbsp;</p>\n<ul>\n<li>A video of you using the marble maze (show me that you can solve it!)\n<ul>\n<li>Make sure to also show your circuit connections</li>\n<li>Showcase any extensions that were added as well!</li>\n</ul>\n</li>\n<li>A copy of your code, submitted as a&nbsp;<strong>.hex</strong> file</li>\n</ul>\n<p>&nbsp;</p>\n<p>&nbsp;</p>\n<p>&nbsp;</p>\n<p>&nbsp;</p>\n<p>&nbsp;</p>\n<p>&nbsp;</p>\n<p>&nbsp;</p>\n<p>&nbsp;</p>\n<p><span style=\"font-size: 18pt; color: #b34000;\">All text below is <span style=\"text-decoration: underline;\">out-of-date at present,</span> so please disregard. It is left in this item as it will be updated for the next section of RBA20.</span></p>\n<p><span style=\"background-color: #273540;\"><strong><span style=\"font-size: 18pt; background-color: #273540;\">Extensions:</span></strong></span></p>\n<p style=\"padding-left: 40px;\"><span style=\"background-color: #273540;\">For this project, completing the base features correctly will earn a 9/10. To gain full marks, you'll need to do at least one of the following extensions:</span></p>\n<p style=\"padding-left: 40px;\"><br><span style=\"background-color: #273540;\"><a id=\"extOne\" style=\"background-color: #273540;\"></a><strong>Extension 1 - Completion LED: </strong></span></p>\n<p style=\"padding-left: 40px;\"><span style=\"background-color: #273540;\">Using a&nbsp;<strong>paper switch</strong> and some <strong>copper tape</strong>, create a small circuit that will turn an LED on when the steel marble reaches the end of the maze.</span></p>\n<p style=\"padding-left: 40px; text-align: center;\"><span style=\"background-color: #273540;\"><img style=\"display: block; margin-left: auto; margin-right: auto;\" src=\"media/web_resources/Mable-Maze-Paper-Switch-2.gif\" alt=\"\" width=\"621\" height=\"349\" data-decorative=\"true\" data-api-endpoint=\"https://canvas.instructure.com/api/v1/courses/12681309/files/309399490\" data-api-returntype=\"File\" loading=\"lazy\"><em style=\"font-family: inherit; font-size: 1rem; background-color: #273540;\">sample circuit only - you'll build this into your completed maze using <strong>5v</strong> and <strong>GND</strong> from the Arduino</em></span></p>\n<p style=\"padding-left: 40px;\"><span style=\"background-color: #273540;\">The gap between the copper tape (as shown) will make this particular LED circuit broken. The metal ball, once it reaches this point, should press the paper switch down, and the copper on the bottom of the paper switch will close the circuit, turning the LED on.</span></p>\n<table style=\"height: 929px; width: 100%; border-collapse: collapse;\" border=\"0\">\n<tbody>\n<tr style=\"height: 488px;\">\n<td style=\"width: 50%; height: 488px;\">\n<p style=\"text-align: center;\"><span style=\"background-color: #273540;\"><img style=\"display: block; margin-left: auto; margin-right: auto;\" src=\"media/web_resources/marble-maze-LED-close-up.png\" alt=\"\" width=\"339\" height=\"436\" data-decorative=\"true\" data-api-endpoint=\"https://canvas.instructure.com/api/v1/courses/12681309/files/309399475\" data-api-returntype=\"File\" loading=\"lazy\"><em><span style=\"font-size: 10pt; background-color: #273540;\">twist together your LED, resistor, and 5v/GND wires</span></em></span></p>\n</td>\n<td style=\"width: 50%; text-align: center; height: 488px;\"><span style=\"background-color: #273540;\"><img src=\"media/web_resources/marble-maze-Copper-Tape-Leads.png\" alt=\"\" data-decorative=\"true\" data-api-endpoint=\"https://canvas.instructure.com/api/v1/courses/12681309/files/309399506\" data-api-returntype=\"File\" loading=\"lazy\"><em><span style=\"font-size: 10pt; background-color: #273540;\">When making the \"switch\" you can connect wires to the copper tape b
