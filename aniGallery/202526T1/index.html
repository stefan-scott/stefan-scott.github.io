<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Animation 10 Major Projects</title>

<style>
    body {
        margin: 0;
        font-family: Arial, sans-serif;
        display: flex;
        height: 100vh;
        background: #f5f5f5;
    }

    /* Desktop sidebar */
    #sidebar {
        width: 180px;
        background: #222;
        color: white;
        padding: 20px 10px;
        box-sizing: border-box;
        overflow-y: auto;
    }

    #sidebar h1 {
        font-size: 18px;
        margin-bottom: 4px;
    }

    #sidebar h2 {
        font-size: 12px;
        font-weight: normal;
        margin-top: 0;
        margin-bottom: 20px;
        color: #ccc;
    }

    .student {
        padding: 8px;
        cursor: pointer;
        border-radius: 4px;
        margin-bottom: 4px;
    }

    .student:hover { background: #444; }
    .active { background: #00aaff; font-weight: bold; }

    /* Main content */
    #main {
        flex-grow: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        position: relative;
        padding: 20px;
    }

    #media-container {
        max-width: 90%;
        max-height: 80%;
        display: flex;
        align-items: center;
        justify-content: center;
        background: white;
        border: 2px solid #ccc;
        border-radius: 8px;
        padding: 10px;
        box-sizing: border-box;
        aspect-ratio: 16 / 9;
    }

    video, img {
        max-width: 100%;
        max-height: 100%;
        border-radius: 6px;
    }

    /* Desktop arrows */
    .arrow-desktop {
        position: absolute;
        top: 50%;
        transform: translateY(-50%);
        font-size: 40px;
        cursor: pointer;
        user-select: none;
        color: #555;
    }

    #prev-desktop { left: 20px; }
    #next-desktop { right: 20px; }

    .arrow-desktop:hover { color: #000; }

    /* Mobile bar */
    #mobile-bar {
        display: none;
        margin-top: 12px;
        width: 100%;
        align-items: center;
        justify-content: space-between;
        font-size: 18px;
    }

    #mobile-name {
        cursor: pointer;
        font-weight: bold;
        text-align: center;
        flex: 1;
    }

    #mobile-list {
        display: none;
        position: absolute;
        bottom: 80px;
        background: white;
        border: 1px solid #ccc;
        border-radius: 6px;
        max-height: 200px;
        overflow-y: auto;
        width: 70%;
        box-shadow: 0 4px 10px rgba(0,0,0,0.2);
    }

    #mobile-list div {
        padding: 8px;
        cursor: pointer;
    }

    #mobile-list div:hover { background: #eee; }

    /* Mobile arrows */
    .arrow-mobile {
        font-size: 40px;
        cursor: pointer;
        user-select: none;
        color: #555;
    }

    /* Responsive: MOBILE MODE */
    @media (max-width: 768px) {
        body { flex-direction: column; }
        #sidebar { display: none; }
        #mobile-bar { display: flex; }
        #prev-desktop, #next-desktop { display: none; }
        #media-container { max-width: 100%; max-height: none; }
    }
</style>
</head>

<body>

<!-- Desktop Sidebar -->
<div id="sidebar">
    <h1>Animation 10 Major Projects</h1>
    <h2>2025–26 T1</h2>
    <div id="student-list"></div>
</div>

<!-- Main Content -->
<div id="main">
    <div id="media-container"></div>

    <!-- Mobile Navigation Bar -->
    <div id="mobile-bar">
        <div id="prev-mobile" class="arrow-mobile">&#10094;</div>
        <div id="mobile-name"></div>
        <div id="next-mobile" class="arrow-mobile">&#10095;</div>
    </div>

    <div id="mobile-list"></div>

    <!-- Desktop Arrows -->
    <div id="prev-desktop" class="arrow-desktop">&#10094;</div>
    <div id="next-desktop" class="arrow-desktop">&#10095;</div>
</div>

<script>
const projects = [
    { name: "Aiden", file: "projects/aiden.gif" },
    { name: "Alia", file: "projects/alia.gif" },
    { name: "Anaya", file: "projects/anaya.gif" },
    { name: "Babrik", file: "projects/babrik.mp4" },
    { name: "Bella", file: "projects/bella.mp4" },
    { name: "Conor", file: "projects/conor.gif" },
    { name: "Eliza", file: "projects/eliza.mp4" },
    { name: "Gustavo", file: "projects/gustavo.mp4" },
    { name: "Hailey", file: "projects/hailey.mp4" },
    { name: "Liam", file: "projects/liam.mp4" },
    { name: "Miki", file: "projects/miki.mp4" },
    { name: "Mok", file: "projects/mok.GIF" },
    { name: "Rafae", file: "projects/rafae.mp4" },
    { name: "Sahar", file: "projects/sahar.mp4" },
    { name: "Shukria", file: "projects/shukria.gif" },
    { name: "Tyler", file: "projects/tyler.mp4" }
];

let currentIndex = 0;

const studentList = document.getElementById("student-list");
const mediaContainer = document.getElementById("media-container");
const mobileName = document.getElementById("mobile-name");
const mobileList = document.getElementById("mobile-list");

/* Build student lists (desktop + mobile) */
projects.forEach((p, index) => {
    const d = document.createElement("div");
    d.className = "student";
    d.textContent = p.name;
    d.onclick = () => loadProject(index);
    studentList.appendChild(d);

    const m = document.createElement("div");
    m.textContent = p.name;
    m.onclick = () => { loadProject(index); mobileList.style.display = "none"; };
    mobileList.appendChild(m);
});

function loadProject(index) {
    currentIndex = index;
    const project = projects[index];
    mediaContainer.innerHTML = "";

    [...studentList.children].forEach((el, i) =>
        el.classList.toggle("active", i === index)
    );

    mobileName.textContent = project.name;

    const ext = project.file.split(".").pop().toLowerCase();

    if (ext === "mp4") {
        const video = document.createElement("video");
        video.src = project.file;
        video.controls = true;
        mediaContainer.appendChild(video);
    } else {
        const img = document.createElement("img");
        img.src = project.file;
        mediaContainer.appendChild(img);
    }
}

function prev() {
    loadProject((currentIndex - 1 + projects.length) % projects.length);
}

function next() {
    loadProject((currentIndex + 1) % projects.length);
}

/* Desktop arrows */
document.getElementById("prev-desktop").onclick = prev;
document.getElementById("next-desktop").onclick = next;

/* Mobile arrows */
document.getElementById("prev-mobile").onclick = prev;
document.getElementById("next-mobile").onclick = next;

/* Mobile dropdown toggle */
mobileName.onclick = () => {
    mobileList.style.display =
        mobileList.style.display === "block" ? "none" : "block";
};

/* Load first project */
loadProject(0);
</script>

</body>
</html>
