 up Autodesk Inventor","position":2,"published":true,"content_html":"<p>** I sent you a file in your Canvas email that can be submitted as your&nbsp;<strong>enrollment status.&nbsp;</strong>I initially sent this as a .docx file, but am sending it again as a PDF, which seems to be the file format that should work.</p>\n<p>For our 3D Design Unit, we'll be using <strong>Autodesk Inventor 2018.&nbsp;</strong></p>\n<p>This is Industry-Grade Mechanical Modeling Software, but is freely available for Educational contexts. The download is quite large, so it will take some time to get. <em>If there are limitations to your internet access that making downloading this software not possible, contact me and we'll look at alternatives.&nbsp;</em></p>\n<p><span style=\"font-size: 14pt;\"><strong>Autodesk Inventor 2018</strong></span></p>\n<ul>\n<li style=\"list-style-type: none;\">\n<ul>\n<li>download from <a href=\"https://www.autodesk.com/education/free-software/inventor-professional\">here.</a>\n<ul>\n<li>You'll have to create an Autodesk account and list what school you are from.</li>\n<li>\n<strong><span style=\"text-decoration: underline;\">Make sure to get the 2018 version! </span></strong>I won't be able to open/grade files created in the newer versions.&nbsp;</li>\n<li>Take note of the Serial Number and Product Key from the download page - you'll need these to activate the program.</li>\n</ul>\n</li>\n</ul>\n</li>\n</ul>\n<p><strong>How to Download:&nbsp;</strong><em>(doesn't show creating an account - see video below for that portion)</em></p>\n<p><iframe src=\"https://www.youtube.com/embed/jmzIg3jdROk\" width=\"560\" height=\"315\" allowfullscreen=\"allowfullscreen\" allow=\"accelerometer; autoplay; encrypted-media; gyroscope; picture-in-picture\" loading=\"lazy\"></iframe></p>\n<p><strong>How to Create Your Student Account:</strong></p>\n<p><iframe src=\"https://www.youtube.com/embed/D_JPuaye4W8\" width=\"560\" height=\"315\" allowfullscreen=\"allowfullscreen\" allow=\"accelerometer; autoplay; encrypted-media; gyroscope; picture-in-picture\" loading=\"lazy\"></iframe></p>\n<p><strong>IF THE INSTALLER DOESN'T SEEM TO BE WORKING:</strong></p>\n<p>In this case, you can try a \"Browser Download\". With this option, you'll need to leave the browser open for the entire download, which is quite large! But, it should work reliably if you can do that. To pick it, click the arrow to the right of&nbsp;<strong>DOWNLOAD NOW, </strong>as shown below:</p>\n<p><img src=\"media/web_resources/Inventor-Browser-Download-Button.PNG\" alt=\"\" data-decorative=\"true\" loading=\"lazy\"></p>\n\n"},{"id":"gf8d991d1f2322b58a0767f7498153950","kind":"page","title":"3D Modeling / CAD Demos 01-2","nav_title":"3D Modeling / CAD Demos 01-2","position":3,"published":true,"content_html":"<p>To support building some larger-scale projects, we'll need to develop/refine our ability to model objects digitally in 2D and 3D. In this mini-unit, we'll be using&nbsp;<strong>Autocad Inventor.&nbsp;</strong>Objects created in this environment can later be manufactured using the schools&nbsp;<strong>3D Printers.</strong></p>\n<p><span style=\"text-decoration: underline;\">Demo One:</span></p>\n<p style=\"padding-left: 40px;\">Please open the following PDF, which we will work through together as a class. Each shape will be given an extrusion thickness of roughly 1/10 of the object's width (This measurement will vary across the three demo drawings).</p>\n<p style=\"padding-left: 40px;\"><a class=\"instructure_file_link instructure_scribd_file\" title=\"Demo - 01.pdf\" href=\"media/web_resources/Demo-01.pdf\" data-api-endpoint=\"https://canvas.instructure.com/api/v1/courses/1951684/files/90811972\" data-api-returntype=\"File\">Demo - 01.pdf</a></p>\n<p>&nbsp;</p>\n<p><span style=\"text-decoration: underline;\">Demo Videos:</span>&nbsp;&nbsp;</p>\n<p style=\"padding-left: 40px;\">Follow along with these three videos (one for each of the demo drawings). Make sure to create all three 3D designs in Inventor as you work through the video. Once complete, you'll be ready to do this week's exercises&nbsp;<em>on your own.</em></p>\n<p style=\"padding-left: 40px;\"><strong>Demo One:</strong></p>\n<p style=\"padding-left: 40px;\"><iframe src=\"https://www.youtube.com/embed/Cxgcw-UV7o4\" width=\"560\" height=\"315\" allowfullscreen=\"allowfullscreen\" allow=\"accelerometer; autoplay; encrypted-media; gyroscope; picture-in-picture\" loading=\"lazy\"></iframe></p>\n<p style=\"padding-left: 40px;\"><strong>Demo Two:</strong></p>\n<p style=\"padding-left: 40px;\"><iframe src=\"https://www.youtube.com/embed/UBOw646PtSw\" width=\"560\" height=\"315\" allowfullscreen=\"allowfullscreen\" allow=\"accelerometer; autoplay; encrypted-media; gyroscope; picture-in-picture\" loading=\"lazy\"></iframe></p>\n<p style=\"padding-left: 40px;\"><strong>Demo Three:</strong></p>\n<p style=\"padding-left: 40px;\"><iframe src=\"https://www.youtube.com/embed/13sbpApnwG0\" width=\"560\" height=\"315\" allowfullscreen=\"allowfullscreen\" allow=\"accelerometer; autoplay; encrypted-media; gyroscope; picture-in-picture\" loading=\"lazy\"></iframe></p>\n\n"},{"id":"g3587ca8f365bdf5b4d6b2724050530cc","kind":"assignment","title":"CAD Exercise Pack 01","nav_title":"CAD Exercise Pack 01","position":4,"published":true,"content_html":"<div class=\"item-meta\"><span class=\"meta-points\"><strong>Points:</strong> 10.0</span> &middot; <span class=\"meta-submission\"><strong>Submission type:</strong> online upload</span> &middot; <span class=\"meta-ext\"><strong>Allowed file types:</strong> ipt,zip</span></div><p>Following our class demos, <strong>create the three drawings</strong> dimensioned in the following file.</p>\n<ul>\n<li>Each 2D sketch should be extruded to a thickness roughly 1/10 of the object's width.&nbsp;</li>\n<li>Make sure that the objects are created using&nbsp;<strong>millimeters&nbsp;</strong>for your units.</li>\n<li><em>You can hand in 3 .ipt files, or ZIP all three together and submit the ZIP</em></li>\n<li>\n<span style=\"color: #ffffff; background-color: #800000;\"><strong>NOTE:</strong> </span>In drawing 3, the places where you can see a circle in a circle should be a&nbsp;<strong>counterbore</strong> <em>(see video below)</em>. For these, the outer diameter is 33mm and the inner diameter is 17mm)</li>\n</ul>\n<p><a class=\"instructure_file_link instructure_scribd_file\" title=\"Exercises - 01.pdf\" href=\"media/web_resources/Exercises-01.pdf\" data-api-endpoint=\"https://canvas.instructure.com/api/v1/courses/2494334/files/121929400\" data-api-returntype=\"File\">Exercises - 01.pdf</a></p>\n<p><span style=\"text-decoration: underline;\">Extra Information:</span></p>\n<p><em>One of the exercises has a few features that require some tools we didn't cover. Check out these short quick-hitters on how to make fillets and counterbores.<br><br></em></p>\n<p style=\"padding-left: 40px;\"><strong>Trim:</strong></p>\n<p style=\"padding-left: 40px;\"><iframe src=\"https://www.youtube.com/embed/WH_BFlA-QiA\" width=\"560\" height=\"315\" allowfullscreen=\"allowfullscreen\" allow=\"accelerometer; autoplay; encrypted-media; gyroscope; picture-in-picture\" loading=\"lazy\"></iframe></p>\n<p style=\"padding-left: 40px;\"><strong><br>Fillets:</strong></p>\n<p style=\"padding-left: 40px;\"><iframe src=\"https://www.youtube.com/embed/eYnc7a3TTso\" width=\"560\" height=\"315\" allowfullscreen=\"allowfullscreen\" allow=\"accelerometer; autoplay; encrypted-media; gyroscope; picture-in-picture\" loading=\"lazy\"></iframe></p>\n<p style=\"padding-left: 40px;\">&nbsp;</p>\n<p style=\"padding-left: 40px;\"><strong>Counterbore:</strong></p>\n<p style=\"padding-left: 40px;\"><iframe src=\"https://www.youtube.com/embed/NNu4x1LMMUc\" width=\"560\" height=\"315\" allowfullscreen=\"allowfullscreen\" allow=\"accelerometer; autoplay; encrypted-media; gyroscope; picture-in-picture\" loading=\"lazy\"></iframe></p>\n<p style=\"padding-left: 40px;\">The third drawing has 3 places where a circle is inside another circle. For 3D objects, this is typically a&nbsp;<strong>Counterbore, Countersink, or Spotface </strong>feature<strong>.&nbsp;</strong>We'll see as a class how to add a&nbsp;<strong>Counterbore&nbsp;</strong>feature in Inventor. For these three circles, you can assume the depth of the large circle will be&nbsp;<em>half of the overall object (Extrusion) thickness.</em></p>\n\n"},{"id":"g0c91ed98c8f4f3cef137c3a26167eb3e","kind":"page","title":"3D Modeling / CAD Demos 02-2","nav_title":"3D Modeling / CAD Demos 02-2","position":5,"published":true,"content_html":"<p><strong>Content Videos:</strong></p>\n<p>This week we'll see drawings of objects in some new formats: isometric and orthographic. Both are commonly used to represent objects, and we'll work to translate from both types into 3D Geometry. Begin by watching the following content videos to get a quick overview of the characteristics of these representations:</p>\n<p><iframe src=\"https://www.youtube.com/embed/SdLegfoMXNA\" width=\"560\" height=\"315\" allowfullscreen=\"allowfullscreen\" allow=\"accelerometer; autoplay; encrypted-media; gyroscope; picture-in-picture\" loading=\"lazy\"></iframe></p>\n<p><iframe src=\"https://www.youtube.com/embed/WhSJDrp4eOE\" width=\"560\" height=\"315\" allowfullscreen=\"allowfullscreen\" allow=\"accelerometer; autoplay; encrypted-media; gyroscope; picture-in-picture\" loading=\"lazy\"></iframe></p>\n<p>&nbsp;</p>\n<p><strong><span style=\"text-decoration: underline;\">Demo Videos</span></strong></p>\n<p>In Demo Two, we'll look at creating 3D solids through both <strong>adding material</strong> and<strong> removing material</strong> (cuts). As well, we'll explore <strong>orthographic projections</strong>, and modeling based off of those types of representations.</p>\n<p><a class=\"instructure_file_link instructure_scribd_file\" title=\"Demo - 02.pdf\" href=\"media/web_resources/Demo-02.pdf\" data-api-endpoint=\"https://canvas.instructure.com/api/v1/courses/1951684/files/90811991\" data-api-returntype=\"File\">Demo - 02.pdf</a></p>\n<p><br><strong>Exercise 1:</strong></p>\n<p><iframe src=\"https://www.youtube.com/embed/HQ6INNZCr4k\" width=\"560\" height=\"315\" allowfullscreen=\"allowfullscreen\" allow=\"accelerometer; autoplay; encrypted-media; gyroscope; picture-in-picture\" loading=\"lazy\"></iframe></p>\n<p><br><strong>Exercise 2:</strong></p>\n<p><iframe src=\"https://www.youtube.com/embed/Ae9EA2XaHJ0\" width=\"560\" height=\"315\" allowfullscreen=\"allowfullscreen\" allow=\"accelerometer; autoplay; encrypted-media; gyroscope; picture-in-picture\" loading=\"lazy\"></iframe></p>\n<p><strong><br>Exercise 3:</strong></p>\n<p><em>This demo exercise will also introduce a few new concepts / commands (copy, offset plane, bolt circle, parametric modeling, slice graphics)</em></p>\n<p><iframe src=\"https://www.youtube.com/embed/qrAbgGUjmxo\" width=\"560\" height=\"315\" allowfullscreen=\"allowfullscreen\" allow=\"accelerometer; autoplay; encrypted-media; gyroscope; picture-in-picture\" loading=\"lazy\"></iframe></p>\n\n"},{"id":"gd381f312ebdc39bdf3eb14e7ca632d49","kind":"assignment","title":"CAD Exercise Pack 02","nav_title":"CAD Exercise Pack 02","position":6,"published":true,"content_html":"<div class=\"item-meta\"><span class=\"meta-points\"><strong>Points:</strong> 1.0</span> &middot; <span class=\"meta-submission\"><strong>Submission type:</strong> online upload</span></div><p>Following our second set of class demo videos,<span>&nbsp;</span><strong>pick three of the attached four drawings </strong><span>&nbsp;</span>to recreate in Inventor. All the necessary measurements are included. Images are either represented as<span>&nbsp;</span><strong>isometric</strong><span>&nbsp;</span>(a pictorial form)or as an<span>&nbsp;</span><strong>orthographic projection</strong><span>&nbsp;</span>(individual drawings of<span>&nbsp;</span><strong>front, top,</strong><span>&nbsp;</span>and<span>&nbsp;</span><strong>right</strong><span>&nbsp;</span>views).&nbsp;</p>\n<p><span class=\"instructure_file_holder link_holder\"><a class=\"instructure_file_link\" title=\"Exercises - 02.pdf\" href=\"media/web_resources/Exercises-02.pdf\" data-api-endpoint=\"https://canvas.instructure.com/api/v1/courses/1951684/files/90812007\" data-api-returntype=\"File\">Exercises - 02.pdf</a><a class=\"file_preview_link\" title=\"Preview the document\" href=\"media/web_resources/Exercises-02.pdf\" aria-hidden=\"true\" data-api-endpoint=\"https://canvas.instructure.com/api/v1/courses/1951684/files/90812007\" data-api-returntype=\"File\"><img src=\"https://canvas.instructure.com/images/preview.png\" alt=\"Preview the document\" loading=\"lazy\"></a></span></p>\n<p><strong><span class=\"instructure_file_holder link_holder\">Submission Details</span></strong></p>\n<ul>\n<li>Make sure that the objects are created using&nbsp;<strong>millimeters&nbsp;</strong>for your units.</li>\n<li><em>You can hand in 3 .ipt files, or ZIP all three together and submit the ZIP</em></li>\n</ul>\n<p><strong><span class=\"instructure_file_holder link_holder\"><br>Hint Video</span></strong></p>\n<p><em><span class=\"instructure_file_holder link_holder\">The third exercise has one sneaky dimension that may need some explanation. See this short video for how to find the centerpoints for the holes in this object.</span></em></p>\n<p><iframe src=\"https://www.youtube.com/embed/g4Vl8kExVzI\" width=\"560\" height=\"315\" allowfullscreen=\"allowfullscreen\" allow=\"accelerometer; autoplay; encrypted-media; gyroscope; picture-in-picture\" loading=\"lazy\"></iframe></p>\n\n"}]},{"id":"g9abda7d80735c3557ddaac21e2248278","slug":"26-week-02-3d-modeling-and-design-2","title":"Week 02 - 3D Modeling and Design 2","order":26,"items":[{"id":"geb13ebf8236a81c88d117f93d32c5cd9","kind":"page","title":"CAD Exercise Pack 02-2","nav_title":"CAD Exercise Pack 02-2","position":2,"published":true,"content_html":"<p>Following our second class demo, <strong>create the four drawings</strong> dimensioned in the following file. All the necessary measurements are included. Images are either represented as <strong>isometric</strong> (a pictorial form)or as an <strong>orthographic projection</strong> (individual drawings of <strong>front, top,</strong> and <strong>right</strong> views). One or more of the drawings in this pack <em>(randomly chosen by the instructor)</em>&nbsp;will be submitted later on for assessment.</p>\n<p><a class=\"instructure_file_link instructure_scribd_file\" title=\"Exercises - 02.pdf\" href=\"media/web_resources/Exercises-02.pdf\">Exercises - 02.pdf</a></p>\n<p>&nbsp;</p>\n\n"}]},{"id":"g7cd5da259b7d14a51f99fbfcde5d9c78","slug":"27-logging-in-to-tinkercad","title":"Logging in to TinkerCAD","order":27,"items":[]},{"id":"g2b59404cc4dd8b77544a4a4ca42d159d","slug":"28-working-with-steppers","title":"Working with Steppers","order":28,"items":[{"id":"g911772d59ca5dd4238cfda7612b31333","kind":"assignment","title":"Stepper Basics","nav_title":"Stepper Basics","position":1,"published":true,"content_html":"<div class=\"item-meta\"><span class=\"meta-points\"><strong>Points:</strong> 10.0</span> &middot; <span class=\"meta-submission\"><strong>Submission type:</strong> online upload</span> &middot; <span class=\"meta-ext\"><strong>Allowed file types:</strong> mp4,mov,ino,zip</span></div><p>Stepper Motors work differently than DC motors and Servos, but have some desirable characteristics of each. Namely, Stepper Motors have <strong>no limits on their rotation</strong> but also <strong>can keep track of how much they have moved</strong>. This makes them very suitable for applications where you want to drive a belt or a gear very precise distances. Many robotics applications use stepper motors. <span style=\"text-decoration: underline;\">One very common example would be 3D printers.</span>&nbsp;</p>\n<p>As we move towards the&nbsp;<strong>projects</strong> section of this course, many projects will need to use stepper motors, so this assignment will ensure we understand<strong> how they work</strong> and have some <strong>experience actually using them</strong>.</p>\n<p><strong>Videos - How They Work:</strong></p>\n<p>&nbsp;</p>\n<p><iframe src=\"https://www.youtube.com/embed/eyqwLiowZiU\" width=\"560\" height=\"315\" allowfullscreen=\"allowfullscreen\" allow=\"accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture\" loading=\"lazy\"></iframe></p>\n<p>&nbsp;</p>\n<p><strong>Tutorial - Control with an Arduino:</strong></p>\n<p>Take a look through the following tutorial and play around with controlling your 28byj Stepper motor. This tutorial features some example programs that come with explanations.</p>\n<p><a href=\"https://www.makerguides.com/28byj-48-stepper-motor-arduino-tutorial/\">https://www.makerguides.com/28byj-48-stepper-motor-arduino-tutorial/</a></p>\n<p>In particular, you need to be able to control the stepper with both of the libraries used in the tutorial:</p>\n<ul>\n<li>Stepper.h Library (should be pre-installed)</li>\n<li>AccelStepper Library</li>\n</ul>\n<p>&nbsp;</p>\n<p><span style=\"background-color: #ff6600; color: #ffffff;\"><strong>Note:</strong></span> <em>The provided circuit diagram shows powering the stepper with external power. For simplicity, just use 5v and GND from the Arduino. (This will mean less power, but for this particular exercise that won't be an issue).</em></p>\n<p>&nbsp;</p>\n<p><strong>Demonstration:</strong></p>\n<p>Create a circuit that includes 4 buttons and a stepper motor / stepper driver.</p>\n<ul>\n<li>Pressing each button should move the stepper according to the following scheme:\n<ul>\n<li>Button 1:&nbsp; Rotate left 180 degrees</li>\n<li>Button 2: Rotate left 25 degrees</li>\n<li>Button 3: Rotate right 25 degrees</li>\n<li>Button 4: Rotate right 180 degrees</li>\n</ul>\n</li>\n</ul>\n\n"}]}],"unfiled":[{"id":"geacb83d5cc5c3cc5cabdda4536ecaf13","kind":"page","title":"02 - Ultrasonic, Temperature, RGB LEDs","nav_title":"02 - Ultrasonic, Temperature, RGB LEDs","position":1,"published":true,"content_html":"<p><span style=\"font-family: inherit; font-size: 1rem;\">For your second day of at-home learning, we'll keep things a bit lighter with tutorials to follow along with and create in the simulator. The main learning goals are:</span></p>\n<ul>\n<li>Learn about a new component or two</li>\n<li>Gain some additional practice with coding (block based, or text-based if you choose).</li>\n</ul>\n<p>&nbsp;</p>\n<p><span style=\"font-size: 18pt;\"><strong>Submission and Assessment</strong></span></p>\n<p><span style=\"font-family: inherit; font-size: 1rem;\">For both of the tutorials below:</span></p>\n<ul>\n<li><span style=\"font-family: inherit; font-size: 1rem;\">Create the simulated circuit using TinkerCAD</span></li>\n<li>\n<span style=\"font-family: inherit; font-size: 1rem;\">Name the completed simulated projects as follows:</span>\n<ul>\n<li><span style=\"font-family: inherit; font-size: 1rem;\">Ultrasonic Rangefinder - READY TO MARK</span></li>\n<li><span style=\"font-family: inherit; font-size: 1rem;\">RGB and Temperature Sensor - READY TO MARK</span></li>\n</ul>\n</li>\n</ul>\n<p><em><span style=\"font-family: inherit; font-size: 1rem;\">Assessment for these two will simply be complete/incomplete. I want to encourage you to attempt the on-your-own extensions that are listed with the Ultrasonic tutorial, but there will be no penalty for not completing that portion.<br><br></span></em></p>\n<p><span style=\"font-size: 18pt;\"><strong>Tutorial One - Ultrasonic Rangefinder</strong></span></p>\n<p>This is a super-common component that uses sound waves to <strong>detect objects</strong> and <strong>measure distances</strong>. Following along with the following video in TinkerCAD. Once complete, add the extension listed just underneath the video.</p>\n<p><iframe src=\"https://www.youtube.com/embed/eu9K6AF82T4\" width=\"560\" height=\"315\" allowfullscreen=\"allowfullscreen\" allow=\"accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture\" loading=\"lazy\"></iframe><strong></strong></p>\n<p><strong>On-your-own Extension:</strong></p>\n<p>Add four LEDs (or more, if you'd like it to look cooler) to your circuit. The amount of LEDs that are on should depend on the detected distance with the Ultrasonic sensor:</p>\n<ul>\n<li>No Object&nbsp; (dist &gt;= 335cm)&nbsp; → no LEDs on</li>\n<li>( dist &lt; 335 and dist &gt;= 250) → 1 LED on</li>\n<li>( dist &lt; 250 and dist &gt;= 180) → 2 LED on</li>\n<li>( dist &lt; 180 and dist &gt;= 100) → 3 LED on</li>\n<li>( dist &lt; 100 ) → 4 LED on</li>\n</ul>\n<p>&nbsp;</p>\n<p><span style=\"font-size: 18pt;\"><strong>Tutorial Two - RGB LED and Temperature Sensor:</strong></span></p>\n<p>This tutorial will be straightforward - no extensions. A few pieces of information before you start:</p>\n<ul>\n<li>RGB LEDs&nbsp; (red - green - blue) are actually 3 small LED that are fit into a single bulb.\n<ul>\n<li>Of the 4 wires, 3 are for each of the individual LEDs (red, green, blue)</li>\n<li>The last wire is a common wire<em> (sometimes a common GND, sometimes common 5v - there are 2 types)</em>\n</li>\n<li>Setting the individual brightness of all three colors will allow us to <strong>mix the colors</strong> to produce many different outputs.</li>\n</ul>\n</li>\n</ul>\n<p><iframe src=\"https://www.youtube.com/embed/5XZ3D0r6HfM\" width=\"560\" height=\"315\" allowfullscreen=\"allowfullscreen\" allow=\"accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture\" loading=\"lazy\"></iframe></p>\n<p>&nbsp;</p>\n\n"},{"id":"g2cde229b49c479eddbb4095971373704","kind":"page","title":"03 Expert Challenge H Bridge","nav_title":"03 Expert Challenge H Bridge","position":2,"published":true,"content_html":""},{"id":"gd4505a107ff52f297621c0b9c7f9b52d","kind":"page","title":"CAD Exercise Pack 01-2","nav_title":"CAD Exercise Pack 01-2","position":3,"published":true,"content_html":"<p>Following our first class demo, <strong>create the three drawings</strong> dimensioned in the following file. Each 2D sketch should be extruded to a thickness roughly 1/10 of the object's width. One or more of the drawings in this pack <em>(randomly chosen by the instructor)</em> will be submitted later on for assessment.</p>\n<p><a class=\"instructure_file_link instructure_scribd_file\" title=\"Exercises - 01.pdf\" href=\"media/web_resources/Exercises-01.pdf\" data-api-endpoint=\"https://canvas.instructure.com/api/v1/courses/1951684/files/90811992\" data-api-returntype=\"File\">Exercises - 01.pdf</a></p>\n<p><span style=\"text-decoration: underline;\">Extra Information:</span></p>\n<p><em>One of the exercises has a few features that require some tools we didn't cover. Check out these short quick-hitters on how to make fillets and counterbores.</em></p>\n<p style=\"padding-left: 40px;\"><strong>Fillets</strong></p>\n<p style=\"padding-left: 40px;\"><iframe src=\"https://www.youtube.com/embed/eYnc7a3TTso\" width=\"560\" height=\"315\" allowfullscreen=\"allowfullscreen\" allow=\"accelerometer; autoplay; encrypted-media; gyroscope; picture-in-picture\" loading=\"lazy\"></iframe></p>\n<p style=\"padding-left: 40px;\">&nbsp;</p>\n<p style=\"padding-left: 40px;\"><strong>Counterbore:</strong></p>\n<p style=\"padding-left: 40px;\"><iframe src=\"https://www.youtube.com/embed/NNu4x1LMMUc\" width=\"560\" height=\"315\" allowfullscreen=\"allowfullscreen\" allow=\"accelerometer; autoplay; encrypted-media; gyroscope; picture-in-picture\" loading=\"lazy\"></iframe></p>\n<p style=\"padding-left: 40px;\">The third drawing has 3 places where a circle is inside another circle. For 3D objects, this is typically a&nbsp;<strong>Counterbore, Countersink, or Spotface </strong>feature<strong>.&nbsp;</strong>We'll see as a class how to add a&nbsp;<strong>Counterbore&nbsp;</strong>feature in Inventor. For these three circles, you can assume the depth of the large circle will be&nbsp;<em>half of the overall object (Extrusion) thickness.</em></p>\n\n"},{"id":"g341ee2d9d2f5eef0d49d1972fe085133","kind":"page","title":"Extra Lab Hours 2019-20","nav_title":"Extra Lab Hours 2019-20","position":4,"published":true,"content_html":"<p>If you would like to come in for extra help on one of your classes, I will keep the lab open one day a week as a drop-in <strong>tutorial session time.</strong> For this semester, the day/time is:</p>\n<p><strong><span style=\"font-size: 18pt;\">Tuesdays → 3:30 - 5:00</span></strong></p>\n<p>&nbsp;</p>\n<p>&nbsp;</p>\n\n"},{"id":"gc97b4e7fedfa8d258365f8691f17e125","kind":"page","title":"H-Bridge Hints","nav_title":"H-Bridge Hints","position":5,"published":true,"content_html":"<p><em>The following Illustration shows a TinkerCAD implementation of the H-Bridge circuit schematic provided for this exercise:</em></p>\n<p><img src=\"media/web_resources/Uploaded-Media/H-Bridge-Solution-Circuit-Revised-.PNG\" alt=\"H Bridge Solution Circuit (Revised).PNG\" loading=\"lazy\"></p>\n<p><span style=\"text-decoration: underline;\">Code</span></p>\n<p><em>The following code uses four&nbsp;<strong>for loops</strong> to speed up and down gradually in one direction, then do the same in the opposite direction.</em></p>\n<div style=\"background: #ffffff; overflow: auto; width: auto; border: solid gray; border-width: .1em .1em .1em .8em; padding: .2em .6em;\">\n<pre style=\"margin: 0; line-height: 125%;\"><span style=\"color: #333399;\">void</span> <span style=\"color: #0066bb;\">setup</span>()\n{\n  pinMode(<span style=\"color: #0000dd;\">5</span>, OUTPUT);\n  pinMode(<span style=\"color: #0000dd;\">6</span>, OUTPUT);\n}\n\n<span style=\"color: #333399;\">void</span> <span style=\"color: #0066bb;\">loop</span>()\n{\n  <span style=\"color: #888888;\">//Increase Speed in Direction One</span>\n  <span style=\"color: #008800;\">for</span>(<span style=\"color: #333399;\">int</span> i <span style=\"color: #333333;\">=</span> <span style=\"color: #0000dd;\">0</span>; i <span style=\"color: #333333;\">&lt;</span> <span style=\"color: #0000dd;\">255</span>; i<span style=\"color: #333333;\">+=</span><span style=\"color: #0000dd;\">1</span>){\n    analogWrite(<span style=\"color: #0000dd;\">5</span>, i);\n    digitalWrite(<span style=\"color: #0000dd;\">6</span>, <span style=\"color: #0000dd;\">LOW</span>);\n    delay(<span style=\"color: #0000dd;\">30</span>);\n  }\n  <span style=\"color: #888888;\">//Decrease Speed in Direction One</span>\n  <span style=\"color: #008800;\">for</span>(<span style=\"color: #333399;\">int</span> i <span style=\"color: #333333;\">=</span> <span style=\"color: #0000dd;\">255</span>; i <span style=\"color: #333333;\">&gt;</span> <span style=\"color: #0000dd;\">0</span>; i<span style=\"color: #333333;\">-=</span> <span style=\"color: #0000dd;\">1</span>){\n    analogWrite(<span style=\"color: #0000dd;\">5</span>, i);\n    digitalWrite(<span style=\"color: #0000dd;\">6</span>, <span style=\"color: #0000dd;\">LOW</span>);\n    delay(<span style=\"color: #0000dd;\">30</span>);\n  }\n  <span style=\"color: #888888;\">//Increase Speed in Direction Two</span>\n  <span style=\"color: #008800;\">for</span>(<span style=\"color: #333399;\">int</span> i <span style=\"color: #333333;\">=</span> <span style=\"color: #0000dd;\">0</span>; i <span style=\"color: #333333;\">&lt;</span> <span style=\"color: #0000dd;\">255</span>; i<span style=\"color: #333333;\">+=</span><span style=\"color: #0000dd;\">1</span>){\n    analogWrite(<span style=\"color: #0000dd;\">6</span>, i);\n    digitalWrite(<span style=\"color: #0000dd;\">5</span>, <span style=\"color: #0000dd;\">LOW</span>);\n    delay(<span style=\"color: #0000dd;\">30</span>);\n  }\n  <span style=\"color: #888888;\">//Decrease Speed in Direction Two</span>\n  <span style=\"color: #008800;\">for</span>(<span style=\"color: #333399;\">int</span> i <span style=\"color: #333333;\">=</span> <span style=\"color: #0000dd;\">255</span>; i <span style=\"color: #333333;\">&gt;</span> <span style=\"color: #0000dd;\">0</span>; i<span style=\"color: #333333;\">-=</span> <span style=\"color: #0000dd;\">1</span>){\n    analogWrite(<span style=\"color: #0000dd;\">6</span>, i);\n    digitalWrite(<span style=\"color: #0000dd;\">5</span>, <span style=\"color: #0000dd;\">LOW</span>);\n    delay(<span style=\"color: #0000dd;\">30</span>);\n  }\n}\n</pre>\n</div>\n<p><em><br>The following animation shows the output produced by the speed ramp code. Although the visualization becomes difficult to follow as speeds increase, the RPM value shows the increasing and decreasing pattern.</em></p>\n<p><img src=\"media/web_resources/H-Bridge-Speed-Ramp-Animation.gif\" alt=\"\" width=\"478\" height=\"347\" data-decorative=\"true\" data-api-endpoint=\"https://canvas.instructure.com/api/v1/courses/4227213/files/168010819\" data-api-returntype=\"File\" loading=\"lazy\"></p>\n\n"},{"id":"g4dda6084bba64c07a2caf808b2fea230","kind":"page","title":"Intro Video: Choosing a 3D Modeling Environment","nav_title":"Intro Video: Choosing a 3D Modeling Environment","position":6,"published":true,"content_html":"<iframe width=\"560\" height=\"315\" src=\"https://www.youtube.com/embed/WH92LRbUyik\" frameborder=\"0\" allow=\"accelerometer; autoplay; encrypted-media; gyroscope; picture-in-picture\" allowfullscreen=\"\" loading=\"lazy\"></iframe>\n\n"},{"id":"g86bdacc5f9784e89a070e3d776eba26a","kind":"page","title":"Making Music: Notes + Timings","nav_title":"Making Music: Notes + Timings","position":7,"published":true,"content_html":"<p>If you are having trouble coming up with the notes and timings, please refer to the following chart when building your program:</p>\n<p><img src=\"media/web_resources/Uploaded-Media/Notes-and-Timing-Making-Music-..PNG\" alt=\"Notes and Timing (Making Music)..PNG\" loading=\"lazy\"></p>\n\n"},{"id":"g1aab95fce16124cd9a73fb9194e699bf","kind":"page","title":"Marble Maze Simple Code Complete","nav_title":"Marble Maze Simple Code Complete","position":8,"published":true,"content_html":"<p>The follow code can be used to drive your servo marble maze. A few things of note:</p>\n<ol>\n<li>This prints current joystick positions to the Serial Monitor. Make sure to check that you are getting valid readings</li>\n<li>If you need to switch the direction of the horizontal axis (left-right&nbsp; or up-down), just flip reverse the numbers in the&nbsp;<strong>map</strong> block.</li>\n<li>If your resting position isn't horizontal, adjust the angles in a range so that both are shifted in one direction\n<ul>\n<li>This changes the \"angle midpoint\", which is the resting position for each servo.</li>\n</ul>\n</li>\n</ol>\n<p><img src=\"media/web_resources/Uploaded-Media/Complete-Code-Simple.PNG\" alt=\"Complete Code - Simple.PNG\" loading=\"lazy\"></p>\n\n"},{"id":"g91251e50949e52f4073f4edbf6a67d1a","kind":"page","title":"Marble Maze: Smoothed Joystick Control","nav_title":"Marble Maze: Smoothed Joystick Control","position":9,"published":true,"content_html":"<p>Below is some code which you can try out with your marble maze. Instead of mapping the servo position directly to the angle of the joystick, some&nbsp;<em>smoothing</em> is applied so that there is acceleration and deceleration on the servo, which will&nbsp;<em>produce smoother motion overall:</em></p>\n<p>&nbsp;</p>\n\n<div style=\"background: #ffffff; overflow: auto; width: auto; border: solid gray; border-width: .1em .1em .1em .8em; padding: .2em .6em;\">\n<pre style=\"margin: 0; line-height: 125%;\"><span style=\"color: #888888;\">// Servo Marble Maze: Smooth Joystick Control</span>\n<span style=\"color: #888888;\">// Mr. Scott<br></span><span style=\"color: #888888;\">// 2021<br></span>\n<span style=\"color: #557799;\">#include &lt;Servo.h&gt;</span>\n\n<span style=\"color: #333399; \">int</span> xAngle <span style=\"color: #333333;\">=</span> <span style=\"color: #0000dd; \">0</span>;\n<span style=\"color: #333399; \">int</span> yAngle <span style=\"color: #333333;\">=</span> <span style=\"color: #0000dd; \">0</span>;\n\n\n<span style=\"color: #888888;\">//Set up the max rotational positions</span>\n<span style=\"color: #008800; \">const</span> <span style=\"color: #333399; \">int</span> minX <span style=\"color: #333333;\">=</span> <span style=\"color: #0000dd; \">70</span>;\n<span style=\"color: #008800; \">const</span> <span style=\"color: #333399; \">int</span> maxX <span style=\"color: #333333;\">=</span> <span style=\"color: #0000dd; \">110</span>;\n<span style=\"color: #008800; \">const</span> <span style=\"color: #333399; \">int</span> minY <span style=\"color: #333333;\">=</span> <span style=\"color: #0000dd; \">70</span>;\n<span style=\"color: #008800; \">const</span> <span style=\"color: #333399; \">int</span> maxY <span style=\"color: #333333;\">=</span> <span style=\"color: #0000dd; \">110</span>;\n\nServo servo_6;\nServo servo_4;\n\n<span style=\"color: #333399; \">float</span> currentX <span style=\"color: #333333;\">=</span> <span style=\"color: #0000dd; \">0</span>;\n<span style=\"color: #333399; \">float</span> prevX <span style=\"color: #333333;\">=</span> <span style=\"color: #0000dd; \">0</span>;\n<span style=\"color: #333399; \">float</span> currentY <span style=\"color: #333333;\">=</span> <span style=\"color: #0000dd; \">0</span>;\n<span style=\"color: #333399; \">float</span> prevY <span style=\"color: #333333;\">=</span> <span style=\"color: #0000dd; \">0</span>;\n\n<span style=\"color: #333399; \">void</span> <span style=\"color: #0066bb; \">setup</span>()\n{\n  pinMode(A0, INPUT);\n  pinMode(A1, INPUT);\n  Serial.begin(<span style=\"color: #0000dd; \">9600</span>);\n\n  servo_6.attach(<span style=\"color: #0000dd; \">6</span>, <span style=\"color: #0000dd; \">500</span>, <span style=\"color: #0000dd; \">2500</span>);\n  servo_4.attach(<span style=\"color: #0000dd; \">4</span>, <span style=\"color: #0000dd; \">500</span>, <span style=\"color: #0000dd; \">2500</span>);\n}\n\n<span style=\"color: #333399; \">void</span> <span style=\"color: #0066bb; \">loop</span>()\n{\n  xAngle <span style=\"color: #333333;\">=</span> map(analogRead(A0), <span style=\"color: #0000dd; \">0</span>, <span style=\"color: #0000dd; \">1023</span>, <span style=\"color: #0000dd; \">0</span>, <span style=\"color: #0000dd; \">100</span>);\n  yAngle <span style=\"color: #333333;\">=</span> map(analogRead(A1), <span style=\"color: #0000dd; \">0</span>, <span style=\"color: #0000dd; \">1023</span>, <span style=\"color: #0000dd; \">0</span>, <span style=\"color: #0000dd; \">100</span>);\n\n  currentX <span style=\"color: #333333;\">=</span> (xAngle<span style=\"color: #333333;\">*</span><span style=\"color: #6600ee; \">0.05</span>) <span style=\"color: #333333;\">+</span> (prevX <span style=\"color: #333333;\">*</span> <span style=\"color: #6600ee; \">0.95</span>) ;\n  prevX <span style=\"color: #333333;\">=</span> currentX;\n  \n  currentY <span style=\"color: #333333;\">=</span> (yAngle<span style=\"color: #333333;\">*</span><span style=\"color: #6600ee; \">0.05</span>) <span style=\"color: #333333;\">+</span> (prevY <span style=\"color: #333333;\">*</span> <span style=\"color: #6600ee; \">0.95</span>) ;\n  prevY <span style=\"color: #333333;\">=</span> currentY;\n\n  <span style=\"color: #888888;\">//print out the raw and smoothed positions (in a 0-100 scale)</span>\n  Serial.print(xAngle);\n  Serial.print(<span style=\"background-color: #fff0f0;\">\",\"</span>);\n  Serial.print(currentX);\n  Serial.print(<span style=\"background-color: #fff0f0;\">\",\"</span>);\n  Serial.print(yAngle);\n  Serial.print(<span style=\"background-color: #fff0f0;\">\",\"</span>);\n  Serial.println(currentY);\n  \n  <span style=\"color: #888888;\">//re-map back to our desired angle range</span>\n  xAngle <span style=\"color: #333333;\">=</span> map(xAngle,<span style=\"color: #0000dd; \">0</span>,<span style=\"color: #0000dd; \">100</span>,minX,maxX);\n  yAngle <span style=\"color: #333333;\">=</span> map(yAngle,<span style=\"color: #0000dd; \">0</span>,<span style=\"color: #0000dd; \">100</span>,minY,maxY);\n  \n\n  servo_6.write(xAngle);\n  servo_4.write(yAngle);\n  delay(<span style=\"color: #0000dd; \">10</span>); <span style=\"color: #888888;\">// Delay a little bit to improve simulation performance</span>\n}\n</pre>\n</div>\n\n"},{"id":"g17f7d9c8315803308f9f18cc0834a78e","kind":"page","title":"Welcome to Robotics Online","nav_title":"Welcome to Robotics Online","position":10,"published":true,"content_html":"<p>Hello again! Here is a quick greeting from me, as well as a high-level plan for the remainder of the semester:</p>\n<p><iframe src=\"https://www.youtube.com/embed/SE_9srBMUSs\" width=\"560\" height=\"315\" allowfullscreen=\"allowfullscreen\" allow=\"accelerometer; autoplay; encrypted-media; gyroscope; picture-in-picture\" loading=\"lazy\"></iframe></p>\n<p>&nbsp;</p>\n\n"},{"id":"g91dee53b18fdc01aec4c794a068c77f8","kind":"assignment","title":"3D Modeling Assignment Submission","nav_title":"3D Modeling Assignment Submission","position":11,"published":true,"content_html":"<div class=\"item-meta\"><span class=\"meta-points\"><strong>Points:</strong> 8.0</span> &middot; <span class=\"meta-submission\"><strong>Submission type:</strong> online upload</span> &middot; <span class=\"meta-ext\"><strong>Allowed file types:</strong> ipt</span></div><p>We've had several class periods to hone our 3D modeling and design skills in&nbsp;<strong>Inventor</strong>. You should have completed the drawings from both <a title=\"CAD Exercise Pack 01\" href=\"#item:gd82cec7fa662ca0dc4f7746e54a9237e\" data-api-endpoint=\"https://canvas.instructure.com/api/v1/courses/1676030/pages/cad-exercise-pack-01\" data-api-returntype=\"Page\" data-item-ref=\"gd82cec7fa662ca0dc4f7746e54a9237e\">CAD Exercise Pack 01</a> and <a title=\"CAD Exercise Pack 02\" href=\"#item:g7e70282b8eef78374832da62fc56486c\" data-api-endpoint=\"https://canvas.instructure.com/api/v1/courses/1676030/pages/cad-exercise-pack-02\" data-api-returntype=\"Page\" data-item-ref=\"g7e70282b8eef78374832da62fc56486c\">CAD Exercise Pack 02</a>.</p>\n<p>Out of the completed drawings, submit the following three:</p>\n<p><img src=\"media/web_resources/CAD-Assignments-to-Submit.png\" alt=\"\" data-decorative=\"true\" data-api-endpoint=\"https://canvas.instructure.com/api/v1/courses/1676030/files/82956285\" data-api-returntype=\"File\" loading=\"lazy\"></p>\n<p><em>Reminder - the full version set of dimensions are available on the pages linked above. When complete, you should hand in <strong>all three</strong> as&nbsp;<strong>ipt</strong> (inventor part) files. </em></p>\n<p><em>Each file will be graded for completion (out of one) and one drawing at random will be marked for accuracy (out of five), for a total of 8 marks.</em></p>\n\n"},{"id":"gef5c27477ec12c21e5e9134cd4ab51e9","kind":"assignment","title":"Garage Door Opener Copy","nav_title":"Garage Door Opener Copy","position":12,"published":true,"content_html":"<div class=\"item-meta\"><span class=\"meta-points\"><strong>Points:</strong> 1.0</span> &middot; <span class=\"meta-submission\"><strong>Submission type:</strong> online url</span></div><p>For this project, we'll be taking a look at a new type of switch component (dip switches) in the context of a common application - garage door openers. This we'll also learn about <strong>binary number systems</strong> and also discuss <strong>hardware security</strong>.</p>\n<p>&nbsp;</p>\n<p><strong>New Component - DIP Switches (Dual In-line Package)</strong></p>\n<p><img src=\"media/web_resources/dip-switch-sample-image.PNG\" alt=\"\" width=\"178\" height=\"157\" data-decorative=\"true\" data-api-endpoint=\"https://canvas.instructure.com/api/v1/courses/1951684/files/92616818\" data-api-returntype=\"File\" loading=\"lazy\"></p>\n<p>DIP Switches are small switches that often are grouped together in a package. The actual switch type can vary, but the image above shows a DIP switch that uses&nbsp;<em>slide switches.</em> Commonly each switch will have 2 possible positions, but sometimes there may be more. As there will be many different possible on/off combinations for the whole package, DIP switches are commonly used to set the&nbsp;<strong>mode</strong> of some electronic device or in the case of fixed-code garage door openers, the&nbsp;<strong>code that will allow it to be activated.</strong></p>\n<p><br><span style=\"font-size: 18pt;\"><strong>Step One: Binary Number System</strong></span></p>\n<p><span style=\"font-size: 12pt;\">Before jumping right into this project, start with this short video on binary numbers and how they can be used to represent digital information. We will be using binary numbers in a simple way that emulates&nbsp;<strong>fixed-code</strong> garage door opening systems.</span></p>\n<p><iframe src=\"https://www.youtube.com/embed/ewokFOSxabs\" width=\"560\" height=\"315\" allowfullscreen=\"allowfullscreen\" allow=\"accelerometer; autoplay; encrypted-media; gyroscope; picture-in-picture\" loading=\"lazy\"></iframe></p>\n<p>&nbsp;</p>\n<p><span style=\"font-size: 18pt;\"><strong>Step Two: Basic DIP Switches</strong></span></p>\n<p>In this exercise we will use SPST (Single Pole, Single Throw) switches. This means for each switch:</p>\n<ul>\n<li>There is one electrical connection point on each side of the switch</li>\n<li>There are only two possible switch positions</li>\n<li>Typically these are used in ON/OFF applications</li>\n</ul>\n<p>Each switch in the group works independently from the others. See the illustrations below where only one of the four DIP switches are being used to light an LED.</p>\n<p><img src=\"media/web_resources/DIP-switch-illustration-OFF.png\" alt=\"\" width=\"250\" height=\"644\" data-decorative=\"true\" data-api-endpoint=\"https://canvas.instructure.com/api/v1/courses/1951684/files/92772676\" data-api-returntype=\"File\" loading=\"lazy\"> <img src=\"media/web_resources/DIP-switch-illustration-ON.png\" alt=\"\" width=\"250\" height=\"643\" data-decorative=\"true\" data-api-endpoint=\"https://canvas.instructure.com/api/v1/courses/1951684/files/92772695\" data-api-returntype=\"File\" loading=\"lazy\"></p>\n<p>&nbsp;</p>\n<p>To try using them (and to start our larger circuit), construct the following circuit where we can control one LED per DIP switch:</p>\n<p><img src=\"media/web_resources/DIP-switch-step-two-circuit.png\" alt=\"\" data-decorative=\"true\" data-api-endpoint=\"https://canvas.instructure.com/api/v1/courses/1951684/files/92780340\" data-api-returntype=\"File\" loading=\"lazy\"></p>\n<p><em>This provides four separate LED circuits, each controlled by one of the ON/OFF DIP switches. Note that this circuit has no coding - the switches are simply used to break or connect each of the four circuits.</em></p>\n<p>&nbsp;</p>\n<p><span style=\"font-size: 18pt;\"><strong>Step Three: Reading DIP Switches</strong></span></p>\n<p>For this project, we will want to be able to keep track of our DIP switch positions with code, so let's modify the starter circuit a bit. We want to bring in a SPSTx6 DIP switch:</p>\n<p><img src=\"media/web_resources/DIP-SPSTx6.png\" alt=\"\" data-api-endpoint=\"https://canvas.instructure.com/api/v1/courses/1951684/files/92780971\" data-api-returntype=\"File\" loading=\"lazy\"></p>\n<p>To be able to&nbsp;<em>read the switch position with code</em>, we can use the same type of circuit we have done previously with buttons. Let's start with the following circuit:</p>\n<p><img src=\"media/web_resources/DIP-Switch-step-three-circuit-A.png\" alt=\"\" data-decorative=\"true\" data-api-endpoint=\"https://canvas.instructure.com/api/v1/courses/1951684/files/92781949\" data-api-returntype=\"File\" loading=\"lazy\"></p>\n<p>Notice that the&nbsp;<strong>5v</strong> is only part of the circuit to pin 2&nbsp;<em>when the DIP switch is on.&nbsp;</em>When off, the pull-down resistor will ensure any voltage read yields <strong>0v.</strong></p>\n<p><strong>Coding the Switch Read:</strong></p>\n<p>Follow along with this video to make the initial code:</p>\n<p><iframe src=\"https://www.youtube.com/embed/7P_5-Uc-CSE\" width=\"560\" height=\"315\" allowfullscreen=\"allowfullscreen\" allow=\"accelerometer; autoplay; encrypted-media; gyroscope; picture-in-picture\" loading=\"lazy\"></iframe></p>\n<p><br><span style=\"text-decoration: underline; font-size: 14pt;\">ON YOUR OWN:</span></p>\n<p style=\"padding-left: 40px;\">Using the video and circuit diagram above as reference, wire up the remaining DIP switches to be read from&nbsp;<strong>digital pins 3 - 7.</strong> Expand the code to add variables called&nbsp;<strong>bin16, bin8, bin4, bin2,&nbsp;</strong>and <strong>bin1.&nbsp;</strong>Inside&nbsp;<strong>loop()</strong>, use digitalRead() to fill each of those variables.</p>\n<p style=\"padding-left: 40px;\"><em>If you need help, the video below shows how to do this. Make sure to try it on your own first!</em></p>\n<p><iframe src=\"https://www.youtube.com/embed/DO8OQtVJzQ0\" width=\"560\" height=\"315\" allowfullscreen=\"allowfullscreen\" allow=\"accelerometer; autoplay; encrypted-media; gyroscope; picture-in-picture\" loading=\"lazy\"></iframe></p>\n<p>&nbsp;</p>\n<p><span style=\"font-size: 18pt;\"><strong>Step Four: LED Indicators</strong></span></p>\n<p><span style=\"font-size: 12pt;\">As a bit of review into controlling LEDs through code, we'll add <strong>six LEDs</strong> to our circuit, and have them turn ON/OFF to coincide with the position of the DIP Switches. A few things to consider before we get to the circuit diagram and code:</span></p>\n<ul>\n<li>\n<span style=\"font-size: 12pt;\">We need 6 I/O pins for this operation. While there are still that many digital pins available we will need a few of those pins later on. On the Arduino,&nbsp;<strong>analog pins</strong> can be used as digital pins.</span>\n<ul>\n<li><span style=\"font-size: 12pt;\">There are 6 Analog pins - we'll use all of them (A0 - A5) for LED control</span></li>\n</ul>\n</li>\n<li><span style=\"font-size: 12pt;\">Anytime we want to supply voltage (write) with an i/o pin, we need to set the&nbsp;<strong>pinMode</strong> to&nbsp;<strong>OUTPUT</strong> in the setup() function</span></li>\n<li><span style=\"font-size: 12pt;\">330 <span>Ω resistors were used for each LED</span></span></li>\n</ul>\n<p><span style=\"font-size: 12pt;\"><img src=\"media/web_resources/DIP-Switch-step-four-circuit.png\" alt=\"\" data-decorative=\"true\" data-api-endpoint=\"https://canvas.instructure.com/api/v1/courses/1951684/files/92893715\" data-api-returntype=\"File\" loading=\"lazy\"></span></p>\n<p>&nbsp;</p>\n<p><strong>Functions - A Way to Organize Code</strong></p>\n<p>We have been writing most of our code inside of the <strong>loop()</strong> function<strong>.&nbsp;</strong>As programs grow in size, it is good practice to organize our code with&nbsp;<strong>functions.&nbsp;</strong>A <strong>function</strong> is a like a container that holds some lines of code that we can ask to run whenever we need. A very simple example is below:</p>\n<pre>int loopCount = 0;<br><br>void setup(){<br><br>    <span style=\"color: #339966;\">//This code runs once at the start of the program</span><br><br>    Serial.begin(9600);&nbsp; &nbsp; <span style=\"color: #339966;\">//initialize the serial monitor</span><br><br>}<br><br>void loop(){<br><br>    <span style=\"color: #339966;\">//This code repeats over and over as the program runs</span><br><br>    printMessage();&nbsp; &nbsp; <span style=\"color: #339966;\">//this line asks the program to run whatever code is stored inside our <strong>printMessage()</strong> function</span><br><br>}<br><br>void printMessage(){<br><br>    Serial.print(\"The loop() function has repeated \");<br>    Serial.print(loopCount);<br>    Serial.println(\"times.\");<br><br>    loopCount = loopCount + 1;&nbsp; &nbsp;<span style=\"color: #339966;\"> //add one to the current value of loopCount</span><br><br>}</pre>\n<p><span style=\"font-size: 12pt;\">See how a new function has been added - called printMessage(). All the code in between the script brackets that follow&nbsp;<em>void printMessage()</em> is a part of the function. Whenever the name of the function is by itself:</span></p>\n<p style=\"text-align: center;\"><strong><span style=\"font-size: 12pt;\">printMessage();</span></strong></p>\n<p style=\"text-align: left;\"><span style=\"font-size: 12pt;\">This is a&nbsp;<em>function call</em> - a line of code requesting the function to run.&nbsp;</span></p>\n<p style=\"text-align: left;\"><span style=\"font-size: 12pt;\">Follow along with the next video to create a new function to handle our six new LEDs:</span></p>\n<p><iframe src=\"https://www.youtube.com/embed/iwajpOJsSg0\" width=\"560\" height=\"315\" allowfullscreen=\"allowfullscreen\" allow=\"accelerometer; autoplay; encrypted-media; gyroscope; picture-in-picture\" loading=\"lazy\"></iframe></p>\n<p style=\"text-align: left;\">&nbsp;</p>\n<p><span style=\"font-size: 18pt;\"><strong>Interlude: Fixed-Code Garage Door Openers</strong></span></p>\n<p><span style=\"font-size: 12pt;\">This week's project is to build a simulation of a&nbsp;<strong>fixed-code garage door remote&nbsp;</strong>system. This short video will introduce how this system allowed *secure* communication between a remote an receiver, and the way DIP switches were a part of this.</span></p>\n<p><iframe src=\"https://www.youtube.com/embed/m8HbyX8StCo\" width=\"560\" height=\"315\" allowfullscreen=\"allowfullscreen\" allow=\"accelerometer; autoplay; encrypted-media; gyroscope; picture-in-picture\" loading=\"lazy\"></iframe></p>\n<p>&nbsp;</p>\n<p><span style=\"font-size: 18pt;\"><strong>Step Five: Translate the \"Code\"</strong></span></p>\n<p>This will be a short step! We have our 6 bits (read from each DIP switch, and stored in separate variables: bin32, bin16, bin8, etc...) and what we'll want to do next is combine the data from the 6 variables into one single value. If we&nbsp;<em>translate our binary bits<strong>&nbsp;</strong></em><em>into&nbsp;<span style=\"text-decoration: underline;\">one decimal number</span></em>, that will accomplish this goal.</p>\n<p><img style=\"display: block; margin-left: auto; margin-right: auto;\" src=\"media/web_resources/DIP-Switch-Binary-Translate.png\" alt=\"\" width=\"392\" height=\"188\" data-decorative=\"true\" data-api-endpoint=\"https://canvas.instructure.com/api/v1/courses/1951684/files/92886028\" data-api-returntype=\"File\" loading=\"lazy\"></p>\n<p>Imagine our DIP switch has the pattern shown above. Each of our variables will hold a 0 or a 1, which is also shown above. Since we've named our variables to match the&nbsp;<em>binary place</em>, we simply need to multiply each variable by <em>whatever place it represents.</em> For example:</p>\n<p><strong>1s&nbsp; &nbsp;place:</strong>&nbsp; bin1 * 1<br><strong>2s&nbsp; &nbsp;place:</strong>&nbsp; bin2 * 2<br><strong>4s&nbsp; &nbsp;place:</strong>&nbsp; bin4 * 4<br><strong>8s&nbsp; &nbsp;place:</strong>&nbsp; bin8 * 8<br><strong>16s place:</strong> bin16 * 16<br><strong>32s place:</strong> bin32 * 32</p>\n<p>Create a new variable at the top of the program (global variable) called&nbsp;<strong>dipValue&nbsp;</strong>and initialize it to 0.</p>\n<p>Then, inside the&nbsp;<strong>loop()</strong> function, update&nbsp;<strong>dipValue</strong> by adding up the value of each of the DIP switch positions:</p>\n<p style=\"text-align: center;\">dipValue = bin32 * 32&nbsp; &nbsp;+&nbsp; &nbsp;bin16 * 16&nbsp; &nbsp;+&nbsp; &nbsp;bin8 * 8&nbsp; &nbsp;+&nbsp; &nbsp;bin4 * 4&nbsp; &nbsp;+&nbsp; &nbsp;bin2 * 2&nbsp; &nbsp;+&nbsp; &nbsp;bin1 * 1</p>\n<p style=\"text-align: left;\">We'll update our Serial print statements to also print out the value of&nbsp;<strong>dipValue.</strong> The above is shown in the next short video:</p>\n<p><iframe src=\"https://www.youtube.com/embed/oHE0zKHuFSQ\" width=\"560\" height=\"315\" allowfullscreen=\"allowfullscreen\" allow=\"accelerometer; autoplay; encrypted-media; gyroscope; picture-in-picture\" loading=\"lazy\"></iframe></p>\n<p style=\"text-align: left;\">&nbsp;</p>\n<p><span style=\"font-size: 18pt;\"><strong>Step Six: Create the secret code and Door Mechanism</strong></span></p>\n<p>We're nearly there! Next, we'll add a&nbsp;<strong>servo</strong> and&nbsp;<strong>momentary switch</strong> to our circuit. These will be used to simulate <em>pressing a button on a garage door remot</em>e and the<em> motor that activates the door to open and close.</em> Begin by adding the following to your circuit:</p>\n<ul>\n<li>A button hooked up to be read on&nbsp;<strong>digital pin 10&nbsp;</strong>(with 1k pull-down resistor)</li>\n<li>A servo connected to&nbsp;<strong>digital pin 9</strong> (<em>which is PWM enabled)</em>\n</li>\n<li>Two <strong>comments</strong> to mark when the servo (door opener) is open or closed.\n<ul>\n<li>To add a comment, click this button on the top toolbar: <img src=\"media/web_resources/DIP-Switch-Comment-Button.png\" alt=\"\" data-decorative=\"true\" data-api-endpoint=\"https://canvas.instructure.com/api/v1/courses/1951684/files/92914392\" data-api-returntype=\"File\" loading=\"lazy\">\n</li>\n</ul>\n</li>\n</ul>\n<p><img src=\"media/web_resources/DIP-Switch-step-six-circuit-1.png\" alt=\"\" data-decorative=\"true\" data-api-endpoint=\"https://canvas.instructure.com/api/v1/courses/1951684/files/92914337\" data-api-returntype=\"File\" loading=\"lazy\"></p>\n<p>To extend our code, we need to do the following:</p>\n<ul>\n<li>Create a new global int variable called&nbsp;<strong>doorCode&nbsp;</strong>and initialize it to 43.\n<ul>\n<li>this means the code (in binary) is 101011</li>\n</ul>\n</li>\n<li>Add the necessary code to control the servo<br>\n<ul>\n<li>Either watch the video below or revisit an old circuit that used the servo block to see what&nbsp;<span style=\"text-decoration: underline;\">text code</span> that generated.<br><br>\n</li>\n</ul>\n</li>\n<li>Add code to check if the button is being pressed. This should be at the bottom of&nbsp;<strong>loop(),</strong> just before the delay statement.<br><br>\n</li>\n<li>Create a new function called&nbsp;<strong>checkCode()&nbsp;&nbsp;</strong>and call it <span style=\"text-decoration: underline;\">if the button is being pressed</span>\n<ul>\n<li>inside&nbsp;<strong>checkCode()</strong> compare <strong>doorCode&nbsp;</strong>and&nbsp;<strong>dipValue. </strong>If they are equal, do the following:\n<ul>\n<li>Print \"Door Opening\" to the Serial Monitor</li>\n<li>Have the servo move to 150 degrees</li>\n<li>Wait 1 second</li>\n<li>Print \"Door Closing\" to the Serial Monitor</li>\n<li>Have the servo move to 30 degrees</li>\n<li>Wait 1 second</li>\n</ul>\n</li>\n<li>If&nbsp;<strong>doorCode&nbsp;</strong>and&nbsp;<strong>dipValue</strong> are&nbsp;<span style=\"text-decoration: underline;\">not equal</span>, print \"Incorrect Code\" to the Serial Monitor</li>\n</ul>\n</li>\n</ul>\n<p><iframe src=\"https://www.youtube.com/embed/2AO5Y0jCvOI\" width=\"560\" height=\"315\" allowfullscreen=\"allowfullscreen\" allow=\"accelerometer; autoplay; encrypted-media; gyroscope; picture-in-picture\" loading=\"lazy\"></iframe></p>\n<p><em>Information on how to submit this project is&nbsp;<span style=\"text-decoration: underline;\">below</span> the extension challenges.</em></p>\n<p><span style=\"font-size: 18pt;\"><strong>Optional:&nbsp; On-Your-Own Extension Challenge(s)</strong></span></p>\n<p>Having completed the base program, you're ready to submit. If you have additional time and want to challenge yourself further, try to extend your program in the following way(s):</p>\n<ol>\n<li>\n<strong>More Realistic Control<br></strong><br>Add some logic so that when the button is pressed the servo will only move in one direction (either open or closed, <em>whichever position it doesn't currently occupy</em>) until it reaches that destination.<br><br><img src=\"media/web_resources/Garage-Door-Extension-01.gif\" alt=\"\" data-decorative=\"true\" data-api-endpoint=\"https://canvas.instructure.com/api/v1/courses/1951684/files/93102832\" data-api-returntype=\"File\" loading=\"lazy\"><br><br>\n</li>\n<li>\n<strong>Allow Interruptions<br><br></strong>Add functionality so that if the button is pressed&nbsp;<em>while the servo is in the process of moving</em> that the servo will freeze in its current spot, and that the next press will initiate it to travel in the&nbsp;<span style=\"text-decoration: underline;\">opposite direction<em>.</em></span><em>&nbsp;</em>This is quite&nbsp; a bit more difficult than the first extension, but matches typical behavior in real-life systems.<br><br><img src=\"media/web_resources/Garage-Door-Extension-2.gif\" alt=\"\" data-decorative=\"true\" data-api-endpoint=\"https://canvas.instructure.com/api/v1/courses/1951684/files/93102873\" data-api-returntype=\"File\" loading=\"lazy\"><br><br>\n</li>\n<li>\n<strong>Radio Message<br><br></strong>Working with a partner (or two Arduinos on your own), modify the code into two programs that can act as&nbsp;<strong>remote&nbsp;&nbsp;</strong>and&nbsp;<strong>receiver</strong>, by using a 433 Mhz radio transmitter/receiver module with each.<br><br><span style=\"background-color: #ff0000; color: #ffffff;\">NOTE:</span> This is a future plan extension, as we can't simulate this component in TinkerCAD. If interested in how this&nbsp;<em>could work</em>, search up \"Arduino 433 Mhz\" and you can find some tutorials or videos that show the use of this components to send and receive messages with radio waves. There are tons of interesting project that this component allows for.<br><br>\n</li>\n</ol>\n<p><span style=\"font-size: 18pt;\"><strong>How to Submit:</strong></span></p>\n<p>You must make your project public and submit a shared link. The steps are pretty simple - follow along with these steps or watch the following video on how to submit your project correctly:</p>\n<ol>\n<li>Navigate to the TinkerCAD Circuits selection page (where you can see all projects)</li>\n<li>Click the options icon for the project to submit (gear icon in upper right of project card)</li>\n<li>Choose properties\n<ul>\n<li>change the&nbsp;<strong>privacy</strong> dropdown to \"public\"</li>\n</ul>\n</li>\n<li>Navigate back to selection page and click on the project card (ensure the card says \"public\" along the bottom)</li>\n<li>Near the bottom of the project view page there should be a link to the project\n<ul>\n<li>Try opening this link in a different browser (not signed in to TinkerCAD) to ensure it works</li>\n<li>If you that brings you back to the project card, take that URL and submit here.</li>\n</ul>\n</li>\n</ol>\n<p><iframe src=\"https://www.youtube.com/embed/964gxJOtRPY\" width=\"560\" height=\"315\" allowfullscreen=\"allowfullscreen\" allow=\"accelerometer; autoplay; encrypted-media; gyroscope; picture-in-picture\" loading=\"lazy\"></iframe></p>\n\n"},{"id":"g5ece0ea0511e6edba680e29ec9fd0d46","kind":"assignment","title":"Level 1.5/2 Review Pack","nav_title":"Level 1.5/2 Review Pack","position":13,"published":true,"content_html":"<div class=\"item-meta\"><span class=\"meta-points\"><strong>Points:</strong> 20.0</span> &middot; <span class=\"meta-submission\"><strong>Submission type:</strong> online upload</span> &middot; <span class=\"meta-ext\"><strong>Allowed file types:</strong> zip,mp4,ino</span></div><p>Welcome back to Robotics! It's been a while, so we should start with a some review. The following pack of projects (increasing in complexity) cover some of the basics of working with light, sound, and motion.</p>\n<p><span style=\"text-decoration: underline;\">For each project:</span></p>\n<ul>\n<li>you should submit a&nbsp;<strong>video of your physical circuit</strong>\n<ul>\n<li>Make sure to clearly introduce yourself and what the circuit is</li>\n<li>Please explain what it does as you demonstrate it in the video<br><br>\n</li>\n</ul>\n</li>\n<li>submit your code</li>\n</ul>\n<p>&nbsp;</p>\n<p>Since there are 4 projects (Potentiometer,&nbsp; Button for Lights, Trumpet with Bling,&nbsp; Combination Safe), you should hand in&nbsp;<strong>Eight Files</strong> in total. Submit them all together here, either as individual files, or packaged together in a single ZIP archive.</p>\n\n"},{"id":"gaeb254763ebe8a371da9324e6b1d6513","kind":"assignment","title":"Milestone Mark","nav_title":"Milestone Mark","position":14,"published":true,"content_html":"<div class=\"item-meta\"><span class=\"meta-points\"><strong>Points:</strong> 100.0</span> &middot; <span class=\"meta-submission\"><strong>Submission type:</strong> none</span></div>"},{"id":"gec55948aa44cca6cdd9fe4f422905d16","kind":"assignment","title":"Robot Gripper Part Modeling","nav_title":"Robot Gripper Part Modeling","position":15,"published":true,"content_html":"<div class=\"item-meta\"><span class=\"meta-points\"><strong>Points:</strong> 10.0</span> &middot; <span class=\"meta-submission\"><strong>Submission type:</strong> online upload</span> &middot; <span class=\"meta-ext\"><strong>Allowed file types:</strong> ipt,stl</span></div><p>Step One of the robot arm project is to create an&nbsp;<em>end effector. </em>That is – the tool attached to the end of the arm. In our case, we will be making a <strong>3D-printed</strong> <strong>gear driven gripper</strong>.</p>\n<p><img src=\"media/web_resources/Gripper-Assembly-Sample.JPG\" alt=\"\" data-decorative=\"true\" data-api-endpoint=\"https://canvas.instructure.com/api/v1/courses/1676030/files/82957113\" data-api-returntype=\"File\" loading=\"lazy\"></p>\n<p><em>Note - our gripper will be slightly modified from the one designed above, to allow it to interface with the Robot Arm design we'll be using.<br></em></p>\n<p>To save time, several parts of the gripper will have been printed for you in advance. You will,&nbsp; however, model&nbsp;<strong>one or two</strong> (see options below) of the parts. The test of your CAD skills will be to see if they fit with the rest of the parts when you assemble them together!</p>\n<p><strong>Primary Modeling Part - Base</strong> (max&nbsp; 8.5/10)</p>\n<p style=\"padding-left: 40px;\">Using the following dimensions, model the base for the robot arm. This is the piece that we'll attach the 9g servo to, as well as the arms and gear system. Completing this part only will allow for a max grade of 8.5/10 (if modeled accurately and the printed part works in the assembly).</p>\n<p style=\"padding-left: 40px;\"><a class=\"instructure_file_link instructure_image_thumbnail\" title=\"Gripper Dimensions - Base v3.png\" href=\"media/web_resources/Gripper-Dimensions-Base.png\" data-api-endpoint=\"https://canvas.instructure.com/api/v1/courses/1676030/files/83065540\" data-api-returntype=\"File\">Base Dimensions</a></p>\n<p style=\"padding-left: 40px;\">&nbsp;</p>\n<p><strong>Secondary Modeling Part - Geared Arm </strong>(max 10/10)</p>\n<p style=\"padding-left: 40px;\">Once you've completed the Base, you have the option to&nbsp;<strong>also model</strong> one of the geared arms. Use the following dimensions for its construction. Completing this (and the base) will allow for a max grade of 10/10 if both parts are modeled accurately and the printed parts work in the assembly.</p>\n<p style=\"padding-left: 40px;\"><a class=\"instructure_file_link instructure_image_thumbnail\" title=\"Gripper Dimensions - Geared Arm.png\" href=\"media/web_resources/Gripper-Dimensions-Geared-Arm.png\" data-api-endpoint=\"https://canvas.instructure.com/api/v1/courses/1676030/files/83102752\" data-api-returntype=\"File\">Geared Arm Dimensions</a></p>\n<p>&nbsp;</p>\n<p><strong>Submitting to PRINT</strong></p>\n<p style=\"padding-left: 40px;\">Inventor's .<strong>ipt</strong> format is not directly printable. To create a<em> sliced file</em> that a 3D printer can&nbsp;interpret, follow these steps in Inventor:</p>\n<ol>\n<li style=\"list-style-type: none;\">\n<ol>\n<li>Go to the <strong>File&nbsp;</strong>Menu</li>\n<li>Click the&nbsp;<strong>arrow</strong> beside the&nbsp;<strong>Save As</strong> button</li>\n<li>Choose&nbsp;<strong>Save as a Copy</strong>\n</li>\n<li>In the <strong>file-type</strong> drop down menu, choose&nbsp;<strong>STL</strong>\n</li>\n<li>Click the <strong>Options Button</strong> and ensure the&nbsp;<strong>units</strong> here match your document's units</li>\n<li>Navigate to your class folder, name the file, and&nbsp;<strong>Save</strong>\n</li>\n</ol>\n</li>\n</ol>\n<p><strong><span style=\"color: #008000;\">For this project, submit both an IPT and STL file for each part completed.</span></strong></p>\n<p><em>Submit your part(s) here when complete, and let me know so we can begin printing them promptly. Instructions for assembly and how to submit a video of your completed gripper will be in the next assignment item in the Canvas module.</em></p>\n\n"},{"id":"ga677a910cade6ffd94fff678600b4189","kind":"assignment","title":"Snow Day 2 (Sound Assignment)","nav_title":"Snow Day 2 (Sound Assignment)","position":16,"published":true,"content_html":"<div class=\"item-meta\"><span class=\"meta-submission\"><strong>Submission type:</strong> none</span></div>"},{"id":"g62d1d8ded778a79fb7b3704ea72edbf9","kind":"discussion","title":"About Yourself","nav_title":"About Yourself","position":17,"published":true,"content_html":"<div class=\"item-meta\">Discussion Topic</div><p>Your first assignment is to tell the rest of the class a little bit about yourself. We are going to be spending a bunch of time together this semester, so it would be nice to get to know each other. I'll start:</p>\n<ul>\n<li>I really enjoy playing sports (basketball, soccer, football, badminton,<span>&nbsp;</span><span>spikeball</span>, tennis, you name it!)</li>\n<li>I teach Computer Science, Drafting, Digital Media Production, and Robotics this year. Recently I've also taught Graphic Arts, Photography, and Math.&nbsp;</li>\n<li>I'm quite interested in Sailing and Windsurfing, and bought a 1978 Hobie 16 that I'm try to get on the water as much as possible.</li>\n<li>Recently my wife and myself had our first child, a son named Roscoe! He loves to smile and is a lot of fun.<br><img src=\"media/web_resources/Roscoe-Surfer.jpg\" alt=\"\" width=\"374\" height=\"524\" data-decorative=\"true\" loading=\"lazy\">\n</li>\n</ul>\n<p>How about you? What makes you tick?&nbsp;What are you looking forward to in this class?</p>\n<p><em>If you've already taken a class from me, then think of something new I don't already know!</em></p>\n<p>&nbsp;</p>"},{"id":"g2b510cffc8bffb7c0f7e20ac16be7519","kind":"quiz","title":"03 Orthographic Views Quiz","nav_title":"03 Orthographic Views Quiz","position":18,"published":true,"content_html":"<div class=\"item-meta\"><span class=\"meta-points\"><strong>Points:</strong> 9.0</span></div><p>This quiz will provide an opportunity to demonstrate your understanding of Orthographic Views and your Spatial Reasoning.</p><div class=\"qz-questions\">\n<div class=\"qz-question\"><h3 class=\"qz-qtitle\">Question</h3>\n<div class=\"qz-qtext\"><div>If the Green is the top view and Red is the front, then what view is the Blue?<img src=\"media/web_resources/01-Ortho-1.PNG\" alt=\"\" data-decorative=\"true\" loading=\"lazy\">\n</div></div>\n<ul class=\"qz-choices\">\n<li class=\"qz-choice qz-correct\"><span class=\"qz-mark\">&#10003;</span> Right</li>\n<li class=\"qz-choice\"><span class=\"qz-mark\"></span> Left</li>\n<li class=\"qz-choice\"><span class=\"qz-mark\"></span> Bottom</li>\n<li class=\"qz-choice\"><span class=\"qz-mark\"></span> Front</li>\n</ul>\n</div>\n<div class=\"qz-question\"><h3 class=\"qz-qtitle\">Orthographic Views</h3>\n<div class=\"qz-qtext\"><div>\n<p>Which diagram below shows the right view of this object?</p>\n<p><img src=\"media/web_resources/02-Ortho-G-2.PNG\" alt=\"\" data-decorative=\"true\" loading=\"lazy\"></p>\n</div></div>\n<ul class=\"qz-choices\">\n<li class=\"qz-choice qz-correct\"><span class=\"qz-mark\">&#10003;</span> <img src=\"media/web_resources/02-Ortho-G-2-01.PNG\" alt=\"\" data-decorative=\"true\" loading=\"lazy\"></li>\n<li class=\"qz-choice\"><span class=\"qz-mark\"></span> <img src=\"media/web_resources/02-Ortho-G-2-02.PNG\" alt=\"\" data-decorative=\"true\" loading=\"lazy\"></li>\n<li class=\"qz-choice\"><span class=\"qz-mark\"></span> <img src=\"media/web_resources/02-Ortho-G-2-03.PNG\" alt=\"\" data-decorative=\"true\" loading=\"lazy\"></li>\n<li class=\"qz-choice\"><span class=\"qz-mark\"></span> <img src=\"media/web_resources/02-Ortho-G-2-04.PNG\" alt=\"\" data-decorative=\"true\" loading=\"lazy\"></li>\n</ul>\n</div>\n<div class=\"qz-question\"><h3 class=\"qz-qtitle\">Spatial Reasoning</h3>\n<div class=\"qz-qtext\"><div>\n<p><em>The following question tests your spatial reasoning to visualize the rotation of three-dimension objects. </em></p>\n<p><strong>Determine the rotation</strong> that has been applied to the white (non-filled) object. <strong>Apply that same rotation</strong> to the filled (grey) object. Which of the available options shows what that object would then look like?</p>\n<p><img src=\"media/web_resources/07-Spatial-G.png\" alt=\"\" data-decorative=\"true\" loading=\"lazy\"></p>\n</div></div>\n<ul class=\"qz-choices\">\n<li class=\"qz-choice qz-correct\"><span class=\"qz-mark\">&#10003;</span> B</li>\n<li class=\"qz-choice\"><span class=\"qz-mark\"></span> A</li>\n<li class=\"qz-choice\"><span class=\"qz-mark\"></span> C</li>\n</ul>\n</div>\n<div class=\"qz-question\"><h3 class=\"qz-qtitle\">Spatial Reasoning</h3>\n<div class=\"qz-qtext\"><div>\n<p><em>The following question tests your spatial reasoning to visualize the rotation of three-dimension objects. </em></p>\n<p><strong>Determine the rotation</strong> that has been applied to the white (non-filled) object. <strong>Apply that same rotation</strong> to the filled (grey) object. Which of the available options shows what that object would then look like?</p>\n<p><img src=\"media/web_resources/08-Spatial-G.png\" alt=\"\" data-decorative=\"true\" loading=\"lazy\"></p>\n</div></div>\n<ul class=\"qz-choices\">\n<li class=\"qz-choice qz-correct\"><span class=\"qz-mark\">&#10003;</span> A</li>\n<li class=\"qz-choice\"><span class=\"qz-mark\"></span> B</li>\n<li class=\"qz-choice\"><span class=\"qz-mark\"></span> C</li>\n</ul>\n</div>\n</div>"}]}</script>
