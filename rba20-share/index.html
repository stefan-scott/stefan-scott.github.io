: #273540;\"><img src=\"media/web_resources/marble-maze-Copper-Tape-Pattern.png\" alt=\"marble maze - Copper Tape Pattern.png\" width=\"574\" height=\"355\" data-api-endpoint=\"https://canvas.instructure.com/api/v1/courses/12681309/files/309399512\" data-api-returntype=\"File\" loading=\"lazy\"><em><em style=\"font-size: 10pt; font-family: inherit; background-color: #273540;\">With copper tape, create two close parallel lines. </em><em style=\"font-size: 10pt; font-family: inherit; background-color: #273540;\">This is the 'break' that will be closed by the switch.</em></em></span></p>\n<p>&nbsp;</p>\n</td>\n<td style=\"width: 50%; height: 441px;\">\n<p><span style=\"background-color: #273540;\"><img style=\"display: block; margin-left: auto; margin-right: auto;\" src=\"media/web_resources/marble-maze-LED-overview-open-switch.png\" alt=\"marble maze - LED overview open switch.png\" width=\"477\" height=\"358\" data-api-endpoint=\"https://canvas.instructure.com/api/v1/courses/12681309/files/309399230\" data-api-returntype=\"File\" loading=\"lazy\"><em><span style=\"font-size: 10pt; background-color: #273540;\">Overview of switch setup. Note switch is flipped upside down to show copper tape on underside.&nbsp; </span></em></span></p>\n</td>\n</tr>\n</tbody>\n</table>\n<p><span style=\"background-color: #273540;\">&nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp;<em>&nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp;</em>&nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp;<span style=\"font-size: 10pt; background-color: #273540;\"><em>&nbsp; </em>&nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp;</span></span></p>\n<ul>\n<li style=\"list-style-type: none;\">\n<ul>\n<li style=\"list-style-type: none;\">\n<ul>\n<li><span style=\"background-color: #273540;\">Copper tape can be joined to a regular wire for traveling on the outside of the maze.</span></li>\n<li><span style=\"background-color: #273540;\">Wire should be able to travel from the underside of the maze down to the breadboard/Arduino. Make sure to leave enough slack so the servo motion is not restricted.</span></li>\n<li><span style=\"background-color: #273540;\">You can use tape to secure the wires going back to the Arduino to the bottom of the maze.</span></li>\n<li><span style=\"background-color: #273540;\">Don't forget a 220-330 Ω resistor</span></li>\n<li><span style=\"background-color: #273540;\">The circuit should just connect on either end to 5v and GND; no logic needed, just allow the light to be on when the \"switch\" is in place.</span></li>\n</ul>\n</li>\n</ul>\n</li>\n</ul>\n<p style=\"padding-left: 40px;\"><span style=\"background-color: #273540;\"><br><strong>Extension 2 - Accelerometer Control</strong></span></p>\n<p style=\"padding-left: 40px;\"><span style=\"background-color: #273540;\">Get an accelerometer from me and use it instead of the joystick to control the servos.</span></p>\n<p style=\"padding-left: 80px;\"><span style=\"text-decoration: underline; background-color: #273540;\">Resources:</span></p>\n<ul>\n<li style=\"list-style-type: none;\">\n<ul>\n<li style=\"list-style-type: none;\">\n<ul>\n<li style=\"list-style-type: none;\">\n<ul>\n<li><span style=\"background-color: #273540;\"><a style=\"background-color: #273540;\" href=\"https://www.hackster.io/ashraf_minhaj/how-to-use-servotimer2-library-simple-explain-servo-sweep-512fd9\">https://www.hackster.io/ashraf_minhaj/how-to-use-servotimer2-library-simple-explain-servo-sweep-512fd9</a></span></li>\n<li><span style=\"background-color: #273540;\"><a style=\"background-color: #273540;\" href=\"https://github.com/nabontra/ServoTimer2\">https://github.com/nabontra/ServoTimer2</a></span></li>\n<li><span style=\"background-color: #273540;\"><a style=\"background-color: #273540;\" href=\"https://lucidar.me/en/inertial-measurement-unit/mpu-9250-and-arduino-9-axis-imu/\">https://lucidar.me/en/inertial-measurement-unit/mpu-9250-and-arduino-9-axis-imu/</a></span></li>\n</ul>\n</li>\n</ul>\n</li>\n</ul>\n</li>\n</ul>\n<p style=\"padding-left: 40px;\"><span style=\"background-color: #273540;\"><strong>Extension 3 - Accelerometer Radio</strong> Control</span></p>\n<p style=\"padding-left: 40px;\"><span style=\"background-color: #273540;\">Use a radio module to send the accelerometer over radio to a receiver on the Arduino. This would allow your accelerometer control to operate with no tether.</span></p>\n<p style=\"padding-left: 80px;\"><span style=\"text-decoration: underline; background-color: #273540;\">Resources:</span></p>\n<ul>\n<li style=\"list-style-type: none;\">\n<ul>\n<li style=\"list-style-type: none;\">\n<ul>\n<li style=\"list-style-type: none;\">\n<ul>\n<li><span style=\"background-color: #273540;\"><a style=\"background-color: #273540;\" href=\"https://howtomechatronics.com/tutorials/arduino/arduino-wireless-communication-nrf24l01-tutorial/\">https://howtomechatronics.com/tutorials/arduino/arduino-wireless-communication-nrf24l01-tutorial/</a></span></li>\n</ul>\n</li>\n</ul>\n</li>\n</ul>\n</li>\n</ul>\n<p><span style=\"font-size: 18pt; background-color: #273540;\"><strong><br>To Submit:</strong></span></p>\n<p><span style=\"background-color: #273540;\">For this project, there are two things to submit:&nbsp;</span></p>\n<ul>\n<li><span style=\"background-color: #273540;\">A video of you using the marble maze (show me that you can solve it!)</span>\n<ul>\n<li><span style=\"background-color: #273540;\">Make sure to also show your circuit connections</span></li>\n</ul>\n</li>\n<li><span style=\"background-color: #273540;\">A copy of your code, submitted as a&nbsp;<strong>.ino</strong> file, or pasted into a&nbsp;<strong>text&nbsp;</strong><strong>file</strong></span></li>\n</ul>\n\n"}]},{"id":"g77cb28ee0d365f99b11cb5836e8013e8","slug":"09-microbit-intermediate-components","title":"Microbit - Intermediate Components","order":9,"items":[{"id":"g22192b58780bb6cc494bfff44941ce2b","kind":"assignment","title":"Garage Door Opener","nav_title":"Garage Door Opener","position":2,"published":true,"content_html":"<div class=\"item-meta\"><span class=\"meta-points\"><strong>Points:</strong> 10.0</span> &middot; <span class=\"meta-submission\"><strong>Submission type:</strong> online upload</span></div><p>For this project, we'll be taking a look at a new type of switch component (dip switches) in the context of a common application - garage door openers. This we'll also learn about <strong>binary number systems</strong> and also discuss <strong>hardware security</strong>.</p>\n<p>&nbsp;</p>\n<p><strong>New Component - DIP Switches (Dual In-line Package)</strong></p>\n<p><img src=\"media/web_resources/dip-switch-sample-image.PNG\" alt=\"\" width=\"178\" height=\"157\" data-decorative=\"true\" data-api-endpoint=\"https://canvas.instructure.com/api/v1/courses/12681309/files/309399451\" data-api-returntype=\"File\" loading=\"lazy\"></p>\n<p>DIP Switches are small switches that often are grouped together in a package. The actual switch type can vary, but the image above shows a DIP switch that uses&nbsp;<em>slide switches.</em> Commonly each switch will have 2 possible positions, but sometimes there may be more. As there will be many different possible on/off combinations for the whole package, DIP switches are commonly used to set the&nbsp;<strong>mode</strong> of some electronic device or in the case of fixed-code garage door openers, the&nbsp;<strong>code that will allow it to be activated.</strong></p>\n<p><br><span style=\"font-size: 18pt;\"><strong>Binary Number System</strong></span></p>\n<p><span style=\"font-size: 12pt;\">Before jumping right into this project, start with this short video on binary numbers and how they can be used to represent digital information. We will be using binary numbers in a simple way that emulates&nbsp;<strong>fixed-code</strong> garage door opening systems.</span></p>\n<p><iframe src=\"https://www.youtube.com/embed/ewokFOSxabs\" width=\"560\" height=\"315\" loading=\"lazy\" allowfullscreen=\"allowfullscreen\" allow=\"accelerometer; autoplay; encrypted-media; gyroscope; picture-in-picture\"></iframe></p>\n<p>&nbsp;</p>\n<p><span style=\"font-size: 18pt;\"><strong>Basic DIP Switches</strong></span></p>\n<p>In this exercise we will use SPST (Single Pole, Single Throw) switches. This means for each switch:</p>\n<ul>\n<li>There is one electrical connection point on each side of the switch</li>\n<li>There are only two possible switch positions</li>\n<li>Typically these are used in ON/OFF applications</li>\n</ul>\n<p>Each switch in the group works independently from the others. See the illustrations below where only one of the four DIP switches are being used to light an LED.</p>\n<p><img src=\"media/web_resources/DIP-switch-illustration-OFF.png\" alt=\"\" width=\"250\" height=\"644\" data-decorative=\"true\" data-api-endpoint=\"https://canvas.instructure.com/api/v1/courses/12681309/files/309399433\" data-api-returntype=\"File\" loading=\"lazy\"> <img src=\"media/web_resources/DIP-switch-illustration-ON.png\" alt=\"\" width=\"250\" height=\"643\" data-decorative=\"true\" data-api-endpoint=\"https://canvas.instructure.com/api/v1/courses/12681309/files/309399226\" data-api-returntype=\"File\" loading=\"lazy\"></p>\n<pre><br><br><br><br><br><br></pre>\n<p>&nbsp;</p>\n<p><span style=\"font-size: 18pt;\"><strong>Fixed-Code Garage Door Openers</strong></span></p>\n<p><span style=\"font-size: 12pt;\">This week's project is to build a simulation of a&nbsp;<strong>fixed-code garage door remote&nbsp;</strong>system. This short video will introduce how this system allowed *secure* communication between a remote an receiver, and the way DIP switches were a part of this.</span></p>\n<p><iframe src=\"https://www.youtube.com/embed/m8HbyX8StCo\" width=\"560\" height=\"315\" loading=\"lazy\" allowfullscreen=\"allowfullscreen\" allow=\"accelerometer; autoplay; encrypted-media; gyroscope; picture-in-picture\"></iframe></p>\n<p>&nbsp;</p>\n<p><span style=\"font-size: 18pt;\"><strong>Project</strong></span></p>\n<p>Thats enough preamble – let's get into the project. You can find the details here: <a class=\"instructure_file_link instructure_scribd_file inline_disabled\" title=\"A05 Garage Door Opener.pdf\" href=\"media/web_resources/Uploaded-Media/A05-Garage-Door-Opener.pdf\" target=\"_blank\" data-canvas-previewable=\"false\">A05 Garage Door Opener.pdf</a></p>\n<p>&nbsp;</p>\n<p>&nbsp;</p>\n<p><span style=\"font-size: 18pt;\"><strong>To Submit:</strong></span></p>\n<p>There are&nbsp;<strong>two things</strong><span>&nbsp;</span>you need to submit for this project.</p>\n<ol>\n<li>Your Completed Code\n<ul>\n<li>You can submit MakeCode .hex file<br><br></li>\n</ul>\n</li>\n<li>A video demonstrating your physical circuit&nbsp;<strong>with commentary</strong>\n<ul>\n<li>As you demonstrate all the ways your circuit can be used, include some commentary:\n<ul>\n<li>\"Hi, this is ______ and here is my Garage Door Opener Project\"</li>\n<li>Be sure to demonstrate the&nbsp;<strong>base features</strong> along with whichever&nbsp;<strong>extensions&nbsp;</strong>you added to the project.</li>\n</ul>\n</li>\n</ul>\n</li>\n</ol>\n<p><em>Once you have all the files ready to hand in, click the blue<span>&nbsp;</span><strong>submit</strong><span>&nbsp;</span>button in the upper-right portion of this page. Next, attach all three files and press the button to submit<strong>.</strong></em></p>\n<p>&nbsp;</p>\n<p>&nbsp;</p>\n\n"},{"id":"g62f2c68193dfb5632d30765e509f90dc","kind":"page","title":"Neopixel Challenges","nav_title":"Neopixel Challenges","position":3,"published":true,"content_html":"<p>Using an 8-LED Neopixel Strip, practice code writing (specifically loops and working with arrays) to create a number of LED animations / effects. Try to complete as many of the following as possible:</p>\n<p>&nbsp;</p>\n<p><span style=\"text-decoration: underline; font-size: 18pt;\">Twinkle</span></p>\n<p><span style=\"text-decoration: underline;\"><img src=\"media/web_resources/Uploaded-Media/neo-twinkle.gif\" alt=\"neo - twinkle.gif\" loading=\"lazy\"></span></p>\n<ul>\n<li data-start=\"754\" data-end=\"818\">\n<p data-start=\"756\" data-end=\"818\">Pick <strong data-start=\"761\" data-end=\"780\">1–2 random LEDs</strong> to light up briefly, then fade out.</p>\n</li>\n<li data-start=\"819\" data-end=\"883\">\n<p data-start=\"821\" data-end=\"883\">Repeat with different LEDs to simulate a “twinkling” effect.</p>\n</li>\n<li data-start=\"819\" data-end=\"883\">LEDs can be white light&nbsp;<em>or</em> color</li>\n</ul>\n<p>&nbsp;</p>\n<p>&nbsp;</p>\n<p><span style=\"text-decoration: underline; font-size: 18pt;\">LED Bounce</span></p>\n<p><img src=\"media/web_resources/Uploaded-Media/neo-bouncing-LED.gif\" alt=\"neo - bouncing LED.gif\" loading=\"lazy\"></p>\n<ul>\n<li data-start=\"310\" data-end=\"356\"><strong data-start=\"310\" data-end=\"354\">One pixel moves left → right, then back.</strong></li>\n<li data-start=\"422\" data-end=\"498\">\n<p data-start=\"424\" data-end=\"498\"><strong data-start=\"424\" data-end=\"438\">Variation:</strong> Use two pixels bouncing and moving in opposite directions.</p>\n</li>\n</ul>\n<p>&nbsp;</p>\n<p>&nbsp;</p>\n<p><span style=\"text-decoration: underline; font-size: 18pt;\">Breathing</span></p>\n<p><img src=\"media/web_resources/Uploaded-Media/neo-breathing.gif\" alt=\"neo - breathing.gif\" loading=\"lazy\"></p>\n<ul>\n<li data-start=\"1114\" data-end=\"1152\">\n<p data-start=\"1116\" data-end=\"1152\">All LEDs fade in and out together.</p>\n</li>\n<li data-start=\"1153\" data-end=\"1217\">\n<p data-start=\"1155\" data-end=\"1217\"><strong data-start=\"1155\" data-end=\"1169\">Variation:</strong> Only even LEDs pulse, odd LEDs counter-phase.</p>\n</li>\n</ul>\n<p>&nbsp;</p>\n<p><span style=\"text-decoration: underline; font-size: 18pt;\">Random Color Progress Bar</span></p>\n<p><img src=\"media/web_resources/Uploaded-Media/neo-progress-bar-random.gif\" alt=\"neo - progress bar random.gif\" loading=\"lazy\"></p>\n<ul>\n<li data-start=\"1114\" data-end=\"1152\">\n<p data-start=\"1511\" data-end=\"1540\">Each LED represents a step:</p>\n<ul data-start=\"1543\" data-end=\"1604\">\n<li data-start=\"1543\" data-end=\"1604\">\n<p data-start=\"1545\" data-end=\"1604\">Fill LEDs one by one to indicate “progress” or “loading”.</p>\n</li>\n<li data-start=\"1543\" data-end=\"1604\">Pick a new random color each time</li>\n</ul>\n</li>\n</ul>\n<p>&nbsp;</p>\n<p><span style=\"text-decoration: underline; font-size: 18pt;\">Mirror Wave</span></p>\n<p><img src=\"media/web_resources/Uploaded-Media/neo-mirror-wave.gif\" alt=\"neo - mirror wave.gif\" loading=\"lazy\"></p>\n<ul>\n<li style=\"list-style-type: none;\" data-start=\"1114\" data-end=\"1152\">\n<ul>\n<li data-start=\"920\" data-end=\"1007\">\n<p data-start=\"922\" data-end=\"961\"><strong data-start=\"922\" data-end=\"932\">Mirror</strong> the strip from the center:</p>\n<ul data-start=\"964\" data-end=\"1007\">\n<li data-start=\"964\" data-end=\"1007\">\n<p data-start=\"966\" data-end=\"1007\">LEDs 0 &amp; 7 same color, 1 &amp; 6 same, etc.</p>\n</li>\n</ul>\n</li>\n<li data-start=\"1008\" data-end=\"1079\">\n<p data-start=\"1010\" data-end=\"1079\">Animate a “wave” from the center outwards, then from edges to center.</p>\n</li>\n</ul>\n</li>\n</ul>\n<p>&nbsp;</p>\n<p><span style=\"text-decoration: underline; font-size: 18pt;\">User Input Based Animation</span></p>\n<ul>\n<li style=\"list-style-type: none;\">\n<ul>\n<li style=\"list-style-type: none;\">\n<ul data-start=\"964\" data-end=\"1007\">\n<li data-start=\"964\" data-end=\"1007\">\n<p data-start=\"966\" data-end=\"1007\">choose an input component (sensor, potentiometer), get a reading and color a number of LEDs based on the reading.</p>\n<ul data-start=\"964\" data-end=\"1007\">\n<li data-start=\"964\" data-end=\"1007\">low reading value (few LEDs on)</li>\n<li data-start=\"964\" data-end=\"1007\">high reading value (more LEDs on)</li>\n</ul>\n</li>\n</ul>\n</li>\n</ul>\n</li>\n</ul>\n\n"}]},{"id":"g8c7bd8ffccf081793d6e8d91d9b8be4b","slug":"11-project-car-assignments","title":"Project: Car - [Assignments]","order":10,"items":[{"id":"g235ae60b3b60dfd1dd5bc613ef15dfaa","kind":"page","title":"Robot Car Grading Scheme","nav_title":"Robot Car Grading Scheme","position":1,"published":true,"content_html":"<p>For our Robot Car project, there will be a series of <strong>milestones </strong>to complete. Your overall grade will be based on the number of milestones you are able to finish.&nbsp;</p>\n<p><em>If a milestone is partly complete, I will assess partial credit as is appropriate.</em></p>\n<p><strong>List of Milestones:</strong></p>\n<table style=\"border-collapse: collapse; width: 29.2821%; height: 226.146px;\" border=\"1\">\n<tbody>\n<tr style=\"height: 28.9867px;\">\n<td style=\"width: 28.1968%; height: 28.9867px;\">Milestone 0</td>\n<td style=\"width: 71.7382%; height: 28.9867px;\">Car Build + Test Drive</td>\n</tr>\n<tr style=\"height: 28.608px;\">\n<td style=\"width: 28.1968%; height: 28.608px;\">Milestone 0.5</td>\n<td style=\"width: 71.7382%; height: 28.608px;\">3D Print - Hood Ornament</td>\n</tr>\n<tr style=\"height: 28.9867px;\">\n<td style=\"width: 28.1968%; height: 28.9867px;\">Milestone 1</td>\n<td style=\"width: 71.7382%; height: 28.9867px;\">Pattern Driving&nbsp;</td>\n</tr>\n<tr style=\"height: 28.9867px;\">\n<td style=\"width: 28.1968%; height: 28.9867px;\">Milestone 2</td>\n<td style=\"width: 71.7382%; height: 28.9867px;\">Line Tracking</td>\n</tr>\n<tr style=\"height: 28.9867px;\">\n<td style=\"width: 28.1968%; height: 28.9867px;\">Milestone 3</td>\n<td style=\"width: 71.7382%; height: 28.9867px;\">Barcode Reader</td>\n</tr>\n<tr style=\"height: 28.9867px;\">\n<td style=\"width: 28.1968%; height: 28.9867px;\">Milestone 4</td>\n<td style=\"width: 71.7382%; height: 28.9867px;\">Obstacle Avoidance</td>\n</tr>\n<tr style=\"height: 52.6042px;\">\n<td style=\"width: 28.1968%; height: 52.6042px;\">Milestone 5</td>\n<td style=\"width: 71.7382%; height: 52.6042px;\">\n<p>Remote Control (Radio or Bluetooth)</p>\n</td>\n</tr>\n</tbody>\n</table>\n<p>&nbsp;</p>\n<p><strong>Grades Based on Milestones completed</strong></p>\n<table style=\"border-collapse: collapse; width: 15.1248%;\" border=\"1\">\n<tbody>\n<tr>\n<td style=\"width: 72.8695%; text-align: center;\">1 milestone complete</td>\n<td style=\"width: 27.0646%; text-align: center;\">40%</td>\n</tr>\n<tr>\n<td style=\"width: 72.8695%; text-align: center;\">2 milestones complete</td>\n<td style=\"width: 27.0646%; text-align: center;\">60%</td>\n</tr>\n<tr>\n<td style=\"width: 72.8695%; text-align: center;\">3 milestones complete</td>\n<td style=\"width: 27.0646%; text-align: center;\">80%</td>\n</tr>\n<tr>\n<td style=\"width: 72.8695%; text-align: center;\">4 milestones complete</td>\n<td style=\"width: 27.0646%; text-align: center;\">90%</td>\n</tr>\n<tr>\n<td style=\"width: 72.8695%; text-align: center;\">5 milestones complete</td>\n<td style=\"width: 27.0646%; text-align: center;\">95%</td>\n</tr>\n<tr>\n<td style=\"width: 72.8695%; text-align: center;\">6 milestones complete</td>\n<td style=\"width: 27.0646%; text-align: center;\">98%</td>\n</tr>\n<tr>\n<td style=\"width: 72.8695%; text-align: center;\">7 milestones complete</td>\n<td style=\"width: 27.0646%; text-align: center;\">100%</td>\n</tr>\n</tbody>\n</table>\n<p>&nbsp;</p>\n\n"},{"id":"g76c45b30bdda64468063f3431ebd3f94","kind":"assignment","title":"Milestone 0: Finish the Build + Test Drive","nav_title":"Milestone 0: Finish the Build + Test Drive","position":2,"published":true,"content_html":"<div class=\"item-meta\"><span class=\"meta-points\"><strong>Points:</strong> 1.0</span> &middot; <span class=\"meta-submission\"><strong>Submission type:</strong> online upload</span></div><p>Your first Milestone is to finish the build of the car and take it on its first&nbsp;<em>test drive.<br><br></em></p>\n<p><span style=\"font-size: 18pt;\"><strong>Test Drive Program</strong></span></p>\n<p>There are two main things we want to establish in the first driving test:</p>\n<ul>\n<li>that both motors turn the correct direction <em>(drive forward when the code tries to drive forward)</em></li>\n<li>That your&nbsp;<span style=\"text-decoration: underline;\">left motor is&nbsp;<strong>motor 1</strong></span> and your&nbsp;<span style=\"text-decoration: underline;\">right motor is&nbsp;<strong>motor 2.<br></strong></span></li>\n</ul>\n<p>A simple program like this can verify both things:<br><em><img src=\"media/web_resources/Uploaded-Media/car-milestone-0-i01.png\" alt=\"car milestone 0 - i01.png\" width=\"325\" height=\"264\" loading=\"lazy\"></em></p>\n<p>When run, your car should <strong>drive forward, but curve to the right.</strong></p>\n<p><strong><br><br></strong>If either of the motors is spinning backwards:</p>\n<ul>\n<li>you can fix that by reversing its wire connections to the crickit board motor controller</li>\n<li>you could instead fix it by including a block to invert motor direction: <img src=\"media/web_resources/Uploaded-Media/car-milestone-0-i02-1.png\" alt=\"car milestone 0 - i02-1.png\" width=\"276\" height=\"40\" loading=\"lazy\"></li>\n</ul>\n<p>&nbsp;</p>\n<p>&nbsp;</p>\n<p><span style=\"font-size: 18pt;\"><strong>Submission</strong></span></p>\n<p><span style=\"font-size: 12pt;\"><em>There are two things to submit:</em></span></p>\n<ul>\n<li>A video of the car running the <strong>motor test program</strong> (above)</li>\n<li>.hex file of your code</li>\n</ul>\n<p><em><span style=\"background-color: #e67e23; color: #ffffff;\">Note:</span><span style=\"color: #ffffff;\"> </span>If working as a pair:</em></p>\n<ul>\n<li><em>One student submit the video/code</em>\n<ul>\n<li><em>include a comment listing who their partner is</em></li>\n</ul>\n</li>\n</ul>\n\n"},{"id":"g851744e56f636fd962dc896450a315bf","kind":"assignment","title":"Milestone 0.5: 3D Printed Hood Ornament","nav_title":"Milestone 0.5: 3D Printed Hood Ornament","position":3,"published":true,"content_html":"<div class=\"item-meta\"><span class=\"meta-points\"><strong>Points:</strong> 1.0</span> &middot; <span class=\"meta-submission\"><strong>Submission type:</strong> online upload</span></div><p>To help customize your&nbsp;<strong>car project,</strong> you'll design and&nbsp;<strong>3D print</strong> a \"hood ornament\" to go on the car.&nbsp; There are only a few requirements:</p>\n<ul>\n<li>should include a single hole to mount to chassis (3.3mm diameter)</li>\n<li>max dimensions for the ornament: 35mm x 35mm x35mm</li>\n<li>think about making a design that is likely to be successful when you go to print it\n<ul>\n<li>decent surface adhesion</li>\n<li>not too many major overhangs</li>\n</ul>\n</li>\n</ul>\n<p><strong>Once you've made your</strong> design (as a .ipt file),&nbsp; also <span style=\"text-decoration: underline;\">save a copy</span> as <strong>a .STL file</strong>.</p>\n<ul>\n<li>Load the STL file into Prusa Slicer</li>\n<li>Slice the file and print it!</li>\n</ul>\n<p><strong>To submit:</strong></p>\n<ul>\n<li>.ipt file of design</li>\n<li>photo of your car project with the ornament installed on it</li>\n</ul>\n\n"},{"id":"gb98c8ac734f8343005458e8aae49837a","kind":"assignment","title":"Milestone 1: Pattern Driving","nav_title":"Milestone 1: Pattern Driving","position":4,"published":true,"content_html":"<div class=\"item-meta\"><span class=\"meta-points\"><strong>Points:</strong> 1.0</span> &middot; <span class=\"meta-submission\"><strong>Submission type:</strong> online upload</span></div><p>Once we've finished the initial build process for our Robot Car, it's time to take it for a&nbsp;<strong>test drive!</strong></p>\n<p><span style=\"font-size: 18pt;\"><strong>Step One: Driving</strong></span></p>\n<p>Specifically, you will need to program some pattern for it to drive. You can design any pattern that you want, but it must include at least&nbsp;<strong>one occurrence&nbsp;</strong>of the following&nbsp;<strong>six basic movements:</strong></p>\n<ul>\n<li>Moving Forwards&nbsp; &nbsp; &nbsp; <em>(motors moving in same direction, same speed)</em></li>\n<li>Moving Backwards&nbsp; <em>(motors moving in same direction, same speed)</em></li>\n<li>Pivoting Right&nbsp; &nbsp; <em>(motors moving in opposite directions, same speed)</em></li>\n<li>Pivoting Left&nbsp; &nbsp; &nbsp; <em>(motors moving in opposite directions, same speed)</em></li>\n<li>Curving Right&nbsp; &nbsp; &nbsp; <em>(motors moving in same direction, different speed)</em></li>\n<li>Curving Left&nbsp; &nbsp; &nbsp; &nbsp; <em>(motors moving in same direction, different speed)</em></li>\n</ul>\n<p><span style=\"font-size: 18pt;\"><strong><br>Two: Lights</strong></span></p>\n<p>At the end of the pattern driving, the car should stop driving and the LED light strip should be activated in some way. You can light up either a solid or animated pattern; the choice is yours.</p>\n<p>The car should stay in this state until the user presses the&nbsp;<em>reset</em> button on the Micro:bit to begin the process again.</p>\n<p>&nbsp;</p>\n<p><span style=\"font-size: 18pt;\"><strong>To Submit:</strong></span></p>\n<p>Take a video showing the operation of this car, and submit it here. Make sure to leave the name of your partner in the comments as well!</p>\n\n"},{"id":"gf44d5b937c8d70b45b848273475b8ac0","kind":"assignment","title":"Milestone 2: Line Tracking","nav_title":"Milestone 2: Line Tracking","position":5,"published":true,"content_html":"<div class=\"item-meta\"><span class=\"meta-points\"><strong>Points:</strong> 1.0</span> &middot; <span class=\"meta-submission\"><strong>Submission type:</strong> online upload</span> &middot; <span class=\"meta-ext\"><strong>Allowed file types:</strong> mp4,mov,zip,hex</span></div><p>To further allowing our robot to&nbsp;<strong>sense its environment,</strong> we'll create a <strong>line tracking sensor</strong> to the front of the robot, and will allow it to follow a line marked on the ground.</p>\n<p><img src=\"media/web_resources/Uploaded-Media/Line-Sensor-Array.jpg\" alt=\"Line Sensor Array.jpg\" width=\"310\" height=\"176\" data-api-endpoint=\"https://canvas.instructure.com/api/v1/courses/12681309/files/323217094\" data-api-returntype=\"File\" loading=\"lazy\">&nbsp;&nbsp;</p>\n<p>This front skid contains 5 individual IR sensors, arranged in a line.&nbsp;</p>\n<p>&nbsp;</p>\n<p><span style=\"font-size: 18pt;\"><strong>Step One: Raw Analog Readings</strong></span></p>\n<p>According to our wiring diagram, we should be able to write a function to&nbsp;<strong>poll each sensor</strong> and store its reading in a&nbsp;<strong>well-named&nbsp;</strong>variable.&nbsp;<br><em>(Note: &nbsp;Using an array rather than 5 variables would be a more advanced approach. If you want a challenge, try it out!)</em></p>\n<p><img src=\"media/web_resources/Uploaded-Media/line-sensor-read-function.png\" alt=\"line sensor read function.png\" data-api-endpoint=\"https://canvas.instructure.com/api/v1/courses/12681309/files/323217935\" data-api-returntype=\"File\" loading=\"lazy\"></p>\n<p>&nbsp;</p>\n<p>To verify a reasonable reading from each of the five sensors, create a&nbsp;<strong>helper function</strong> to print out all five values:</p>\n<p><img src=\"media/web_resources/Uploaded-Media/car-milestone-2-i01.png\" alt=\"car milestone 2 - i01.png\" width=\"292\" height=\"447\" data-api-endpoint=\"https://canvas.instructure.com/api/v1/courses/12681309/files/323479347\" data-api-returntype=\"File\" loading=\"lazy\"></p>\n<p>&nbsp;</p>\n<p>To test, call both of these functions in a&nbsp;<strong>forever loop.&nbsp;</strong><em>(don't forget a delay to prevent creating a <span style=\"text-decoration: underline;\">tight loop</span></em><em>)</em></p>\n<p><img src=\"media/web_resources/Uploaded-Media/car-milestone-2-i04.png\" alt=\"car milestone 2 - i04.png\" width=\"217\" height=\"230\" data-api-endpoint=\"https://canvas.instructure.com/api/v1/courses/12681309/files/323479454\" data-api-returntype=\"File\" loading=\"lazy\"></p>\n<p>&nbsp;</p>\n<p>&nbsp;</p>\n<p><span style=\"font-size: 18pt;\"><strong>Step Two: Translate to Digital</strong></span></p>\n<p>The sensors we are using give analog readings. However, we ultimately only care about 2 states: (<span style=\"text-decoration: underline;\">on black line</span> or <span style=\"text-decoration: underline;\"><strong>not </strong>on black line</span>).<br>With this in mind, the next step is to take each of our variables and change them into a&nbsp;<strong>0</strong> or a&nbsp;<strong>1.</strong></p>\n<ul>\n<li>0 →&nbsp; will stand for <strong>not on black</strong></li>\n<li>1 →&nbsp; will stand for <strong>on black</strong></li>\n</ul>\n<p>As we need to do a very similar translation for each of the 5 variables, let's create a helper function that can be reused 5 times:</p>\n<p><img src=\"media/web_resources/Uploaded-Media/lineToDigital.png\" alt=\"lineToDigital.png\" width=\"478\" height=\"295\" data-api-endpoint=\"https://canvas.instructure.com/api/v1/courses/12681309/files/323750171\" data-api-returntype=\"File\" loading=\"lazy\"></p>\n<p><em>This function returns 0 or 1, determined by the reading passed into the function (analogReading) and our&nbsp;<strong>threhold value,</strong> which is 80 in this example. You should be picking your&nbsp;<strong>threshold value</strong> based on the raw analog readings you observed earlier. What is a number that is somewhere between the values the sensors provided when on black and the value provided when on white. This threshold value is a&nbsp;<span style=\"text-decoration: underline;\">dividing line.</span></em></p>\n<p>&nbsp;</p>\n<p>This function can now be used to set our 5 variables to hold either a 0 or 1:</p>\n<p><img src=\"media/web_resources/Uploaded-Media/car-milestone-2-i03.png\" alt=\"car milestone 2 - i03.png\" width=\"527\" height=\"367\" data-api-endpoint=\"https://canvas.instructure.com/api/v1/courses/12681309/files/323479869\" data-api-returntype=\"File\" loading=\"lazy\"></p>\n<p>&nbsp;</p>\n<p>To verify correctness, we can&nbsp;<span style=\"text-decoration: underline;\">reuse</span> our printing function, since we're still using the same variables. Updated forever loop would look like:</p>\n<p><img src=\"media/web_resources/Uploaded-Media/car-milestone-2-i05.png\" alt=\"car milestone 2 - i05.png\" width=\"224\" height=\"252\" data-api-endpoint=\"https://canvas.instructure.com/api/v1/courses/12681309/files/323479993\" data-api-returntype=\"File\" loading=\"lazy\"></p>\n<p><em>Please notice that the print function is moved to the very end, so that we ensure the translation to 0s and 1s is complete before we try to print the contents of the variables.</em></p>\n<p>&nbsp;</p>\n<p>&nbsp;</p>\n<p><span style=\"font-size: 18pt;\"><strong>Step Three: Line Tracking Algorithm:</strong></span></p>\n<p><span style=\"font-size: 12pt;\">At this point we should be able to&nbsp;<span style=\"text-decoration: underline;\">look at our sensor data</span> and&nbsp;<span style=\"text-decoration: underline;\">instruct the motors how to spin.</span>&nbsp; In this section, presented is a simple line tracking algorithm. <em>A more elegant (but slighty less simple) solution will be presented further down below for an extra challenge.</em></span></p>\n<ol>\n<li><span style=\"font-size: 12pt;\">Poll the 5 sensors and store updated readings in our 5 variables:&nbsp; &nbsp; &nbsp;<strong>outer</strong><strong>Left&nbsp; &nbsp; &nbsp; innerLeft</strong>&nbsp; &nbsp; &nbsp; &nbsp; <strong>center&nbsp; &nbsp; &nbsp; &nbsp; &nbsp;innerRight</strong>&nbsp; &nbsp; &nbsp;<strong>outer</strong><strong>Right&nbsp;</strong></span>\n<ul>\n<li><span style=\"font-size: 12pt;\">This was covered in step one and two!<br></span></li>\n<li><span style=\"font-size: 12pt;\">Recall that a value of&nbsp;<strong>1</strong> indicates \"<strong>on black</strong>\"<br><br></span></li>\n</ul>\n</li>\n<li><span style=\"font-size: 12pt;\">Move the motors based on the values received from the sensors.</span>\n<ul>\n<li><span style=\"font-size: 12pt;\">If the&nbsp;<strong>center</strong> holds <strong>1:&nbsp; </strong>drive straight a small amount</span></li>\n<li><span style=\"font-size: 12pt;\">Else if the <strong>innerRight</strong>&nbsp;holds <strong>1</strong><strong>:</strong>&nbsp; turn right a small amount</span></li>\n<li><span style=\"font-size: 12pt;\">Else if the <strong>outer</strong><strong>Right</strong>&nbsp;holds <strong>1</strong><strong>:</strong>&nbsp; turn right a medium amount</span></li>\n<li><span style=\"font-size: 12pt;\">Else if the&nbsp;<strong>innerLeft</strong>&nbsp;holds <strong>1</strong><strong>:&nbsp;&nbsp;</strong>turn left a small amount</span></li>\n<li><span style=\"font-size: 12pt;\">Else if the <strong>outer</strong><strong>Left</strong>&nbsp;holds <strong>1</strong><strong>:&nbsp;&nbsp;</strong>turn left a medium amount<br><br><span style=\"background-color: #c71f23; color: #ffffff;\"><strong>NOTE:</strong></span>&nbsp; When picking your motor speeds, don't go&nbsp;<strong>too low.&nbsp;</strong> At lower values the toque will be so low that the motors won't be strong enough to spin. <em>Aim to keep motor speeds both at least 50%.</em><br><br></span></li>\n<li><span style=\"font-size: 12pt;\"><em>If all of the variables hold <strong>0</strong>, this mean the line has been lost! If that is the case, just have the robot pivot a small amount in one direction and eventually the line should be found again.<br></em><br></span>\n<ul>\n<li><span style=\"font-size: 12pt;\"><em>To join multiple conditions again, use the&nbsp;<strong>and</strong><strong> block</strong>&nbsp;For instance:</em></span>\n<ul>\n<li>\n<pre><span style=\"font-size: 12pt;\"><em>&nbsp; if (outerLeft == 0 <strong>and </strong>innerLeft == 0 <strong>and </strong>center == 0&nbsp; ...and so on)&nbsp;  <br></em></span></pre>\n</li>\n</ul>\n</li>\n</ul>\n</li>\n<li><span style=\"font-size: 12pt;\"><em>If all the variables hold&nbsp;<strong>1</strong>, that means your robot has reached the end! At this point, <span style=\"text-decoration: underline;\">turn off the motors</span> and <span style=\"text-decoration: underline;\">activate your neopixel light strip</span> (colors or animation of your choice).<br><br></em></span></li>\n</ul>\n</li>\n<li><span style=\"font-size: 12pt;\">Insert a very short pause (10-40 ms). Then go back to step one and repeat.</span></li>\n</ol>\n<p><br><em>It is important that all the motor actions are very short (the robot moves 1-2 centimeters, perhaps) so that the sensors can be polled frequently. Otherwise, it may be possible for the robot to move entirely off the line and miss its chance for a correction.</em></p>\n<p>&nbsp;</p>\n<p><br><span style=\"font-size: 18pt;\"><strong>To Submit</strong></span></p>\n<p>For this milestone, submit a video of your robot car following the line on our classroom floor. <span style=\"text-decoration: underline;\">It should stop driving when it reaches the perpendicular line.</span></p>\n<p>&nbsp;</p>\n<p>&nbsp;</p>\n<p><span style=\"text-decoration: underline;\"><br></span><span style=\"font-size: 18pt;\"><strong>Challenge:</strong></span></p>\n<p>An improvement would be to make the algorithm more&nbsp;<strong>concise and elegant</strong> by removing the need for so many&nbsp;<strong>IF/ELSE</strong> branches.&nbsp; &nbsp;Switching to using an&nbsp;<strong>array</strong> with 5 spots rather than&nbsp;<strong>5 individual variables</strong> would tidy up the code further.</p>\n<p style=\"padding-left: 40px;\"><span style=\"text-decoration: underline; font-size: 14pt;\">Basic Idea</span></p>\n<ul>\n<li style=\"list-style-type: none;\">\n<ul>\n<li style=\"list-style-type: none;\">\n<ul>\n<li>Assume our basic driving strategy is to drive forward. We pick some default motor speeds\n<ul>\n<li>For example:&nbsp; &nbsp;left motor 70%&nbsp; &nbsp; &nbsp; right motor 70%<br><br></li>\n</ul>\n</li>\n<li>Each time we go to update the driving instruction, we'll use the sensors to calculate a&nbsp;<strong>motor offset value.</strong>&nbsp;\n<ul>\n<li>left motor and right motor speeds will modified by either&nbsp;<strong>adding</strong> or&nbsp;<strong>substracting&nbsp;</strong>this offset value.<br><br></li>\n</ul>\n</li>\n<li>Each sensor is given a&nbsp;<strong>weight:</strong></li>\n<li>\n<pre>    outerLeft      innerLeft     center     innerRight     outerRight<br>       -2             -1            0            1              2</pre>\n<ul>\n<li>Decide on an offset amount per wieght (in motor power %) - let's say 10%\n<ul>\n<li>calculate the overall weight using&nbsp; &nbsp; &nbsp; &nbsp;<strong>sum of all readings on black (1)&nbsp; /&nbsp; number of all readings on black</strong>\n<ul>\n<li>in practice, most of the time only 1 or 2 sensors should be on black<br><br></li>\n</ul>\n</li>\n</ul>\n</li>\n<li>Modify motors using this expression:\n<ul>\n<li>left motor = left motor + (overall weight * 10)&nbsp; &nbsp;<span style=\"color: #027634;\"><em>// 10 for 10% power per offset value</em></span></li>\n<li><span style=\"color: #000000;\">right motor = right motor - (overall weight * 10)<br></span></li>\n</ul>\n</li>\n<li><span style=\"color: #000000;\">Don't forget, however, to&nbsp;<span style=\"text-decoration: underline;\">check if all the variables</span>&nbsp;or&nbsp;<span style=\"text-decoration: underline;\">none of the variables</span> are holding 1s. These special cases should be checked and resolved on their own.</span></li>\n</ul>\n</li>\n</ul>\n</li>\n</ul>\n</li>\n</ul>\n\n"},{"id":"g78655835ff93be804cbbeec483199d2f","kind":"assignment","title":"Milestone 3: Line Sensor Barcodes","nav_title":"Milestone 3: Line Sensor Barcodes","position":6,"published":true,"content_html":"<div class=\"item-meta\"><span class=\"meta-points\"><strong>Points:</strong> 1.0</span> &middot; <span class=\"meta-submission\"><strong>Submission type:</strong> online upload</span> &middot; <span class=\"meta-ext\"><strong>Allowed file types:</strong> mov,mp4,hex</span></div><p><iframe src=\"https://docs.google.com/presentation/d/e/2PACX-1vQxcAO4CH0_HOA3s9mtHYpx3kqjxSHl7xN0NFTp2dV0S96Wv5K73rDcYiE5_wlkY69hOcIOedtKCIZQ/pubembed?start=false&amp;loop=false&amp;delayms=3000\" width=\"960\" height=\"569\" loading=\"lazy\" allowfullscreen=\"allowfullscreen\" webkitallowfullscreen=\"webkitallowfullscreen\" mozallowfullscreen=\"mozallowfullscreen\"></iframe></p>\n\n"},{"id":"gae0c9a9c66dd0b5bfafa5cc0e477925a","kind":"assignment","title":"Milestone 4: Obstacle Avoidance","nav_title":"Milestone 4: Obstacle Avoidance","position":7,"published":true,"content_html":"<div class=\"item-meta\"><span class=\"meta-points\"><strong>Points:</strong> 1.0</span> &middot; <span class=\"meta-submission\"><strong>Submission type:</strong> online upload</span> &middot; <span class=\"meta-ext\"><strong>Allowed file types:</strong> mp4,mov,zip,hex</span></div><p>For this <strong>milestone</strong>, your task is to implement simple <strong>autonomous driving</strong> for your robot car, using the three <strong>Ultrasonic Sensors</strong> as the primary input. Your robot car should&nbsp;<span style=\"text-decoration: underline;\">avoid any obstacles</span> by automatically changing direction when a collision is pending.&nbsp;</p>\n<p><em>You can use a variety of objects from the classroom as obstacles in your testing.<br></em></p>\n<p><span style=\"font-size: 14pt;\"><strong>Step One:&nbsp;&nbsp;<span style=\"text-decoration: underline;\">Center Sensor</span></strong></span></p>\n<ul>\n<li>The main way to anticipate a collision&nbsp;<em>(when driving straight)</em> is to&nbsp;<span style=\"text-decoration: underline;\">rely on the center sensor.</span> Write you program such that the car will:\n<ul>\n<li>continue driving straight until there is an obstacle 10cm away or closer.</li>\n<li>at this point, your car should&nbsp;<span style=\"text-decoration: underline;\">resolve the situation</span> using the strategy outlined in&nbsp;<strong>Step Two.</strong></li>\n</ul>\n</li>\n</ul>\n<p>&nbsp;</p>\n<p><span style=\"font-size: 14pt;\"><strong>Step Two:&nbsp;<span style=\"text-decoration: underline;\">Optimal Correction</span></strong></span></p>\n<ul style=\"list-style-type: disc;\">\n<li>Identifying when there is an obstacle in the car's way is a start, but without more information the best we could do is guess what sort of movement will get us away from the obstacle. Instead, the <span style=\"text-decoration: underline;\">two side sensors</span> should be polled to see which direction is <span style=\"text-decoration: underline;\">more promising.</span>\n<ul style=\"list-style-type: circle;\">\n<li>If at least one of the side sensors has at least 20cm until an object, we can do a turn.\n<ul style=\"list-style-type: square;\">\n<li>If only the left sensor has at least 20cm, turn left somewhere between 45 and 90 degrees</li>\n<li>If only the right sensor has at least 20cm, turn right somewhere between 45 and 90 degrees.</li>\n<li>If both sensors have at least that much space, turn towards the side that has a&nbsp;<span style=\"text-decoration: underline;\">greater distance.</span></li>\n</ul>\n</li>\n</ul>\n</li>\n</ul>\n<p><strong><br><span style=\"font-size: 14pt;\">Step Three:&nbsp;<span style=\"text-decoration: underline;\">Nowhere to go?</span></span></strong></p>\n<ul style=\"list-style-type: disc;\">\n<li>However what if we read a dead end? <em>(front is blocked &lt;10,&nbsp; boths sides are blocked (&lt;20)</em><br>\n<ul style=\"list-style-type: circle;\">\n<li>In this case, have the robot car back up for 1-2 seconds and turn left or right somwhere between 45 and 90 degrees\n<ul style=\"list-style-type: square;\">\n<li>however, if the left/right sensors still detect nearby objects, the robot should carry on to back up further before trying to turn.</li>\n</ul>\n</li>\n</ul>\n</li>\n</ul>\n<p>&nbsp;</p>\n<p><span style=\"font-size: 18pt;\"><strong>To Submit:</strong></span></p>\n<p>Hand in a video file of your robot car responding to a number of obstacles. Also please submit your .hex file.</p>\n\n"},{"id":"gcc9a32a39445e1b248023c2da6256879","kind":"assignment","title":"MileStone 5: Remote Control","nav_title":"MileStone 5: Remote Control","position":8,"published":true,"content_html":"<div class=\"item-meta\"><span class=\"meta-points\"><strong>Points:</strong> 1.0</span> &middot; <span class=\"meta-submission\"><strong>Submission type:</strong> online upload</span> &middot; <span class=\"meta-ext\"><strong>Allowed file types:</strong> mov,mp4,mkv,hex</span></div><p>For Milestone 5, we'll move away from <strong>autonomous control</strong> and instead implement a simple <strong>telemetry control system.</strong></p>\n<p><em>You may have already tried something similar with the Marble Maze project. If so, I'd encourage you to choose an option below that challenges you in a new</em> way.</p>\n<p>&nbsp;</p>\n<p>Implement a simple&nbsp;<strong>controller</strong> system. It can either be&nbsp;<strong>radio control</strong>&nbsp; or&nbsp;&nbsp;<strong>bluetooth</strong><strong> control.</strong></p>\n<p>&nbsp;</p>\n<p><strong><span style=\"font-size: 18pt;\">Radio Control Option</span></strong></p>\n<p>Using a second micro:bit, gather some sort of inputs</p>\n<ul>\n<li>tilt data</li>\n<li>joystick</li>\n<li>buttons</li>\n<li>potentiometers</li>\n</ul>\n<p>and devise a scheme to send the information to the car's microbit via radio messages. Add code to the car microbit to control the motors (and neopixel / servo if you like) according to the radio messages.</p>\n<p>&nbsp;</p>\n<p><strong><span style=\"font-size: 18pt;\">Bluetooth Control Option</span></strong></p>\n<p>It should also be possible to use a bluetooth app on your phone to communicate with the micro:bit. Check out some of the instructions here:</p>\n<p><a href=\"https://cardboard.lofirobot.com/microbit-control-app-info/\" target=\"_blank\">https://cardboard.lofirobot.com/microbit-control-app-info/</a></p>\n<p>&nbsp;</p>\n<p>&nbsp;</p>\n<p><strong><span style=\"font-size: 18pt;\">To Submit</span></strong></p>\n<p>.hex file of all code used <em>(might be multiple files, depending on if radio or bluetooth was used)</em></p>\n<p>video of your remote control car in operation</p>\n<p>&nbsp;</p>\n\n"},{"id":"g71b64cf219e57bdb501f70a48e599522","kind":"page","title":"Extension (If you're ahead): RFID Reader","nav_title":"Extension (If you're ahead): RFID Reader","position":13,"published":true,"content_html":"<p><img src=\"media/web_resources/rfid-reader-image.jpg\" alt=\"\" width=\"177\" height=\"150\" data-decorative=\"true\" loading=\"lazy\"></p>\n<p>An RFID (Radio Field ID) reader can be used to get ID information from a tag or card. They are commonly used for security clearance or door locks, but we'll incorporate one into our robotic car design.<br><br></p>\n<p><strong>Step One: Learn the Basics</strong></p>\n<p style=\"padding-left: 40px;\">Get an RFID module to start working with. If needed, solder the header pins onto it. Once you have the module ready to go, use the following tutorial to get to the stage where you can read card information and display it in the Serial Montior.</p>\n<p style=\"padding-left: 40px;\">To install the library:</p>\n<ul>\n<li style=\"list-style-type: none;\">\n<ul>\n<li style=\"list-style-type: none;\">\n<ul>\n<li>Download the ZIP file linked on the tutorial page below</li>\n<li>In Arduino:&nbsp; &nbsp;Sketch → Include Library → add .ZIP Library&nbsp; &nbsp;, then select the downloaded ZIP</li>\n<li>Restart the Arduino program</li>\n</ul>\n</li>\n</ul>\n</li>\n</ul>\n<p style=\"padding-left: 40px;\"><a href=\"https://randomnerdtutorials.com/security-access-using-mfrc522-rfid-reader-with-arduino/\">https://randomnerdtutorials.com/security-access-using-mfrc522-rfid-reader-with-arduino/</a></p>\n<p style=\"padding-left: 40px;\"><span style=\"background-color: #ffcc99;\">Caution:&nbsp;</span> <span style=\"color: #800080;\"><strong>DO NOT</strong> plug this module into 5v power, as that will destroy the module. It can only be plugged into the 3.3V pin on the Arduino.<br><em><span style=\"color: #000000;\">If you don't have enough available pins, you can add a second Arduino to your robot for this component.<br><br></span></em></span></p>\n<p><strong>Step Two: Light Control<br></strong></p>\n<p style=\"padding-left: 40px;\">Modify the code you have so far to control the LED light strip.&nbsp;</p>\n<ul>\n<li style=\"list-style-type: none;\">\n<ul>\n<li style=\"list-style-type: none;\">\n<ul>\n<li>Have the lights start all in one solid color</li>\n<li>When the RFID reader detects a known card, change to a color associated with that card</li>\n<li>Program in 3 possible card UIDs<br><br>\n</li>\n</ul>\n</li>\n</ul>\n</li>\n</ul>\n<p><strong>Step Three: Merge with Line Follower</strong></p>\n<p style=\"padding-left: 40px;\">Merge this program with your line follower so that the card reading can happen while following a line</p>\n<ul>\n<li style=\"list-style-type: none;\">\n<ul>\n<li style=\"list-style-type: none;\">\n<ul>\n<li>We'll tape down some RFID card onto the track to test this out</li>\n<li>If you used two separate Arduinos, you can have one run the lights and RFID and the other the line tracker sensor and motor controller</li>\n</ul>\n</li>\n</ul>\n</li>\n</ul>\n\n"}]},{"id":"gdedc774f9fe8d4ccec4be341c939d6a2","slug":"12-open-circuit-project","title":"Open Circuit Project","order":11,"items":[{"id":"gb95e272185a6c57083a9a6f61a808993","kind":"assignment","title":"Open Circuit Project","nav_title":"Open Circuit Project","position":1,"published":true,"content_html":"<div class=\"item-meta\"><span class=\"meta-points\"><strong>Points:</strong> 10.0</span> &middot; <span class=\"meta-submission\"><strong>Submission type:</strong> online upload</span></div><p>For this major project, you will create an <strong data-start=\"199\" data-end=\"258\">interactive art piece, game, or other electronic device</strong> that uses the components we’ve learned about over the past three weeks. This project should demonstrate both <strong data-start=\"368\" data-end=\"388\">circuit-building</strong> and <strong data-start=\"393\" data-end=\"426\">creative or functional design</strong>.<br><br></p>\n<p><span style=\"font-size: 18pt;\"><strong>Circuit Requirements</strong></span></p>\n<p>You must include components from the following categories. Read carefully and come up with a set of components that fulfill the requirements. You may add additional components as well once you'll included the required ones.</p>\n<ol style=\"list-style-type: decimal;\">\n<li><strong>RGB LED&nbsp;</strong>and&nbsp;<strong>a Single LED</strong>&nbsp; &nbsp; &nbsp; &nbsp; &nbsp;OR&nbsp; &nbsp; &nbsp; &nbsp; &nbsp;&nbsp;<strong>Seven Segment Display<br><br></strong></li>\n<li><span style=\"text-decoration: underline;\">At least one input device</span> from the following:&nbsp; &nbsp;\n<ul style=\"list-style-type: square;\">\n<li><strong>Ultrasonic Sensor</strong></li>\n<li><strong>HuskyLens AI camera</strong></li>\n<li><strong>QRE1113 IR Sensor (line sensors)</strong></li>\n<li><strong>P</strong><strong>hotoresistor</strong><strong></strong></li>\n<li><strong>IR Remote / Reciever</strong><strong></strong></li>\n<li><strong>3x4 Membrane Keypad<br><br></strong></li>\n</ul>\n</li>\n<li><span style=\"text-decoration: underline;\">Three or more</span> of the following:\n<ul style=\"list-style-type: square;\">\n<li data-start=\"746\" data-end=\"758\"><strong>Joystick</strong></li>\n<li data-start=\"746\" data-end=\"758\"><strong>Button</strong></li>\n<li data-start=\"746\" data-end=\"758\"><strong>Tilt Switch</strong></li>\n<li data-start=\"746\" data-end=\"758\"><strong>Slide Switch</strong></li>\n<li data-start=\"746\" data-end=\"758\"><strong>Dip Switches</strong></li>\n<li data-start=\"746\" data-end=\"758\"><strong>Potentiometer</strong></li>\n<li data-start=\"746\" data-end=\"758\"><strong>Neopixel Strip<br><br></strong></li>\n</ul>\n</li>\n<li><span style=\"text-decoration: underline;\">At Least one</span> output or actuator:\n<ul style=\"list-style-type: square;\">\n<li><strong>Servo</strong></li>\n<li><strong>DC Motor</strong><em> (small 3-6v motor with fan blades)</em></li>\n<li><strong>DC Motor</strong> <em>(larger yellow TT Motor)</em></li>\n<li><strong>LCD Module<br><br></strong><strong></strong></li>\n</ul>\n</li>\n</ol>\n<p><span style=\"font-size: 18pt;\"><strong>Physical Component</strong></span></p>\n<p style=\"padding-left: 40px;\">In addition to electronic components, you may also incorporate physical materials (cardstock, cardboard, canvas, plastic) as needed for your design.</p>\n<p style=\"padding-left: 40px;\">To recieve&nbsp;<span style=\"text-decoration: underline;\">full marks</span> on this project, some component of the physical construction must be <strong>digitally designed and fabricated</strong> by you. (3D Printer, Laser Cutter).</p>\n<ul>\n<li style=\"list-style-type: none;\">\n<ul>\n<li style=\"list-style-type: none;\">\n<ul>\n<li><em>without the use of 3D printer or Laser Cutter, the maximum grade possible will be 95%.<br><br></em></li>\n</ul>\n</li>\n</ul>\n</li>\n</ul>\n<p><span style=\"font-size: 18pt;\"><strong>Circuit Diagram</strong></span></p>\n<p>You must create a <strong data-start=\"1242\" data-end=\"1269\">digital circuit diagram</strong> that clearly shows how all components in your project are connected.</p>\n<ul>\n<li>Powerpoint or Google Slides can work well for this part\n<ul>\n<li>A ZIP of .PNG images of the required components can be found <a class=\"instructure_file_link inline_disabled\" title=\"component images.zip\" href=\"media/web_resources/Uploaded-Media/component-images.zip\" target=\"_blank\" data-canvas-previewable=\"false\" data-api-endpoint=\"https://canvas.instructure.com/api/v1/courses/12681309/files/327026795\" data-api-returntype=\"File\">here.</a><br><br></li>\n</ul>\n</li>\n<li>Alternatively, <a class=\"inline_disabled\" href=\"https://app.cirkitdesigner.com/project/a605677a-56ba-4fe1-8f0a-b8b75c935143\" target=\"_blank\">Cirkit Designer</a> can also work well!\n<ul>\n<li>Likely a bit more to learn, but will allow for a much nicer finished product</li>\n<li><em>Create an account to ensure you don't lose your work!<br><br></em></li>\n</ul>\n</li>\n</ul>\n<p><span style=\"font-size: 18pt;\"><strong>Project Ideas</strong></span></p>\n<p>It is possible that you choose something that you can build with the <span style=\"text-decoration: underline;\">materials/components available</span> and within the <span style=\"text-decoration: underline;\">time frame allocated.</span>&nbsp; Here are some possible ideas:</p>\n<ul style=\"list-style-type: square;\">\n<li>4-Level Smart Fan Control System</li>\n<li>No Dogs Allowed AI-Enabled Cat House</li>\n<li>Cardboard Crane Loading and Unloading project</li>\n<li>Enhanced Neopixel Strip/Panel Reaction Game</li>\n</ul>\n<p><span style=\"font-size: 18pt;\"><strong><br>Submission</strong></span></p>\n<p>Once complete, <span style=\"text-decoration: underline;\">please submit the following:</span></p>\n<ul style=\"list-style-type: square;\">\n<li>A video of your project in operation</li>\n<li>A digital circuit diagram file</li>\n<li>Any other digital files (3D models, 2D Laser paths, .hex code)</li>\n</ul>\n<p>&nbsp;</p>\n\n"}]},{"id":"gf35330e4ac9085d4a312ba3074279e06","slug":"13-final-day","title":"Final Day","order":12,"items":[{"id":"gace8f17e564285f1512117a549ca451e","kind":"page","title":"Self-Assessment and Course Feedback","nav_title":"Self-Assessment and Course Feedback","position":1,"published":true,"content_html":"<p><span style=\"background-color: #cf4a00; color: #ffffff;\"><strong>NOTE:</strong></span><span style=\"color: #ffffff;\">&nbsp;</span> It is recommended to&nbsp;<strong>not fill this form out directly.</strong><span>&nbsp;</span>Instead, write your answers in&nbsp;<strong>Microsoft Word</strong><span>&nbsp;</span>or&nbsp;<strong>GoogleDocs</strong><span>&nbsp;</span>and then copy-paste the responses into the form. This will greatly reduce the likelihood of accidentally losing your work!</p>\n<p><span style=\"color: #ffffff; background-color: #cf4a00;\"><strong>NOTE:NOTE:</strong></span><span>&nbsp;</span><span>&nbsp;</span>Make sure to write this yourself. No AI help, please!!</p>\n<p><iframe src=\"https://docs.google.com/forms/d/e/1FAIpQLSfJGtGLuue3dV8L9u_dyJ0XC_gat494JTN0ZRXLh5GZz-xIIQ/viewform?embedded=true\" width=\"640\" height=\"3021\" loading=\"lazy\"></iframe></p>\n\n"},{"id":"g49a3813972fe56860f75c9fd26be4acb","kind":"page","title":"Last Day TO-DO","nav_title":"Last Day TO-DO","position":2,"published":true,"content_html":"<p><span style=\"font-size: 14pt;\">1. Start with <strong>Self-Reflection and Course Review</strong> on Canvas<br><br></span></p>\n<p><span style=\"font-size: 14pt;\">2. Car Teardown</span></p>\n<ul>\n<li>All parts into boxes / Bins</li>\n<li>Fasteners Sorted according to size and head type\n<ul>\n<li>make sure you put&nbsp;<strong>CORRECT SIZE </strong>in the <strong>CORRECT Bin!</strong></li>\n</ul>\n</li>\n<li>Stack chassis in pile</li>\n<li>3D designs (\"Hood Ornament\") → students keep if you want, or you can leave to have it recycled.<br><br></li>\n</ul>\n<p><span style=\"font-size: 14pt;\">3. Marble Maze deconstruction</span></p>\n<ul>\n<li><span style=\"font-size: 12pt;\">Most of this project will be recycled, but first we should reclaim and sort the following components:</span>\n<ul>\n<li><span style=\"font-size: 12pt;\">Servos (s)</span></li>\n<li><span style=\"font-size: 12pt;\">M3 machine screws and nuts</span></li>\n<li><span style=\"font-size: 12pt;\">Servo Horns (if possible)<br></span></li>\n<li><span style=\"font-size: 12pt;\">Side Supports and Bottom Connectors - save these if they are in good shape!</span>\n<ul>\n<li><span style=\"font-size: 12pt;\">The rest of the cardboard can be recycled.<br></span></li>\n</ul>\n</li>\n</ul>\n</li>\n</ul>\n<p><span style=\"font-size: 14pt;\">4. Micro:bit Kit Re-organization<br></span></p>\n<ul>\n<li>We will remove most of our components from the kits and sort them into bins. The finished kits should have the following items still in them:<br>\n<ul>\n<li>Microbit+Cable <em>(in a bag)</em></li>\n<li>Resistors</li>\n<li>LEDs</li>\n<li>Momentary Switches (buttons)</li>\n<li>Jumper Cables (10-20 only! Return additional wires to the bins)</li>\n<li>Large Breadboard<br><br></li>\n</ul>\n</li>\n<li>All other parts need to go back into bins. <strong>Please have me review your kit when you think you've completed this task<br><br></strong><em>It should look something like this:<br><img src=\"media/web_resources/Uploaded-Media/PXL_20260126_213353927.png\" alt=\"PXL_20260126_213353927.png\" width=\"473\" height=\"333\" loading=\"lazy\"><br></em></li>\n</ul>\n<p><br><span style=\"font-size: 14pt;\">4. Extra Jobs to help out with:</span></p>\n<ul>\n<li>Sort Misc. Fasteners</li>\n<li>Open up new components (metal tooth servos,&nbsp; hall effect sensors)</li>\n<li>Organize leftover cardboard</li>\n<li>Soldering (repair broken components)</li>\n<li>Salvage (old headphones)</li>\n<li>Disassemble Plywood structure</li>\n<li>Extra Kits to sort</li>\n</ul>\n\n"}]},{"id":"g7b7d2d3a328b4b5282d670f4b02571aa","slug":"10-project-car-build","title":"Project: Car - [Build]","order":14,"items":[{"id":"g5471d04e02f1171bcfb4c2a15766acdb","kind":"weblink","title":"Build Guide","nav_title":"Build Guide","position":2,"published":true,"external_url":"https://stefan-scott.github.io/microbuild"}]},{"id":"gcad360f1397a18f9a38eaa5a280f84b9","slug":"14-holding-folder-old-items","title":"Holding Folder - old items","order":15,"items":[{"id":"g3446417d9b0b1cf39154b607db2feb6d","kind":"assignment","title":"09 - Rise of the Robots Documentary","nav_title":"09 - Rise of the Robots Documentary","position":1,"published":true,"content_html":"<div class=\"item-meta\"><span class=\"meta-points\"><strong>Points:</strong> 10.0</span> &middot; <span class=\"meta-submission\"><strong>Submission type:</strong> online upload</span></div><p>Robotics and Automation are becoming increasingly prevalent in our society, both in the workplace and at home. BBC Four has produced a 3-part documentary that provides a look at present and future applications of robotics and discusses the impacts they will have on our world. The title of the series is&nbsp;<strong>Rise of the Robots</strong>, and it is just under two hours in length.</p>\n<p><img src=\"media/web_resources/Rise-of-the-Robots-Title-Image.jpg\" alt=\"\" width=\"357\" height=\"201\" data-decorative=\"true\" data-api-endpoint=\"https://canvas.instructure.com/api/v1/courses/4227213/files/168010783\" data-api-returntype=\"File\" loading=\"lazy\"></p>\n<p>Before beginning to watch the film, download the following assignment of reflection questions:</p>\n<p><a class=\"instructure_file_link instructure_scribd_file\" title=\"Rise of the Robots - Reflection Assignment.docx\" href=\"media/web_resources/Rise-of-the-Robots-Reflection-Assignment.docx\" data-api-endpoint=\"https://canvas.instructure.com/api/v1/courses/4227213/files/168010857\" data-api-returntype=\"File\">Rise of the Robots - Reflection Assignment.docx</a></p>\n<p><br>Below are links to the three parts. As you work through the documentary, answer the questions from the reflection assignment.&nbsp;<em>You may find this easiest to do as you watch - they are ordered chronologically.</em></p>\n<p>&nbsp;</p>\n<p><iframe src=\"https://www.youtube.com/embed/hRuBZLe8vfs\" width=\"560\" height=\"315\" allowfullscreen=\"allowfullscreen\" allow=\"accelerometer; autoplay; encrypted-media; gyroscope; picture-in-picture\" loading=\"lazy\"></iframe> <iframe src=\"https://www.youtube.com/embed/9SA2WLDB65A\" width=\"560\" height=\"315\" allowfullscreen=\"allowfullscreen\" allow=\"accelerometer; autoplay; encrypted-media; gyroscope; picture-in-picture\" loading=\"lazy\"></iframe> <iframe src=\"https://www.youtube.com/embed/D22UOL-ncgw\" width=\"560\" height=\"315\" allowfullscreen=\"allowfullscreen\" allow=\"accelerometer; autoplay; encrypted-media; gyroscope; picture-in-picture\" loading=\"lazy\"></iframe></p>\n<p>&nbsp;</p>\n<p><strong>What to Submit:</strong></p>\n<p>Once you've finished watching all three parts and have answered each of the questions, submit your answers here as a word document.</p>\n\n"},{"id":"gabe620c1a4ddcec002483886921c58ba","kind":"page","title":"Mini-lesson: Capacitors and Exercise-2","nav_title":"Mini-lesson: Capacitors and Exercise-2","position":2,"published":true,"content_html":"<p>Capacitors are a very common electronics component, but&nbsp;<em>what exactly are they,&nbsp;</em><em>and</em><em> how do they work?&nbsp;</em>In this demo, you'll create a circuit that uses a Capacitor to create a fade effect for an LED.</p>\n<p><strong>Step One - Video:</strong></p>\n<p><em>Begin with the following short video that provides the basic information about Capacitors.</em></p>\n<p><iframe src=\"https://www.youtube.com/embed/L6cgSxpGmDo\" width=\"560\" height=\"315\" allowfullscreen=\"allowfullscreen\" allow=\"accelerometer; autoplay; encrypted-media; gyroscope; picture-in-picture\" loading=\"lazy\"></iframe></p>\n<p>&nbsp;</p>\n<p><strong>Step Two - TinkerCAD Exercise:</strong></p>\n<p><em>Following along with the exercise PDF below to construct an LED circuit that uses a capacitor to create a fading effect when battery power is cut off from the circuit.</em></p>\n<p><a class=\"instructure_file_link instructure_scribd_file\" title=\"Capacitors Exercise.pdf\" href=\"media/web_resources/Capacitors-Exercise-1.pdf\" data-api-endpoint=\"https://canvas.instructure.com/api/v1/courses/1951684/files/93945771\" data-api-returntype=\"File\">Capacitors Exercise.pdf</a></p>\n<p>&nbsp;</p>\n<p><strong>Complete - Sample Animation:</strong></p>\n<p><em>For reference, at the final step of this circuit, the multimeter readings should be similar to below (example shown has a 200<span>μF capacitor.</span></em></p>\n<p><img src=\"media/web_resources/Capacitor-Exercise-Multimeter-1.gif\" alt=\"\" width=\"640\" height=\"272\" data-decorative=\"true\" data-api-endpoint=\"https://canvas.instructure.com/api/v1/courses/1951684/files/93945263\" data-api-returntype=\"File\" loading=\"lazy\"></p>\n<p>&nbsp;</p>\n\n"},{"id":"g38d847af697210a192d0c8a553490665","kind":"assignment","title":"Transistors and DC Motors","nav_title":"Transistors and DC Motors","position":3,"published":true,"content_html":"<div class=\"item-meta\"><span class=\"meta-points\"><strong>Points:</strong> 5.0</span> &middot; <span class=\"meta-submission\"><strong>Submission type:</strong> online upload</span></div><p>Transistors are also very common electronics components, but <em>what exactly are they,&nbsp;</em><em>and</em><em><span>&nbsp;</span>how do they work?&nbsp;</em></p>\n<p><strong>Step One - Transistors Video:</strong></p>\n<p><em>Begin with the following short video that provides the basic information about transistors.</em></p>\n<p><iframe src=\"https://www.youtube.com/embed/IcrBqCFLHIY\" width=\"560\" height=\"315\" allowfullscreen=\"allowfullscreen\" allow=\"accelerometer; autoplay; encrypted-media; gyroscope; picture-in-picture\" loading=\"lazy\"></iframe></p>\n<p>&nbsp;</p>\n<p><strong>Step Two - DC Motors Video:</strong></p>\n<p>In this lesson we'll look at DC motor operation and control. The following video shows the internal construction and workings of a DC motor. For this course it isn't necessary to fully understand all the physics represented, just the general idea.</p>\n<p><iframe src=\"https://www.youtube.com/embed/LAtPHANEfQo\" width=\"560\" height=\"315\" allowfullscreen=\"allowfullscreen\" allow=\"accelerometer; autoplay; encrypted-media; gyroscope; picture-in-picture\" loading=\"lazy\"></iframe></p>\n<p>&nbsp;</p>\n<p><strong>Step Three - TinkerCAD Exercise:</strong></p>\n<p>In this exercise, we'll look at&nbsp;<strong>DC Motors</strong>,&nbsp;<strong>Transistors (NPN),&nbsp;</strong>and&nbsp;<strong>PIR Motion Sensors.</strong> Follow along with the PDF below:</p>\n<table style=\"border-collapse: collapse; width: 98.7109%;\" border=\"1\">\n<tbody>\n<tr>\n<td style=\"width: 99.8451%;\">\n<p><strong>Before you Begin:</strong></p>\n<p><em>For the physical circuit, we'll use the following two things:</em></p>\n<p style=\"padding-left: 80px;\"><strong>Transistor:&nbsp;&nbsp;</strong>While a number of transistors can be used, we'll use a&nbsp;<strong>2N3904 NPN transistor.</strong>&nbsp;</p>\n<p style=\"padding-left: 80px;\"><strong>Power Supply:</strong>&nbsp; We do need external power, but it doesn't need to come from a 9V battery. Instead, we'll use a&nbsp;<strong>Breadboard Power Module</strong> connected to a second USB cable to the computer.</p>\n</td>\n</tr>\n</tbody>\n</table>\n<p><a class=\"instructure_file_link instructure_scribd_file\" title=\"Transistors and DC Motor Control.pdf\" href=\"media/web_resources/Transistors-and-DC-Motor-Control-1.pdf\" data-api-endpoint=\"https://canvas.instructure.com/api/v1/courses/4227213/files/168010832\" data-api-returntype=\"File\">Transistors and DC Motor Control.pdf</a></p>\n<p><em>Below is an animation showing example behavior of the completed exercise. Note the motor graphic has been enlarged for clarity and covers much of the circuit.</em></p>\n<p><img src=\"media/web_resources/Transistors-Result-Animation-1.gif\" alt=\"\" width=\"542\" height=\"251\" data-decorative=\"true\" data-api-endpoint=\"https://canvas.instructure.com/api/v1/courses/4227213/files/168010831\" data-api-returntype=\"File\" loading=\"lazy\"></p>\n<p>&nbsp;</p>\n<p><span style=\"font-size: 18pt;\"><strong>Submission:<br></strong><span style=\"font-size: 12pt;\">Please submit both <strong>your code</strong> as well as a&nbsp;<strong>video of your physical circuit in operation!</strong></span><strong> <br></strong></span></p>\n<p>&nbsp;</p>\n\n"},{"id":"gc395d59d2f44d8648ea0356882181f9c","kind":"assignment","title":"04 Combination Safe","nav_title":"04 Combination Safe","position":4,"published":true,"content_html":"<div class=\"item-meta\"><span class=\"meta-points\"><strong>Points:</strong> 10.0</span> &middot; <span class=\"meta-submission\"><strong>Submission type:</strong> online text entry,online upload</span></div><p>This assignment will challenge you to incorporate&nbsp;<strong>buttons, LEDs, Servo Motors</strong>, and some&nbsp;<strong>coding skill</strong> to develop an electronic system for a Combination Safe or \"lockbox\".&nbsp;</p>\n<p>The following PDF outlines the steps to follow. Begin by developing the work in TinkerCAD, and when complete transition it into a physical circuit.</p>\n<p><a class=\"instructure_file_link instructure_scribd_file\" title=\"Motion - 04 - Combination Safe.pdf\" href=\"media/web_resources/Motion-04-Combination-Safe.pdf\" data-api-endpoint=\"https://canvas.instructure.com/api/v1/courses/2494334/files/121929202\" data-api-returntype=\"File\">Motion - 04 - Combination Safe.pdf</a><em><br><br>** As&nbsp; a reminder, to earn a&nbsp;<strong>complete</strong> on this project, you must finish at least the \"base features\" as outline in the PDF. While I would encourage you to try the extension challenges, you will not be penalized if you aren't able to solve them.</em></p>\n<p>&nbsp;</p>\n<p><strong>Base Features Help Video</strong></p>\n<p style=\"padding-left: 40px;\">While the PDF lays out almost all of the steps to complete the basic circuit and code, there are a few listed&nbsp;<strong>on-your-own</strong> challenges to finish the base features. <span style=\"text-decoration: underline;\">You should attempt these on your own</span> as a way to test your coding and problem-solving abilities. If, however, after working on them for a&nbsp; while you find you can't quite get it to work correctly, you can check out the following video, which also will lead you through the final steps. <em>This video doesn't include the <strong>extension challenges;</strong> those will be left to complete entirely on your own!</em></p>\n<p><iframe src=\"https://www.youtube.com/embed/QRtjmdnYoS4\" width=\"560\" height=\"315\" allowfullscreen=\"allowfullscreen\" allow=\"accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture\" loading=\"lazy\"></iframe></p>\n<p style=\"padding-left: 40px;\">&nbsp;</p>\n<p><span style=\"font-size: 18pt;\"><strong>How to Submit:</strong></span></p>\n<p><em>Since we aren't making a physical circuit, instead you need to share your&nbsp;<strong>simulated circuit and code</strong> with me. See below for how to do this:</em></p>\n<p>1. Name the project.</p>\n<p style=\"padding-left: 40px;\">As the teacher of the TinkerCAD&nbsp;<strong>class,&nbsp;</strong>I can view the work on your profile. To ensure that I know which assignment to mark, rename this project:<br><strong>01 - Combination Safe - READY TO GRADE</strong></p>\n<p>2. Submit a copy of your code.</p>\n<p style=\"padding-left: 40px;\">Download a copy of your code from TinkerCAD</p>\n<ul>\n<li style=\"list-style-type: none;\">\n<ul>\n<li style=\"list-style-type: none;\">\n<ul>\n<li>either look at&nbsp;<strong>blocks and text</strong> mode to copy the text code</li>\n<li>or use the&nbsp;<strong>\"download code\"&nbsp;</strong>button</li>\n</ul>\n</li>\n</ul>\n</li>\n</ul>\n<p style=\"padding-left: 40px;\">Hand this file in here. I'll use this to cross-reference when grading to ensure I'm looking at the correct project on your account.</p>\n\n"},{"id":"gb9ba1c5c1073479dca53213d1bfb8313","kind":"file","title":"08 - Student Activity 1B - Adding a Potentiometer_.pdf","nav_title":"LED Challenge 2 - Adding a Potentiometer","position":5,"published":true,"media_path":"media/web_resources/08-Student-Activity-1B-Adding-a-Potentiometer_.pdf"},{"id":"g51ce6ed5c03db9e4d8b5875b5240e66d","kind":"assignment","title":"Traffics Light Assignment","nav_title":"Traffics Light Assignment","position":6,"published":true,"content_html":"<div class=\"item-meta\"><span class=\"meta-points\"><strong>Points:</strong> 5.0</span> &middot; <span class=\"meta-submission\"><strong>Submission type:</strong> online upload</span></div><p><img src=\"media/web_resources/Traffic-Lights.PNG\" alt=\"\" data-decorative=\"true\" data-api-endpoint=\"https://canvas.instructure.com/api/v1/courses/3350348/files/149484204\" data-api-returntype=\"File\" loading=\"lazy\"></p>\n<p><br>Let's combine some of the different components we've been working with in a more complex way. Follow along with the following instructions to create a set of <strong>traffic lights:</strong></p>\n<p><a id=\"149484196\" class=\"instructure_file_link instructure_scribd_file inline_disabled\" href=\"media/web_resources/Traffic-Lights-Assignment.pdf\" target=\"_blank\" data-canvas-previewable=\"true\" data-api-endpoint=\"https://canvas.instructure.com/api/v1/courses/3350348/files/149484196\" data-api-returntype=\"File\">Traffic Lights Assignment.pdf</a></p>\n<p><strong>Grading:</strong></p>\n<p>4.5 marks:</p>\n<p style=\"padding-left: 40px;\">For 4.5/5, complete the basic circuit and code as outlined in the pdf. (not including the <em>extension challenge</em>)</p>\n<p>0.5 Marks:</p>\n<p style=\"padding-left: 40px;\">For the last 0.5/5, also complete the extension challenge as outlined in the pdf.</p>\n<p>&nbsp;</p>\n<p><strong>Submitting your work:</strong></p>\n<p>For this project, you'll need to submit two things:</p>\n<ol>\n<li>The code you've used to drive the microcontroller (submit the .ino arduino file)<br><br>\n</li>\n<li>A short video (you can use a cell-phone for the purposes of recording this short clip, or sign out a school camera), when you show the operation of your circuit.\n<ul>\n<li>Uploading the video to canvas may take a bit of time -- be patient!</li>\n<li>In the video, show the circuit and explain how you are using it.</li>\n</ul>\n</li>\n</ol>\n\n"},{"id":"ge071559d8e719766dd6beea013f2c35d","kind":"assignment","title":"LED Challenge 01 - Using a Photoresistor","nav_title":"LED Challenge 01 - Using a Photoresistor","position":7,"published":true,"content_html":"<div class=\"item-meta\"><span class=\"meta-points\"><strong>Points:</strong> 10.0</span> &middot; <span class=\"meta-submission\"><strong>Submission type:</strong> online upload</span></div><p><strong>Project Instructions:</strong></p>\n<p>Follow along with these instructions to make a photoresistor-controlled LED circuit:</p>\n<p><a class=\"instructure_file_link instructure_scribd_file inline_disabled\" title=\"Light - Using a Photoresistor to control LED (4).pdf\" href=\"media/web_resources/Uploaded-Media/Light-Using-a-Photoresistor-to-control-LED-4-.pdf\" target=\"_blank\" data-canvas-previewable=\"false\" data-api-endpoint=\"https://canvas.instructure.com/api/v1/courses/4227213/files/168010899\" data-api-returntype=\"File\">Light - Using a Photoresistor to control LED.pdf</a></p>\n<p>&nbsp;</p>\n<p><strong>Grading:</strong></p>\n<p><span style=\"color: #e03e2d;\"><strong>NOTE: This term we mostly did this as a class, so credit will be just marked as a 'pass' at a lower weighting.</strong></span></p>\n<p>8.5 marks:</p>\n<p>For 8.5/10, complete the basic circuit and code as outlined in the pdf. (not including the&nbsp;<em>extension challenge</em>)</p>\n<p>1.5 Marks:</p>\n<p>For 1.5/10, also complete the extension challenge as outlined in the pdf.</p>\n<p>&nbsp;</p>\n<p><strong>Submitting your work:</strong></p>\n<p>For this project, you'll need to submit two things:</p>\n<ol>\n<li>The code you've used to drive the microcontroller (submit the .ino arduino file)<br><br>\n</li>\n<li>A short video (you can use a cell-phone for the purposes of recording this short clip, or sign out a school camera), when you show the operation of your circuit.\n<ul>\n<li>Uploading the video to canvas may take a bit of time -- be patient!</li>\n<li>In the video, show the circuit and explain how you are using it.</li>\n</ul>\n</li>\n</ol>\n\n"},{"id":"g2be3fcc1bf202b3fd84028470bb23c38","kind":"file","title":"LED Challenge 3 - Using a Button to Control Lights.pdf","nav_title":"LED Challenge 3 - Using a Button to Control Lights.pdf","position":8,"published":true,"media_path":"media/web_resources/LED-Challenge-3-Using-a-Button-to-Control-Lights.pdf"},{"id":"g37f69c5e2d81b3034f152cc9d2ed0719","kind":"file","title":"LED Challenge 4 - Detecting Light with a Photoresistor.pdf","nav_title":"LED Challenge 4 - Detecting Light with a Photoresistor.pdf","position":9,"published":true,"media_path":"media/web_resources/LED-Challenge-4-Detecting-Light-with-a-Photoresistor.pdf"},{"id":"ga6a6d8e127b0440fec7bb451d33ca294","kind":"file","title":"LED Challenge 2 - Using a Potentiometer.pdf","nav_title":"LED Challenge 2 - Using a Potentiometer.pdf","position":10,"published":true,"media_path":"media/web_resources/LED-Challenge-2-Using-a-Potentiometer.pdf"},{"id":"gbcca125e6177d15ad998b0ea52bd6cd2","kind":"file","title":"LED Challenge 5 - Fading an LED.pdf","nav_title":"LED Challenge 5 - Fading an LED.pdf","position":11,"published":true,"media_path":"media/web_resources/LED-Challenge-5-Fading-an-LED.pdf"},{"id":"g27d017594645472e98acd1381868b8e9","kind":"file","title":"LED Challenge 6 - Custom Colors with RGB LEDs.pdf","nav_title":"LED Challenge 6 - Custom Colors with RGB LEDs.pdf","position":12,"published":true,"media_path":"media/web_resources/LED-Challenge-6-Custom-Colors-with-RGB-LEDs.pdf"},{"id":"g46fe09a7a112e378c1534c751e16f518","kind":"page","title":"Extension: Try out some additional components","nav_title":"Extension: Try out some additional components","position":13,"published":true,"content_html":"<p>If you are finished the assignment early, I'd like you to experiment with some different components from your kit that we won't examine as a class.</p>\n<p><em>Some specialty sensors aren't in the base kits, but in a class sensor kit. If you can't find one of the items listed below in your kit, come see me to borrow from the sensor kit.</em></p>\n<p><strong>Capacitive Touch Sensor</strong></p>\n<p><a href=\"http://henrysbench.capnfatz.com/henrys-bench/arduino-sensors-and-input/catalex-ttp223b-arduino-capacitive-touch-sensor-tutorial/\">http://henrysbench.capnfatz.com/henrys-bench/arduino-sensors-and-input/catalex-ttp223b-arduino-capacitive-touch-sensor-tutorial/</a><br><br></p>\n<p><strong>Avoidance Sensor</strong></p>\n<p><a href=\"https://www.sunfounder.com/learn/lesson-23-obstacle-avoidance-sensor-sensor-kit-v1-for-arduino.html\">https://www.sunfounder.com/learn/lesson-23-obstacle-avoidance-sensor-sensor-kit-v1-for-arduino.html</a><br><br></p>\n<p><strong>Digital Temperature Sensor</strong></p>\n<p><a href=\"https://arduinomodules.info/ky-028-digital-temperature-sensor-module/\">https://arduinomodules.info/ky-028-digital-temperature-sensor-module/</a></p>\n<p>&nbsp;</p>\n<p><strong>Other Sensors or Components</strong></p>\n<p>These kits have a whole variety of components that can be used with an Arduino. You can also choose one (or more) that are not listed above. Try see how to use it with an Arduino, just do an internet search in the form of \"<em>name of component&nbsp;<strong>arduino</strong>\"&nbsp;</em>and you should be able to find several tutorial pages that include circuit diagrams, explanations, and sample code.</p>\n<p>&nbsp;</p>\n<p><strong>TASK &gt;&gt;&gt;</strong> Our only output component so far has been LEDs (Which granted, are very important and common output components). Create a mini-project where your new sensor(s) are controlling&nbsp;<strong>one or more LEDs.</strong></p>\n<p>&nbsp;</p>\n<p><br><strong><span style=\"background-color: #ff0000;\">Joystick Module</span> &nbsp; //we will try this one out as a class, so try something different&nbsp;<br></strong><a href=\"https://exploreembedded.com/wiki/Analog_JoyStick_with_Arduino\">https://exploreembedded.com/wiki/Analog_JoyStick_with_Arduino</a><strong><br></strong><a href=\"https://create.arduino.cc/projecthub/MisterBotBreak/how-to-use-a-joystick-with-serial-monitor-1f04f0\">https://create.arduino.cc/projecthub/MisterBotBreak/how-to-use-a-joystick-with-serial-monitor-1f04f0<br></a></p>\n<p>&nbsp;</p>\n\n"},{"id":"ge5bd1b4ce36744ef6071e61c6521c505","kind":"page","title":"LED Challenge 7 - RGB LED and Arduino Coding","nav_title":"LED Challenge 7 - RGB LED and Arduino Coding","position":14,"published":true,"content_html":"<p><img src=\"media/web_resources/RGB-LED-Pins-1.jpg\" alt=\"\" data-decorative=\"true\" data-api-endpoint=\"https://canvas.instructure.com/api/v1/courses/2494334/files/121929274\" data-api-returntype=\"File\" loading=\"lazy\"></p>\n<p><img src=\"media/web_resources/RGB-LED-Wiring.PNG\" alt=\"\" data-decorative=\"true\" loading=\"lazy\"></p>\n<p>&nbsp;</p>\n<p>&nbsp;</p>\n\n"},{"id":"gd5a4ff7045b9bebd2124111b3bf3bd60","kind":"file","title":"06 - Sask Code Challenge - BLinky.pdf","nav_title":"LED Challenge 1 - Blinky","position":15,"published":true,"media_path":"media/web_resources/06-Sask-Code-Challenge-BLinky.pdf"},{"id":"g80aca5a319799347aa0f81b22e8b009c","kind":"file","title":"Display 1 - How to Set up a 7-Segment Display.pdf","nav_title":"Display 1 - How to Set up a 7-Segment Display.pdf","position":16,"published":true,"media_path":"media/web_resources/Display-1-How-to-Set-up-a-7-Segment-Display.pdf"},{"id":"g18b84a0909cbb0ba5f05ea1e9ab08edc","kind":"file","title":"09 - Student Activity 1C - Using a Button to Control Lights_.pdf","nav_title":"LED Challenge 3 - Using a Button to Control Lights","position":17,"published":true,"media_path":"media/web_resources/09-Student-Activity-1C-Using-a-Button-to-Control-Li
