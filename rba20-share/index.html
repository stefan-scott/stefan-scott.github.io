ghts_.pdf"},{"id":"g382154f6e1fd07d5769ddcc7fbd3582b","kind":"page","title":"LED Challenge 4 - Photoresistors","nav_title":"LED Challenge 4 - Photoresistors","position":18,"published":true,"content_html":"<p>Begin by following along with the class exercise outlined in the PDF below:</p>\n<p><a class=\"instructure_file_link instructure_scribd_file\" title=\"11 - Student Activity 1E - Using a Photoresistor_.pdf\" href=\"media/web_resources/11-Student-Activity-1E-Using-a-Photoresistor_.pdf\">11 - Student Activity 1E - Using a Photoresistor_.pdf</a></p>\n<p>&nbsp;</p>\n<p><strong>Additional Extension Activity:</strong></p>\n<p>If you finish the extension activities with some time to spare, use the remaining time in the class for this activity:</p>\n<p><em>Create a circuit that includes 3-5 individually controlled LEDs as well as a circuit that uses a photoresistor to detect the amount of ambient light. Add some logic (IF, ELSE-IF, ELSE) to turn on/off a different number of LEDs depending on how dark it is:</em></p>\n<p style=\"padding-left: 40px;\"><em>ie. If it is very dark, turn on ALL LEDs<br>&nbsp; &nbsp; &nbsp;If it is a bit lighter, turn on all except one<br>&nbsp; &nbsp; &nbsp;... and so on, until it is bright enough to leave them all off.&nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp;<span style=\"color: #339966;\">//this simulates a simple automated night light</span></em></p>\n<p><em><span style=\"color: #339966;\"><img src=\"media/web_resources/Photoreisistor.gif\" alt=\"\" data-decorative=\"true\" loading=\"lazy\"></span></em></p>\n\n"},{"id":"g3e23ba891909737d39dbce989c01062b","kind":"file","title":"12 - Student Activity 1F_  Blink without delay (Multitasking)_.pdf","nav_title":"LED Challenge 5 - Blink without Delay","position":19,"published":true,"media_path":"media/web_resources/12-Student-Activity-1F_-Blink-without-delay-Multitasking-_.pdf"},{"id":"g8ad720d7b19b3540b1bae7d1a8f411cd","kind":"weblink","title":"Led10 Starter","nav_title":"Led10 Starter","position":20,"published":true,"external_url":"https://www.tinkercad.com/things/8MyAj3niYnJ-led10-starter/"},{"id":"g33feee5c0ddcc72281928b58e45e28f4","kind":"weblink","title":"Starter: LED Chase","nav_title":"Starter: LED Chase","position":21,"published":true,"external_url":"https://www.tinkercad.com/things/4HI4YZwjOon-working-with-loops/"}]},{"id":"g5aa5ba85316b841ea727f551d4785353","slug":"16-setup-and-introductory-circuits","title":"Setup and Introductory Circuits","order":16,"items":[{"id":"g5ff3715a8f11c4c2f395a9e2a1b50a7b","kind":"page","title":"Introductory Videos","nav_title":"Introductory Videos","position":1,"published":true,"content_html":"<p><iframe src=\"https://www.youtube.com/embed/w0c3t0fJhXU\" width=\"560\" height=\"315\" allowfullscreen=\"allowfullscreen\" allow=\"accelerometer; autoplay; encrypted-media; gyroscope; picture-in-picture\" loading=\"lazy\"></iframe></p>\n<p><strong>Basics of Electricity:</strong></p>\n<p><video id=\"media_comment_m-chQCHashjo6em6vSsKBfW84wrRcVTwz\" class=\"instructure_inline_media_comment video_comment\" data-media_comment_type=\"video\" data-alt=\"\" style=\"width: 320px; height: 240px; display: inline-block;\" title=\"\" data-media-type=\"video\" allowfullscreen=\"allowfullscreen\" allow=\"fullscreen\" data-media-id=\"m-chQCHashjo6em6vSsKBfW84wrRcVTwz\" loading=\"lazy\"><source src=\"media/web_resources/Uploaded-Media/How-ELECTRICITY-works-working-principle-TRIMMED.mp4\" data-media-id=\"m-chQCHashjo6em6vSsKBfW84wrRcVTwz\" data-media-type=\"video\"></video></p>\n<p><strong>Ohm's Law:</strong></p>\n<p><strong><video id=\"media_comment_m-32LGSLo31AKVikhWb2T7ubpRmBfugcTo\" class=\"instructure_inline_media_comment video_comment\" style=\"width: 320px; height: 240px; display: inline-block;\" title=\"\" data-media-type=\"video\" allowfullscreen=\"allowfullscreen\" allow=\"fullscreen\" data-media-id=\"m-32LGSLo31AKVikhWb2T7ubpRmBfugcTo\" loading=\"lazy\"><source src=\"media/web_resources/Uploaded-Media/MAKE-presents-Ohm-s-Law.mp4\" data-media-id=\"m-32LGSLo31AKVikhWb2T7ubpRmBfugcTo\" data-media-type=\"video\"></video></strong></p>\n\n"},{"id":"gd2b922e4fdefcee9b4de40e8d39e3903","kind":"file","title":"03 Resistors Colour Codes.pdf","nav_title":"Resistors Colour Codes.pdf","position":2,"published":true,"media_path":"media/web_resources/03-Resistors-Colour-Codes.pdf"},{"id":"g223986076f99ee009b1c0db53b10cb72","kind":"page","title":"Reading Schematics","nav_title":"Reading Schematics","position":3,"published":true,"content_html":"<p>Try reading the following schematic, and translating it into a physical circuit!</p>\n<p><img src=\"media/web_resources/Uploaded-Media/Schematics-Practice-01.png\" alt=\"Schematics Practice 01.png\" loading=\"lazy\"></p>\n\n"}]},{"id":"g07160b6a2f5d06a777847b5c806dac4a","slug":"17-sound","title":"Sound!","order":17,"items":[{"id":"g75a500493e3abb7b17662c42d3178901","kind":"weblink","title":"LED10 Starter (electret microphone demo)","nav_title":"LED10 Starter (electret microphone demo)","position":1,"published":true,"external_url":"https://www.tinkercad.com/things/8MyAj3niYnJ-led10-starter/"},{"id":"g65fccad9e463d5c4a438fd1c091b3d02","kind":"assignment","title":"Sound - 01 - Making Music","nav_title":"Sound - 01 - Making Music","position":2,"published":true,"content_html":"<div class=\"item-meta\"><span class=\"meta-points\"><strong>Points:</strong> 10.0</span> &middot; <span class=\"meta-submission\"><strong>Submission type:</strong> online upload</span> &middot; <span class=\"meta-ext\"><strong>Allowed file types:</strong> ino,zip,mp4,mov</span></div><p>For our first sound project, we'll look at how a&nbsp;<strong>piezo</strong> <strong>buzzer</strong> can create sound at a variety of pitches, and write code to have it play a song. This is a&nbsp;<em>mastery assignment;</em> that is, the entire process is provided in the PDF below. Grading will be broken up as follows:</p>\n<p>Completion of song code with pitch shift potentiometer - 9 Marks<br>5 LED song visualization - 1 Mark</p>\n<p>PDF instructions: <a class=\"instructure_file_link instructure_scribd_file\" title=\"Sound - 01 - Making Music.pdf\" href=\"media/web_resources/Sound-01-Making-Music.pdf\" data-api-endpoint=\"https://canvas.instructure.com/api/v1/courses/3350348/files/149484365\" data-api-returntype=\"File\">Sound - 01 - Making Music.pdf</a></p>\n<p><strong>Hint:</strong></p>\n<p>Determining the correct pitches and timings can be tricky. If you are having difficulty, you can refer to the solution here:</p>\n<p><a title=\"Making Music: Notes + Timings\" href=\"#item:g86bdacc5f9784e89a070e3d776eba26a\" data-api-endpoint=\"https://canvas.instructure.com/api/v1/courses/3350348/pages/making-music-notes-+-timings\" data-api-returntype=\"Page\" data-item-ref=\"g86bdacc5f9784e89a070e3d776eba26a\">Making Music: Notes + Timings</a></p>\n<p><strong>To Submit:</strong></p>\n<p>Once complete, submit:</p>\n<ul>\n<li>a video where you introduce and demonstrate the operation of your circuit.</li>\n<li>submit your code as well.</li>\n</ul>\n\n"},{"id":"g2e2a01ad4bf7491df322708dedabb51f","kind":"file","title":"Sound - 02 - Making a Trumpet.pdf","nav_title":"Sound - 02 - Making a Trumpet.pdf","position":3,"published":true,"media_path":"media/web_resources/Sound-02-Making-a-Trumpet.pdf"},{"id":"g0ef739ade602fb4e289dd7d7216f9dae","kind":"file","title":"Sound - 03 - Trumpet With BLING.pdf","nav_title":"Sound - 03 - Trumpet With BLING.pdf","position":4,"published":true,"media_path":"media/web_resources/Sound-03-Trumpet-With-BLING.pdf"},{"id":"g7bc7b320be2532277d09676d00258f3e","kind":"file","title":"Sound - 03E - Multi-Tones Expert Challenge.pdf","nav_title":"Sound - 03E - Multi-Tones Expert Challenge.pdf","position":5,"published":true,"media_path":"media/web_resources/Sound-03E-Multi-Tones-Expert-Challenge.pdf"},{"id":"g036b829e5413d4da7935ed8b7d1c2711","kind":"assignment","title":"Arduino Trumpet? Assignment","nav_title":"Arduino Trumpet? Assignment","position":7,"published":true,"content_html":"<div class=\"item-meta\"><span class=\"meta-points\"><strong>Points:</strong> 2.0</span> &middot; <span class=\"meta-submission\"><strong>Submission type:</strong> online upload</span> &middot; <span class=\"meta-ext\"><strong>Allowed file types:</strong> mov,mp4</span></div><p>Hand in a video of your trumpet (with buttons and LEDs) here.</p>\n\n"},{"id":"gb01d8a99bbdae3e56428870e6a467014","kind":"assignment","title":"Beat Box Assignment","nav_title":"Beat Box Assignment","position":8,"published":true,"content_html":"<div class=\"item-meta\"><span class=\"meta-points\"><strong>Points:</strong> 10.0</span> &middot; <span class=\"meta-submission\"><strong>Submission type:</strong> online upload</span></div><p><img src=\"media/web_resources/beatbox-illustration.PNG\" alt=\"\" data-decorative=\"true\" data-api-endpoint=\"https://canvas.instructure.com/api/v1/courses/1676030/files/82038794\" data-api-returntype=\"File\" loading=\"lazy\"></p>\n<p>With an broadened array of components, including the <em>piezo speaker</em>, create (and perform with) your own&nbsp;<strong>beat box machine.&nbsp;</strong>Use the following set of instructions:</p>\n<p><a class=\"instructure_file_link instructure_scribd_file\" title=\"Sound - 04 - Arduino Beat Box.pdf\" href=\"media/web_resources/Sound-04-Arduino-Beat-Box.pdf\">Sound - 04 - Arduino Beat Box.pdf</a></p>\n<p><strong>Grading:</strong></p>\n<p><span style=\"text-decoration: underline;\">7.5 marks:</span></p>\n<p style=\"padding-left: 40px;\">For 7.5/10, complete the basic circuit and code as outlined in the pdf. (not including the <em>extension challenge</em>)</p>\n<p><span style=\"text-decoration: underline;\">1.5 Marks:</span></p>\n<p style=\"padding-left: 40px;\">For 1.5/10, also complete the extension challenge as outlined in the pdf.</p>\n<ul>\n<li style=\"list-style-type: none;\">\n<ul>\n<li>Notices the extra annotations on the schematic, as the original drawing had a few errors.</li>\n</ul>\n</li>\n</ul>\n<p><span style=\"text-decoration: underline;\">1 Mark:</span></p>\n<p style=\"padding-left: 40px;\">For 1/10, Add a pitch-shifting button. When depressed, all the normal pitches generated for the piezo speaker should be 400 Hz higher.</p>\n<ul>\n<li style=\"list-style-type: none;\">\n<ul>\n<li>For instance, if some of the possible frequencies to play were 80Hz,&nbsp; 200Hz, and 300Hz, if the button were depressed the program would instead use the values 480Hz, 600Hz, and 700Hz.<br><br>\n</li>\n<li>If you've got two speakers/photoresistors in the circuit, you can choose whether the button impacts both circuits, or just one.</li>\n<li>When the button is no longer pressed, pitches should return to their original values.</li>\n</ul>\n</li>\n</ul>\n<p><strong>Submitting your work:</strong></p>\n<p>For this project, you'll need to submit two things:</p>\n<ol>\n<li>The code you've used to drive the microcontroller (submit the .ino arduino file)<br><br>\n</li>\n<li>A short video (you can use a cell-phone for the purposes of recording this short clip, or sign out a school camera), when you show the operation of your circuit. <strong>This should include a short beat-box performance!</strong>\n<ul>\n<li>Uploading the video to canvas may take a bit of time -- be patient!</li>\n<li>In the video, show the circuit and explain how you are using it.</li>\n</ul>\n</li>\n</ol>\n\n"}]},{"id":"gbe892ccbf9714a6be539a82b9950e27e","slug":"18-learning-at-home","title":"Learning At Home","order":18,"items":[{"id":"gbcdf4f0ae11ba7c7208383b3a220f795","kind":"page","title":"What you need to do | Schedule","nav_title":"What you need to do | Schedule","position":1,"published":true,"content_html":"<p>For the 17 days of <strong>at-home learning</strong>, you'll have a number of self-directed robotics modules to work through. All these activities are designed to be completed independently, and will only requite a&nbsp;<strong>web browser</strong> as a technology tool. Each module will have one or more thing to submit.</p>\n<p>&nbsp;</p>\n<p><strong>Grading:</strong></p>\n<p>All projects will be graded using a simple <strong>complete/incomplete </strong>grading scheme</p>\n<ul>\n<li>\n<strong>Incomplete</strong>&nbsp;- a significant portion of the assignment is not completed successfully</li>\n<li>\n<strong>Complete</strong>- base features (and optionally extension features) are completed successfully</li>\n</ul>\n<p>&nbsp;</p>\n<p><strong>Schedule:</strong></p>\n<p>For each group below, you'll be given a set number of days to complete it, This amount refers to&nbsp;<em>at home days</em>. (do not count the days you are at school):</p>\n<p>&nbsp;</p>\n<ol>\n<li>\n<strong>TinkerCAD Circuits Mini-Lessons </strong>(1 day)\n<ul>\n<li>Day 1 (A-K) → due end of Jan 5<sup>th</sup>\n</li>\n<li>Day 2 (J-Z) → due end of Jan 6<sup>th<br><br></sup>\n</li>\n</ul>\n</li>\n<li>\n<strong>Ultrasonic, Temperature, RGB LEDs </strong>(1 day)\n<ul>\n<li>Day 1 (A-K) → due end of Jan 7<sup>th</sup>\n</li>\n<li>Day 2 (J-Z) → due end of Jan 8<sup>th<br><br></sup><strong></strong>\n</li>\n</ul>\n</li>\n<li>\n<strong>Sound Basics - Making Music</strong> (2 day)\n<ul>\n<li>Day 1 (A-K) → due end of Jan 13<sup>th</sup>\n</li>\n<li>Day 2 (J-Z) → due end of Jan 14<sup>th<br>Making Music is organized in 2 parts → you may want to use the first day for part 1 and the second day for part 2</sup>\n</li>\n</ul>\n</li>\n<li>\n<strong>Combination Safe (</strong>2 days)\n<ul>\n<li>Day 1 (A-K) → due end of Jan 19<sup>th</sup>\n</li>\n<li>Day 2 (J-Z) → due end of Jan 20<sup>th<br></sup>&nbsp;</li>\n</ul>\n</li>\n<li>\n<strong>Catch-up Time </strong>(1 day)\n<ul>\n<li>Day 1 (A-K) → Jan 21<sup>st&nbsp; </sup><em>use to catch up on previous at-home activities, or move to item 6 if no catch-up needed.</em>\n</li>\n<li>Day 2 (J-Z) →&nbsp; Jan 22<sup>nd&nbsp; </sup><em>use to catch up on previous at-home activities, or move to item 6 if no catch-up needed.<br><br></em><strong></strong>\n</li>\n</ul>\n</li>\n<li>\n<strong>Garage Door Opener</strong> (2 days)\n<ul>\n<li>Day 1 (A-K) → due end of Jan 27<sup style=\"font-family: inherit;\">th</sup>\n</li>\n<li>Day 2 (J-Z) → due end of Jan 28<sup style=\"font-family: inherit;\">th</sup><sup><br><br></sup>\n</li>\n</ul>\n</li>\n<li>\n<strong>Capacitors | Transistors | H-Bridge </strong>(2 days)\n<ul>\n<li>Day 1 (A-K) → due end of Feb 2<sup style=\"font-family: inherit;\">nd</sup>\n</li>\n<li>Day 2 (J-Z) → due end of Feb 3<sup style=\"font-family: inherit;\">rd</sup><sup><br><br></sup>\n</li>\n</ul>\n</li>\n<li>\n<strong>Catch-up Time </strong>(1 day)\n<ul>\n<li>Day 1 (A-K) → Feb 4<sup>th&nbsp; </sup><em>use to catch up on previous at-home activities, or move to item 9 if no catch-up needed.</em>\n</li>\n<li>Day 2 (J-Z) →&nbsp; Feb 5<sup>th&nbsp; </sup><em>use to catch up on previous at-home activities, or move to item 9 if no catch-up needed.<br><br></em><strong></strong>\n</li>\n</ul>\n</li>\n<li>\n<strong>Addressable RGB LEDs</strong>&nbsp;(2 days)\n<ul>\n<li>Day 1 (A-K) → due end of Feb 10<sup>th</sup>\n</li>\n<li>Day 2 (J-Z) → due end of Feb 11<sup>th</sup><sup><br><br></sup>\n</li>\n</ul>\n</li>\n<li>\n<strong>Robotics and Society</strong> (1 day)\n<ul>\n<li>Day 1 (A-K) → due end of Feb 12<sup>th</sup>\n</li>\n<li>Day 2 (J-Z) → due end of Feb 22<sup>nd<br></sup><sup><br></sup>\n</li>\n</ul>\n</li>\n<li>\n<strong>LED Display (Elevator Control) </strong>(2 days)\n<ul>\n<li>Day 1 (A-K) → due end of Feb 25<sup>th</sup>\n</li>\n<li>Day 2 (J-Z) → due end of Feb 26<sup>th&nbsp;<br><br></sup>\n</li>\n</ul>\n</li>\n<li>\n<strong>Catch-up Time </strong>(1 day)</li>\n</ol>\n<p>&nbsp;</p>\n\n"},{"id":"g155b657f1d485cffe013a02e3869d89a","kind":"assignment","title":"01 TinkerCAD Circuits Mini-Lessons","nav_title":"01 TinkerCAD Circuits Mini-Lessons","position":2,"published":true,"content_html":"<div class=\"item-meta\"><span class=\"meta-points\"><strong>Points:</strong> 10.0</span> &middot; <span class=\"meta-submission\"><strong>Submission type:</strong> online text entry</span></div><p>In our first in-person class, we had a brief chance to build some simple&nbsp;<strong>simulated circuits.</strong> For your first at-home set of activities, you'll have six small circuits to build, following along with the official TinkerCAD circuits video series.</p>\n<p><span style=\"background-color: #ff0000; color: #ffffff;\"><strong>Important:&nbsp;</strong></span> <em>The videos are short, but please play pay attention to the concepts discussed in each - this is much more important than simply being able to replicate the circuit and code. We'll be revisiting these ideas, but this is a first chance to gain exposure to those concepts.</em></p>\n<p>&nbsp;</p>\n<p><strong>To Submit:</strong></p>\n<p>For all six mini-lessons, you only need to create the simulated portion of the project (no physical circuits)! When all six are ready to be graded (incomplete/complete):</p>\n<ul>\n<li>Make sure all are renamed on TinkerCAD according to the following list, and include \"READY TO GRADE\" in their title:\n<ul>\n<li>TinkerCAD Mini - Blink LED - READY TO GRADE</li>\n<li>TinkerCAD Mini - LED Breadboard - READY TO GRADE</li>\n<li>TinkerCAD Mini - Fade LED - READY TO GRADE</li>\n<li>TinkerCAD Mini - RGB LED - READY TO GRADE</li>\n<li>TinkerCAD Mini - Pushbutton Digital - READY TO GRADE</li>\n<li>TinkerCAD Mini - Potentiometer Input - READY TO GRADE<br><br>\n</li>\n</ul>\n</li>\n<li>Use the&nbsp;<strong>submit button</strong> on this page and submit a comment saying \"All six are complete and are ready to grade\"</li>\n</ul>\n<p>&nbsp;</p>\n<p><strong>Mini Lessons:</strong></p>\n<p>Follow along with each of these six mini-lessons. Each are roughly 5 minutes long, and introduce us to several components and ideas that we'll be going further with when we meet together in person.</p>\n<p><a class=\"\" href=\"https://www.youtube.com/watch?v=yyG0koj9nNY&amp;list=PLxW5bBHPfdByrF_TANdThbw6VXuKRx9eL&amp;index=1\" data-preview-alt=\"Blink an LED With Arduino in Tinkercad\">Blink an LED With Arduino in Tinkercad</a></p>\n<p><a class=\"\" href=\"https://www.youtube.com/watch?v=MojSo7OtF9w&amp;list=PLxW5bBHPfdByrF_TANdThbw6VXuKRx9eL&amp;index=2\" data-preview-alt=\"LEDs &amp;amp; Breadboards With Arduino in Tinkercad\">LEDs &amp;amp; Breadboards With Arduino in Tinkercad</a></p>\n<p><a class=\"\" href=\"https://www.youtube.com/watch?v=X8dHbdhnGKY&amp;list=PLxW5bBHPfdByrF_TANdThbw6VXuKRx9eL&amp;index=3\" data-preview-alt=\"Fading LED With Arduino in Tinkercad\">Fading LED With Arduino in Tinkercad</a></p>\n<p><a class=\"\" href=\"https://www.youtube.com/watch?v=YqHkULDmmGU&amp;list=PLxW5bBHPfdByrF_TANdThbw6VXuKRx9eL&amp;index=4\" data-preview-alt=\"RGB LEDs With Arduino in Tinkercad\">RGB LEDs With Arduino in Tinkercad</a></p>\n<p><a class=\"\" href=\"https://www.youtube.com/watch?v=PC15jBx2UxI&amp;list=PLxW5bBHPfdByrF_TANdThbw6VXuKRx9eL&amp;index=5\" data-preview-alt=\"Pushbutton Digital Input With Arduino in Tinkercad\">Pushbutton Digital Input With Arduino in Tinkercad</a></p>\n<p><a class=\"\" href=\"https://www.youtube.com/watch?v=-EDYMQ9lczA&amp;list=PLxW5bBHPfdByrF_TANdThbw6VXuKRx9eL&amp;index=6\" data-preview-alt=\"Potentiometer Analog Input With Arduino in Tinkercad\">Potentiometer Analog Input With Arduino in Tinkercad</a></p>\n<p>&nbsp;</p>\n\n"},{"id":"g0d79f71613dbf519b4d07a084022b84b","kind":"assignment","title":"02 Ultrasonic, Temperature, RGB LEDs","nav_title":"02 Ultrasonic, Temperature, RGB LEDs","position":3,"published":true,"content_html":"<div class=\"item-meta\"><span class=\"meta-points\"><strong>Points:</strong> 10.0</span> &middot; <span class=\"meta-submission\"><strong>Submission type:</strong> online text entry</span></div><p><span style=\"font-family: inherit; font-size: 1rem;\">For your second day of at-home learning, we'll keep things a bit lighter with tutorials to follow along with and create in the simulator. The main learning goals are:</span></p>\n<ul>\n<li>Learn about a new component or two</li>\n<li>Gain some additional practice with coding (block based, or text-based if you choose).</li>\n</ul>\n<p>&nbsp;</p>\n<p><span style=\"font-size: 18pt;\"><strong>Submission and Assessment</strong></span></p>\n<p><span style=\"font-family: inherit; font-size: 1rem;\">For both of the tutorials below:</span></p>\n<ul>\n<li><span style=\"font-family: inherit; font-size: 1rem;\">Create the simulated circuit using TinkerCAD</span></li>\n<li>\n<span style=\"font-family: inherit; font-size: 1rem;\">Name the completed simulated projects as follows:</span>\n<ul>\n<li><span style=\"font-family: inherit; font-size: 1rem;\">Ultrasonic Rangefinder - READY TO MARK</span></li>\n<li><span style=\"font-family: inherit; font-size: 1rem;\">RGB and Temperature Sensor - READY TO MARK</span></li>\n</ul>\n</li>\n</ul>\n<p><em><span style=\"font-family: inherit; font-size: 1rem;\">Assessment for these two will simply be complete/incomplete. I want to encourage you to attempt the on-your-own extensions that are listed with the Ultrasonic tutorial, but there will be no penalty for not completing that portion.<br><br></span></em></p>\n<p><span style=\"font-size: 18pt;\"><strong>Tutorial One - Ultrasonic Rangefinder</strong></span></p>\n<p>This is a super-common component that uses sound waves to <strong>detect objects</strong> and <strong>measure distances</strong>. Following along with the following video in TinkerCAD. Once complete, add the extension listed just underneath the video.</p>\n<p><iframe src=\"https://www.youtube.com/embed/eu9K6AF82T4\" width=\"560\" height=\"315\" allowfullscreen=\"allowfullscreen\" allow=\"accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture\" data-mce-fragment=\"1\" loading=\"lazy\"></iframe><strong></strong></p>\n<p><strong>On-your-own Extension:</strong></p>\n<p>Add four LEDs (or more, if you'd like it to look cooler) to your circuit. The amount of LEDs that are on should depend on the detected distance with the Ultrasonic sensor:</p>\n<ul>\n<li>No Object&nbsp; (dist &gt;= 335cm)&nbsp; → no LEDs on</li>\n<li>( dist &lt; 335 and dist &gt;= 250) → 1 LED on</li>\n<li>( dist &lt; 250 and dist &gt;= 180) → 2 LED on</li>\n<li>( dist &lt; 180 and dist &gt;= 100) → 3 LED on</li>\n<li>( dist &lt; 100 ) → 4 LED on</li>\n</ul>\n<p>&nbsp;</p>\n<p><span style=\"font-size: 18pt;\"><strong>Tutorial Two - RGB LED and Temperature Sensor:</strong></span></p>\n<p>This tutorial will be straightforward - no extensions. A few pieces of information before you start:</p>\n<ul>\n<li>RGB LEDs&nbsp; (red - green - blue) are actually 3 small LED that are fit into a single bulb.\n<ul>\n<li>Of the 4 wires, 3 are for each of the individual LEDs (red, green, blue)</li>\n<li>The last wire is a common wire<em> (sometimes a common GND, sometimes common 5v - there are 2 types)</em>\n</li>\n<li>Setting the individual brightness of all three colors will allow us to <strong>mix the colors</strong> to produce many different outputs.</li>\n</ul>\n</li>\n</ul>\n<p><iframe src=\"https://www.youtube.com/embed/5XZ3D0r6HfM\" width=\"560\" height=\"315\" allowfullscreen=\"allowfullscreen\" allow=\"accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture\" data-mce-fragment=\"1\" loading=\"lazy\"></iframe></p>\n<p>&nbsp;</p>\n\n"},{"id":"g7542ee7cbf1e584dfaef5dbc6d98f1ab","kind":"assignment","title":"03 Making Music","nav_title":"03 Making Music","position":4,"published":true,"content_html":"<div class=\"item-meta\"><span class=\"meta-points\"><strong>Points:</strong> 10.0</span> &middot; <span class=\"meta-submission\"><strong>Submission type:</strong> online upload</span></div><p>For our first sound project, we'll look at how a&nbsp;<strong>piezo</strong> <strong>buzzer</strong> can create sound at a variety of pitches, and write code to have it play a song. This is a&nbsp;<em>mastery assignment;</em> that is, the entire process is provided in the PDF below. <br><br></p>\n<p>This will be graded as pass/fail. Two part video leads through the whole process.</p>\n<ul>\n<li>You are welcome to either:\n<ul>\n<li>try project on your own and use the video for hints&nbsp;</li>\n<li>follow along with the video and create the project that way<br><br>\n</li>\n</ul>\n</li>\n</ul>\n<p>PDF instructions: <a class=\"instructure_file_link instructure_scribd_file\" title=\"Sound - 01 - Making Music.pdf\" href=\"media/web_resources/Sound-01-Making-Music.pdf\" data-api-endpoint=\"https://canvas.instructure.com/api/v1/courses/2494334/files/121929363\" data-api-returntype=\"File\">Sound - 01 - Making Music.pdf</a></p>\n<p><strong>Video Tutorial:</strong></p>\n<p>&nbsp;</p>\n<p><iframe src=\"https://www.youtube.com/embed/-dFTg2V8KhU\" width=\"560\" height=\"315\" allowfullscreen=\"allowfullscreen\" allow=\"accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture\" loading=\"lazy\"></iframe></p>\n<p>&nbsp;</p>\n<p><iframe src=\"https://www.youtube.com/embed/M-daIcR5WXQ\" width=\"560\" height=\"315\" allowfullscreen=\"allowfullscreen\" allow=\"accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture\" loading=\"lazy\"></iframe></p>\n<p>&nbsp;</p>\n<p><strong>To Submit:</strong></p>\n<p>Once complete, submit:</p>\n<ul>\n<li>a screenshot of your circuit<em> (press&nbsp;<strong>share&nbsp;</strong>button in TinkerCAD upper right)</em>\n</li>\n<li>submit your code as well. <em>(either use&nbsp;<strong>download</strong> button in TinkerCAD, or copy-paste code into a text editor)</em>\n</li>\n</ul>\n\n"},{"id":"g30e7002006867189a44a50ee43dfe5bc","kind":"page","title":"07a Mini-lesson: Capacitors Exercise","nav_title":"07a Mini-lesson: Capacitors Exercise","position":6,"published":true,"content_html":"<p>Capacitors are a very common electronics component, but&nbsp;<em>what exactly are they,&nbsp;</em><em>and</em><em> how do they work?&nbsp;</em>In this demo, you'll create a circuit that uses a Capacitor to create a fade effect for an LED.</p>\n<p><strong>Step One - Video:</strong></p>\n<p><em>Begin with the following short video that provides the basic information about Capacitors.</em></p>\n<p><iframe src=\"https://www.youtube.com/embed/L6cgSxpGmDo\" width=\"560\" height=\"315\" allowfullscreen=\"allowfullscreen\" allow=\"accelerometer; autoplay; encrypted-media; gyroscope; picture-in-picture\" loading=\"lazy\"></iframe></p>\n<p>&nbsp;</p>\n<p><strong>Step Two - TinkerCAD Exercise:</strong></p>\n<p><em>Following along with the exercise PDF below to construct an LED circuit that uses a capacitor to create a fading effect when battery power is cut off from the circuit.</em></p>\n<p><a class=\"instructure_file_link instructure_scribd_file\" title=\"Capacitors Exercise.pdf\" href=\"media/web_resources/Capacitors-Exercise.pdf\" data-api-endpoint=\"https://canvas.instructure.com/api/v1/courses/2417501/files/114629155\" data-api-returntype=\"File\">Capacitors Exercise.pdf</a></p>\n<p>&nbsp;</p>\n<p><strong>Complete - Sample Animation:</strong></p>\n<p><em>For reference, at the final step of this circuit, the multimeter readings should be similar to below (example shown has a 200<span>μF capacitor.</span></em></p>\n<p><img src=\"media/web_resources/Capacitor-Exercise-Multimeter.gif\" alt=\"\" width=\"640\" height=\"272\" data-decorative=\"true\" data-api-endpoint=\"https://canvas.instructure.com/api/v1/courses/2417501/files/114629157\" data-api-returntype=\"File\" loading=\"lazy\"></p>\n<p>&nbsp;</p>\n\n"},{"id":"g9647a238fc7b7702bc7bb64fecd72be1","kind":"assignment","title":"07b Transistors and DC Motors","nav_title":"07b Transistors and DC Motors","position":7,"published":true,"content_html":"<div class=\"item-meta\"><span class=\"meta-points\"><strong>Points:</strong> 10.0</span> &middot; <span class=\"meta-submission\"><strong>Submission type:</strong> online upload</span></div><p>Transistors are also very common electronics components, but <em>what exactly are they,&nbsp;</em><em>and</em><em><span>&nbsp;</span>how do they work?&nbsp;</em></p>\n<p><strong>Step One - Transistors Video:</strong></p>\n<p><em>Begin with the following short video that provides the basic information about transistors.</em></p>\n<p><iframe src=\"https://www.youtube.com/embed/IcrBqCFLHIY\" width=\"560\" height=\"315\" allowfullscreen=\"allowfullscreen\" allow=\"accelerometer; autoplay; encrypted-media; gyroscope; picture-in-picture\" loading=\"lazy\"></iframe></p>\n<p>&nbsp;</p>\n<p><strong>Step Two - DC Motors Video:</strong></p>\n<p>In this lesson we'll look at DC motor operation and control. The following video shows the internal construction and workings of a DC motor. For this course it isn't necessary to fully understand all the physics represented, just the general idea.</p>\n<p><iframe src=\"https://www.youtube.com/embed/LAtPHANEfQo\" width=\"560\" height=\"315\" allowfullscreen=\"allowfullscreen\" allow=\"accelerometer; autoplay; encrypted-media; gyroscope; picture-in-picture\" loading=\"lazy\"></iframe></p>\n<p>&nbsp;</p>\n<p><strong>Step Three - TinkerCAD Exercise:</strong></p>\n<p>In this exercise, we'll look at&nbsp;<strong>DC Motors</strong>,&nbsp;<strong>Transistors (NPN),&nbsp;</strong>and&nbsp;<strong>PIR Motion Sensors.</strong> Follow along with the PDF below:</p>\n<p><a class=\"instructure_file_link instructure_scribd_file\" title=\"Transistors and DC Motor Control.pdf\" href=\"media/web_resources/Transistors-and-DC-Motor-Control.pdf\" data-api-endpoint=\"https://canvas.instructure.com/api/v1/courses/3350348/files/149484399\" data-api-returntype=\"File\">Transistors and DC Motor Control.pdf</a></p>\n<p><em>Below is an animation showing example behavior of the completed exercise. Note the motor graphic has been enlarged for clarity and covers much of the circuit.</em></p>\n<p><img src=\"media/web_resources/Transistors-Result-Animation.gif\" alt=\"\" width=\"542\" height=\"251\" data-decorative=\"true\" data-api-endpoint=\"https://canvas.instructure.com/api/v1/courses/3350348/files/149484322\" data-api-returntype=\"File\" loading=\"lazy\"></p>\n<p><em><span style=\"font-size: 12pt;\">Completing the base features (as above) will earn a grade of 8.5/10<br><br></span></em></p>\n<p><span style=\"font-size: 18pt;\"><strong>Expert Challenge:</strong></span></p>\n<p>To go further with using transistors to control motors, the expert challenge is to build a simulator H-Bridge, which allows for motor speed and direction to be controlled through code. Details on how to do this project are available <a title=\"07c - Expert Challenge: H-Bridge\" href=\"#item:g8e1ccef4b385184258a5e7ee7757715d\" data-item-ref=\"g8e1ccef4b385184258a5e7ee7757715d\">here.</a> Once complete, follow the same submission steps as below (and submit on this page).</p>\n<p><span style=\"font-size: 18pt;\"><strong><br>How to Submit:</strong></span></p>\n<p><em>Since we aren't making a physical circuit, instead you need to share your&nbsp;<strong>simulated circuit and code</strong><span>&nbsp;</span>with me. See below for how to do this:</em></p>\n<p>1. Name the project.</p>\n<p>As the teacher of the TinkerCAD&nbsp;<strong>class,&nbsp;</strong>I can view the work on your profile. To ensure that I know which assignment to mark, rename this project:<br><strong>03 - Transistors and Capacitors - READY TO GRADE</strong></p>\n<p>2. Submit a copy of your code.</p>\n<p>Download a copy of your code from TinkerCAD</p>\n<ul>\n<li>either look at&nbsp;<strong>blocks and text</strong><span>&nbsp;</span>mode to copy the text code</li>\n<li>or use the&nbsp;<strong>\"download code\"&nbsp;</strong>button</li>\n<li style=\"list-style-type: none;\">\n</li>\n</ul>\n<p>Hand this file in here. I'll use this to cross-reference when grading to ensure I'm looking at the correct project on your account.</p>\n<p>&nbsp;</p>\n\n"},{"id":"g8e1ccef4b385184258a5e7ee7757715d","kind":"page","title":"07c - Expert Challenge: H-Bridge","nav_title":"07c - Expert Challenge: H-Bridge","position":8,"published":true,"content_html":"<p>Our previous exercise allowed us to use an&nbsp;<strong>NPN&nbsp;</strong><strong>transistor to act as an electrical switch controlling on/off behaviour for a DC motor.</strong> However, in many applications (robots that move on wheels, for instance) we often need greater control than simply off/on. It is necessary to also control the&nbsp;<strong>direction</strong>&nbsp;<strong>of rotation</strong> as well as&nbsp;<strong>speed of rotation.</strong></p>\n<p>We saw earlier that those properties were controlled with 2 different properties:</p>\n<ul>\n<li>Direction of Rotation - <em>Polarity of circuit (direction electons are passing through DC motor)</em>\n</li>\n<li>Speed of Rotation - <em>Voltage level passing through DC motor (high voltage = faster rotation)</em>\n</li>\n</ul>\n<p>What we need is a circuit where we can electronically switch the direction of electrons passing through the motor and also vary the voltage. One such circuit (which is the basis of many motor controllers) is called an&nbsp;<strong>H-Bridge.</strong></p>\n<p>In this exercise, you'll use&nbsp;<strong>4 transistors</strong> to create a simulated H-Bridge, and we'll see how it allows us to control motor direction and speed.&nbsp;<br><br></p>\n<p><span style=\"font-size: 18pt;\"><strong>Step One - Symbols</strong></span></p>\n<p>Below you'll watch a short video showing internal motor construction and a simple H-Bridge circuit design. The circuit will be presented in a schematic view. For references, the following symbols are used:</p>\n<p><img src=\"media/web_resources/H-Bridge-Exercise-Schematic-Labels.png\" alt=\"\" data-decorative=\"true\" data-api-endpoint=\"https://canvas.instructure.com/api/v1/courses/2417501/files/114629152\" data-api-returntype=\"File\" loading=\"lazy\"></p>\n<p><span style=\"text-decoration: underline;\">MOSFET:</span></p>\n<p>A MOSFET is a type of transistor, arguably more commonly used now than the BJT transistor we used in our original Motor Control exercise. This is the type that was being described in the transistors video, and have the&nbsp;<strong>source, gate,&nbsp;</strong>and&nbsp;<strong>drain</strong> pins. More information on this type of transistor can be found <a href=\"https://en.wikipedia.org/wiki/MOSFET\">here.</a></p>\n<p>For our purposes of reading the H-Bridge schematic, these are the pin assignments for that particular schematic symbol:</p>\n<p><img style=\"display: block; margin-left: auto; margin-right: auto;\" src=\"media/web_resources/H-Bridge-Exercise-Mosfet-Pins.png\" alt=\"\" width=\"299\" height=\"245\" data-api-endpoint=\"https://canvas.instructure.com/api/v1/courses/2417501/files/114629153\" data-api-returntype=\"File\" loading=\"lazy\"></p>\n<p><span style=\"background-color: #ff0000; color: #ffffff;\">NOTE:&nbsp;</span> There are <span style=\"text-decoration: underline;\">two types</span> of MOSFETS - <strong>NMOS</strong> and <strong>PMOS</strong>. You'll need <strong>two of each</strong>, and both can be found in the TinkerCAD components. To locate these components, search for \"mos\" in the&nbsp;<em>components palette.</em></p>\n<p><img src=\"media/web_resources/H-Bridge-NMOS-PMOS.PNG\" alt=\"\" width=\"554\" height=\"314\" data-decorative=\"true\" data-api-endpoint=\"https://canvas.instructure.com/api/v1/courses/2417501/files/114629146\" data-api-returntype=\"File\" loading=\"lazy\"></p>\n<p>&nbsp;</p>\n<p><span style=\"font-size: 18pt;\"><strong>Step Two - Video</strong></span></p>\n<p><em>Watch this short video to see the circuit. This particular H-Bridge is controlled with a potentiometer and a switch; we'll implement a modified one that allows us to control it with an Arduino.</em></p>\n<p><iframe src=\"https://www.youtube.com/embed/yk7Z6NxMQmY\" width=\"560\" height=\"315\" allowfullscreen=\"allowfullscreen\" allow=\"accelerometer; autoplay; encrypted-media; gyroscope; picture-in-picture\" loading=\"lazy\"></iframe></p>\n<p>&nbsp;</p>\n<p><span style=\"font-size: 18pt;\"><strong>Step Three - Implement and Test</strong></span></p>\n<p><em>Using the full schematic below, try to create this circuit in a new TinkerCAD project. Sample code to test will be provided below as well. A completed tinkerCAD circuit will be available to see below as well, but challenge yourself to build the circuit on your own first; this is a good opportunity to practice reading schematic diagrams.</em></p>\n<p><span style=\"text-decoration: underline;\">Schematic:</span></p>\n<p style=\"text-align: center;\"><img src=\"media/web_resources/H-Bridge-Exercise-Schematic-Diagram.png\" alt=\"\" data-api-endpoint=\"https://canvas.instructure.com/api/v1/courses/2417501/files/114629174\" data-api-returntype=\"File\" loading=\"lazy\"></p>\n<p style=\"text-align: left;\">NOTE:<em> For the Battery, use a&nbsp;<strong>9v battery</strong>, and make sure to connect the battery GND also back to the Arduino GND.&nbsp;</em></p>\n<p style=\"text-align: center;\">&nbsp;</p>\n<p><span style=\"text-decoration: underline;\">Testing Code:</span></p>\n<p>Direction is controlled by&nbsp;<strong>applying power to only one of the digital pins.&nbsp;</strong>(applying to neither will stop the motor).&nbsp;<br>Speed is controlled by using PWM with the pin applying power. The higher the value, the faster the rotation.</p>\n<p><img style=\"display: block; margin-left: auto; margin-right: auto;\" src=\"media/web_resources/H-Bridge-Exercise-Simple-Code-Test.png\" alt=\"\" width=\"489\" height=\"533\" data-decorative=\"true\" data-api-endpoint=\"https://canvas.instructure.com/api/v1/courses/2417501/files/114629172\" data-api-returntype=\"File\" loading=\"lazy\"></p>\n<p>&nbsp;</p>\n<p><span style=\"font-size: 18pt;\"><strong>Hints - Circuit and Code</strong></span></p>\n<p><em>If, once you've tried to construct the H-Bridge on your own, things aren't quite working. You can look on the following page to see a solution circuit as well as some extended code to show a speed ramp in both directions.</em></p>\n<p><em><a title=\"H-Bridge Hints\" href=\"#item:gc97b4e7fedfa8d258365f8691f17e125\" data-api-endpoint=\"https://canvas.instructure.com/api/v1/courses/2417501/pages/H-Bridge%20Hints\" data-api-returntype=\"Page\" data-item-ref=\"gc97b4e7fedfa8d258365f8691f17e125\">H-Bridge Hints</a></em></p>\n\n"}]},{"id":"g620a4a1b2cc11dd4aec955c2c0fdb806","slug":"19-motion","title":"Motion!","order":19,"items":[{"id":"g1768c236aaa3518e0177b8b1b727ef91","kind":"page","title":"Expert Challenge: H-Bridge","nav_title":"Expert Challenge: H-Bridge","position":1,"published":true,"content_html":"<p>Our previous exercise allowed us to use an&nbsp;<strong>NPN&nbsp;</strong><strong>transistor to act as an electrical switch controlling on/off behaviour for a DC motor.</strong> However, in many applications (robots that move on wheels, for instance) we often need greater control than simply off/on. It is necessary to also control the&nbsp;<strong>direction</strong>&nbsp;<strong>of rotation</strong> as well as&nbsp;<strong>speed of rotation.</strong></p>\n<p>We saw earlier that those properties were controlled with 2 different properties:</p>\n<ul>\n<li>Direction of Rotation - <em>Polarity of circuit (direction electons are passing through DC motor)</em></li>\n<li>Speed of Rotation - <em>Voltage level passing through DC motor (high voltage = faster rotation)</em></li>\n</ul>\n<p>What we need is a circuit where we can electronically switch the direction of electrons passing through the motor and also vary the voltage. One such circuit (which is the basis of many motor controllers) is called an&nbsp;<strong>H-Bridge.</strong></p>\n<p>In this exercise, you'll use&nbsp;<strong>4 transistors</strong> to create a simulated H-Bridge, and we'll see how it allows us to control motor direction and speed.&nbsp;<br><br></p>\n<p><span style=\"font-size: 18pt;\"><strong>Step One - Symbols</strong></span></p>\n<p>Below you'll watch a short video showing internal motor construction and a simple H-Bridge circuit design. The circuit will be presented in a schematic view. For references, the following symbols are used:</p>\n<p><img src=\"media/web_resources/H-Bridge-Exercise-Schematic-Labels-1.png\" alt=\"\" data-decorative=\"true\" data-api-endpoint=\"https://canvas.instructure.com/api/v1/courses/4227213/files/168010725\" data-api-returntype=\"File\" loading=\"lazy\"></p>\n<p><span style=\"text-decoration: underline;\">MOSFET:</span></p>\n<p>A MOSFET is a type of transistor, arguably more commonly used now than the BJT transistor we used in our original Motor Control exercise. This is the type that was being described in the transistors video, and have the&nbsp;<strong>source, gate,&nbsp;</strong>and&nbsp;<strong>drain</strong> pins. More information on this type of transistor can be found <a href=\"https://en.wikipedia.org/wiki/MOSFET\">here.</a></p>\n<p>For our purposes of reading the H-Bridge schematic, these are the pin assignments for that particular schematic symbol:</p>\n<p><img style=\"display: block; margin-left: auto; margin-right: auto;\" src=\"media/web_resources/H-Bridge-Exercise-Mosfet-Pins-1.png\" alt=\"\" width=\"299\" height=\"245\" data-api-endpoint=\"https://canvas.instructure.com/api/v1/courses/4227213/files/168010833\" data-api-returntype=\"File\" loading=\"lazy\"></p>\n<p><span style=\"background-color: #ff0000; color: #ffffff;\">NOTE:&nbsp;</span> There are <span style=\"text-decoration: underline;\">two types</span> of MOSFETS - <strong>NMOS</strong> and <strong>PMOS</strong>. You'll need <strong>two of each</strong>, and both can be found in the TinkerCAD components. To locate these components, search for \"mos\" in the&nbsp;<em>components palette.</em></p>\n<p><img src=\"media/web_resources/H-Bridge-NMOS-PMOS-1.PNG\" alt=\"\" width=\"554\" height=\"314\" data-decorative=\"true\" data-api-endpoint=\"https://canvas.instructure.com/api/v1/courses/4227213/files/168010838\" data-api-returntype=\"File\" loading=\"lazy\"></p>\n<p>&nbsp;</p>\n<p><span style=\"font-size: 18pt;\"><strong>Step Two - Video</strong></span></p>\n<p><em>Watch this short video to see the circuit. This particular H-Bridge is controlled with a potentiometer and a switch; we'll implement a modified one that allows us to control it with an Arduino.</em></p>\n<p><iframe src=\"https://www.youtube.com/embed/yk7Z6NxMQmY\" width=\"560\" height=\"315\" allowfullscreen=\"allowfullscreen\" allow=\"accelerometer; autoplay; encrypted-media; gyroscope; picture-in-picture\" loading=\"lazy\"></iframe></p>\n<p>&nbsp;</p>\n<p><span style=\"font-size: 18pt;\"><strong>Step Three - Implement and Test</strong></span></p>\n<p><em>Using the full schematic below, try to create this circuit in a new TinkerCAD project. Sample code to test will be provided below as well. A completed tinkerCAD circuit will be available to see below as well, but challenge yourself to build the circuit on your own first; this is a good opportunity to practice reading schematic diagrams.</em></p>\n<p><span style=\"text-decoration: underline;\">Schematic:</span></p>\n<p style=\"text-align: center;\"><img src=\"media/web_resources/Uploaded-Media/H-Bridge-Exercise-Schematic-Diagram.png\" alt=\"H Bridge Exercise - Schematic Diagram.png\" loading=\"lazy\"></p>\n<p style=\"text-align: left;\"><strong>NOTE</strong><span>:&nbsp;</span><em>For the Battery, use a 7.2V NiMH pack.</em></p>\n<p style=\"text-align: center;\">&nbsp;</p>\n<p><span style=\"text-decoration: underline;\">Testing Code:</span></p>\n<p>Direction is controlled by&nbsp;<strong>applying power to only one of the digital pins.&nbsp;</strong>(applying to neither will stop the motor).&nbsp;<br>Speed is controlled by using PWM with the pin applying power. The higher the value, the faster the rotation.</p>\n<p><img style=\"display: block; margin-left: auto; margin-right: auto;\" src=\"media/web_resources/H-Bridge-Exercise-Simple-Code-Test-1.png\" alt=\"\" width=\"489\" height=\"533\" data-decorative=\"true\" data-api-endpoint=\"https://canvas.instructure.com/api/v1/courses/4227213/files/168010818\" data-api-returntype=\"File\" loading=\"lazy\"></p>\n<p>&nbsp;</p>\n<p><span style=\"font-size: 18pt;\"><strong>Hints - Circuit and Code</strong></span></p>\n<p><em>If, once you've tried to construct the H-Bridge on your own, things aren't quite working. You can look on the following page to see a solution circuit as well as some extended code to show a speed ramp in both directions.</em></p>\n<p><em><a title=\"H-Bridge Hints\" href=\"#item:gc97b4e7fedfa8d258365f8691f17e125\" data-api-endpoint=\"https://canvas.instructure.com/api/v1/courses/4227213/pages/H-Bridge%20Hints\" data-api-returntype=\"Page\" data-item-ref=\"gc97b4e7fedfa8d258365f8691f17e125\">H-Bridge Hints</a></em></p>\n<p>&nbsp;</p>\n<p><span><strong>Step Four - Physical Circuit</strong></span></p>\n<p><span><strong>&nbsp; &nbsp;&nbsp;</strong></span><span><strong>Afterwards,</strong></span>&nbsp;you'll build a<span>&nbsp;</span><span>physical H-Bridge</span><span>&nbsp;</span>as well. For this, use the following two types of transistors from our class transistor kit:</p>\n<ul>\n<li>\n<ul>\n<li>IRF 9450N or IRF 4905&nbsp; (P-MOS)</li>\n<li>IRF Z44N (N-MOS)</li>\n</ul>\n</li>\n</ul>\n<p>&nbsp; &nbsp; Use one of the supplied DC motors, and power with a 4xAA battery pack.<br><em>&nbsp; &nbsp; &nbsp;Make sure the external power's GND is connected to the Arduino GND!</em></p>\n<p><span>For this component, you'll submit a short video showing the operation of motor speed and direction via your own H-Bridge!</span></p>\n\n"},{"id":"g721ea2bcc6200673486d49badaf5ead2","kind":"assignment","title":"Proximity Alarm Assignment (Older - with NewPing Extension)","nav_title":"Proximity Alarm Assignment (Older - with NewPing Extension)","position":2,"published":true,"content_html":"<div class=\"item-meta\"><span class=\"meta-points\"><strong>Points:</strong> 10.0</span> &middot; <span class=\"meta-submission\"><strong>Submission type:</strong> online upload</span></div><p>With an broadened array of components, including the <em>Ultrasonic Sensor</em> and <em>9g Servo</em>, create (and perform with) your own <strong>Alarm System. </strong>Use the following set of instructions:</p>\n<p><a class=\"instructure_file_link instructure_scribd_file\" title=\"Proximity Alarm Project.pdf\" href=\"media/web_resources/Proximity-Alarm-Project.pdf\">Proximity Alarm Project.pdf</a></p>\n<p><strong>Grading:</strong></p>\n<p><span style=\"text-decoration: underline;\">9 marks:</span></p>\n<p style=\"padding-left: 40px;\">For 9/10, complete the basic circuit and code as outlined in the pdf. (Base Features)</p>\n<p>&nbsp;</p>\n<p><span style=\"text-decoration: underline;\">1 Marks:</span></p>\n<p style=\"padding-left: 40px;\">For 1/10, use the <strong>NewPing</strong> library to handle the distance calculation (rather than the tinkerCAD Ultrasonic blocks).</p>\n<ul>\n<li style=\"list-style-type: none;\">\n<ul>\n<li>You can make reference to <a title=\"Motion 2 - Distance Sensor Demo\" href=\"#item:gf0abad8639a7e4cc975b15f1703d6146\" data-api-endpoint=\"https://canvas.instructure.com/api/v1/courses/2417501/pages/motion-2-distance-sensor-demo\" data-api-returntype=\"Page\" data-item-ref=\"gf0abad8639a7e4cc975b15f1703d6146\">Motion 2 - Distance Sensor Demo</a>, to recall what we learned about using that library. The link to the official website includes some sample code, which is a good start.</li>\n<li>\n<p><span style=\"font-size: 14pt; color: #ffffff; background-color: #800000;\">Important:</span><span style=\"font-size: 14pt; color: #ffffff;\">&nbsp; </span>At present, the NewPing library conflicts with the built-in Tone library which we've been using for the buzzer. In order to use NewPing, you'll need to disable any tone commands in your code. Don't delete them; just at // at the front of each tone line, to turn the instruction into a comment (which won't be run).</p>\n</li>\n</ul>\n</li>\n</ul>\n<p><strong>Submitting your work:</strong></p>\n<p>For this project, you'll need to submit three things:</p>\n<ol>\n<li>A screenshot of your simulated circuit (press&nbsp;<strong>share&nbsp;</strong>button on TinkerCAD)<br><br>\n</li>\n<li>The code you've used to drive the microcontroller (submit the .ino arduino file)<br><br>\n</li>\n<li>A short video (you can use a cell-phone for the purposes of recording this short clip, or sign out a school camera), when you show the operation of your circuit. <br>\n<ul>\n<li>Ensure that your video clearly shows the different actions for each of the 3 distances from the ultrasonic sensor.&nbsp;</li>\n<li>Make sure to introduce yourself in the video <em>\"This is ______, and here is my alarm system project...\"</em>\n</li>\n<li>Uploading the video to canvas may take a bit of time -- be patient!</li>\n<li>In the video, show the circuit and explain how you are using it.</li>\n</ul>\n</li>\n</ol>\n\n"},{"id":"g37f650319eae9c1999b187e86fc2bec8","kind":"file","title":"Motion 01 - Servo Motors.pdf","nav_title":"Motion 1 - Servo Motors.pdf","position":3,"published":true,"media_path":"media/web_resources/Motion-01-Servo-Motors.pdf"},{"id":"gf0abad8639a7e4cc975b15f1703d6146","kind":"page","title":"Motion 2 - Distance Sensor Demo","nav_title":"Motion 2 - Distance Sensor Demo","position":4,"published":true,"content_html":"<p>In Today's class demo, we'll look at one of our first&nbsp;<strong>sensors&nbsp;</strong>– objects that can interpret information about the world around them, and report it back to a microcontroller. We'll be investigating an&nbsp;<strong>Ultrasonic Sensor&nbsp;</strong>(HC-SR04).</p>\n<p>&nbsp;</p>\n<p><span style=\"text-decoration: underline;\">Wiring:</span></p>\n<p><img src=\"media/web_resources/Ultrasonic-Demo-Schematic.jpg\" alt=\"\" data-decorative=\"true\" data-api-endpoint=\"https://canvas.instructure.com/api/v1/courses/2417501/files/114629105\" data-api-returntype=\"File\" loading=\"lazy\"><img src=\"media/web_resources/Ultrasonic-Demo-Wiring-Chart.PNG\" alt=\"\" data-decorative=\"true\" data-api-endpoint=\"https://canvas.instructure.com/api/v1/courses/2417501/files/114629033\" data-api-returntype=\"File\" loading=\"lazy\"></p>\n<p>&nbsp;</p>\n<p><span style=\"text-decoration: underline;\">How does it work</span>&nbsp; &nbsp; (what is a Trig / Echo...?)</p>\n<p><img src=\"media/web_resources/Ultrasonic-Demo-Ilustration-Two.PNG\" alt=\"\" data-decorative=\"true\" data-api-endpoint=\"https://canvas.instructure.com/api/v1/courses/2417501/files/114629101\" data-api-returntype=\"File\" loading=\"lazy\"></p>\n<p><img src=\"media/web_resources/Ultrasonic-Demo-Ilustration-Three.PNG\" alt=\"\" width=\"561\" height=\"381\" data-decorative=\"true\" data-api-endpoint=\"https://canvas.instructure.com/api/v1/courses/2417501/files/114629034\" data-api-returntype=\"File\" loading=\"lazy\"></p>\n<p>&nbsp;</p>\n<p><span style=\"text-decoration: underline;\">Arduino Library Manager</span></p>\n<p>After looking at the code generated by TinkerCAD, there's definitely a bit more involved in using this one component than the other things we've looked at previously. Often times we can improve the <strong>simplicity</strong> of our programs by utilizing a&nbsp;<strong>library</strong> that has been written by someone else and made publicly available.</p>\n<p>To attempt to use the Ultrasonic Sensor directly through Arduino coding, we'll use the <a href=\"https://playground.arduino.cc/Code/NewPing/\">NewPing</a> library. Click the preceding link to open up the library's web page.</p>\n<p>Once we've looked through the explanation of what the library provides and how to use it, we should install the library through Arduino so that we can reference it in our code:</p>\n<p style=\"padding-left: 40px;\"><strong>Tools → Manage Libraries.</strong></p>\n<p style=\"padding-left: 40px;\"><strong>Search for \"NewPing\"</strong></p>\n<p style=\"padding-left: 40px;\"><strong>Choose it and press install</strong></p>\n<p>Following this, any sketches that are going to use the library should have #include &lt;NewPing.h&gt; in it. An automatic way to do this is:&nbsp;<strong> Sketch → Libraries → select the NewPing Library from near the bottom.</strong></p>\n<p>Now, let's try the sample code from the NewPing website to verify our component is working. Following that, we'll construct some more sophisticated uses with our circuit and code.</p>\n\n"},{"id":"gf88e6a434db885a54ef96bbfc38748d2","kind":"weblink","title":"Extension: Accelerometer Tutorial","nav_title":"Extension: Accelerometer Tutorial","position":5,"published":true,"external_url":"https://www.youtube.com/watch?v=KMhbV1p3MWk"},{"id":"g6c5f8f2f3fbe6e748382256914f19bc8","kind":"file","title":"Motion 02 - Distance Sensor.pdf","nav_title":"Motion 02 - Distance Sensor.pdf","position":6,"published":true,"media_path":"media/web_resources/Motion-02-Distance-Sensor.pdf"},{"id":"gab0e11af20018af196bb7290366b652a","kind":"file","title":"Motion 03 -  Joystick Servos.pdf","nav_title":"Motion 3 -  Joystick Servos.pdf","position":7,"published":true,"media_path":"media/web_resources/Motion-03-Joystick-Servos.pdf"},{"id":"g543fd5192b4f980ac3e9288b362cceaa","kind":"file","title":"Motion 04 - Combination Safe.pdf","nav_title":"Motion 4 - Combination Safe.pdf","position":8,"published":true,"media_path":"media/web_resources/Motion-04-Combination-Safe.pdf"},{"id":"ga16bdb5a58ea43aec2ed6fc2f1622186","kind":"file","title":"Motion 05 - Key Pad Lock.pdf","nav_title":"Motion 5 - Key Pad Lock.pdf","position":9,"published":true,"media_path":"media/web_resources/Motion-05-Key-Pad-Lock.pdf"},{"id":"geb482e07ef3d79e8d13c2750394dee91","kind":"file","title":"Motion 06 - Motion Alarm.pdf","nav_title":"Motion 6 - Motion Alarm.pdf","position":10,"published":true,"media_path":"media/web_resources/Motion-06-Motion-Alarm.pdf"}]},{"id":"g9860de425b79acc18ea4e8bf6ab68f0b","slug":"20-display","title":"Display","order":20,"items":[{"id":"gf6b7a7d960ae2c5e6b05bfe9ab2bb67e","kind":"page","title":"Liquid Crystal I2C Usage","nav_title":"Liquid Crystal I2C Usage","position":1,"published":true,"content_html":"<p>There are a number of different libraries that allow us to interface with a 16x2 Liquid Crystal Display through an i2c adapter. The advantage of this approach is that it greatly simplifies the wiring and pin usage in our Arduino.&nbsp;</p>\n<p><em>This guide summarizes the a tutorial on Makerguides.com. You can see the full document <a href=\"https://www.makerguides.com/character-i2c-lcd-arduino-tutorial/\">here.</a></em></p>\n<p>&nbsp;</p>\n<p><span style=\"font-size: 18pt;\"><strong>Installing the Library</strong></span></p>\n<p>This guide will reference <span style=\"text-decoration: underline;\">LiquidCrystal.I2C.h</span>.&nbsp; To install this library, open up the library manager in Arduino ( CTRL-SHIFT-I&nbsp; or Tools → Include Library → Manage Library&nbsp; )&nbsp;</p>\n<p>Once in the library manager, search for liquid crystal i2c, and look for the one authored by Frank de Brabander. Press Install:</p>\n<p><img src=\"media/web_resources/lcd-i2c-library-install.PNG\" alt=\"\" data-decorative=\"true\" data-api-endpoint=\"https://canvas.instructure.com/api/v1/courses/4227213/files/168010766\" data-api-returntype=\"File\" loading=\"lazy\"></p>\n<p>&nbsp;</p>\n<p><span style=\"font-size: 18pt;\"><strong>Wiring Diagram</strong></span></p>\n<p>VCC → 5v<br>GND → GND<br>SDA → A4<br>SCL → A5<br><em>i2c adapter horizontal pins connect to all matching LCD screen horizontal pins</em></p>\n<p><img src=\"media/web_resources/i2c-circuit-no-button-1.png\" alt=\"\" data-api-endpoint=\"https://canvas.instructure.com/api/v1/courses/4227213/files/168010767\" data-api-returntype=\"File\" loading=\"lazy\"></p>\n<p><span style=\"font-size: 18pt;\"><strong>Verify the i2c Address of your Device</strong></span></p>\n<p>i2c allows for a microcontoller to potentially control over a hundred devices with only 2 wires (signal and clock). The way that instructions and requests can be directed to specific devices is that each device has an <strong>address</strong>. We need to determine our LCD screen's address before we can use it!</p>\n<p>While most LCD screens have a default address of '0x27', we can run a simple i2c scanner program that looks for any connected i2c devices and will print out related information to the serial monitor. We'll run this one time to verify the address, and then we can be sure we're using the correct value in our LCD programs.</p>\n<p>Download and run the following program: &nbsp;<a class=\"instructure_file_link instructure_scribd_file inline_disabled\" title=\"lcd_i2c_scanner.txt\" href=\"media/web_resources/Uploaded-Media/lcd_i2c_scanner.txt\" target=\"_blank\" data-canvas-previewable=\"false\" data-api-endpoint=\"https://canvas.instructure.com/api/v1/courses/4227213/files/173660833\" data-api-returntype=\"File\">lcd_i2c_scanner.txt</a>&nbsp;</p>\n<p>Open the serial monitor and check to verify that the LCD screen is detected (must be wired in, of course!) and that the address is 0x27. <em>If the address is something different, you'll need to update the address in the code example below.</em><br><br></p>\n<p><span style=\"font-size: 18pt;\"><strong>Template Program</strong></span></p>\n<p>Thankfully, the&nbsp;<em>boilerplate code</em> to use the LCD i2c library is pretty short!</p>\n<p>Download the template: &nbsp;<a class=\"instructure_file_link instructure_scribd_file inline_disabled\" title=\"lcd_template_code-1.txt\" href=\"media/web_resources/Uploaded-Media/lcd_template_code-1.txt\" target=\"_blank\" data-canvas-previewable=\"false\">lcd_template_code-1.txt</a> &nbsp;&nbsp;<em>You can use this as a starting point for any projects using the LCD i2c component.</em></p>\n<p>&nbsp;</p>\n<p><span style=\"font-size: 18pt;\"><strong>List of Available Methods</strong></span></p>\n<p>The following table summarizes the available methods() for the&nbsp;<strong>LiquidCrystal_I2C</strong> library:</p>\n<p><span style=\"text-decoration: underline; font-size: 14pt;\">Basics:</span></p>\n<table style=\"border-collapse: collapse; width: 100%; height: 290px;\" border=\"1\">\n<tbody>\n<tr style=\"height: 29px;\">\n<td style=\"width: 21.6035%; height: 29px;\"><strong>Method Name&nbsp;</strong></td>\n<td style=\"width: 78.3965%; height: 29px;\"><strong>Description</strong></td>\n</tr>\n<tr style=\"height: 29px;\">\n<td style=\"width: 21.6035%; height: 29px;\">init()</td>\n<td style=\"width: 78.3965%; height: 29px;\">Activates the LCD so it can be used</td>\n</tr>\n<tr style=\"height: 29px;\">\n<td style=\"width: 21.6035%; height: 29px;\">backlight()</td>\n<td style=\"width: 78.3965%; height: 29px;\">Turn on the backlight</td>\n</tr>\n<tr style=\"height: 29px;\">\n<td style=\"width: 21.6035%; height: 29px;\">noBacklight()</td>\n<td style=\"width: 78.3965%; height: 29px;\">Turn off the backlight</td>\n</tr>\n<tr style=\"height: 29px;\">\n<td style=\"width: 21.6035%; height: 29px;\">print()</td>\n<td style=\"width: 78.3965%; height: 29px;\">Display some data at the current cursor position. Text must be surrounded with \"\", numbers need not.</td>\n</tr>\n<tr style=\"height: 29px;\">\n<td style=\"width: 21.6035%; height: 29px;\">clear()</td>\n<td style=\"width: 78.3965%; height: 29px;\">Clears and screen and resets cursor position to upper left</td>\n</tr>\n</tbody>\n</table>\n<p>&nbsp;</p>\n<p><span style=\"text-decoration: underline; font-size: 14pt;\">Cursor Control:</span></p>\n<table style=\"border-collapse: collapse; width: 100%; height: 203px;\" border=\"1\">\n<tbody>\n<tr style=\"height: 29px;\">\n<td style=\"width: 21.6035%; height: 29px;\"><strong>Method Name</strong></td>\n<td style=\"width: 78.3965%; height: 29px;\"><strong>Description</strong></td>\n</tr>\n<tr style=\"height: 29px;\">\n<td style=\"width: 21.6035%; height: 29px;\">home()</td>\n<td style=\"width: 78.3965%; height: 29px;\">Positions cursor in upper left</td>\n</tr>\n<tr style=\"height: 29px;\">\n<td style=\"width: 21.6035%; height: 29px;\">setCursor(x, y)</td>\n<td style=\"width: 78.3965%; height: 29px;\">Sets the cursor position. You must pass in an <strong>x-position</strong> (0-15) and a <strong>y-position</strong> (0-1)</td>\n</tr>\n<tr style=\"height: 29px;\">\n<td style=\"width: 21.6035%; height: 29px;\">cursor()</td>\n<td style=\"width: 78.3965%; height: 29px;\">Displays a cursor as an underscore character at the position of the next character to be printed.</td>\n</tr>\n<tr style=\"height: 29px;\">\n<td style=\"font-family: inherit; font-size: 1rem; width: 21.6035%; height: 29px;\">noCursor()</td>\n<td style=\"width: 78.3965%; height: 29px;\">Hides the LCD Cursor</td>\n</tr>\n<tr style=\"height: 29px;\">\n<td style=\"font-family: inherit; font-size: 1rem; width: 21.6035%; height: 29px;\">blink()</td>\n<td style=\"width: 78.3965%; height: 29px;\">Displays a blinking block-style cursor at the position of the next character to be printed.</td>\n</tr>\n<tr style=\"height: 29px;\">\n<td style=\"font-family: inherit; font-size: 1rem; width: 21.6035%; height: 29px;\">noBlink()</td>\n<td style=\"width: 78.3965%; height: 29px;\">Hides the block-style cursor.</td>\n</tr>\n</tbody>\n</table>\n<p>&nbsp;</p>\n<p><span style=\"text-decoration: underline; font-size: 14pt;\">Screen:</span></p>\n<table style=\"border-collapse: collapse; width: 100%; height: 203px;\" border=\"1\">\n<tbody>\n<tr style=\"height: 29px;\">\n<td style=\"width: 21.6035%; height: 29px;\"><strong>Method Name</strong></td>\n<td style=\"width: 78.3965%; height: 29px;\"><strong>Description</strong></td>\n</tr>\n<tr style=\"height: 29px;\">\n<td style=\"width: 21.6035%; height: 29px;\">display()</td>\n<td style=\"width: 78.3965%; height: 29px;\"><span>Turns on the LCD screen and displays any text or cursors that have been printed to the display.</span></td>\n</tr>\n<tr style=\"height: 29px;\">\n<td style=\"width: 21.6035%; height: 29px;\">noDisplay()</td>\n<td style=\"width: 78.3965%; height: 29px;\"><span>Turns off any text or cursors printed to the LCD. The text/data is not cleared from the LCD memory.</span></td>\n</tr>\n<tr style=\"height: 29px;\">\n<td style=\"font-family: inherit; font-size: 1rem; width: 21.6035%; height: 29px;\">write()</td>\n<td style=\"width: 78.3965%; height: 29px;\"><span>This function can be used to write a character to the LCD. <em>Used in conjunction with createChar()</em></span></td>\n</tr>\n<tr style=\"height: 29px;\">\n<td style=\"font-family: inherit; font-size: 1rem; width: 21.6035%; height: 29px;\">createChar()</td>\n<td style=\"width: 78.3965%; height: 29px;\">Allows custom characters to be created. See the <a href=\"https://www.makerguides.com/character-i2c-lcd-arduino-tutorial/#character\">tutorial</a> for more information.</td>\n</tr>\n<tr style=\"height: 29px;\">\n<td style=\"font-family: inherit; font-size: 1rem; width: 21.6035%; height: 29px;\">leftToRight()</td>\n<td style=\"width: 78.3965%; height: 29px;\">Text flows to the right from the cursor, as if left-justified (default)</td>\n</tr>\n<tr style=\"height: 29px;\">\n<td style=\"font-family: inherit; font-size: 1rem; width: 21.6035%; height: 29px;\">rightToLeft()</td>\n<td style=\"width: 78.3965%; height: 29px;\">Text flows to the left from the cursor, as if right-justified</td>\n</tr>\n</tbody>\n</table>\n<p>&nbsp;</p>\n<p><span style=\"text-decoration: underline; font-size: 14pt;\">Scrolling:</span></p>\n<table style=\"border-collapse: collapse; width: 100%; height: 203px;\" border=\"1\">\n<tbody>\n<tr style=\"height: 29px;\">\n<td style=\"width: 21.6035%; height: 29px;\"><strong>Method Name</strong></td>\n<td style=\"width: 78.3965%; height: 29px;\"><strong>Description</strong></td>\n</tr>\n<tr style=\"height: 29px;\">\n<td style=\"width: 21.6035%; height: 29px;\">scrollDisplayLeft()</td>\n<td style=\"width: 78.3965%; height: 29px;\">Scrolls contents of text and cursor one space to the left</td>\n</tr>\n<tr style=\"height: 29px;\">\n<td style=\"width: 21.6035%; height: 29px;\">scrollDisplayRight()</td>\n<td style=\"width: 78.3965%; height: 29px;\">Scrolls contents of text and cursor one space to the right</td>\n</tr>\n<tr style=\"height: 29px;\">\n<td style=\"font-family: inherit; font-size: 1rem; width: 21.6035%; height: 29px;\">autoscroll()</td>\n<td style=\"width: 78.3965%; height: 29px;\">Turns on autoscrolling. New characters are all written at the same location, and old characters get bumped over by one (direction depends on if direction is left-to-right (default) or right-to-left</td>\n</tr>\n<tr style=\"height: 29px;\">\n<td style=\"font-family: inherit; font-size: 1rem; width: 21.6035%; height: 29px;\">rightToLeft()</td>\n<td style=\"width: 78.3965%; height: 29px;\">Text flows to the left from the cursor, as if right-justified</td>\n</tr>\n</tbody>\n</table>\n\n"},{"id":"g187ced9b44e8b6091ae5603a5e5926fb","kind":"page","title":"10. LCD Demo","nav_title":"10. LCD Demo","position":2,"published":true,"content_html":"<p><em>Follow along with this video for an introduction into the 16x2 LCD Component, how to access it's library, and an overview of some common functions.</em></p>\n<p><iframe src=\"https://www.youtube.com/embed/yxdQ4Mu-Hto\" width=\"560\" height=\"315\" allowfullscreen=\"allowfullscreen\" allow=\"accelerometer; autoplay; encrypted-media; gyroscope; picture-in-picture\" loading=\"lazy\"></iframe></p>\n\n"},{"id":"g4ebc4262fc5cb843f7f810a92f86f2ec","kind":"assignment","title":"10. LCD Elevator Control","nav_title":"10. LCD Elevator Control","position":3,"published":true,"content_html":"<div class=\"item-meta\"><span class=\"meta-points\"><strong>Points:</strong> 10.0</span> &middot; <span class=\"meta-submission\"><strong>Submission type:</strong> online url,online upload</span></div><h2>Elevator Control</h2>\n<p>For this project, we’ll incorporate a 16x2 Liquid Crystal Display (LCD) as a new component into a system that simulates an elevator control system.</p>\n<p><span style=\"color: #ffffff; background-color: #e67e23;\"><strong>NOTE:</strong></span> <span style=\"color: #ba372a;\">The following set of instructions are for use <em>without&nbsp;</em>the i2c adapter. You can work in this way in the simulator. If you want to have a simpler physical circuit, you can use the i2c adapter; just remember that you'll need to import the LiquidCrystal_I2C.h library (make sure it is installed), and your lcd instructions may need to be modified to reflect the change in library– for instance, <strong>lcd.init()</strong> rather than <strong>lcd.begin()&nbsp;&nbsp;</strong><em>Most of the functions have identical names, so there should not be many changes necessary.</em></span></p>\n<p><strong><br>New Component – LCD Screen</strong></p>\n<p><img src=\"media/web_resources/LCD-16x2-Sample-Image.jpg\" alt=\"\" data-api-endpoint=\"https://canvas.instructure.com/api/v1/courses/3350348/files/149484329\" data-api-returntype=\"File\" loading=\"lazy\"></p>\n<p>An LCD component allows for a different way to produce text output for a circuit. We can produce similar output to when the <em>Serial Monitor</em> is used, but this display can be used at all times, not only when the circuit is connected to a computer.</p>\n<p>You’ve likely seen these before; they are fairly common, especially in older inexpensive electronics.<br><br></p>\n<p style=\"background: white; margin: 9.0pt 0in 9.0pt 0in;\"><strong><span style=\"font-size: 18.0pt; font-family: 'Lato',sans-serif; color: #2d3b45;\">Step One: Get the Starter Circuit</span></strong></p>\n<p style=\"background: white; margin: 9.0pt 0in 9.0pt 0in;\"><span style=\"font-family: 'Lato',sans-serif; color: #2d3b45;\">Wiring an LCD to an Arduino takes several connections (although there are i2c adapters that greatly simplify the circuit). To start off, build these connections in TinkerCAD. For simplicity, use the <strong><u>built-in Starter Circuit</u></strong> that is available if you search for <strong><u>LCD</u></strong> in the components palette.</span></p>\n<p style=\"background: white; margin: 9.0pt 0in 9.0pt 0in;\"><span style=\"font-family: 'Lato',sans-serif; color: #2d3b45;\"><img src=\"media/web_resources/02-Starter-Circuit-Search-LCD.PNG\" alt=\"\" data-decorative=\"true\" data-api-endpoint=\"https://canvas.instructure.com/api/v1/courses/3350348/files/149484341\" data-api-returntype=\"File\" loading=\"lazy\">&nbsp; &nbsp; &nbsp;&nbsp;</span><img style=\"font-size: 1rem; color: #2d3b45; font-family: Lato, sans-serif;\" src=\"media/web_resources/01-Component-Search-LCD.PNG\" alt=\"\" width=\"448\" height=\"148\" data-decorative=\"true\" data-api-endpoint=\"https://canvas.instructure.com/api/v1/courses/3350348/files/149484340\" data-api-returntype=\"File\" loading=\"lazy\"></p>\n<p style=\"background: white; margin: 9.0pt 0in 9.0pt 0in;\"><span style=\"font-family: 'Lato',sans-serif; color: #2d3b45;\">The complete starter circuit should look as follows:</span></p>\n<p style=\"background: white; margin: 9.0pt 0in 9.0pt 0in;\"><span style=\"font-family: 'Lato',sans-serif; color: #2d3b45;\"><img src=\"media/web_resources/03-LCD-Full-Starter-Circuit.PNG\" alt=\"\" data-decorative=\"true\" data-api-endpoint=\"https://canvas.instructure.com/api/v1/courses/3350348/files/149484339\" data-api-returntype=\"File\" loading=\"lazy\"></span></p>\n<p style=\"background: white; margin: 9.0pt 0in 9.0pt 0in;\">&nbsp;</p>\n<p><span style=\"font-size: 18pt;\"><strong>Step Two: Add and Test Floor Buttons</strong></span></p>\n<p>Our elevator will have one button for each floor (like many elevators!). Add to the circuit 3-5 (5 will be needed for one of the extension challenges) buttons that can be checked using <strong>digitalRead().</strong></p>\n<p>You can either follow the schematic below, or use the <em>internal pull-up resistors </em>&nbsp;for a simpler connection with each button.</p>\n<p><em>(If you want to do this but don’t remember how, just do an Internet search “button internal pullup Arduino” and you’ll find an explanation and diagram to support this method).</em></p>\n<table style=\"height: 717px; width: 84.4%; border-collapse: collapse; margin-left: auto; margin-right: auto;\" border=\"0\">\n<tbody>\n<tr style=\"height: 388px;\">\n<td style=\"width: 100%; height: 388px;\"><span style=\"font-family: 'Lato',sans-serif; color: #2d3b45;\"><img src=\"media/web_resources/04-Button-Circuit-3-.PNG\" alt=\"\" width=\"1051\" height=\"658\" data-api-endpoint=\"https://canvas.instructure.com/api/v1/courses/3350348/files/149484330\" data-api-returntype=\"File\" loading=\"lazy\"></span></td>\n</tr>\n<tr style=\"height: 30px;\">\n<td style=\"width: 100%; height: 30px;\">\n<p style=\"text-align: center;\"><em>You may also use digital pins 6 and 10 if you add 5 \"floors\"</em></p>\n</td>\n</tr>\n</tbody>\n</table>\n<p><br>To test reading each of these buttons, let’s create a <strong>testing function</strong> in our code that will print to the Serial Monitor whenever one of the floor buttons is being pressed:</p>\n<p><iframe src=\"https://www.youtube.com/embed/ISXi4GCm-48\" width=\"560\" height=\"315\" allowfullscreen=\"allowfullscreen\" allow=\"accelerometer; autoplay; encrypted-media; gyroscope; picture-in-picture\" loading=\"lazy\"></iframe></p>\n<p>&nbsp;</p>\n<p><span style=\"font-size: 18pt;\"><strong>Step Three: Basic Elevator Movement with LCD</strong></span></p>\n<p>Once we are confident that we can read from each of the button presses, it’s time to build up the code to control our elevator. We should start with creating some <u>global variables</u> to track information that will be needed:</p>\n<p><strong>currentFloor</strong> – a variable to represent the floor the elevator is currently on (int)</p>\n<p><strong>targetFloor</strong> – a variable to store what floor the elevator is travelling to (int)</p>\n<p><strong>moving</strong> – a variable to represent whether the elevator is currently moving towards a target floor <br>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; or not (bool)</p>\n<p><strong>moveCounter</strong> – a variable to help track the time that has elapsed since a button was pressed or <br>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; the last floor was reached. This will help control how long it takes the elevator to <br>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; move by one floor. (int)</p>\n<p>Initially, <strong>currentFloor = 1&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; targetFloor = -1 (no target)&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; moving = false;&nbsp;&nbsp;&nbsp;&nbsp; moveCounter = 0<br><br></strong></p>\n<p><span style=\"background-color: #ffff99;\">The following is some <strong>Psuedocode, </strong>which will provide an outline for what should be happening in our program.</span></p>\n<p><u>Setup (on time at start of program):</u></p>\n<ul>\n<li>Initialize the LCD</li>\n<li>Display current floor on the LCD<br><br>\n</li>\n</ul>\n<p><u>Loop (repeating over and over):</u></p>\n<ul>\n<li>If the elevator is <strong>not moving:<br><br></strong>\n<ul>\n<li>Check each of the buttons to see if one is being pressed</li>\n<li>If one of the buttons is being pressed<br><br>\n<ul>\n<li>Make sure this floor is not the current floor. If it is not:<br><br>\n<ul>\n<li>Update <strong>targetFloor</strong> to be this floor</li>\n<li>Update <strong>moving</strong> to be true</li>\n<li>Update <strong>moveCounter</strong> to the current time (<strong>millis()</strong>)<br><br>\n</li>\n</ul>\n</li>\n<li>If the elevator <strong>is moving:<br><br></strong>\n<ul>\n<li>Check if the current time (<strong>millis()</strong>) – <strong>moveCounter</strong> is greater than 1000 (meaning a second has elapsed). If this is the case:<br><br>\n<ul>\n<li>Check if the target floor is higher or lower. If higher:<br><br>\n<ul>\n<li>Increase <strong>currentFloor</strong> by one<br><br>\n</li>\n</ul>\n</li>\n<li>If Lower:<br><br>\n<ul>\n<li>Decrease <strong>currentFloor</strong> by one<br><br>\n</li>\n</ul>\n</li>\n<li>In Either case:<br><br>\n<ul>\n<li>Rewrite the current Floor (eg. “Floor 2”) on the LCD</li>\n<li>Update <strong>moveCounter</strong> to <strong>millis()</strong>\n</li>\n<li>Check if <strong>currentFloor</strong> and <strong>targetFloor</strong> are now equal. If so:\n<ul>\n<li>Set moving back to be false<br><br>\n</li>\n</ul>\n</li>\n<li>Delay for 50 milliseconds (only needed for simulation to run smoother)</li>\n</ul>\n</li>\n</ul>\n</li>\n</ul>\n</li>\n</ul>\n</li>\n</ul>\n</li>\n</ul>\n<p><em>Following the pseudocode above will allow you to implement the base features of this project. A video will step through the whole coding process, but challenge yourself to try it on your own (with the pseudocode guide) before referring to the solution video.</em></p>\n<p><iframe src=\"https://www.youtube.com/embed/iaNnUsOyGcY\" width=\"560\" height=\"315\" allowfullscreen=\"allowfullscreen\" allow=\"accelerometer; autoplay; encrypted-media; gyroscope; picture-in-picture\" loading=\"lazy\"></iframe></p>\n<p>&nbsp;</p>\n<p><span style=\"font-size: 18pt;\"><strong>Extensions:</strong></span></p>\n<p><strong><br></strong><span style=\"font-size: 14pt;\"><strong>Five Floors:</strong></span></p>\n<p>If you haven’t already, extend your circuit and code to accommodate five floors rather than three. There should be enough digital inputs (6 and 10 should be available) to do this.</p>\n<p><strong>&nbsp;</strong></p>\n<p><span style=\"font-size: 14pt;\"><strong>Floor Display on LCD:</strong></span></p>\n<p>With the base features, the first row of the LCD is used to display what floor the elevator is currently on. For this extension, add the following visualization on the second row to also indicate where the elevator is.</p>\n<p>To do this, create a function called lcdPosition(). This function should be called once in Setup, and any time the currentFloor changes. Using this function, display the elevator position in the following way:</p>\n<table style=\"width: 100%; border-collapse: collapse;\" border=\"0\">\n<caption>\n<p><em>The “X” character marks the position of the elevator. If you have 4 or 5 buttons on your project, modify the text to have the appropriate number of “[ ]” positions.</em></p>\n</caption>\n<tbody>\n<tr>\n<td style=\"width: 33.3333%;\"><img style=\"display: block; margin-left: auto; margin-right: auto;\" src=\"media/web_resources/05a-LCD-Floor-One.PNG\" alt=\"\" data-decorative=\"true\" data-api-endpoint=\"https://canvas.instructure.com/api/v1/courses/3350348/files/149484345\" data-api-returntype=\"File\" loading=\"lazy\"></td>\n<td style=\"width: 33.3333%;\"><img style=\"display: block; margin-left: auto; margin-right: auto;\" src=\"media/web_resources/05a-LCD-Floor-Two.PNG\" alt=\"\" data-decorative=\"true\" data-api-endpoint=\"https://canvas.instructure.com/api/v1/courses/3350348/files/149484305\" data-api-returntype=\"File\" loading=\"lazy\"></td>\n<td style=\"width: 33.3333%;\"><img style=\"display: block; margin-left: auto; margin-right: auto;\" src=\"media/web_resources/05a-LCD-Floor-Three.PNG\" alt=\"\" data-api-endpoint=\"https://canvas.instructure.com/api/v1/courses/3350348/files/149484299\" data-api-returntype=\"File\" loading=\"lazy\"></td>\n</tr>\n</tbody>\n</table>\n<p><span style=\"background-color: #ffcc99;\">You can see an example of this in the GIF below:</span></p>\n<p><img src=\"media/web_resources/Elevator-Control-LCD-with-LCD.gif\" alt=\"Elevator Control LCD with LCD.gif\" width=\"412\" height=\"350\" data-api-endpoint=\"https://canvas.instructure.com/api/v1/courses/3350348/files/149484325\" data-api-returntype=\"File\" loading=\"lazy\"></p>\n<p>&nbsp;</p>\n<p><span style=\"font-size: 14pt;\"><strong>NeoPixel Floor Indicator Lights</strong></span></p>\n<p>Elevators typically have lights that both can indicate <em>where the elevator is</em> as well as <em>where it is planning to stop.</em> For this extension, add 3 – 5 individual NeoPixel RGB LEDs (one light per floor).</p>\n<p><img src=\"media/web_resources/06-Neopixels-to-Add.PNG\" alt=\"\" width=\"644\" height=\"215\" data-decorative=\"true\" data-api-endpoint=\"https://canvas.instructure.com/api/v1/courses/3350348/files/149484343\" data-api-returntype=\"File\" loading=\"lazy\"></p>\n<p><em>You can connect the signal cable to any available digital or analog pin. In this circuit, A0 should be free<br><br></em></p>\n<p>The light that corresponds with the current floor should display <strong>green.</strong></p>\n<p>The light that corresponds with the target floor should display <strong>red.</strong></p>\n<p>All other lights should be <strong>off.<br><br></strong></p>\n<p><span style=\"background-color: #ffcc99;\">You can see an example of this in the GIF below:</span></p>\n<p><img src=\"media/web_resources/Elevator-Example.gif\" alt=\"Elevator Example.gif\" width=\"433\" height=\"484\" data-api-endpoint=\"https://canvas.instructure.com/api/v1/courses/3350348/files/149484323\" data-api-returntype=\"File\" loading=\"lazy\"></p>\n<p>&nbsp;</p>\n<p><span style=\"font-size: 14pt;\"><strong>Make an Actual Mini-Elevator</strong></span></p>\n<p>This extension would need to be done with a physical circuit, and would require some construction/manufacturing techniques to build an elevator structure. Some things to possibly consider:</p>\n<ul>\n<li>Elevator could be supported by a string coming from a spool attached to a DC motor at the top of the elevator structure\n<ul>\n<li>Running the DC motor for a predetermined number of milliseconds could be used to reach a new floor. This is a simpl
