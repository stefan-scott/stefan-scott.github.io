e solution, but not perfect as battery life will affect motor speed (and ultimately distance travelled).</li>\n<li>Using a DC motor with encoders could allow for more precise distances travelled. This involves a little more work, but would provide very accurate distances in moving between floors</li>\n</ul>\n</li>\n<li>Elevator shaft/structure could be designed with 3D printed parts, Popsicle sticks, laser cut wood, or cardboard.</li>\n<li>For an especially advanced solution, servos could be inside the elevator itself so that the door would open and close appropriately\n<ul>\n<li>Long central servo cable(s) (with enough slack) may allow for communication with the servo as the elevator height changes</li>\n<li>If that solution is problematic, a separate arduino could be in the elevator, and a 433 Mhz radio module could allow the elevator main control&nbsp; and elevator comparment to talk to each other (ie \"open doors now\"&nbsp; \"close doors now\"</li>\n</ul>\n</li>\n</ul>\n\n"}]},{"id":"gf53cc1814a233ded3419c728f65d431a","slug":"21-intermediate-coding-in-arduino","title":"Intermediate Coding in Arduino","order":21,"items":[{"id":"g17ab8eb609cb0a17550b511d9341a1fb","kind":"page","title":"Addressable RGB LEDs","nav_title":"Addressable RGB LEDs","position":1,"published":true,"content_html":"<p><span style=\"font-size: 18pt;\"><strong>Introduction</strong></span></p>\n<p>Addressable RGB LEDs are&nbsp;<strong>strips of lighting</strong> where code can control the&nbsp;<strong>color and intensity&nbsp;</strong>of each light<strong> individually</strong> over a single digital pin. This allows for many types of complex animations and effects to be created without the need for many control wires.</p>\n<p>This type of lighting is used in many contexts. See the video below for one way they are used as visuals for music and entertainment:</p>\n<p><iframe src=\"https://www.youtube.com/embed/7_MhvCsibZg\" width=\"560\" height=\"315\" allowfullscreen=\"allowfullscreen\" allow=\"accelerometer; autoplay; encrypted-media; gyroscope; picture-in-picture\" loading=\"lazy\"></iframe></p>\n<p>&nbsp;</p>\n<p><span style=\"font-size: 18pt;\"><strong>Demo Videos</strong></span></p>\n<p>The following videos will lead you through the basic coding involved with addressable RGB LEDs (Neopixels), as well as some animation effects. Make sure to code along and&nbsp;<span style=\"text-decoration: underline;\">save copies of your work,</span> as having these demo files will help with the&nbsp;<strong>on-your-own exercises</strong> to follow.</p>\n<p>&nbsp;</p>\n<p><span style=\"text-decoration: underline;\">Demo One: Neopixel Basics</span></p>\n<p><iframe src=\"https://www.youtube.com/embed/moM7Azzvg7U\" width=\"560\" height=\"315\" allowfullscreen=\"allowfullscreen\" allow=\"accelerometer; autoplay; encrypted-media; gyroscope; picture-in-picture\" loading=\"lazy\"></iframe></p>\n<p>&nbsp;</p>\n<p><span style=\"text-decoration: underline;\">Fading and For Loops</span>:</p>\n<p><iframe src=\"https://www.youtube.com/embed/bPXseAU1ji4\" width=\"560\" height=\"315\" allowfullscreen=\"allowfullscreen\" allow=\"accelerometer; autoplay; encrypted-media; gyroscope; picture-in-picture\" loading=\"lazy\"></iframe></p>\n<p><br><span style=\"text-decoration: underline;\">HSV Color Mode and Arrays:</span></p>\n<p><iframe src=\"https://www.youtube.com/embed/5_QQJlcMVGM\" width=\"560\" height=\"315\" allowfullscreen=\"allowfullscreen\" allow=\"accelerometer; autoplay; encrypted-media; gyroscope; picture-in-picture\" loading=\"lazy\"></iframe></p>\n<p>&nbsp;</p>\n<p><span style=\"text-decoration: underline;\">Creating a Theatre Chase Animation (Naieve):</span></p>\n<p><iframe src=\"https://www.youtube.com/embed/SoTr2bclzdo\" width=\"560\" height=\"315\" allowfullscreen=\"allowfullscreen\" allow=\"accelerometer; autoplay; encrypted-media; gyroscope; picture-in-picture\" loading=\"lazy\"></iframe></p>\n<p>&nbsp;</p>\n<p><span style=\"text-decoration: underline;\">Improving the Theatre Chase Algorithm:</span></p>\n<p><iframe src=\"https://www.youtube.com/embed/RQLywUKe-Dk\" width=\"560\" height=\"315\" allowfullscreen=\"allowfullscreen\" allow=\"accelerometer; autoplay; encrypted-media; gyroscope; picture-in-picture\" loading=\"lazy\"></iframe></p>\n\n"},{"id":"gb3c38e078f9d1daf045c5d921ee93d25","kind":"weblink","title":"Link to TinkerCAD Class Space","nav_title":"Link to TinkerCAD Class Space","position":2,"published":true,"external_url":"https://www.tinkercad.com/joinclass/3YRLD8J57R42"},{"id":"g57f31611c015ae32ceacce82ab19fd43","kind":"page","title":"Arduino Coding Reference Sheet","nav_title":"Arduino Coding Reference Sheet","position":3,"published":true,"content_html":"<p><em>Use the following document as a <strong>reference for the basic coding structures</strong> in the Arduino Environment. There are many resources that will provide more detail than this; the intent here is show the essentials in a concise form. If you would like to view the official (and much more complete) reference, it is <a href=\"https://www.arduino.cc/reference/en/\">here.</a></em></p>\n<p>&nbsp;</p>\n<p><span style=\"font-size: 18pt;\"><strong>Basic Program Anatomy</strong></span></p>\n<p style=\"padding-left: 40px;\">In an Arduino program, there are three<strong> main sections:<br><br></strong><span style=\"text-decoration: underline;\">Global Variables </span><strong>- </strong>at the top of the program, define any variables that will be used throughout the whole program.<br><br><span style=\"text-decoration: underline;\">setup() function</span>- this function is run only once, and before the loop() function is run.<br><br><span style=\"text-decoration: underline;\">loop() function </span>- this function behaves like a loop - it is run over and over as long as the Arduino is powered on. This is the main driver of your program.<br><br></p>\n<pre style=\"padding-left: 40px;\">//Sample Arduino Program to show the three main areas<br>//Global Variables<br>int speed = 5;        //creates a variable named speed (integer type) and stores a 5 in it.<br>int steps = 10;       //creates a variable named steps (also an integer) and stores a 10 in it.<br><br>//Setup function runs only once. <br>void setup(){              //void means the function does not return a value<br>    Serial.begin(9600);    //turn on the Serial Monitor<br>}<br><br>//Loop function runs continually repeating itself<br>void loop(){<br>    int dist = speed*steps;  //creates a variable (local to loop function)<br>    Serial.println(dist);    //print<br>}</pre>\n<p style=\"padding-left: 80px;\">&nbsp;</p>\n<p><span style=\"font-size: 18pt;\"><strong>Brackets and Semicolons</strong></span></p>\n<p style=\"padding-left: 40px;\">Some sections of code need to be encapsulated inside of brackets, either script brackets {}&nbsp; &nbsp;parenthesis ()&nbsp; or square brackets []. Be&nbsp;<span style=\"text-decoration: underline;\">very careful</span> with the brackets. Whenever you open up a bracket,&nbsp;<strong>it must be matched</strong> with a pairing closing bracket of the same type.<br><br>Most statements need to be finished with a semicolon&nbsp; ;&nbsp; &nbsp;character. You should end almost every line with them - the exceptions to this are:</p>\n<ul>\n<li style=\"list-style-type: none;\">\n<ul>\n<li style=\"list-style-type: none;\">\n<ul>\n<li style=\"list-style-type: none;\">\n<ul>\n<li>when creating a new function</li>\n<li>when creating an IF statement</li>\n<li>when creating a loop</li>\n<li>on a line that just has a script bracket</li>\n</ul>\n</li>\n</ul>\n</li>\n</ul>\n</li>\n</ul>\n<p><br><span style=\"font-size: 18pt;\"><strong>Printing to the Serial Monitor</strong></span></p>\n<p style=\"padding-left: 40px;\">The&nbsp;<strong>Serial Monitor</strong> is a text console that your program can write information to. You can access this area in the Arduino IDE by looking in the&nbsp;<strong>Tools</strong> menu and selecting&nbsp;<strong>Serial Monitor.</strong><br><br>Typically we&nbsp; will be using this either for debugging messages we've coded in ourselves, or values being read in by sensors. There are 3 functions we may likely want to call:<br><br><strong>Serial.begin(9600); &nbsp;</strong> Tells Arduino to enable the serial monitor for this program. The number (Baud Rate) tells arduino how fast to send the messages along the USB cable back to the computer<br><br><strong>Serial.print(</strong><strong>someData</strong><strong>);&nbsp; </strong>Prints some data (whatever you put in the brackets) to the text window.<br><br><strong>Serial.println(someData);&nbsp; </strong>Same as above, but also adds a newline character so that the next thing printed out will be on a different line in the Serial Monitor.<br><br></p>\n<pre style=\"padding-left: 40px;\">//Serial Monitor Sample Code<br><br>void setup(){<br>&nbsp;&nbsp;&nbsp; Serial.begin(9600);&nbsp;&nbsp;&nbsp; //start the Serial Monitor with a Baud Rate of 9600.<br>&nbsp;&nbsp;&nbsp; Serial.println(\"Program Starting\");<br>}<br><br>void loop(){<br>&nbsp;&nbsp;&nbsp; int button = digitalRead(0);&nbsp;&nbsp;&nbsp; //digital read on pin 0, stored in variable called button<br>&nbsp;&nbsp;&nbsp; Serial.println(button);&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; //prints this number to the console (1 per line)<br>}</pre>\n<p style=\"padding-left: 40px;\"><span style=\"background-color: #ffcc00;\"><strong>Note:</strong> The Serial Montior uses pins <strong>0</strong> and <strong>1</strong> for transmitting and receiving data. If you are using the Serial Monitor in your code, you should not be using pins 0 or 1 in the circuit!<br><br></span></p>\n<p><span style=\"font-size: 18pt;\"><strong>Variables</strong></span></p>\n<p style=\"padding-left: 40px;\">Variables are containers that can hold data to be used later on in our programs. There are many types of data, but the most common ones we'll need to know are:</p>\n<ul>\n<li style=\"list-style-type: none;\">\n<ul>\n<li style=\"list-style-type: none;\">\n<ul>\n<li>i<strong>nt</strong> &nbsp;- numeric value with no decimal precision</li>\n<li>\n<strong>float</strong> -&nbsp; numeric value with many places of decimal precision</li>\n</ul>\n</li>\n</ul>\n</li>\n</ul>\n<p style=\"padding-left: 40px;\">To create a variable, you must list the <em>type </em>as well as give it a unique name that starts with a letter:&nbsp;</p>\n<pre style=\"padding-left: 40px;\">myInt = 10; //creates an int-type variable an initializes it to 10<br>float myFloat = 4.32; //creates a float-type variable an initializes it to 4.32</pre>\n<p style=\"padding-left: 40px;\"><span style=\"text-decoration: underline;\">Variable Scope</span></p>\n<p style=\"padding-left: 80px;\">If a variable is created at the top of the program (outside of all functions), it is a&nbsp;<strong>global variable</strong> and can be accessed or modified anywhere else in the program.</p>\n<p style=\"padding-left: 80px;\">Otherwise, any variables we create will be&nbsp;<strong>local to the set of script brackets {}&nbsp;</strong>it was defined inside of.&nbsp;</p>\n<pre style=\"padding-left: 80px;\"><span style=\"font-size: 10pt;\">void checkButton(){</span><br><span style=\"font-size: 10pt;\">  &nbsp; int buttonPressed = digitalRead(2);&nbsp;<span style=\"color: #339966;\"> //read current state on digital pin 2</span></span><br><span style=\"font-size: 10pt;\">&nbsp; &nbsp; if (buttonPressed == 1){</span><br><span style=\"font-size: 10pt;\">&nbsp; &nbsp; &nbsp; &nbsp; Serial.println(<span style=\"color: #339966;\">\"Button was pressed\"</span>);</span><br><span style=\"font-size: 10pt;\">&nbsp; &nbsp; }</span><br><span style=\"font-size: 10pt;\">&nbsp; &nbsp; else{</span><br><span style=\"font-size: 10pt;\">&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; Serial.println(<span style=\"color: #339966;\">“Button NOT pressed”</span>);</span><br><span style=\"font-size: 10pt;\">&nbsp;&nbsp;&nbsp; }</span><br><span style=\"font-size: 10pt;\">}</span></pre>\n<p style=\"padding-left: 80px;\">In the example above, myInt is <strong>local</strong> to the checkButton() function, and can't be used elsewhere.<br><br><br></p>\n<p><span style=\"font-size: 18pt;\"><strong>Conditions</strong></span></p>\n<p style=\"padding-left: 40px;\">We can add decision-making to our programs through use of&nbsp;<em>conditional statements.</em></p>\n<pre style=\"padding-left: 40px;\"><span style=\"font-size: 10pt;\"><em>int pValue = analogRead(A0);&nbsp; <span style=\"color: #339966;\">//perhaps a value read from a potentiometer...</span></em></span></pre>\n<p style=\"padding-left: 40px;\"><span style=\"text-decoration: underline;\">Single Branch Condition</span></p>\n<pre style=\"padding-left: 80px;\"><span style=\"font-size: 10pt;\">if (pValue &lt; 200)</span><br><span style=\"font-size: 10pt;\">{</span><br><br><span style=\"font-size: 10pt;\">&nbsp; &nbsp; &nbsp;Serial.println(<span style=\"color: #339966;\">\"Low Value Reading\"</span>);</span><br><span style=\"font-size: 10pt;\">}</span></pre>\n<p style=\"padding-left: 40px;\"><span style=\"text-decoration: underline;\">Two-Branch Condition</span></p>\n<pre style=\"padding-left: 80px;\"><span style=\"font-size: 10pt;\">if (pValue &lt; 200)</span><br><span style=\"font-size: 10pt;\">{</span><br><span style=\"font-size: 10pt;\">&nbsp; &nbsp; &nbsp;Serial.println(<span style=\"color: #339966;\">\"Low Value Reading\"</span>);</span><br><span style=\"font-size: 10pt;\">}</span><br><span style=\"font-size: 10pt;\">else</span><br><span style=\"font-size: 10pt;\">{</span><br><span style=\"font-size: 10pt;\">&nbsp; &nbsp; &nbsp;Serial.println(<span style=\"color: #339966;\">\"High Value Reading\"</span>);</span><br><span style=\"font-size: 10pt;\">}</span></pre>\n<p style=\"padding-left: 40px;\"><span style=\"text-decoration: underline;\">Three+ Branch Condition</span></p>\n<pre style=\"padding-left: 80px;\"><span style=\"font-size: 10pt;\">if (pValue &lt; 200)</span><br><span style=\"font-size: 10pt;\">{</span><br><span style=\"font-size: 10pt;\">&nbsp; &nbsp; &nbsp;Serial.println(<span style=\"color: #339966;\">\"Low Value Reading\"</span>);</span><br><span style=\"font-size: 10pt;\">}</span><br><span style=\"font-size: 10pt;\">else if (pValue &lt; 550)&nbsp; <span style=\"color: #339966;\">//not below 200, but below 550</span></span><br><span style=\"font-size: 10pt;\">{</span><br><span style=\"font-size: 10pt;\">&nbsp; &nbsp; &nbsp;Serial.println(<span style=\"color: #339966;\">\"Medium Value Reading\"</span>);</span><br><span style=\"font-size: 10pt;\">}</span><br><span style=\"font-size: 10pt;\">else</span><br><span style=\"font-size: 10pt;\">{</span><br><span style=\"font-size: 10pt;\">&nbsp; &nbsp;  Serial.println(<span style=\"color: #339966;\">\"High Value Reading\"</span>);</span><br><span style=\"font-size: 10pt;\">}</span></pre>\n<p>&nbsp;</p>\n<p><strong>Loops</strong> <strong>Delays</strong> <strong>Functions</strong> <strong>Arrays</strong></p>\n<p>&nbsp;</p>\n\n"},{"id":"g399cf8817fc70b3f396bea8e201b55b9","kind":"weblink","title":"if / while practice: Starter","nav_title":"if / while practice: Starter","position":4,"published":true,"external_url":"https://www.tinkercad.com/things/fejyNm9k8c7-ifwhile-practice-starter/"},{"id":"gdc01effa46f99fad8918f88ab2bfec45","kind":"weblink","title":"if/ while practice: Challenges","nav_title":"if/ while practice: Challenges","position":5,"published":true,"external_url":"https://www.tinkercad.com/things/lLHLQkUFiAM-ifwhile-practice-challenges/"},{"id":"gf7d7ac1782d0c54edfa663074b6e27ef","kind":"assignment","title":"08 - RGB LED Coding Assignment","nav_title":"08 - RGB LED Coding Assignment","position":6,"published":true,"content_html":"<div class=\"item-meta\"><span class=\"meta-points\"><strong>Points:</strong> 10.0</span> &middot; <span class=\"meta-submission\"><strong>Submission type:</strong> online upload</span> &middot; <span class=\"meta-ext\"><strong>Allowed file types:</strong> ino</span></div><p>We've spent a couple of days creating some different lighting effects using the&nbsp;<strong>WS2812 RGB LED&nbsp;</strong><strong>Strips</strong> with the&nbsp;<strong>Neopixel library.</strong> On your own, create the functions below. You can work either in the Arduino IDE or the TinkerCAD Arduino Simulator - make sure to test the code regularly.</p>\n<p><span style=\"text-decoration: underline; font-size: 14pt;\"><br>Base Features ( 9 / 10 )</span></p>\n<ol>\n<li style=\"list-style-type: none;\">\n<ol>\n<li>\n<strong><span style=\"font-size: 12pt;\">void turnLeft()<br><br></span></strong><span style=\"font-size: 12pt;\">When this function is called, the <strong>left half</strong> of the LED strip should turn green. The right half should be off.<br><br><img src=\"media/web_resources/turnLeft.gif\" alt=\"\" data-decorative=\"true\" data-api-endpoint=\"https://canvas.instructure.com/api/v1/courses/2417501/files/114629226\" data-api-returntype=\"File\" loading=\"lazy\"><br></span><span style=\"font-size: 12pt;\"><br></span>\n</li>\n<li>\n<strong><span style=\"font-size: 12pt;\">void turnRight()<br><br></span></strong><span style=\"font-size: 12pt;\">When this function is called, the <strong>right half</strong> of the LED strip should turn green. The left half should be off.<br><br><img src=\"media/web_resources/turnRight-1.gif\" alt=\"\" data-decorative=\"true\" data-api-endpoint=\"https://canvas.instructure.com/api/v1/courses/2417501/files/114629227\" data-api-returntype=\"File\" loading=\"lazy\"><br><br></span>\n</li>\n<li>\n<strong><span style=\"font-size: 12pt;\"> void</span><span style=\"font-size: 12pt;\"> blinkLeft()<br><br></span></strong><span style=\"font-size: 12pt;\">When this function is called, the&nbsp;<strong>left half</strong> of the LED strip should flash green / off&nbsp;<strong>three times.<br><em>hint:</em></strong><em> you may want to use your turnLeft() function as part of the solution for this function<br><br><img src=\"media/web_resources/blinkLeft.gif\" alt=\"\" data-decorative=\"true\" data-api-endpoint=\"https://canvas.instructure.com/api/v1/courses/2417501/files/114629229\" data-api-returntype=\"File\" loading=\"lazy\"><br></em><strong><br></strong></span>\n</li>\n<li>\n<strong><span style=\"font-size: 12pt;\">void</span><span style=\"font-size: 12pt;\"> blinkRight()<br><br></span></strong><span style=\"font-size: 12pt;\">When this function is called, the&nbsp;<strong>right half </strong>of the LED strip should flash green / off <strong>three times.<br><em>hint:</em></strong><em> you may want to use your turnRight() function as part of the solution for this function<br><br></em><strong><img src=\"media/web_resources/blinkRight.gif\" alt=\"\" data-decorative=\"true\" data-api-endpoint=\"https://canvas.instructure.com/api/v1/courses/2417501/files/114629139\" data-api-returntype=\"File\" loading=\"lazy\"><br><br></strong></span>\n</li>\n<li>\n<strong><span style=\"font-size: 12pt;\">void</span><span style=\"font-size: 12pt;\"> brakeLight()<br><br></span></strong><span style=\"font-size: 12pt;\">When this function is called, turn&nbsp;<strong>all the LEDs</strong> to <strong>red</strong>.<br><br><img src=\"media/web_resources/Brake.gif\" alt=\"\" data-decorative=\"true\" data-api-endpoint=\"https://canvas.instructure.com/api/v1/courses/2417501/files/114629223\" data-api-returntype=\"File\" loading=\"lazy\"><br></span>\n</li>\n</ol>\n</li>\n</ol>\n<p><span style=\"font-size: 12pt;\"><br><span style=\"text-decoration: underline; font-size: 14pt;\">Expert Challenge ( 1 / 10 )</span></span></p>\n<ol>\n<li style=\"list-style-type: none;\">\n<ol>\n<li>\n<strong><span style=\"font-size: 12pt;\">void bounceLED()<br><br></span></strong>This function should create an animation where one LED is a different color than the rest <em>(the other LEDs can either be off, or a single color)</em><br><br>The unique colored LED should 'bounce' back and forth across the LED strip (ie. move to the right until it reaches the end of the strip, at which point it should begin moving to the left until it reaches the left end of the strip).<br><br><em><img src=\"media/web_resources/bounceLedStandard.gif\" alt=\"\" data-decorative=\"true\" data-api-endpoint=\"https://canvas.instructure.com/api/v1/courses/2417501/files/114629225\" data-api-returntype=\"File\" loading=\"lazy\"><br><br><br></em><em>For additional difficultly - have the travelling LED switch colors each time it reaches an end.</em><br><img src=\"media/web_resources/LED-Blink-change-color.gif\" alt=\"\" data-api-endpoint=\"https://canvas.instructure.com/api/v1/courses/2417501/files/114629230\" data-api-returntype=\"File\" loading=\"lazy\"><br><br>\n</li>\n</ol>\n</li>\n</ol>\n<p><span style=\"text-decoration: underline; font-size: 18pt;\">Hints</span></p>\n<p style=\"padding-left: 40px;\">Remember that you can access the <strong>documention</strong> for the <strong>Neopixel </strong>library from TinkerCAD by pressing the Library button<em> (visible when in text code mode)</em>, then the button on the right (boxed in red below).</p>\n<p style=\"padding-left: 40px;\"><img src=\"media/web_resources/Demo-Neopixels-Library-Include-and-REf.JPG\" alt=\"Demo - Neopixels Library Include and REf.JPG\" data-api-endpoint=\"https://canvas.instructure.com/api/v1/courses/2417501/files/114629224\" data-api-returntype=\"File\" loading=\"lazy\"></p>\n<p style=\"padding-left: 40px;\"><br>You don't necessarily need to use&nbsp;<strong>loops&nbsp;</strong>for any of the&nbsp;<strong>base features</strong> functions; remember we can directly modify a particular LED using:</p>\n<pre style=\"padding-left: 40px;\">strip.setPixelColor(2, 255, 0, 0);</pre>\n<p style=\"padding-left: 40px;\">when the first input (2) stands for which LED to change (starting from 0)<br>and the remaining 3 inputs (255, 0, 0) stand for the R, G, B values to assign to that LED</p>\n<p style=\"padding-left: 40px;\">&nbsp;</p>\n<p><span style=\"text-decoration: underline; font-size: 18pt;\">Video Hints</span></p>\n<p style=\"padding-left: 40px;\">If you need additional help, the following videos will lead you through the process of implementing 2 of the 5 base features functions.</p>\n<p><iframe src=\"https://www.youtube.com/embed/yTZ2t7ySAdc\" width=\"560\" height=\"315\" allowfullscreen=\"allowfullscreen\" allow=\"accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture\" loading=\"lazy\"></iframe> <iframe src=\"https://www.youtube.com/embed/hZsSM5HkenU\" width=\"560\" height=\"315\" allowfullscreen=\"allowfullscreen\" allow=\"accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture\" loading=\"lazy\"></iframe></p>\n<p><br><span style=\"text-decoration: underline; font-size: 18pt;\">Submission</span></p>\n<p style=\"padding-left: 40px;\">For this project, you should be trying each function out either in TinkerCAD or on your Arduino. Once complete, you should submit&nbsp;<strong>one code file (.ino)&nbsp;</strong>that includes all of the functions.&nbsp;</p>\n<p style=\"padding-left: 40px;\"><em>You <strong>don't need to</strong> call each function in the&nbsp;<strong>loop()</strong> function submitted code (you should have tested them individually).</em></p>\n\n"},{"id":"gef8e666ffe4fbe26da7ec14436958060","kind":"page","title":"Arduino Ref Backup","nav_title":"Arduino Ref Backup","position":7,"published":true,"content_html":"<p><em>Use the following document as a <strong>reference for the basic coding structures</strong> in the Arduino Environment. There are many resources that will provide more detail than this; the intent here is show the essentials in a concise form. If you would like to view the official (and much more complete) reference, it is <a href=\"https://www.arduino.cc/reference/en/\">here.</a></em></p>\n<p>&nbsp;</p>\n<p><span class=\"element_toggler\" role=\"button\" aria-controls=\"Basic Anatomy\" aria-expanded=\"true\" aria-label=\"Toggler toggle list visibility\"> <i class=\"icon-mini-arrow-down\"></i> </span></p>\n<ol>\n<ol>\n<ol>\n<li><strong>Basic Program Anatomy<br><br></strong></li>\n</ol>\n</ol>\n</ol>\n<p>&nbsp;</p>\n<ul>\n<ul>In an Arduino program, there are three</ul>\n</ul>\n<p><strong> main sections:<br><br></strong><span style=\"text-decoration: underline;\">Global Variables </span><strong>- </strong></p>\n<ul>\n<ul>at the top of the program, define any variables that will be used throughout the whole program.</ul>\n</ul>\n<p><br><br><span style=\"text-decoration: underline;\">setup() function</span></p>\n<ul>\n<ul>- this function is run only once, and before the loop() function is run.</ul>\n</ul>\n<p><br><br><span style=\"text-decoration: underline;\">loop() function </span></p>\n<ul>\n<ul>- this function behaves like a loop - it is run over and over as long as the Arduino is powered on. This is the main driver of your program.</ul>\n</ul>\n<p>&nbsp;</p>\n<pre>//Sample Arduino Program to show the three main areas<br>//Global Variables<br>int speed = 5;        //creates a variable named speed (integer type) and stores a 5 in it.<br>int steps = 10;       //creates a variable named steps (also an integer) and stores a 10 in it.<br><br>//Setup function runs only once. <br>void setup(){              //void means the function does not return a value<br>    Serial.begin(9600);    //turn on the Serial Monitor<br>}<br><br>//Loop function runs continually repeating itself<br>void loop(){<br>    int dist = speed*steps;  //creates a variable (local to loop function)<br>    Serial.println(dist);    //print<br>}</pre>\n<p><br><br></p>\n<ul>\n<li>\n<strong>Brackets and Semi-colons<br><br></strong>Some sections of code need to be encapsulated inside of brackets, either script brackets {}&nbsp; &nbsp;parenthesis ()&nbsp; or square brackets []. Be&nbsp;<span style=\"text-decoration: underline;\">very careful</span> with the brackets. Whenever you open up a bracket,&nbsp;<strong>it must be matched</strong> with a pairing closing bracket of the same type.<br><br>Most statements need to be finished with a semicolon&nbsp; ;&nbsp; &nbsp;character. You should end almost every line with them - the exceptions to this are:<br><br>\n<ul>\n<li>when creating a new function</li>\n<li>when creating an IF statement</li>\n<li>when creating a loop</li>\n<li>on a line that just has a script bracket<br><br><br><br>\n</li>\n</ul>\n</li>\n<li>\n<strong>Printing to the Serial Monitor<br><br></strong>The&nbsp;<strong>Serial Monitor</strong> is a text console that your program can write information to. You can access this area in the Arduino IDE by looking in the&nbsp;<strong>Tools</strong> menu and selecting&nbsp;<strong>Serial Monitor.</strong><br><br>Typically we&nbsp; will be using this either for debugging messages we've coded in ourselves, or values being read in by sensors. There are 3 functions we may likely want to call:<br><br><strong><em>Serial.begin(9600);</em> &nbsp;</strong> Tells Arduino to enable the serial monitor for this program. The number (Baud Rate) tells arduino how fast to send the messages along the USB cable back to the computer<br><br><strong>Serial.print(</strong><em><strong>someData);</strong> &nbsp;</em>Prints some data (whatever you put in the brackets) to the text window.<br><br><em><strong>Serial.println(someData);&nbsp;</strong></em>Same as above, but also adds a newline character so that the next thing printed out will be on a different line in the Serial Monitor.<br><br>\n<pre>//Serial Monitor Sample Code<br><br>void setup(){<br>    Serial.begin(9600);    //start the Serial Monitor with a Baud Rate of 9600.<br>    Serial.println(\"Program Starting\");<br>}<br><br>void loop(){<br>    int button = digitalRead(0);    //digital read on pin 0, stored in variable called button<br>    Serial.println(button);         //prints this number to the console (1 per line)</pre>\n<pre>}</pre>\n</li>\n<li><strong>Variables</strong></li>\n</ul>\n<p><span class=\"element_toggler\" role=\"button\" aria-controls=\"group_1\" aria-expanded=\"true\" aria-label=\"Toggler toggle list visibility\"> <i class=\"icon-mini-arrow-down\"></i> Toggler </span></p>\n<ul id=\"group_1\">\n<li>item 1</li>\n<li>item 2</li>\n<li><strong>Conditions</strong></li>\n<li><strong>Loops</strong></li>\n<li><strong>Delays</strong></li>\n<li><strong>Functions</strong></li>\n<li><strong>Arrays</strong></li>\n</ul>\n\n"},{"id":"gc8b4fc0c8b204366156768a7866d789e","kind":"page","title":"TinkerCad Arduino Demos","nav_title":"TinkerCad Arduino Demos","position":8,"published":true,"content_html":"<p>During our initial coding presentation, we will <strong>create</strong> and <strong>modify</strong> several demo circuits and programs. Below you can find the schematics for each demo as well as the initial code to start with.</p>\n<p>&nbsp;</p>\n<p><strong>Demo One - Blink</strong></p>\n<p><span style=\"text-decoration: underline;\">Schematic: </span>&nbsp; &nbsp;(image not shown full size; if you need a closer view:&nbsp; <strong>right click → open image in new tab</strong>)<br><img src=\"media/web_resources/TinkerCad-Arduino-Demo-Schematic-01.PNG\" alt=\"\" width=\"883\" height=\"397\" data-decorative=\"true\" data-api-endpoint=\"https://canvas.instructure.com/api/v1/courses/1676030/files/84040259\" data-api-returntype=\"File\" loading=\"lazy\"></p>\n<p><span style=\"text-decoration: underline;\">Code:</span></p>\n<p>Although you can see some code in the image above, you&nbsp;<em>shouldn't need to type anything</em> as&nbsp;<strong>Blink</strong> is the default code that shows up in a new&nbsp;<strong>Circuits Project</strong> on Tinkercad. Just change the dropdown to \"Text\" to open up the text editor. Say \"yes\" when it tells you this is an irreversible change.</p>\n<p><img src=\"media/web_resources/TinkerCad-Arduino-Demo-Change-Mode-Dropdown.PNG\" alt=\"\" data-decorative=\"true\" data-api-endpoint=\"https://canvas.instructure.com/api/v1/courses/1676030/files/84040306\" data-api-returntype=\"File\" loading=\"lazy\"></p>\n<p>&nbsp;</p>\n<p>&nbsp;</p>\n<p><strong>Demo 2 - \"Hello World\"</strong></p>\n<p><span style=\"text-decoration: underline;\">Circuit:</span>&nbsp; &nbsp;No need for a new circuit here as the code will be independent of the circuit anyway. Just keep (or reconstruct) the Blink circuit as in the previous demo.</p>\n<p><span style=\"text-decoration: underline;\">Code:</span> Use the following Starter Code:</p>\n<pre>void setup(){<br><br>&nbsp; &nbsp; Serial.begin(9600);<br><br>}<br><br>void loop(){<br><br>&nbsp; &nbsp; Serial.println(\"Hello World\");<br>&nbsp; &nbsp; delay(2000);<br><br>}</pre>\n<p>&nbsp;</p>\n<p><strong>Demo 3 - Button with Pull-up Resistor</strong></p>\n<p><em>When using buttons, remember that when no power is supplied to a circuit (button not pressed), reading that circuit won't necessarily give 0v!&nbsp; You <span style=\"text-decoration: underline;\">must use</span> some sort of resistor (pull-down,&nbsp; pull-up) to stabilize the circuit to get reliable readings. In this demo we'll look at the built-in pull-up resistors in the Arduino, but for more reading check out this tutorial on <a href=\"https://create.arduino.cc/projecthub/muhammad-aqib/arduino-button-tutorial-using-arduino-digitalread-function-08adb5\">buttons and resistors.</a></em></p>\n<p><span style=\"text-decoration: underline;\">Circuit:</span></p>\n<p><img src=\"media/web_resources/TinkerCad-Arduino-Demo-Schematic-02-Buttons-.PNG\" alt=\"\" data-decorative=\"true\" data-api-endpoint=\"https://canvas.instructure.com/api/v1/courses/1676030/files/84042245\" data-api-returntype=\"File\" loading=\"lazy\"></p>\n<p><span style=\"text-decoration: underline;\">Code:</span></p>\n<pre>int LEDpin = 13;<br>int buttonPin = 2;<br><br>void setup()<br>{<br>pinMode(LEDpin, OUTPUT);<br>pinMode(buttonPin, INPUT_PULLUP);<br>}<br><br>void loop()<br>{<br>int buttonValue = digitalRead(buttonPin);<br>digitalWrite(LEDpin, buttonValue);<br>}</pre>\n<p>&nbsp;</p>\n<p><strong>Demo 4 - Arrays (</strong>Pin Entry System)</p>\n<p>In this demo, we'll create a basic PIN pad system. This will be an opportunity to work with arrays. For more information on arrays, see the official <a href=\"https://www.arduino.cc/reference/tr/language/variables/data-types/array/\">Arduino reference page for arrays</a>.</p>\n<p>See the red box below for how to add \"Notes\" to the circuit. We'll use this to label which letter each button will represent.</p>\n<p><img src=\"media/web_resources/TinkerCad-Arduino-Demo-Schematic-Arrays-03.png\" alt=\"\" data-decorative=\"true\" data-api-endpoint=\"https://canvas.instructure.com/api/v1/courses/1676030/files/84061440\" data-api-returntype=\"File\" loading=\"lazy\"></p>\n<p>&nbsp;</p>\n<p><strong>Demo 5 - Basic Functions </strong>(Variable Servo Speed)</p>\n<p>In this demo, we'll look at defining our own functions to help organize code.</p>\n<p><img src=\"media/web_resources/TinkerCad-Arduino-Demo-Schematic-Servo-Speed-Functions-04.png\" alt=\"\" data-decorative=\"true\" data-api-endpoint=\"https://canvas.instructure.com/api/v1/courses/1676030/files/84146801\" data-api-returntype=\"File\" loading=\"lazy\"></p>\n<p>&nbsp;</p>\n<p><span style=\"text-decoration: underline;\">On Your Own:</span></p>\n<p>Once we've finished the speed control code as a class, you'll be given an on-your-own challenge. For that challenge you need to add two buttons using the internal pull-up resistors. Try to wire these yourself from memory (we did it back in demo 3). If you need a reminder, the image below shows the circuit.</p>\n<p><img src=\"media/web_resources/TinkerCad-Arduino-Demo-Schematic-Servo-Speed-Functions-04b.png\" alt=\"\" data-decorative=\"true\" data-api-endpoint=\"https://canvas.instructure.com/api/v1/courses/1676030/files/84146848\" data-api-returntype=\"File\" loading=\"lazy\"></p>\n<p>&nbsp;</p>\n<p><strong>Demo 5: Neopixel Addressable RGB Strip</strong></p>\n<p><span style=\"text-decoration: underline;\">Schematic:</span></p>\n<p><img src=\"media/web_resources/Demo-Neopixels-Circuit.JPG\" alt=\"\" data-decorative=\"true\" loading=\"lazy\"></p>\n<p>To be able to use the Neopixel strip, we need to first include a library. To do this in TinkerCAD, switch to <strong>&lt;text code&gt;</strong> view, and click on the include libraries button:</p>\n<p><img src=\"media/web_resources/Demo-Neopixels-Library-Button.JPG\" alt=\"\" loading=\"lazy\"></p>\n<p><img src=\"media/web_resources/Demo-Neopixels-Library-Include-and-REf.JPG\" alt=\"\" data-decorative=\"true\" loading=\"lazy\"></p>\n<p><em>Once the menu appears, the button the left will add the <strong>#include</strong> statement to your code. The button on the right will load the library reference page, which shows us how we can use it.</em></p>\n<p><strong>Tasks:</strong></p>\n<p>Once we have the strip wired and the library connected, we'll get right to controlling it. As a class, we'll do the following:</p>\n<ul>\n<li>Activate Individual LEDs (blue)</li>\n<li>.clear()&nbsp; &nbsp;- add a button</li>\n<li>2-chase, 3-chase</li>\n<li>shiftLeft()</li>\n</ul>\n<p>Then, on your own, you'll create some effects to be submitted as a small project.</p>\n<p>&nbsp;</p>\n\n"},{"id":"ge836ba611f8214f0021b8bb90678bcf7","kind":"assignment","title":"RGB LED Coding Assignment","nav_title":"RGB LED Coding Assignment","position":9,"published":true,"content_html":"<div class=\"item-meta\"><span class=\"meta-points\"><strong>Points:</strong> 5.0</span> &middot; <span class=\"meta-submission\"><strong>Submission type:</strong> online upload</span></div><p>We've spent a couple of days creating some different lighting effects using the&nbsp;<strong>WS2812 RGB LED&nbsp;</strong><strong>Strips</strong> with the&nbsp;<strong>Neopixel library.</strong> On your own, create the functions below. You can work either in the Arduino IDE or the TinkerCAD Arduino Simulator - make sure to test the code regularly.</p>\n<p><span style=\"text-decoration: underline; font-size: 14pt;\"><br>Base Features ( 4.5 / 5 )</span></p>\n<ol>\n<li style=\"list-style-type: none;\">\n<ol>\n<li>\n<strong><span style=\"font-size: 12pt;\">void turnLeft()<br><br></span></strong><span style=\"font-size: 12pt;\">When this function is called, the <strong>left half</strong> of the LED strip should turn green. The right half should be off.<br><br><img src=\"media/web_resources/turnLeft.gif\" alt=\"\" data-decorative=\"true\" data-api-endpoint=\"https://canvas.instructure.com/api/v1/courses/3350348/files/149484236\" data-api-returntype=\"File\" loading=\"lazy\"><br></span><span style=\"font-size: 12pt;\"><br></span>\n</li>\n<li>\n<strong><span style=\"font-size: 12pt;\">void turnRight()<br><br></span></strong><span style=\"font-size: 12pt;\">When this function is called, the <strong>right half</strong> of the LED strip should turn green. The left half should be off.<br><br><img src=\"media/web_resources/turnRight-1.gif\" alt=\"\" data-decorative=\"true\" data-api-endpoint=\"https://canvas.instructure.com/api/v1/courses/3350348/files/149484243\" data-api-returntype=\"File\" loading=\"lazy\"><br><br></span>\n</li>\n<li>\n<strong><span style=\"font-size: 12pt;\"> void</span><span style=\"font-size: 12pt;\"> blinkLeft()<br><br></span></strong><span style=\"font-size: 12pt;\">When this function is called, the&nbsp;<strong>left half</strong> of the LED strip should flash green / off&nbsp;<strong>three times.<br><em>hint:</em></strong><em> you may want to use your turnLeft() function as part of the solution for this function<br><br><img src=\"media/web_resources/blinkLeft.gif\" alt=\"\" data-decorative=\"true\" data-api-endpoint=\"https://canvas.instructure.com/api/v1/courses/3350348/files/149484239\" data-api-returntype=\"File\" loading=\"lazy\"><br></em><strong><br></strong></span>\n</li>\n<li>\n<strong><span style=\"font-size: 12pt;\">void</span><span style=\"font-size: 12pt;\"> blinkRight()<br><br></span></strong><span style=\"font-size: 12pt;\">When this function is called, the&nbsp;<strong>right half </strong>of the LED strip should flash green / off <strong>three times.<br><em>hint:</em></strong><em> you may want to use your turnRight() function as part of the solution for this function<br><br><img src=\"media/web_resources/turnRight.gif\" alt=\"\" data-decorative=\"true\" data-api-endpoint=\"https://canvas.instructure.com/api/v1/courses/3350348/files/149484238\" data-api-returntype=\"File\" loading=\"lazy\"></em><strong><br><br></strong></span>\n</li>\n<li>\n<strong><span style=\"font-size: 12pt;\">void</span><span style=\"font-size: 12pt;\"> brakeLight()<br><br></span></strong><span style=\"font-size: 12pt;\">When this function is called, turn&nbsp;<strong>all the LEDs</strong> to <strong>red</strong>.<br><br><img src=\"media/web_resources/Brake.gif\" alt=\"\" data-decorative=\"true\" data-api-endpoint=\"https://canvas.instructure.com/api/v1/courses/3350348/files/149484232\" data-api-returntype=\"File\" loading=\"lazy\"><br></span>\n</li>\n</ol>\n</li>\n</ol>\n<p><span style=\"font-size: 12pt;\"><br><span style=\"text-decoration: underline; font-size: 14pt;\">Expert Challenge ( 0.5 / 5 )</span></span></p>\n<ol>\n<li style=\"list-style-type: none;\">\n<ol>\n<li>\n<strong><span style=\"font-size: 12pt;\">void bounceLED()<br><br></span></strong>This function should create an animation where one LED is a different color than the rest <em>(the other LEDs can either be off, or a single color)</em><br><br>The unique colored LED should 'bounce' back and forth across the LED strip (ie. move to the right until it reaches the end of the strip, at which point it should begin moving to the left until it reaches the left end of the strip).<br><br><em><img src=\"media/web_resources/bounceLedStandard.gif\" alt=\"\" data-decorative=\"true\" data-api-endpoint=\"https://canvas.instructure.com/api/v1/courses/3350348/files/149484235\" data-api-returntype=\"File\" loading=\"lazy\"><br><br><br></em><em>For additional difficultly - have the travelling LED switch colors each time it reaches an end.</em><br><img src=\"media/web_resources/LED-Blink-change-color.gif\" alt=\"\" data-api-endpoint=\"https://canvas.instructure.com/api/v1/courses/3350348/files/149484240\" data-api-returntype=\"File\" loading=\"lazy\"><br><br>\n</li>\n</ol>\n</li>\n</ol>\n<p><span style=\"text-decoration: underline; font-size: 18pt;\">Hints</span></p>\n<p style=\"padding-left: 40px;\">Remember that you can access the <strong>documention</strong> for the <strong>Neopixel </strong>library from TinkerCAD by pressing the Library button<em> (visible when in text code mode)</em>, then the button on the right (boxed in red below).</p>\n<p style=\"padding-left: 40px;\"><img src=\"media/web_resources/Demo-Neopixels-Library-Include-and-REf.JPG\" alt=\"Demo - Neopixels Library Include and REf.JPG\" data-api-endpoint=\"https://canvas.instructure.com/api/v1/courses/3350348/files/149484233\" data-api-returntype=\"File\" loading=\"lazy\"></p>\n<p style=\"padding-left: 40px;\"><br>You don't necessarily need to use&nbsp;<strong>loops&nbsp;</strong>for any of the&nbsp;<strong>base features</strong> functions; remember we can directly modify a particular LED using:</p>\n<pre style=\"padding-left: 40px;\">strip.setPixelColor(2, 255, 0, 0);</pre>\n<p style=\"padding-left: 40px;\">when the first input (2) stands for which LED to change (starting from 0)<br>and the remaining 3 inputs (255, 0, 0) stand for the R, G, B values to assign to that LED</p>\n<p><br><span style=\"text-decoration: underline; font-size: 18pt;\">Submission</span></p>\n<p style=\"padding-left: 40px;\">For this project, you should be trying each function out either in TinkerCAD or on your Arduino. Once complete, you should submit&nbsp;<strong>one code file (.ino)&nbsp;</strong>that includes all of the functions.&nbsp;</p>\n<p style=\"padding-left: 40px;\"><em>You <strong>don't need to</strong> call each function in the&nbsp;<strong>loop()</strong> function submitted code (you should have tested them individually).</em></p>\n\n"},{"id":"g4bc0c036da7d20c4c7b22030f0a83535","kind":"assignment","title":"Arduino LCD Display Fortune Machine","nav_title":"Arduino LCD Display Fortune Machine","position":10,"published":true,"content_html":"<div class=\"item-meta\"><span class=\"meta-points\"><strong>Points:</strong> 10.0</span> &middot; <span class=\"meta-submission\"><strong>Submission type:</strong> online upload</span> &middot; <span class=\"meta-ext\"><strong>Allowed file types:</strong> png,ino,mp4,mov</span></div><p>Using an&nbsp;<strong>LCD Display,&nbsp; switches, </strong>and <strong>code,</strong> you'll make a<strong> Fortune-Telling Machine.</strong>&nbsp;</p>\n<p>For this project, you'll create two things:</p>\n<ul>\n<li>A virtual circuit and simulation in&nbsp;<strong>TinkerCAD</strong>\n</li>\n<li>A physical circuit and implementation with your&nbsp;<strong>Arduino Kit<br><br></strong>\n</li>\n</ul>\n<p><span style=\"text-decoration: underline; font-size: 14pt;\">Step One: Virtual TinkerCAD Circuit:</span></p>\n<p>Creating a virtual circuit allows for a very simple testing environment to ensure the circuit design and code behave the intended way. Think of this as a&nbsp;<strong>rough draft.</strong> Once this is successful, you can use it as a template for making the physical circuit.</p>\n<p>Navigate to <a href=\"https://www.tinkercad.com/\">https://www.tinkercad.com/</a> and log in to your student account.</p>\n<p>Begin by wiring up an LCD Panel and testing it out by itself:</p>\n<p><img src=\"media/web_resources/TinkerCad-Arduino-Demo-Schematic-Liquid-Crystal-06.png\" alt=\"\" data-decorative=\"true\" data-api-endpoint=\"https://canvas.instructure.com/api/v1/courses/1676030/files/84334321\" data-api-returntype=\"File\" loading=\"lazy\"></p>\n<p><span style=\"text-decoration: underline;\">Testing Code:</span></p>\n<p><em>The following code can test out the circuit. Note: a library is being <strong>included </strong>at the top - this is necessary in order to easily communicate with the LCD device.&nbsp;</em></p>\n<pre><span style=\"font-size: 12pt;\">#include &lt;LiquidCrystal.h&gt;</span><br><span style=\"font-size: 12pt;\">LiquidCrystal lcd(12, 11, 5, 4, 3, 2);  <span style=\"color: #339966;\">//pin assignments for the LCD</span></span><br><br><span style=\"font-size: 12pt;\">void setup()</span><br><span style=\"font-size: 12pt;\">{</span><br><span style=\"font-size: 12pt;\">    lcd.begin(16,2);</span><br><span style=\"font-size: 12pt;\">    lcd.print(\"Build this Circuit!\");</span><br><span style=\"font-size: 12pt;\">}</span><br><br><br><span style=\"font-size: 12pt;\">void loop()</span><br><span style=\"font-size: 12pt;\">{</span><br><br><span style=\"font-size: 12pt;\">}</span></pre>\n<p>&nbsp;</p>\n<p><em>Once you've got a working LCD display, you can move on to implementing the full challenge.<br><br></em></p>\n<p><strong><span style=\"text-decoration: underline;\">Base Version (8/10):</span></strong></p>\n<p>Write a program that will provide a random fortune to the user.</p>\n<ol>\n<li>When the system is first powered on, the message \"Fortune Machine!\" should be displayed on the LCD.<br><br>\n</li>\n<li>Then, whenever a&nbsp;<strong>tilt switch</strong> is activated, a random fortune should be displayed on the LCD (some hints below).\n<ul>\n<li>A tilt switch is typically open when in its normal orientation, and closed when it is inverted. This way, you'll need to rotate your physical circuit to change the state of that switch. In the digital context, you can click on the switch to get a slider bar that simulates this action.</li>\n<li>If your kit doesn't have one, see me to get an extra. In a pinch, we can use a regular button (momentary switch) for this instead.<br><br>\n</li>\n</ul>\n</li>\n<li>Before the actual fortune is displayed, animate some text (something like \"Your Fortune Is\" in a manner similar to the example animation below<em>&nbsp;(Short delay between each word being displayed).</em><br><br>\n</li>\n<li>Once the random fortune is displayed, it should remain on the LCD screen until the tilt switch is inverted again.<br><br>\n</li>\n<li>Include at 5 possible fortunes (or more, if you'd like).</li>\n</ol>\n<p>&nbsp;</p>\n<p><strong><span style=\"text-decoration: underline;\">Scrollability (1/10):</span></strong></p>\n<p>Longer fortunes can't be displayed on the LCD at once. For this extension, you'll add the ability to scroll the text left and right so each fortune can be read in its entirety.</p>\n<ol>\n<li>Add two buttons to your circuit (you may want to add a second breadboard).\n<ul>\n<li>Make sure to enable the internal pull-up resistor for each in setup().</li>\n<li>Add comment labels \"left\" and \"right\" by the buttons to mark which direction each will do.<br><br>\n</li>\n</ul>\n</li>\n<li>When the \"left\" button is pressed down, scroll the text to the left and do the corresponding action for the right button also.\n<ul>\n<li>In the hints section below you can find some suggestions about how this can be coded.<br><br>\n</li>\n</ul>\n</li>\n</ol>\n<p><strong><span style=\"text-decoration: underline;\">Always Your Lucky Day (1/10):</span></strong></p>\n<p>The final extension is to add a bit of a cheat to the system, where you can guarantee a good fortune!</p>\n<ol>\n<li>Add a slide switch to the circuit\n<ul>\n<li>The middle prong is connected to the one of the outside two prongs at a time (see below):<br><img src=\"media/web_resources/SPDT-Switch-Illustration.png\" alt=\"\" width=\"352\" height=\"199\" data-decorative=\"true\" data-api-endpoint=\"https://canvas.instructure.com/api/v1/courses/1676030/files/84381777\" data-api-returntype=\"File\" loading=\"lazy\">\n</li>\n<li>For this circuit, just wire the middle and one outside prong. It can be wired just like our push buttons (data line to pin with internal pull-up resistor, and other pin to ground). It doesn't matter which pin goes where.<br><img src=\"media/web_resources/Slide-Switch-on-Arduino-llustration.PNG\" alt=\"\" data-decorative=\"true\" data-api-endpoint=\"https://canvas.instructure.com/api/v1/courses/1676030/files/84381871\" data-api-returntype=\"File\" loading=\"lazy\"><br><br>\n</li>\n<li>If the circuit is on <em>(remember, with PULLUP that means a digitalRead() value of 0)</em>, always print out the same fortune: \"Today will be your lucky day!\"<br><br>\n</li>\n<li>Slide switches don't typically fit into breadboards! Take one of the slide switches and solder on two short sections of solid-core wire and connect those to the breadboard.</li>\n</ul>\n</li>\n</ol>\n<p><span style=\"text-decoration: underline;\"><img src=\"media/web_resources/Arduino-Fortune-Machine-Sample-Run.gif\" alt=\"\" width=\"642\" height=\"337\" data-decorative=\"true\" data-api-endpoint=\"https://canvas.instructure.com/api/v1/courses/1676030/files/84370266\" data-api-returntype=\"File\" loading=\"lazy\"><br></span><span style=\"font-size: 10pt;\"><em>Sample run of main program. All extensions are included, but <strong>Always </strong><strong>Your</strong> <strong>Lucky Day</strong> switch isn't toggled on in this demo.</em></span></p>\n<p>&nbsp;</p>\n<p><strong>Programming and Hints:</strong></p>\n<ol>\n<li>Remember you can look back at the demos we've made as a class to remind yourself how we did certain things. Also, you can look back to the&nbsp;<strong>Arduino Coding Reference Sheet</strong> to see short examples of different coding ideas/techniques that will be necessary to build this project.<br><br>\n</li>\n<li>\n<strong>Basic Pseudocode:<br></strong>Having a plain-English outline for what you want a program to do is always a good way to start. This can be used as a template when you go to actually build a program with code. One possible psuedo-code outline for this program could be:<br><br><span style=\"text-decoration: underline;\">Global Variables</span> - set up variables to store the pin assignments for the push buttons, slide switch, and tilt switch.<br><br><span style=\"text-decoration: underline;\">Setup() Function:&nbsp;</span> set all four of the above pins to INPUT_PULLUP, and print the initial title of the program onto the LCD monitor.<br><br><span style=\"text-decoration: underline;\">Loop Function:</span> <br>- digitalRead each of the 4 pins connected to the various switches<br>- if the LEFT or RIGHT button is being pressed (value of 0), scroll the LCD message accordingly<br>- if the TILT SWITCH is activated (value of 0), print the preliminary messages (\"Your\"&nbsp; &nbsp;\"Fortune\"&nbsp; &nbsp;\"Is...\")<br>&nbsp; &nbsp; &nbsp; &nbsp; &nbsp;- Following this, create a random number and store it in a variable. Use this to pick and display a fortune.&nbsp;&nbsp;<br>&nbsp; &nbsp; &nbsp; &nbsp; &nbsp;- Before actually displaying the message, check the slide switch. If it is on (value 0) display \"Today is your Lucky Day\" instead.<br><br>\n</li>\n<li>\n<strong>Random Numbers:</strong><br>To pick a random fortune, the simplest way is to pick a random number, and have each possible random number line up with one of the possible fortunes. Earlier on, we saw that creating random integers is pretty straightforward:<br><br>\n<pre><span style=\"font-size: 12pt;\">int choice = int(random(5));&nbsp; <span style=\"color: #339966;\">//picks a random integer from 0 to 4 (5 possibilities) </span></span><br><span style=\"color: #339966; font-size: 12pt;\">&nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; //and stores it in the variable choice</span><br><br><span style=\"color: #339966; font-size: 12pt;\">// If we use the code above when it is time to pick a fortune, we can follow up with </span><br><span style=\"color: #339966; font-size: 12pt;\">// an <strong>if, else if, else</strong> statement to choose the appropriate thing to display:</span><br><br><span style=\"font-size: 12pt;\">if (choice == 0){</span><br><span style=\"font-size: 12pt;\">&nbsp; &nbsp; &nbsp;lcd.print(\"You are the crispy noodle in the vegetarian salad of life.\");</span><br><span style=\"font-size: 12pt;\">}</span><br><span style=\"font-size: 12pt;\">else if (choice == 1){</span><br><span style=\"font-size: 12pt;\">&nbsp; &nbsp; &nbsp;<span style=\"color: #339966;\">//print out a different fortune</span></span><br><span style=\"font-size: 12pt;\">} </span><br><span style=\"color: #339966; font-size: 12pt;\">//and so on for each available value of choice</span></pre>\n</li>\n<li>\n<strong>Scrolling the LCD (and other functions)<br><br></strong>We'll be controlling the LCD through the library we've included in the sample code above (LiquidCrystal.h). When using a library, the best starting place is to quickly view the reference page to see what functions are built-in to the library. The functions are the&nbsp;<strong>building blocks</strong> you can combine creatively in your programs.<br><br>Go take a quick look at the <a href=\"https://www.arduino.cc/en/Reference/LiquidCrystal\">Arduino LiquidCrystal Library Reference Page.</a><br><br>In particular, you'll likely want to use the&nbsp;<strong>scrollDisplayLeft()&nbsp;</strong>and&nbsp;<strong>scrollDisplayRight()</strong> functions. As well, you will likely want to add <strong>some sort of short delay i</strong>nto loop() so that the scroll speed isn't too fast!<br><br>\n<pre><span style=\"font-size: 12pt;\">lcd.scrollDisplayLeft();&nbsp; &nbsp; &nbsp;<span style=\"color: #339966;\">//scrolls current display to the left</span></span><br><br><span style=\"font-size: 12pt;\">lcd.scrollDisplayRight();&nbsp; &nbsp; &nbsp;<span style=\"color: #339966;\">//scrolls current display to the right</span></span><br><br><span style=\"font-size: 12pt;\">lcd.clear();&nbsp; &nbsp; &nbsp; <span style=\"color: #339966;\">//add this line in if you ever need to erase what is written on</span></span><br><span style=\"font-size: 12pt;\">  &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; <span style=\"color: #339966;\">//the LCD screen... Likely right before printing a new fortune...</span></span></pre>\n</li>\n</ol>\n<p><span style=\"text-decoration: underline; font-size: 14pt;\"><br>Step Two: Physical Project</span></p>\n<p style=\"padding-left: 40px;\">Once you've finished all of step one above, it's time to build this circuit physically using your Arduino kit. Use your Tinkercad file as a schematic for the circuit, and once it is implemented copy your code to the Arduino to test it.</p>\n<p><br><span style=\"text-decoration: underline; font-size: 14pt;\">What to Hand In</span></p>\n<ol>\n<li style=\"text-align: left;\">An image of your circuit schematic from TinkerCAD.&nbsp;<br><img src=\"media/web_resources/Share-TinkerCAD-design-01.PNG\" alt=\"\" width=\"325\" height=\"164\" data-decorative=\"true\" data-api-endpoint=\"https://canvas.instructure.com/api/v1/courses/1676030/files/84383940\" data-api-returntype=\"File\" loading=\"lazy\"><img src=\"media/web_resources/Share-TinkerCAD-design-02.PNG\" alt=\"\" width=\"375\" height=\"166\" data-decorative=\"true\" data-api-endpoint=\"https://canvas.instructure.com/api/v1/courses/1676030/files/84383944\" data-api-returntype=\"File\" loading=\"lazy\"><br><em>Click the&nbsp;<strong>share</strong> button in the upper-right, then click the <strong>download image icon</strong> to get a <strong>PNG</strong> of your circuit.<br><br></em>\n</li>\n<li style=\"text-align: left;\">A copy of your code, downloaded from TinkerCAD<br><img src=\"media/web_resources/Share-TinkerCAD-design-03.PNG\" alt=\"\" data-decorative=\"true\" data-api-endpoint=\"https://canvas.instructure.com/api/v1/courses/1676030/files/84383981\" data-api-returntype=\"File\" loading=\"lazy\"><br><em>When in the&nbsp;<strong>code view</strong> use the button indicated above to<strong> download your code</strong> as a&nbsp;<strong>.ino&nbsp;</strong>file.<br><br></em>\n</li>\n<li style=\"text-align: left;\">A video of your completed physical circuit in operation.\n<ul>\n<li style=\"text-align: left;\">Make sure to introduce yourself in the video, and provide an explanation of what the circuit does as you demonstrate its use.</li>\n</ul>\n</li>\n</ol>\n\n"},{"id":"g0a090fd5278611486249bb2b351acd2e","kind":"assignment","title":"LCD Assignment: Headbanz","nav_title":"LCD Assignment: Headbanz","position":12,"published":true,"content_html":"<div class=\"item-meta\"><span class=\"meta-points\"><strong>Points:</strong> 0.0</span> &middot; <span class=\"meta-submission\"><strong>Submission type:</strong> online upload</span> &middot; <span class=\"meta-ext\"><strong>Allowed file types:</strong> mp4,mov,avi</span></div><p>This short project can be done either&nbsp;<strong>in pairs</strong> or&nbsp;<strong>individually.</strong></p>\n<p><strong>Base Features&nbsp;</strong>( 4.5 / 5 )</p>\n<p style=\"padding-left: 40px;\">Follow along with the instructions and sample code provided in the following PDF:</p>\n<p style=\"padding-left: 40px;\"><a class=\"instructure_file_link instructure_scribd_file\" title=\"08 - Activity 4D_ _Who Am I __ Game.pdf\" href=\"media/web_resources/08-Activity-4D_-_Who-Am-I-__-Game.pdf\">08 - Activity 4D_ _Who Am I __ Game.pdf</a></p>\n<p><strong>Expert Challenge</strong> ( 0.5 / 5 )</p>\n<p style=\"padding-left: 40px;\">Complete the 3 Extension Challenges as listed in the PDF:</p>\n<ul>\n<li style=\"list-style-type: none;\">\n<ul>\n<li style=\"list-style-type: none;\">\n<ul>\n<li>Changing Time Limit</li>\n<li>Changing Word List</li>\n<li>Changing Winning/Losing Music</li>\n</ul>\n</li>\n</ul>\n</li>\n</ul>\n<p><br>Once complete, take a<strong> video of your circuit in action</strong> and submit it. If you worked with a partner, make sure to include a comment saying who your partner was!</p>\n\n"}]},{"id":"g158e11ca0f82204f30b443252611537c","slug":"22-communication","title":"Communication","order":22,"items":[{"id":"g51eedd5e2d8656994a7d466a959ab9bd","kind":"page","title":"Radio Module Listener","nav_title":"Radio Module Listener","position":1,"published":true,"content_html":"<p>For this activity, you'll experiment with a nRF24L01 – a radio module that can be used with the Arduino to&nbsp;<em>send and receive radio messages.</em>&nbsp;</p>\n<p><span style=\"font-size: 18pt;\"><strong>Step One:&nbsp; Create our Circuit</strong></span></p>\n<p style=\"padding-left: 40px;\">The nRF24L01 module can be wired directly to an Arduino. One thing to be&nbsp;<strong>careful for</strong>, though, is that it is e<strong>xpecting a supply voltage of 3.3V</strong>. <span style=\"text-decoration: underline;\">Oversupply will destroy this component.</span> To help reduce the likelihood of a wiring mistake, we'll also use an additional component that handles stepping down voltage from 5v to 3.3v, so there is no risk of oversupply.</p>\n<table style=\"border-collapse: collapse; width: 62.4245%; height: 58px;\" border=\"0\">\n<tbody>\n<tr style=\"height: 29px;\">\n<td style=\"width: 49.9454%; text-align: center; height: 29px;\"><img src=\"media/web_resources/Uploaded-Media/nrf24L01-image.PNG\" alt=\"nrf24L01 image.PNG\" data-api-endpoint=\"https://canvas.instructure.com/api/v1/courses/4227213/files/174260613\" data-api-returntype=\"File\" loading=\"lazy\"></td>\n<td style=\"width: 49.9454%; text-align: center; height: 29px;\"><img src=\"media/web_resources/Uploaded-Media/nrf-adapter.PNG\" alt=\"nrf adapter.PNG\" data-api-endpoint=\"https://canvas.instructure.com/api/v1/courses/4227213/files/174260627\" data-api-returntype=\"File\" loading=\"lazy\"></td>\n</tr>\n<tr style=\"height: 29px;\">\n<td style=\"width: 49.9454%; text-align: center; height: 29px;\">nRF24L01 Radio Transceiver&nbsp;</td>\n<td style=\"width: 49.9454%; text-align: center; height: 29px;\">5V - 3.3V Adapter Module</td>\n</tr>\n</tbody>\n</table>\n<p>&nbsp;</p>\n<p style=\"padding-left: 40px;\">To create our circuit, first plug the radio module into the adapter module. Then, make the following connections from the adapter module to our Arduino:</p>\n<table style=\"border-collapse: collapse; width: 13.9072%; height: 235px;\" border=\"1\">\n<tbody>\n<tr>\n<td style=\"width: 49.9368%; text-align: center;\"><strong>Adapter Pin</strong></td>\n<td style=\"width: 49.9368%; text-align: center;\"><strong>Arduino Pin</strong></td>\n</tr>\n<tr>\n<td style=\"width: 49.9368%; text-align: center;\">VCC</td>\n<td style=\"width: 49.9368%; text-align: center;\">5V</td>\n</tr>\n<tr>\n<td style=\"width: 49.9368%; text-align: center;\">GND</td>\n<td style=\"width: 49.9368%; text-align: center;\">GND</td>\n</tr>\n<tr>\n<td style=\"width: 49.9368%; text-align: center;\">CE</td>\n<td style=\"width: 49.9368%; text-align: center;\">7</td>\n</tr>\n<tr>\n<td style=\"width: 49.9368%; text-align: center;\">CSN</td>\n<td style=\"width: 49.9368%; text-align: center;\">8</td>\n</tr>\n<tr>\n<td style=\"width: 49.9368%; text-align: center;\">SCK</td>\n<td style=\"width: 49.9368%; text-align: center;\">13</td>\n</tr>\n<tr>\n<td style=\"width: 49.9368%; text-align: center;\">MO</td>\n<td style=\"width: 49.9368%; text-align: center;\">11</td>\n</tr>\n<tr>\n<td style=\"width: 49.9368%; text-align: center;\">MI</td>\n<td style=\"width: 49.9368%; text-align: center;\">12</td>\n</tr>\n</tbody>\n</table>\n<p style=\"padding-left: 40px;\">&nbsp;</p>\n<p><span style=\"font-size: 18pt;\"><strong>Step Two: Find the Broadcast</strong></span></p>\n<p style=\"padding-left: 40px;\">There will be a radio module broadcasting some messages around our classroom. We will use some starter code to start to listen for this broadcast.</p>\n<table style=\"border-collapse: collapse; width: 60.7092%; height: 77px;\" border=\"1\">\n<tbody>\n<tr>\n<td style=\"width: 100%;\"><strong>For future reference</strong>, the following tutorial can be used to see the basics of sending and receiving information with the radio module: &nbsp;<a href=\"https://howtomechatronics.com/tutorials/arduino/arduino-wireless-communication-nrf24l01-tutorial/\" target=\"_blank\">https://howtomechatronics.com/tutorials/arduino/arduino-wireless-communication-nrf24l01-tutorial/</a></td>\n</tr>\n</tbody>\n</table>\n<p>&nbsp;</p>\n<p style=\"padding-left: 40px;\">For today's demo, please refer to the following starter code:</p>\n<p style=\"padding-left: 40px;\"><a class=\"instructure_file_link instructure_scribd_file inline_disabled\" title=\"Robot_Radio_Receive_Starter-1.txt\" href=\"media/web_resources/Uploaded-Media/Robot_Radio_Receive_Starter-1.txt\" target=\"_blank\" data-canvas-previewable=\"false\">Robot_Radio_Receive_Starter-1.txt</a>&nbsp;</p>\n<p style=\"padding-left: 40px;\">&nbsp;</p>\n<p style=\"padding-left: 40px;\">We will be listening (initially) for a broadcast being sent out across the classroom. For reference, the following code is being used for that broadcast:</p>\n<p style=\"padding-left: 40px;\"><a class=\"instructure_file_link instructure_scribd_file inline_disabled\" title=\"Robot_Radio_Transmit_Demo.txt\" href=\"media/web_resources/Uploaded-Media/Robot_Radio_Transmit_Demo.txt\" target=\"_blank\" data-canvas-previewable=\"false\" data-api-endpoint=\"https://canvas.instructure.com/api/v1/courses/4227213/files/174275423\" data-api-returntype=\"File\">Robot_Radio_Transmit_Demo.txt</a>&nbsp;<br><br></p>\n<p style=\"padding-left: 40px;\"><em>In addition to wiring the radio accurately, it is essential that the radio&nbsp;<strong>address&nbsp;</strong>(specified in the code) matches between the sender and receiver. Otherwise, communication will not be successful. Having different addresses will also make it possible for many different radio signals to be sent in the same room without causing problems.<br><br></em></p>\n<p><span style=\"font-size: 18pt;\"><strong>Step Three: Radio Light Control</strong></span></p>\n<p style=\"padding-left: 40px;\">At the front of the room will be a receiver circuit</p>\n\n"}]},{"id":"g31bdc6096f75e4cc8b18c5e4879e7562","slug":"24-project-robotic-arm","title":"Project: Robotic Arm","order":24,"items":[{"id":"g0ab0010d35c3884d54b3ec283a3428a9","kind":"assignment","title":"Robot Gripper Part Modeling","nav_title":"Robot Gripper Part Modeling","position":1,"published":true,"content_html":"<div class=\"item-meta\"><span class=\"meta-points\"><strong>Points:</strong> 10.0</span> &middot; <span class=\"meta-submission\"><strong>Submission type:</strong> online upload</span> &middot; <span class=\"meta-ext\"><strong>Allowed file types:</strong> ipt,stl</span></div><p>Step One of the robot arm project is to create an&nbsp;<em>end effector. </em>That is – the tool attached to the end of the arm. In our case, we will be making a <strong>3D-printed</strong> <strong>gear driven gripper</strong>.</p>\n<p><img src=\"media/web_resources/Gripper-Assembly-Sample.JPG\" alt=\"\" data-decorative=\"true\" data-api-endpoint=\"https://canvas.instructure.com/api/v1/courses/1676030/files/82957113\" data-api-returntype=\"File\" loading=\"lazy\"></p>\n<p><em>Note - our gripper will be slightly modified from the one designed above, to allow it to interface with the Robot Arm design we'll be using.<br></em></p>\n<p>To save time, several parts of the gripper will have been printed for you in advance. You will,&nbsp; however, model&nbsp;<strong>one or two</strong> (see options below) of the parts. The test of your CAD skills will be to see if they fit with the rest of the parts when you assemble them together!</p>\n<p><strong>Primary Modeling Part - Base</strong> (max&nbsp; 8.5/10)</p>\n<p style=\"padding-left: 40px;\">Using the following dimensions, model the base for the robot arm. This is the piece that we'll attach the 9g servo to, as well as the arms and gear system. Completing this part only will allow for a max grade of 8.5/10 (if modeled accurately and the printed part works in the assembly).</p>\n<p style=\"padding-left: 40px;\"><a class=\"instructure_file_link instructure_image_thumbnail\" title=\"Gripper Dimensions - Base v3.png\" href=\"media/web_resources/Gripper-Dimensions-Base.png\" data-api-endpoint=\"https://canvas.instructure.com/api/v1/courses/1676030/files/83065540\" data-api-returntype=\"File\">Base Dimensions</a></p>\n<p style=\"padding-left: 40px;\">&nbsp;</p>\n<p><strong>Secondary Modeling Part - Geared Arm </strong>(max 10/10)</p>\n<p style=\"padding-left: 40px;\">Once you've completed the Base, you have the option to&nbsp;<strong>also model</strong> one of the geared arms. Use the following dimensions for its construction. Completing this (and the base) will allow for a max grade of 10/10 if both parts are modeled accurately and the printed parts work in the assembly.</p>\n<p style=\"padding-left: 40px;\"><a class=\"instructure_file_link instructure_image_thumbnail\" title=\"Gripper Dimensions - Geared Arm.png\" href=\"media/web_resources/Gripper-Dimensions-Geared-Arm.png\" data-api-endpoint=\"https://canvas.instructure.com/api/v1/courses/1676030/files/83102752\" data-api-returntype=\"File\">Geared Arm Dimensions</a></p>\n<p>&nbsp;</p>\n<p><strong>Submitting to PRINT</strong></p>\n<p style=\"padding-left: 40px;\">Inventor's .<strong>ipt</strong> format is not directly printable. To create a<em> sliced file</em> that a 3D printer can&nbsp;interpret, follow these steps in Inventor:</p>\n<ol>\n<li style=\"list-style-type: none;\">\n<ol>\n<li>Go to the <strong>File&nbsp;</strong>Menu</li>\n<li>Click the&nbsp;<strong>arrow</strong> beside the&nbsp;<strong>Save As</strong> button</li>\n<li>Choose&nbsp;<strong>Save as a Copy</strong>\n</li>\n<li>In the <strong>file-type</strong> drop down menu, choose&nbsp;<strong>STL</strong>\n</li>\n<li>Click the <strong>Options Button</strong> and ensure the&nbsp;<strong>units</strong> here match your document's units</li>\n<li>Navigate to your class folder, name the file, and&nbsp;<strong>Save</strong>\n</li>\n</ol>\n</li>\n</ol>\n<p><strong><span style=\"color: #008000;\">For this project, submit both an IPT and STL file for each part completed.</span></strong></p>\n<p><em>Submit your part(s) here when complete, and let me know so we can begin printing them promptly. Instructions for assembly and how to submit a video of your completed gripper will be in the next assignment item in the Canvas module.</em></p>\n\n"},{"id":"g804bf918941ea57de7e94c3b5ff5742f","kind":"assignment","title":"Robot Gripper Assembly and Operation","nav_title":"Robot Gripper Assembly and Operation","position":2,"published":true,"content_html":"<div class=\"item-meta\"><span class=\"meta-points\"><strong>Points:</strong> 4.0</span> &middot; <span class=\"meta-submission\"><strong>Submission type:</strong> online upload</span> &middot; <span class=\"meta-ext\"><strong>Allowed file types:</strong> mov,mp4</span></div><p>Once your 3D design work is done, you'll have one or two parts printed for you to go along with the remaining gripper components have been pre-printed.</p>\n<p>This mini-assignment is to assemble and test the gripper out. Once we've verified it is functioning correctly, you and your partner can move on to assembling your entire robot arm.</p>\n<p><strong>Bill of Materials</strong></p>\n<ul>\n<li>Five 3D printed parts (Base, 2 geared arms, small servo gear, and gear interface)</li>\n<li>One 9g Servo (along with the 3 included screws and the half servo horn)</li>\n<li>Two m3 screws (10-15mm) with nut<br><br>\n</li>\n<li>Equipment for testing: Ardunio, 5V Power Supply (not the arduino!), Potentiometer</li>\n</ul>\n<p>&nbsp;</p>\n<p><strong>Assembly Instructions<br></strong>The following snippet from the video shows the assembly process for the gripper. Recall that our gripper base has different geometry to allow it to interface with a different robot arm design. The other steps all still apply, so follow carefully along with the video.</p>\n<p><iframe style=\"overflow: hidden; width: 100%; max-width: 640px; height: 372px;\" src=\"https://www.vibby.com/embed/vib?vib=QJt3K5k4d\" allowfullscreen=\"allowfullscreen\" loading=\"lazy\"></iframe></p>\n<p>&nbsp;</p>\n<p><strong>Design a Test Bed</strong></p>\n<p>Testing the robot arm is pretty straightforward. Building a simple circuit that allows the servo position to be controlled with a potentiometer.</p>\n<ul>\n<li>At the start, strongly restrict the possible angle range (angle 75 to angle 105), as trying to go too far may cause the gears to bind or be damaged.</li>\n<li>if that range doesn't allow full motion of the grabber, expand the range slightly and retest until a suitable range has been found.</li>\n<li>Remember,&nbsp;<em>don't be tempted to move the servo with your hand; the high torque may cause the gears to strip.</em>\n</li>\n</ul>\n<p>&nbsp;</p>\n<p><strong>Demonstrate</strong></p>\n<p>Once you've created the circuit and ensured proper alignment and rotation of the geared arms, find one of the&nbsp;<strong>3D-printed Cubes</strong>, which will be the materials to transport with the robot gripper. Create a short video showing how the gripper (held in your hand) can be used to pick up the cube.&nbsp;&nbsp;</p>\n<p><em>Submit the demonstration video here. Only one partner needs to submit.</em></p>\n<p><br>Your sample video should be similar to the example below.</p>\n<p><video id=\"media_comment_m-2eHBChQfUi3MHAnQy8tECM3Rx7ubjYpy\" class=\"instructure_inline_media_comment video_comment\" data-media_comment_type=\"video\" data-alt=\"\" style=\"width: 320px; height: 240px; display: inline-block;\" title=\"\" data-media-type=\"video\" allowfullscreen=\"allowfullscreen\" allow=\"fullscreen\" data-media-id=\"m-2eHBChQfUi3MHAnQy8tECM3Rx7ubjYpy\" loading=\"lazy\"><source src=\"media/web_resources/Uploaded-Media/Gripper-Sample-Video.mp4\" data-media-id=\"m-2eHBChQfUi3MHAnQy8tECM3Rx7ubjYpy\" data-media-type=\"video\"></video></p>\n\n"},{"id":"gc68dfb1143b6d9b2495acc92fa284b3e","kind":"assignment","title":"Robot Arm Assembly","nav_title":"Robot Arm Assembly","position":3,"published":true,"content_html":"<div class=\"item-meta\"><span class=\"meta-points\"><strong>Points:</strong> 1.0</span> &middot; <span class=\"meta-submission\"><strong>Submission type:</strong> online upload</span> &middot; <span class=\"meta-ext\"><strong>Allowed file types:</strong> mp4</span></div><p>It's time to finally create a robot arm!<span style=\"background-color: #ffff00;\"> With your partner</span>,&nbsp;<strong>follow the instructions below carefully.&nbsp;</strong>Make sure to read each step fully, as missing a step might cause a situation where you'd need to backtrack through several steps of the build to make the correction.</p>\n<p><img src=\"media/web_resources/meArm-Sample-Image.jpg\" alt=\"\" width=\"361\" height=\"271\" data-decorative=\"true\" data-api-endpoint=\"https://canvas.instructure.com/api/v1/courses/1676030/files/83125717\" data-api-returntype=\"File\" loading=\"lazy\"></p>\n<p><strong>Before you assemble any part of the arm, you must <span style=\"text-decoration: underline;\">Calibrate your Servos.</span></strong></p>\n<ul>\n<li>Take your four servos (labeled with tape: \"left\", \"right\", \"middle\", and \"claw\") and do the following two operations:\n<ul>\n<li>Run each in the test bed I've prepared to ensure the servo is in good working order (can pass through expected range of motion)</li>\n<li>Hook the four servos up to the calibration circuit to set the initial position for each servo\n<ul>\n<li>Once this is complete, mark the servos and add the horns&nbsp;<strong>as shown in the instructions</strong>\n</li>\n<li>Don't rush through these steps -<em> if you don't calibrate the servos correctly, the arm will not function as it should once you finish assembling it.</em>\n</li>\n</ul>\n</li>\n</ul>\n</li>\n</ul>\n<p>&nbsp;</p>\n<p><strong>Bill of Materials&nbsp;</strong><span style=\"background-color: #ffff00;\">(one set per pair)</span></p>\n<ul>\n<li>Bag of Laser-cut robot arm parts (either in acrylic or draftboard)</li>\n<li>Four 9g Servos</li>\n<li>m3 hardware:\n<ul>\n<li>nut x10</li>\n<li>6mm x 6</li>\n<li>8mm x15</li>\n<li>10mm x3</li>\n<li>12mm x 8</li>\n<li>20mm x 4</li>\n</ul>\n</li>\n</ul>\n<p>&nbsp;</p>\n<p><strong>Build Instructions</strong></p>\n<p><span style=\"background-color: #ff99cc;\">Have you calibrated your servos yet?</span> Don't proceed until this step is complete!</p>\n<p>You have a few different resources to guide you through the build process. You may use any combination of these resources, but if any step seems unclear, make sure to cross-reference with another resource <em>to see it presented in another way</em>.</p>\n<p><span style=\"text-decoration: underline;\">Official Manual PDF</span></p>\n<p style=\"padding-left: 40px;\"><span style=\"text-decoration: underline;\">T</span>hese instructions have <strong>illustrations and text</strong> showing how to assemble each part. They nicely itemize which numbered pieces and fasteners are needed for each step.</p>\n<p style=\"padding-left: 40px;\"><a class=\"instructure_file_link instructure_scribd_file\" title=\"meArm Manual.pdf\" href=\"media/web_resources/meArm-Manual.pdf\" data-api-endpoint=\"https://canvas.instructure.com/api/v1/courses/1676030/files/83126834\" data-api-returntype=\"File\">meArm Manual.pdf</a> &nbsp; &nbsp; &nbsp;</p>\n<p><br><span style=\"text-decoration: underline;\">Video Tutorial + Accompanying Written Instructions</span></p>\n<p style=\"padding-left: 40px;\">These instructions have a video, accompanied by photographs and text showing how to assemble the project. The video has a nice table of contents in the description that lets you jump to the appropriate part.&nbsp;</p>\n<p>&nbsp;</p>\n<p style=\"margin: 0in; font-family: Calibri; font-size: 11pt; padding-left: 40px;\"><a class=\"\" href=\"https://www.youtube.com/watch?v=zFBsEE7_NbQ\" data-preview-alt=\"Building the MeArm Robotic Arm\">Building the MeArm Robotic Arm</a><br><br></p>\n<p style=\"margin: 0in; font-family: Calibri; font-size: 11pt; padding-left: 40px;\"><a href=\"https://dronebotworkshop.com/assembling-the-mearm-robotic-arm/\">https://dronebotworkshop.com/assembling-the-mearm-robotic-arm/</a></p>\n<p>&nbsp;</p>\n<p><span style=\"text-decoration: underline;\">Instructable</span></p>\n<p style=\"padding-left: 40px;\">This website has written instructions and photographs.</p>\n<p style=\"margin: 0in; font-family: Calibri; font-size: 11pt; padding-left: 40px;\"><a href=\"https://www.instructables.com/id/MeArm-Robot-Arm-Your-Robot-V10/\">https://www.instructables.com/id/MeArm-Robot-Arm-Your-Robot-V10/</a></p>\n<p>&nbsp;</p>\n<p><strong>Submission:</strong></p>\n<p>This portion of the project will be marked in-person. Have me come and look at your constructed arm. This is a chance to identify any potential problems before wiring the servos and supplying power.</p>\n<p>If you are unable to show this to me in person (if handing it in late, for instance), you may take a short video where you show the arm from different views <em>(slowly rotate the camera or the arm so that the whole object is made visible).</em></p>\n<p style=\"margin: 0in; font-family: Calibri; font-size: 11.0pt;\">&nbsp;</p>\n<p style=\"margin: 0in; font-family: Calibri; font-size: 11.0pt;\">&nbsp;</p>\n<p style=\"margin: 0in; font-family: Calibri; font-size: 11.0pt;\">&nbsp;</p>\n<p style=\"margin: 0in; font-family: Calibri; font-size: 11.0pt;\">&nbsp;</p>\n<p style=\"margin: 0in; font-family: Calibri; font-size: 11.0pt;\">&nbsp;</p>\n\n"},{"id":"ga1ab72b8fee574eb3d024e2eb2753d4c","kind":"assignment","title":"Robot Arm Operation","nav_title":"Robot Arm Operation","position":4,"published":true,"content_html":"<div class=\"item-meta\"><span class=\"meta-points\"><strong>Points:</strong> 20.0</span> &middot; <span class=\"meta-submission\"><strong>Submission type:</strong> online upload</span> &middot; <span class=\"meta-ext\"><strong>Allowed file types:</strong> zip,ino,mp4,mov</span></div><p><em>To do:&nbsp; fully write up the assignment. For those of you here now, we talked about the details as a class...</em></p>\n<p>&nbsp;</p>\n<p><strong>Grade Scheme:</strong></p>\n<p>&nbsp;</p>\n<p><strong>14/20&nbsp; Assembled Robot Arm, no electronics or code</strong></p>\n<p style=\"padding-left: 40px;\"><em>Doesn't need to be submitted as an individual video IF one or both of the other items are complete and submitted. Can submit a video showing your assembled arm to get the 7/10 credit for now. You can complete the remaining challenge(s) throughout the remainder of the semester to increase your grade.</em></p>\n<p><em><strong><br><br></strong></em><strong>4/20&nbsp; Robot Arm Manual Control Circuit</strong></p>\n<p style=\"padding-left: 40px;\"><em>Construct a circuit using 4 potentiometers to allow manual control of the four articulations on your robot arm. This circuit will be similar to the earlier exercises we did with potentiometers and servos; reference those materials for a refresher if needed.</em></p>\n<p style=\"padding-left: 40px;\"><em>Hand in a video showing manual control of your robot arm to move 3D-printed cubes from a \"loading\" area to a \"dropoff\" area.<br><br></em></p>\n<p><strong>2/20&nbsp; &nbsp;Automatic Object Transport</strong></p>\n<p style=\"padding-left: 40px;\"><img src=\"media/web_resources/Sample-Autonomous-Arm.gif\" alt=\"Sample Animation of Automatic Object Transport\" loading=\"lazy\"></p>\n\n"}]},{"id":"gb27d60d67ae09bed548a2e9533ae18ea","slug":"25-week-01-3d-modeling-and-design","title":"Week 01 - 3D Modeling and Design","order":25,"items":[{"id":"g090d814b8d5392ecae82e902a2436f39","kind":"page","title":"How Grades will Work","nav_title":"How Grades will Work","position":1,"published":true,"content_html":"<p><iframe src=\"https://www.youtube.com/embed/jTOH2bBdsD4\" width=\"560\" height=\"315\" allowfullscreen=\"allowfullscreen\" allow=\"accelerometer; autoplay; encrypted-media; gyroscope; picture-in-picture\" loading=\"lazy\"></iframe></p>\n\n"},{"id":"g74f3bd3a70d0583f645d0ac3953711e1","kind":"page","title":"how to set up Autodesk Inventor","nav_title":"how to set
