<!doctype html>
<html>

<head>
  <meta charset="utf-8">
  <title>Quickstart Example 1</title>
  <link rel="icon" href="data:;base64,=">
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background-color: #2e2e2e; /* darker mid gray background */
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* Container for the editor */
    #editor {
      width: 85vw;
      height: 85vh;
      background-color: #3a3a3a; /* editor container slightly lighter gray */
      border-radius: 10px;
      box-shadow: 0 0 20px rgba(0, 0, 0, 0.4);
      overflow: hidden;
    }

    /* CodeMirror editor fills its container */
    .cm-editor {
      height: 100%;
      width: 100%;
      font-family: monospace;
      font-size: 15px;
    }

    /* Optional: tweak default CodeMirror theme colors for dark background */
    .cm-content {
      background-color: #999999;
      color: #eee;
    }
  </style>
</head>

<body>
  <div id="editor"></div>

  <script src="dist/cm6.bundle.js"></script>
  <script>
    const { createEditorState, createEditorView } = cm6;

    // Minimal extensions without autocomplete
    const extensions = [
      cm6.lineNumbers ? cm6.lineNumbers() : null,
      cm6.highlightActiveLine ? cm6.highlightActiveLine() : null,
      cm6.highlightActiveLineGutter ? cm6.highlightActiveLineGutter() : null,
      cm6.history ? cm6.history() : null,
      cm6.defaultHighlightStyle ? cm6.defaultHighlightStyle : null,
      cm6.bracketMatching ? cm6.bracketMatching() : null,
      cm6.closeBrackets ? cm6.closeBrackets() : null,
      cm6.keymap ? cm6.keymap : null
      // do NOT include autocomplete
    ].filter(Boolean); // remove nulls

    const initialState = createEditorState("", { extensions });

    const view = createEditorView(initialState, document.getElementById("editor"));

    // Optional: programmatically insert a comment
    view.dispatch({
      changes: { from: 0, insert: "// Create your solution here.\n" }
    });
  </script>
</body>

</html>
