<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Code Practice Editor</title>
  <style>
    html, body {
      height: 100%;
      margin: 0;
      background: #2e2e2e;
      font-family: monospace;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    #editor-container {
      width: 85vw;
      height: 85vh;
      border-radius: 8px;
      box-shadow: 0 0 20px rgba(0,0,0,0.4);
      background: #3a3a3a;
      overflow: hidden;
    }

    .cm-editor {
      height: 100%;
      width: 100%;
      font-size: 16px;
    }

    .cm-content {
      background-color: #3a3a3a;
      color: #eee;
    }

    .cm-scroller {
      overflow: auto !important;
    }
  </style>
</head>
<body>
  <div id="editor-container">
    <div id="editor"></div>
  </div>

  <script type="module">
    import { EditorState } from "https://cdn.jsdelivr.net/npm/@codemirror/state@6.5.2/+esm";
    import { EditorView, keymap, lineNumbers } from "https://cdn.jsdelivr.net/npm/@codemirror/view@6.36.4/+esm";
    import { javascript } from "https://cdn.jsdelivr.net/npm/@codemirror/lang-javascript@6.2.4/+esm";
    import { history, historyKeymap } from "https://cdn.jsdelivr.net/npm/@codemirror/commands@6.8.1/+esm";
  
    const startCode = `// Type your JavaScript here
  function hello() {
      console.log("Hello World");
  }`;
  
    const extensions = [
      lineNumbers(),                 // now imported correctly
      keymap.of(historyKeymap),
      history(),
      javascript({ jsx: true })
      // no autocomplete
    ];
  
    const state = EditorState.create({
      doc: startCode,
      extensions
    });
  
    const view = new EditorView({
      state,
      parent: document.getElementById('editor')
    });
  </script>
  
</body>
</html>
