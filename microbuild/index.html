<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Electronics Project Build Guide</title>
<style>
  body { font-family: Arial, sans-serif; margin: 0; padding: 0; }
  .container { display: flex; justify-content: center; align-items: center; height: 100vh; flex-direction: column; }
  .content { max-width: 800px; padding: 20px; text-align: center; animation: fade 0.5s ease-in-out; }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
  .nav-bottom { position: fixed; bottom: 0; left: 0; right: 0; display: flex; justify-content: center; background: #f8f8f8; padding: 10px 0; border-top: 1px solid #ccc; }
  .nav-bottom a { display: flex; flex-direction: column; align-items: center; margin: 0 15px; text-decoration: none; color: #333; transition: transform 0.2s ease, color 0.2s ease; }
  .nav-bottom a:hover { transform: scale(1.1); color: #007BFF; }
  .circle { width: 30px; height: 30px; border-radius: 50%; background: #ddd; display: flex; justify-content: center; align-items: center; margin-bottom: 5px; }
  .active .circle { background: #007BFF; color: white; }
  .arrow { position: fixed; top: 50%; transform: translateY(-50%); font-size: 2em; color: #333; text-decoration: none; padding: 10px; transition: transform 0.2s ease, color 0.2s ease; }
  .arrow:hover { transform: translateY(-50%) scale(1.2); color: #007BFF; }
  .arrow.left { left: 2%; }
  .arrow.right { right: 2%; }
  .scrollable { max-height: calc(100vh - 100px); overflow-y: auto; }
</style>
</head>
<body>

<div class="container">
  <a href="#" class="arrow left" onclick="prevStep()" id="prevArrow">&#8592;</a>
  <div class="content scrollable" id="content"></div>
  <a href="#" class="arrow right" onclick="nextStep()" id="nextArrow">&#8594;</a>
</div>

<div class="nav-bottom" id="nav">
  <a href="#" class="active" onclick="showStep(0)"><div class="circle">0</div><div>Overview</div></a>
  <a href="#" onclick="showStep(1)"><div class="circle">1</div><div>Wheel & Motor</div></a>
  <a href="#" onclick="showStep(2)"><div class="circle">2</div><div>Ultrasonic</div></a>
  <a href="#" onclick="showStep(3)"><div class="circle">3</div><div>Front Skid</div></a>
  <a href="#" onclick="showStep(4)"><div class="circle">4</div><div>Main Assembly</div></a>
  <a href="#" onclick="showStep(5)"><div class="circle">5</div><div>Wiring</div></a>
  <a href="#" onclick="showStep(6)"><div class="circle">6</div><div>First Drive</div></a>
</div>

<script>
const steps = [
  `<h2>Overview</h2><p>Welcome to the build guide! This guide will walk you through assembling and wiring your project.</p>`,
  `<h2>Wheel & Motor Assembly</h2><img src="placeholder1.png" alt="Wheel Assembly"><p>Attach the wheels to the motors and secure with screws.</p>`,
  `<h2>Ultrasonic Sensor Assembly</h2><img src="placeholder2.png" alt="Ultrasonic Assembly"><p>Assemble the ultrasonic sensor with its mount.</p>`,
  `<h2>Front Skid and QTI Sensor Array Assembly</h2><img src="placeholder3.png" alt="Front Skid"><p>Attach the skid and sensor array to the chassis.</p>`,
  `<h2>Main Assembly</h2><p>1. Add wheel assemblies to chassis plate.<br>2. Add crickit board.<br>3. Add front skid.<br>4. Add battery holder.<br>5. Add ultrasonic sensors.<br>6. Add neopixel strip.<br>7. Add microbit.</p>`,
  `<h2>Wiring</h2><p>Connect each component to the correct pins as listed in the wiring diagram.</p>`,
  `<h2>First Drive and Calibration</h2>
   <p>Before starting programming and driving, let's test our wiring and components.</p>
   <ol>
     <li><strong>Motor Direction:</strong> Open a new MakeCode project, add the Crickit extension, and add a single block: <em>"Crickit Tank Motors 100% 100%"</em>. When you upload this program and power on the crickit board your robot car should turn both motors so that the car drives <strong>forward</strong>. If either (or both) wheels aren't driving forward, turn OFF the crickit board and swap the wire positions for that motor.</li>
     <li><strong>Driving Straight:</strong> Once both wheels turn the correct direction, let your robot drive "straight". It will likely curve in one direction — this is normal. To compensate, slow the motor on the <em>opposite side of the curve</em> slightly. For example: <em>"Crickit Tank Motors 93% 100%"</em>. This won't be perfect, but you can find numbers that work well enough for your robot through testing.</li>
   </ol>`
];

let currentStep = 0;

function showStep(step) {
  if (step < 0 || step >= steps.length) return;
  const content = document.getElementById('content');
  content.style.opacity = 0;
  setTimeout(() => {
    content.innerHTML = steps[step];
    content.style.opacity = 1;
  }, 200);
  currentStep = step;
  updateNav();
}

function prevStep() { showStep(currentStep - 1); }
function nextStep() { showStep(currentStep + 1); }

function updateNav() {
  const links = document.querySelectorAll('.nav-bottom a');
  links.forEach((link, index) => {
    link.classList.toggle('active', index === currentStep);
  });
  document.getElementById('prevArrow').style.display = currentStep === 0 ? 'none' : 'block';
  document.getElementById('nextArrow').style.display = currentStep === steps.length - 1 ? 'none' : 'block';
}

showStep(currentStep);
</script>

</body>
</html>
