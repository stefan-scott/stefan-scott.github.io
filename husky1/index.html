<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Simple Photo Grid</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 40px;
      background: #fafafa;
    }

    h1 {
      margin-top: 60px;
      margin-bottom: 20px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
      max-width: 900px;
    }

    .grid img {
      width: 100%;
      aspect-ratio: 2 / 3; /* portrait ratio */
      object-fit: cover;
      border-radius: 8px;
      background: #ddd;
    }
  </style>
</head>
<body>

  <h1>Version 1: Actors & Actresses</h1>
  <div class="grid">
    <!-- 3 male, 3 female actor portraits -->
    <img src="https://images.unsplash.com/photo-1529626455594-4ff0802cfb7e?auto=format&fit=crop&w=600&h=900&q=80" alt="Female actress portrait" />
    <img src="https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?auto=format&fit=crop&w=600&h=900&q=80" alt="Male actor portrait" />
    <img src="https://images.unsplash.com/photo-1544005313-94ddf0286df2?auto=format&fit=crop&w=600&h=900&q=80" alt="Female actress portrait" />

    <img src="https://images.unsplash.com/photo-1547425260-76bcadfb4f2c?auto=format&fit=crop&w=600&h=900&q=80" alt="Male actor portrait" />
    <img src="https://images.unsplash.com/photo-1520813792240-56fc4a3765a7?auto=format&fit=crop&w=600&h=900&q=80" alt="Male actor portrait" />
    <img src="https://images.unsplash.com/photo-1524504388940-b1c1722653e1?auto=format&fit=crop&w=600&h=900&q=80" alt="Female actress portrait" />
  </div>

  <h1>Version 2: Animals</h1>
  <div class="grid">
    <!-- 2 cats, 2 dogs, 2 other animals -->
    <img src="https://images.unsplash.com/photo-1518791841217-8f162f1e1131?auto=format&fit=crop&w=600&h=900&q=80" alt="Cat" />
    <img src="https://images.unsplash.com/photo-1517849845537-4d257902454a?auto=format&fit=crop&w=600&h=900&q=80" alt="Dog" />
    <img src="https://images.unsplash.com/photo-1526336024174-e58f5cdd8e13?auto=format&fit=crop&w=600&h=900&q=80" alt="Cat" />

    <img src="https://images.unsplash.com/photo-1518717758536-85ae29035b6d?auto=format&fit=crop&w=600&h=900&q=80" alt="Dog" />
    <img src="https://images.unsplash.com/photo-1500534314209-a25ddb2bd429?auto=format&fit=crop&w=600&h=900&q=80" alt="Fox" />
  </div>

</body>
</html>
