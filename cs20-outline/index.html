cf817a0a21dda20a8e6f5428e7aac","kind":"page","title":"Variables and Data","nav_title":"Variables and Data","published":true,"content_html":"<p><iframe allowfullscreen=\"allowfullscreen\" height=\"569\" loading=\"lazy\" mozallowfullscreen=\"mozallowfullscreen\" src=\"https://docs.google.com/presentation/d/e/2PACX-1vQbWUm28rIuwCt0nmw1z0nyERg2GbLlaSsi6uoE1bIlUu6kb9hv5I4im4JaQhGPL6qLDSY4NrkPs2r3/embed?start=false&amp;loop=false&amp;delayms=3000\" webkitallowfullscreen=\"webkitallowfullscreen\" width=\"960\"></iframe></p>","position":4},{"id":"g531f258fb3a7463123819bf52a55a587","kind":"page","title":"Flow Charts","nav_title":"Flow Charts","published":true,"content_html":"<p><iframe allowfullscreen=\"allowfullscreen\" height=\"569\" loading=\"lazy\" mozallowfullscreen=\"mozallowfullscreen\" src=\"https://docs.google.com/presentation/d/e/2PACX-1vS-7HBBDjWRoZrNsJVhiI6aMYxX1BnA4aeMcUyeugLn5svZFzrOYYbJYjQDg0qKssxdZOwnrcm1fZbp/embed?start=false&amp;loop=false&amp;delayms=3000\" webkitallowfullscreen=\"webkitallowfullscreen\" width=\"960\"></iframe></p>","position":5},{"id":"g76a7b74488c2b9eacfb9b411606f38b7","kind":"page","title":"Patterns and Pattern Recognition","nav_title":"Patterns and Pattern Recognition","published":true,"content_html":"<iframe allowfullscreen=\"true\" frameborder=\"0\" height=\"569\" loading=\"lazy\" mozallowfullscreen=\"true\" src=\"https://docs.google.com/presentation/d/e/2PACX-1vQ6LQKnFaMMW2TGtBa4PAkWSAhmEDO2Q3li4FWln0_ig5EVpU13b9eRO3av9QzzRo0Y2R8eIwB54L63/embed?start=false&amp;loop=false&amp;delayms=3000\" webkitallowfullscreen=\"true\" width=\"960\"></iframe>","position":6}]},{"id":"gdcd327faba249ba761dbab487cb3232c","slug":"04-scratch-01-visual-programming-and-problem-solving","title":"Scratch 01:  Visual Programming and Problem-Solving","order":4,"items":[{"id":"gaf5e2a20b8a9e1de94bc40c4ca141a03","kind":"quiz","title":"Practice Quiz One:  Stage, Broadcasts, Sounds","nav_title":"Practice Quiz One:  Stage, Broadcasts, Sounds","published":true,"content_html":"<div class=\"item-meta\"><span class=\"meta-points\"><strong>Points:</strong> 6.0</span></div><p>This practice quiz is connected to our first few days of class, and will help prepare you for the first graded quiz!</p><div class=\"qz-questions\">\n<div class=\"qz-question\"><h3 class=\"qz-qtitle\">Scratch - Stage</h3>\n<div class=\"qz-qtext\"><div>\n<p><span>Assuming a stage width of </span><span>4</span><span>8</span><span>0</span><span> and a stage height of </span><span>3</span><span>6</span><span>0</span><span>,</span><span> what is the current y-position of Scratch?</span></p>\n<p><span><img alt=\"\" height=\"269\" loading=\"lazy\" src=\"https://sps.blackboard.com/bbcswebdav/xid-1294534_1\" width=\"324\"/></span></p>\n<p><img alt=\"Stage Question\" loading=\"lazy\" src=\"media/web_resources/W01-Q-04-.JPG\"/></p>\n</div></div>\n<ul class=\"qz-choices\">\n<li class=\"qz-choice qz-correct\"><span class=\"qz-mark\">&#10003;</span> 90</li>\n<li class=\"qz-choice\"><span class=\"qz-mark\"></span> 0</li>\n<li class=\"qz-choice\"><span class=\"qz-mark\"></span> 360</li>\n<li class=\"qz-choice\"><span class=\"qz-mark\"></span> -180</li>\n</ul>\n</div>\n<div class=\"qz-question\"><h3 class=\"qz-qtitle\">Scratch - Stage</h3>\n<div class=\"qz-qtext\"><div>\n<p><span>Assuming a stage width of 480 and a stage height of 360, what is the current </span><strong>x-position</strong><span> of Scratch?</span></p>\n<p><img alt=\"\" data-decorative=\"true\" loading=\"lazy\" src=\"media/web_resources/assessment_questions/W01-Q-06.JPG\"/></p>\n</div></div>\n<ul class=\"qz-choices\">\n<li class=\"qz-choice qz-correct\"><span class=\"qz-mark\">&#10003;</span> 240</li>\n<li class=\"qz-choice\"><span class=\"qz-mark\"></span> 480</li>\n<li class=\"qz-choice\"><span class=\"qz-mark\"></span> -120</li>\n<li class=\"qz-choice\"><span class=\"qz-mark\"></span> 0</li>\n</ul>\n</div>\n<div class=\"qz-question\"><h3 class=\"qz-qtitle\">Question</h3>\n<div class=\"qz-qtext\"><div>\n<p>What type of program behavior would you expect to happen when the following script is manually activated?</p>\n<p><img alt=\"if.JPG\" height=\"195\" loading=\"lazy\" src=\"media/web_resources/assessment_questions/if.JPG\" width=\"299\"/></p>\n</div></div>\n<ul class=\"qz-choices\">\n<li class=\"qz-choice qz-correct\"><span class=\"qz-mark\">&#10003;</span> Short movement by sprite and a possible rotation.</li>\n<li class=\"qz-choice\"><span class=\"qz-mark\"></span> Sprite will move back and forth across the screen.</li>\n<li class=\"qz-choice\"><span class=\"qz-mark\"></span> Sprite will move across screen and turn 90 to the right each time it hits a wall.</li>\n<li class=\"qz-choice\"><span class=\"qz-mark\"></span> No action</li>\n</ul>\n</div>\n<div class=\"qz-question\"><h3 class=\"qz-qtitle\">Scratch - Broadcast Events</h3>\n<div class=\"qz-qtext\"><div>\n<p>Predict the behavior of the following scripts when the green flag is clicked.</p>\n<p><img alt=\"\" data-decorative=\"true\" height=\"373\" loading=\"lazy\" src=\"media/web_resources/Scratch-Q01P-01.PNG\" width=\"581\"/></p>\n</div></div>\n<ul class=\"qz-choices\">\n<li class=\"qz-choice qz-correct\"><span class=\"qz-mark\">&#10003;</span> The sprite will say \"Beta\" followed by \"Charlie\"</li>\n<li class=\"qz-choice\"><span class=\"qz-mark\"></span> The sprite will say \"Alpha\", followed by \"Beta\", followed by \"Charlie\"</li>\n<li class=\"qz-choice\"><span class=\"qz-mark\"></span> The sprite will say \"Charlie\" only</li>\n<li class=\"qz-choice\"><span class=\"qz-mark\"></span> The sprite will say \"Beta\" only</li>\n<li class=\"qz-choice\"><span class=\"qz-mark\"></span> The sprite will say \"Alpha\" only</li>\n<li class=\"qz-choice\"><span class=\"qz-mark\"></span> The sprite will continuously say \"Alpha\", \"Beta\", \"Charlie\" over and over forever.</li>\n</ul>\n</div>\n</div>","position":2},{"id":"g71961a6a70278d18dc49a324d707a36d","kind":"assignment","title":"Scratch Artist","nav_title":"Scratch Artist","published":true,"content_html":"<div class=\"item-meta\"><span class=\"meta-points\"><strong>Points:</strong> 10.0</span> &middot; <span class=\"meta-submission\"><strong>Submission type:</strong> online upload</span> &middot; <span class=\"meta-ext\"><strong>Allowed file types:</strong> sb3</span></div><p dir=\"ltr\"><img alt=\"artist.PNG\" loading=\"lazy\" src=\"media/web_resources/Uploaded-Media/artist.PNG\"/></p>\n<p dir=\"ltr\">This will add all of the pen blocks that you’ll need for this project.</p>\n<p><br/><br/></p>\n<p dir=\"ltr\"><span style=\"font-size: 18pt;\"><strong>Base Feature Requirements</strong></span></p>\n<p> </p>\n<p dir=\"ltr\"><i>Completing the following basic features will allow for a maximum grade of 9/10. The remaining Challenge Features will account for the remaining 1 mark.</i></p>\n<p> </p>\n<ol>\n<li dir=\"ltr\">\n<p dir=\"ltr\">Create a program that features one sprite (choose any that you want). When the green flag is pressed, this sprite should begin at the origin (0,0), and choose a random direction to move automatically<br/><br/></p>\n<ul>\n<li dir=\"ltr\">\n<p dir=\"ltr\">As it moves, it should use the pen to draw a trail of its motion.</p>\n</li>\n<li dir=\"ltr\">\n<p dir=\"ltr\">Whenever an edge of the stage is encountered, the sprite should bounce.</p>\n</li>\n<li dir=\"ltr\">Movement must use the <strong>move</strong><strong> block.</strong>  No <span style=\"text-decoration: underline;\">glides</span> or <span style=\"text-decoration: underline;\">goto</span> blocks for this feature.</li>\n</ul>\n<br/>\n<p> </p>\n</li>\n</ol>\n<ol start=\"2\">\n<li dir=\"ltr\">\n<p dir=\"ltr\">This project should include both<span> </span><strong>background<span> </span></strong><strong>music<span> </span></strong>as well as<span> </span><strong>sound<span> </span></strong><strong>effects</strong>.<br/><br/></p>\n<ul>\n<li dir=\"ltr\">\n<p dir=\"ltr\">When the green flag is pressed, start some background music. This should play continually until the user stops the program.</p>\n</li>\n<li dir=\"ltr\">\n<p dir=\"ltr\">Have a sound effect play whenever the sprite bounces on the edges of the stage<br/>      <span style=\"color: #e03e2d;\">HINT:</span>   <span style=\"color: #7e8c8d;\">The <img alt=\"Scratch - If on edge bounce.PNG\" height=\"53\" loading=\"lazy\" src=\"media/web_resources/Uploaded-Media/Scratch-If-on-edge-bounce.PNG\" width=\"127\"/> is needed, but you have your program handle the sound effect <strong>first.</strong> This is because the \"bounce\" action spins the character and often they will no longer be touching the edge. Use <img alt=\"Scratch - If touching edge.PNG\" height=\"87\" loading=\"lazy\" src=\"media/web_resources/Uploaded-Media/Scratch-If-touching-edge.PNG\" width=\"214\"/> to help with adding a sound effect each time the sprite runs into the edge of the stage.</span></p>\n</li>\n</ul>\n<br/>\n<p> </p>\n</li>\n</ol>\n<ol start=\"3\">\n<li dir=\"ltr\">\n<p dir=\"ltr\">Allow the pen characteristics to be modified by the user as follows:<br/><br/></p>\n<ul>\n<li dir=\"ltr\">\n<p dir=\"ltr\">The<strong><span> </span>Z key</strong><span> </span>will decrease the size of the pen</p>\n</li>\n<li dir=\"ltr\">\n<p dir=\"ltr\">The<strong><span> </span>X key</strong><span> </span>will increase the size of the pen</p>\n</li>\n<li dir=\"ltr\">\n<p dir=\"ltr\">The<strong><span> </span>C key</strong><span> </span>will change the colour of the pen</p>\n</li>\n<li>The<strong><span> </span>R key</strong><span> </span>will reset the drawing (erase all)</li>\n</ul>\n<br/>\n<p> </p>\n</li>\n</ol>\n<p> </p>\n<p dir=\"ltr\"><span style=\"font-size: 18pt;\"><strong>Challenge Features</strong></span><br/><br/></p>\n<ol>\n<li dir=\"ltr\">\n<p dir=\"ltr\">Add a second sprite into the sketch, whose<span> </span><strong>movement will be controlled by the user</strong>.</p>\n<ul>\n<li dir=\"ltr\">\n<p dir=\"ltr\">Use the four arrow keys (  ↑ ← ↓ → ) to control the sprite’s x-position and y-position.</p>\n</li>\n<li dir=\"ltr\">\n<p dir=\"ltr\">Use pen commands to make this sprite draw a line wherever it moves</p>\n</li>\n</ul>\n<p> </p>\n</li>\n<li>Allow this sprite’s <strong>pen size</strong> and <strong>pen colour </strong>to be changed whenever this sprite touches the other (bouncing) sprite, according to the following scheme:\n<ul>\n<li>If the user-controlled sprite is on the left half of the screen:\n<ul>\n<li>Change the pen size by 2</li>\n</ul>\n</li>\n<li>If the user-controlled sprite is on the right half of the screen:\n<ul>\n<li>Change the pen colour by 10</li>\n</ul>\n</li>\n</ul>\n</li>\n</ol>\n<p> </p>\n<p dir=\"ltr\"> </p>","position":3},{"id":"g0c3d2c9fc83798f3424d2eec9f96f4da","kind":"assignment","title":"Make an Interactive Short Story","nav_title":"Make an Interactive Short Story","published":true,"content_html":"<div class=\"item-meta\"><span class=\"meta-points\"><strong>Points:</strong> 5.0</span> &middot; <span class=\"meta-submission\"><strong>Submission type:</strong> online upload</span> &middot; <span class=\"meta-ext\"><strong>Allowed file types:</strong> sb3,zip</span></div><p>To experiment with <i>creating your own events</i> <i>with broadcasts and taking user inpu</i><i>t</i>, create an interactive short story or play. Create characters, experiment with moving sprites around the stage – it’s up to you!</p>\n<p><strong><img alt=\"Interactive A2 - 01.PNG\" height=\"252\" loading=\"lazy\" src=\"media/web_resources/Uploaded-Media/Interactive-A2-01.PNG\" width=\"708\"/><br/></strong></p>\n<p><strong>Base Features<br/></strong></p>\n<ol>\n<li dir=\"ltr\">\n<p dir=\"ltr\">Within your story, you must include the following components:</p>\n<ul>\n<li dir=\"ltr\">\n<p dir=\"ltr\">At least one Backdrop</p>\n</li>\n<li dir=\"ltr\">\n<p dir=\"ltr\">At least two characters</p>\n</li>\n<li dir=\"ltr\">\n<p dir=\"ltr\">At least<strong> five broadcast statements</strong></p>\n</li>\n</ul>\n<p><span style=\"color: var(--ic-brand-font-color-dark); font-family: inherit; font-size: 1rem;\">Broadcasts must be named appropriately (“bear appears” rather than “message1\")<br/><br/></span></p>\n</li>\n<li dir=\"ltr\">\n<p><span style=\"color: var(--ic-brand-font-color-dark); font-family: inherit; font-size: 1rem;\">Ask the user at least one question (using the ask block)</span></p>\n</li>\n</ol>\n<div class=\"editor-indent\">\n<ul>\n<li style=\"list-style-type: none;\">\n<ul>\n<li>The <strong>answer to this question </strong>should be used in an IF or IF/ELSE statement so that the user’s response impacts what happens in the story.</li>\n</ul>\n</li>\n</ul>\n</div>\n<p><img alt=\"Interactive A2 - 02.PNG\" loading=\"lazy\" src=\"media/web_resources/Uploaded-Media/Interactive-A2-02.PNG\"/></p>\n<p><strong>Challenge Features</strong></p>\n<ol>\n<li dir=\"ltr\">\n<p dir=\"ltr\">Incorporate a second user-input question that is used in a condition</p>\n</li>\n<ul>\n<li dir=\"ltr\">\n<p dir=\"ltr\">Using the <strong>ask </strong>block for user-input</p>\n</li>\n<li dir=\"ltr\">\n<p dir=\"ltr\">Using the answer block inside an <strong>IF</strong> or<strong> IF/ELSE </strong>blocks<br/><br/></p>\n</li>\n</ul>\n<li dir=\"ltr\">\n<p dir=\"ltr\">Include some image or costume effects that are applied depending on the user’s input</p>\n</li>\n</ol>\n<p> </p>\n<p><strong>Outcomes</strong></p>\n<p>CP1, FP3</p>","position":4},{"id":"ga38040c21a6749623827f2f50ecd146e","kind":"quiz","title":"Scratch Quiz One: Stage, Broadcasts, Sound","nav_title":"Scratch Quiz One: Stage, Broadcasts, Sound","published":true,"content_html":"<div class=\"item-meta\"><span class=\"meta-points\"><strong>Points:</strong> 5.0</span></div><p>A quiz to check your understanding of the the basics of the Scratch environment.  Solve only with your brain!</p><div class=\"qz-questions\">\n<div class=\"qz-question\"><h3 class=\"qz-qtitle\">Scratch - Stage</h3>\n<div class=\"qz-qtext\"><div>\n<p><span>Assuming a stage width of<span class=\"Apple-converted-space\"> </span></span><span>4</span><span>8</span><span>0</span><span><span class=\"Apple-converted-space\"> </span>and a stage height of<span class=\"Apple-converted-space\"> </span></span><span>3</span><span>6</span><span>0</span><span>,</span><span> what is the current y-position of Scratch?</span></p>\n<p><span><img alt=\"\" data-decorative=\"true\" loading=\"lazy\" src=\"media/web_resources/W01-Q-05-.JPG\"/></span></p>\n</div></div>\n<ul class=\"qz-choices\">\n<li class=\"qz-choice qz-correct\"><span class=\"qz-mark\">&#10003;</span> -90</li>\n<li class=\"qz-choice\"><span class=\"qz-mark\"></span> 90</li>\n<li class=\"qz-choice\"><span class=\"qz-mark\"></span> 180</li>\n<li class=\"qz-choice\"><span class=\"qz-mark\"></span> -180</li>\n</ul>\n</div>\n<div class=\"qz-question\"><h3 class=\"qz-qtitle\">Scratch - Stage</h3>\n<div class=\"qz-qtext\"><div>\n<table class=\"questionShell key-valueTable\" id=\"questionShellkey-valueTable\" style=\"height: 81px;\" summary=\"\">\n<tbody>\n<tr style=\"height: 81px;\">\n<td style=\"height: 81px; width: 679.036px;\">\n<div class=\"vtbegenerated inlineVtbegenerated\">\n<p><span>Assuming a stage width of<span class=\"Apple-converted-space\"> </span></span><span>4</span><span>8</span><span>0</span><span><span class=\"Apple-converted-space\"> </span>and a stage height of<span class=\"Apple-converted-space\"> </span></span><span>3</span><span>6</span><span>0</span><span>,</span><span> what is the current y-position of Scratch?</span></p>\n</div>\n</td>\n</tr>\n</tbody>\n</table>\n<p><img alt=\"\" data-decorative=\"true\" loading=\"lazy\" src=\"media/web_resources/W01-Q-02.JPG\"/></p>\n</div></div>\n<ul class=\"qz-choices\">\n<li class=\"qz-choice qz-correct\"><span class=\"qz-mark\">&#10003;</span> 0</li>\n<li class=\"qz-choice\"><span class=\"qz-mark\"></span> 240</li>\n<li class=\"qz-choice\"><span class=\"qz-mark\"></span> -180</li>\n<li class=\"qz-choice\"><span class=\"qz-mark\"></span> 180</li>\n</ul>\n</div>\n<div class=\"qz-question\"><h3 class=\"qz-qtitle\">Scratch - Broadcasts</h3>\n<div class=\"qz-qtext\"><div><p>Predict what will be said (and in what order) by the sprite that has the following scripts (when the green flag is pressed),</p>\n<p><img alt=\"\" data-decorative=\"true\" loading=\"lazy\" src=\"media/web_resources/Scratch-Broadcast-Q01b.PNG\"/></p></div></div>\n<ul class=\"qz-choices\">\n<li class=\"qz-choice qz-correct\"><span class=\"qz-mark\">&#10003;</span> Go Bears! Go Bears!</li>\n<li class=\"qz-choice\"><span class=\"qz-mark\"></span> Go Bears! Go Bears! Go Bears!</li>\n<li class=\"qz-choice\"><span class=\"qz-mark\"></span> Go Go Bears! Go Bears!</li>\n<li class=\"qz-choice\"><span class=\"qz-mark\"></span> Go Bears!</li>\n</ul>\n</div>\n<div class=\"qz-question\"><h3 class=\"qz-qtitle\">Scratch - Broadcasts</h3>\n<div class=\"qz-qtext\"><div>\n<p>When the following scripts are activated, what will be said by the sprite (in the correct order, of course!)</p>\n<p> </p>\n<p><img alt=\"\" loading=\"lazy\" src=\"media/web_resources/Scratch-Broadcast-Q03.PNG\"/></p>\n</div></div>\n<ul class=\"qz-choices\">\n<li class=\"qz-choice qz-correct\"><span class=\"qz-mark\">&#10003;</span> Tapioca  Lemon  Banana</li>\n<li class=\"qz-choice\"><span class=\"qz-mark\"></span> Lemon Tapioca Banana</li>\n<li class=\"qz-choice\"><span class=\"qz-mark\"></span> Tapioca Banana Lemon</li>\n<li class=\"qz-choice\"><span class=\"qz-mark\"></span> Lemon Banana Tapioca</li>\n<li class=\"qz-choice\"><span class=\"qz-mark\"></span> Banana Tapioca Lemon</li>\n<li class=\"qz-choice\"><span class=\"qz-mark\"></span> Banana Lemon Tapioca</li>\n</ul>\n</div>\n</div>","position":5}]},{"id":"g723b07093524102ff34fc22935e12d83","slug":"05-scratch-02-decision-making-and-repetition","title":"Scratch 02: Decision-Making and Repetition","order":5,"items":[{"id":"g46d23a5db0236ffac985e661c5235cb3","kind":"file","title":"Sheet.png","nav_title":"Costume Demo: Sheet.png","published":true,"media_path":"media/web_resources/Sheet.png","position":1},{"id":"g1682351047766026f8293acd959d8342","kind":"assignment","title":"Costume Changer","nav_title":"Costume Changer","published":true,"content_html":"<div class=\"item-meta\"><span class=\"meta-points\"><strong>Points:</strong> 10.0</span> &middot; <span class=\"meta-submission\"><strong>Submission type:</strong> online upload</span> &middot; <span class=\"meta-ext\"><strong>Allowed file types:</strong> sb3</span></div><p>This program should showcase your ability to create more complex animations through the use of sprite costumes.<br/><img alt=\"Scratch M02 - A02 - I01.png\" height=\"184\" loading=\"lazy\" src=\"media/web_resources/Uploaded-Media/Scratch-M02-A02-I01.png\" width=\"825\"/><br/> </p>\n<p><span style=\"font-size: 14pt;\"><strong>Base Features </strong></span></p>\n<ol style=\"list-style-type: decimal;\">\n<li>At least one sprite from the sprite library move around the stage autonomously (not controlled by the user) and cycle through its costumes appropriately. Make sure to choose a sprite that has more than one costume!<br/><br/>\n</li>\n<li>A sprite from a custom spritesheet should be controlled by user keyboard input (arrow keys).<br/><br/>\n<ul style=\"list-style-type: disc;\">\n<li>searching for \"spritesheet\" will yield many options. Refer to the videos below for how to rip images from a spritesheet and upload them to Scratch.</li>\n<li>animate this sprite by cycling through costumes using a repeat (loop) block.</li>\n<li>There must be at least 4 costumes in the animation that is continually being cycled.</li>\n</ul>\n</li>\n<li>\n<p>If you are working on a computer without any graphics applications installed, there are web-based alternatives. One option is <a href=\"https://www.photopea.com/\">https://www.photopea.com/</a></p>\n</li>\n<li>\n<p>Your program should use <strong>two different backdrops</strong>. One should be displayed when the sprite controlled by the user is on the left half of the stage, and the other should be used when that sprite is on the right half.</p>\n</li>\n</ol>\n<p> </p>\n<p><span style=\"font-size: 14pt;\"><strong>Challenge Features</strong></span></p>\n<ol>\n<li>\n<p>Add 2 additional \"actions\" (additional sets of animation frames)  that are displayed through the use of different costumes and are activated by keyboard input.</p>\n<ul style=\"list-style-type: disc;\">\n<li>When no buttons are pressed, an <strong>idle animation</strong> should continue to loop</li>\n<li>You'll need to use some logic to distinguish between when <em>particular buttons are pressed</em> and <em>when those particular buttons are <strong>not pressed...</strong></em>\n</li>\n</ul>\n</li>\n</ol>\n<p> </p>\n<p><span style=\"font-size: 14pt;\"><strong>Sample Output</strong></span></p>\n<p><em>A solution may look something like this example:</em></p>\n<div>\n<div>\n<div aria-label=\"Video Player\" data-setup-lazy='{\"techOrder\": [\"youtube\"], \"sources\": [{\"type\": \"video/youtube\", \"src\":\"https://youtu.be/gJKXc8uxObw\"}], \"language\": \"en\", \"fluid\": true}' id=\"id_videojs_626979d16e6d6_1\" role=\"region\" title=\"gJKXc8uxObw\">\n<div><iframe allow=\"accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture\" allowfullscreen=\"allowfullscreen\" height=\"360\" id=\"id_videojs_626979d16e6d6_1_youtube_api\" loading=\"lazy\" src=\"https://www.youtube.com/embed/gJKXc8uxObw?controls=0&amp;modestbranding=1&amp;rel=0&amp;showinfo=0&amp;loop=0&amp;fs=0&amp;hl=en&amp;enablejsapi=1&amp;origin=https%3A%2F%2Fmoodle4u.portagecollege.ca&amp;widgetid=1\" title=\"YouTube video player\" width=\"640\"></iframe></div>\n</div>\n</div>\n</div>\n<p><br/><br/><span style=\"font-size: 14pt;\"><strong>How to Rip images from a Spritesheet</strong></span><br/>Using Photoshop (if you have access to it):     </p>\n<div>\n<div>\n<div aria-label=\"Video Player\" data-setup-lazy='{\"techOrder\": [\"youtube\"], \"sources\": [{\"type\": \"video/youtube\", \"src\":\"https://www.youtube.com/watch?v=Sbtq5qoeJFQ\"}], \"language\": \"en\", \"fluid\": true}' id=\"id_videojs_626979d16e897_2\" role=\"region\" title=\"watch\">\n<div><iframe allow=\"accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture\" allowfullscreen=\"allowfullscreen\" height=\"360\" id=\"id_videojs_626979d16e897_2_youtube_api\" loading=\"lazy\" src=\"https://www.youtube.com/embed/Sbtq5qoeJFQ?controls=0&amp;modestbranding=1&amp;rel=0&amp;showinfo=0&amp;loop=0&amp;fs=0&amp;hl=en&amp;enablejsapi=1&amp;origin=https%3A%2F%2Fmoodle4u.portagecollege.ca&amp;widgetid=2\" title=\"YouTube video player\" width=\"640\"></iframe></div>\n</div>\n</div>\n</div>\n<p> </p>\n<p>Using Photopea (free, web-based):   </p>\n<div>\n<div>\n<iframe allow=\"accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture\" allowfullscreen=\"allowfullscreen\" height=\"315\" loading=\"lazy\" src=\"https://www.youtube.com/embed/YuIzYZ9UbJ0\" title=\"YouTube video player\" width=\"560\"></iframe>\n<div>\n<p dir=\"ltr\"> </p>\n<p dir=\"ltr\" id=\"yui_3_17_2_1_1650866815541_30\"><span style=\"font-family: verdana, geneva, sans-serif; font-size: 14pt;\"><strong>Submission Details</strong></span><br/><br/></p>\n<p dir=\"ltr\" style=\"padding-left: 40px;\">For this project, you should submit your work as a <strong>.sb3 file.</strong></p>\n<p dir=\"ltr\" style=\"padding-left: 40px;\">You can download the sb3 file directly from the scratch editor.  <strong>File → Save to your Computer<br/><br/></strong><strong><img alt=\"Scratch - Save to your computer.png\" loading=\"lazy\" src=\"media/web_resources/Uploaded-Media/Scratch-Save-to-your-computer.png\"/><br/> </strong></p>\n</div>\n</div>\n</div>","position":4},{"id":"g3be3ffe98293ec6a0dd7631ca8f82e5a","kind":"page","title":"Videos: Extracting Costumes from Spritesheets","nav_title":"Videos: Extracting Costumes from Spritesheets","published":true,"content_html":"<p><span style=\"font-size: 14pt;\"><strong>How to Rip images from a Spritesheet</strong></span></p>\n<p>Using Photopea (free, web-based):   </p>\n<div>\n<div><iframe allow=\"accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture\" allowfullscreen=\"allowfullscreen\" height=\"315\" loading=\"lazy\" src=\"https://www.youtube.com/embed/YuIzYZ9UbJ0\" title=\"YouTube video player\" width=\"560\"></iframe>\n<div>\n<p dir=\"ltr\"> </p>\n</div>\n</div>\n</div>\n<p>Using Photoshop (if you have access to it):     </p>\n<div>\n<div>\n<div aria-label=\"Video Player\" data-setup-lazy='{\"techOrder\": [\"youtube\"], \"sources\": [{\"type\": \"video/youtube\", \"src\":\"https://www.youtube.com/watch?v=Sbtq5qoeJFQ\"}], \"language\": \"en\", \"fluid\": true}' id=\"id_videojs_626979d16e897_2\" role=\"region\" title=\"watch\">\n<div><iframe allow=\"accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture\" allowfullscreen=\"allowfullscreen\" height=\"360\" id=\"id_videojs_626979d16e897_2_youtube_api\" loading=\"lazy\" src=\"https://www.youtube.com/embed/Sbtq5qoeJFQ?controls=0&amp;modestbranding=1&amp;rel=0&amp;showinfo=0&amp;loop=0&amp;fs=0&amp;hl=en&amp;enablejsapi=1&amp;origin=https%3A%2F%2Fmoodle4u.portagecollege.ca&amp;widgetid=2\" title=\"YouTube video player\" width=\"640\"></iframe></div>\n</div>\n</div>\n</div>\n<p> </p>","position":5},{"id":"g25bf16f7a92995e5c552ba9916eb2693","kind":"quiz","title":"Practice Quiz Two:  Basics, Decisions, and Loops","nav_title":"Practice Quiz Two:  Basics, Decisions, and Loops","published":true,"content_html":"<div class=\"item-meta\"><span class=\"meta-points\"><strong>Points:</strong> 4.0</span></div><p>Use this practice quiz to test your understanding of the introductory ideas as well as <strong>conditional statements</strong> and <strong>looping structures.</strong></p><div class=\"qz-questions\">\n<div class=\"qz-question\"><h3 class=\"qz-qtitle\">Stage - Location</h3>\n<div class=\"qz-qtext\"><div>\n<p><span>Assuming a stage width of </span><span>4</span><span>8</span><span>0</span><span> and a stage height of </span><span>3</span><span>6</span><span>0</span><span>,</span><span> what is the current x-p<a class=\"instructure_file_link instructure_image_thumbnail\" href=\"media/web_resources/W01-Q-08.JPG\" title=\"W01 - Q - 08.JPG\">o</a>sition of Scratch?</span></p>\n<p><span><img alt=\"\" data-decorative=\"true\" loading=\"lazy\" src=\"media/web_resources/W01-Q-08-1.JPG\"/></span></p>\n</div></div>\n<ul class=\"qz-choices\">\n<li class=\"qz-choice qz-correct\"><span class=\"qz-mark\">&#10003;</span> -240</li>\n<li class=\"qz-choice\"><span class=\"qz-mark\"></span> 120</li>\n<li class=\"qz-choice\"><span class=\"qz-mark\"></span> -120</li>\n<li class=\"qz-choice\"><span class=\"qz-mark\"></span> 240</li>\n</ul>\n</div>\n</div>","position":6},{"id":"gd39c96eae99363712eb6fcd1400a8d6b","kind":"quiz","title":"Scratch Quiz Two: Basics, Decisions, and Loops","nav_title":"Scratch Quiz Two: Basics, Decisions, and Loops","published":true,"content_html":"<div class=\"item-meta\"><span class=\"meta-points\"><strong>Points:</strong> 8.0</span></div><p>A quiz to check our understanding on coordinate systems, broadcast, conditions, and loops. </p><div class=\"qz-questions\">\n<div class=\"qz-question\"><h3 class=\"qz-qtitle\">Scratch - Stage</h3>\n<div class=\"qz-qtext\"><div>\n<p><span>Assuming a stage width of 480 and a stage height of 360, what is the current </span><strong>y-position</strong><span> of Scratch?</span></p>\n<p><span><img alt=\"\" loading=\"lazy\" src=\"media/web_resources/W01-Q-07.JPG\"/></span></p>\n</div></div>\n<ul class=\"qz-choices\">\n<li class=\"qz-choice qz-correct\"><span class=\"qz-mark\">&#10003;</span> 90</li>\n<li class=\"qz-choice\"><span class=\"qz-mark\"></span> 240</li>\n<li class=\"qz-choice\"><span class=\"qz-mark\"></span> 0</li>\n<li class=\"qz-choice\"><span class=\"qz-mark\"></span> -120</li>\n</ul>\n</div>\n<div class=\"qz-question\"><h3 class=\"qz-qtitle\">Scratch - Stage</h3>\n<div class=\"qz-qtext\"><div>\n<p><span>Assuming a stage width of 480 and a stage height of 360, what is the current </span><strong>x-position</strong><span> of Scratch?</span></p>\n<p><img alt=\"\" data-decorative=\"true\" loading=\"lazy\" src=\"media/web_resources/W01-Q-06.JPG\"/></p>\n</div></div>\n<ul class=\"qz-choices\">\n<li class=\"qz-choice qz-correct\"><span class=\"qz-mark\">&#10003;</span> 240</li>\n<li class=\"qz-choice\"><span class=\"qz-mark\"></span> 480</li>\n<li class=\"qz-choice\"><span class=\"qz-mark\"></span> -120</li>\n<li class=\"qz-choice\"><span class=\"qz-mark\"></span> 0</li>\n</ul>\n</div>\n</div>","position":8}]},{"id":"g006dd7d12c54c4c6bb158178d01ffe26","slug":"06-scratch-03-variables","title":"Scratch 03: Variables","order":6,"items":[{"id":"g2aeb170361fa163c3ccbf285f5b78c6f","kind":"weblink","title":"Exercise: Programmable Robot","nav_title":"Exercise: Programmable Robot","published":true,"external_url":"https://docs.google.com/presentation/d/e/2PACX-1vS40EeeXwmWbXSFXJATfFJK9uktAz1YD2m398sT4bWj-h8cvc747KpCeo9t9fBvG57PhMV4u1estFLr/pub?start=false&loop=false&delayms=3000&slide=id.p","position":1},{"id":"gbdbea40795ddfbf680df929bb128f874","kind":"page","title":"Flow Charts + Pair Programming Challenge","nav_title":"Flow Charts + Pair Programming Challenge","published":true,"content_html":"<p><iframe allowfullscreen=\"allowfullscreen\" height=\"569\" loading=\"lazy\" mozallowfullscreen=\"mozallowfullscreen\" src=\"https://docs.google.com/presentation/d/e/2PACX-1vS-7HBBDjWRoZrNsJVhiI6aMYxX1BnA4aeMcUyeugLn5svZFzrOYYbJYjQDg0qKssxdZOwnrcm1fZbp/embed?start=false&amp;loop=false&amp;delayms=3000\" webkitallowfullscreen=\"webkitallowfullscreen\" width=\"960\"></iframe></p>","position":3},{"id":"gd1a181af0e221341b0aa483f05733908","kind":"assignment","title":"Math Grapher","nav_title":"Math Grapher","published":true,"content_html":"<div class=\"item-meta\"><span class=\"meta-points\"><strong>Points:</strong> 10.0</span> &middot; <span class=\"meta-submission\"><strong>Submission type:</strong> online upload</span> &middot; <span class=\"meta-ext\"><strong>Allowed file types:</strong> sb3</span></div><p><span style=\"font-size: 18pt;\"><strong>Slope of a Line:</strong></span></p>\n<p>The slope of a line tells us whether it is rising or falling, as well as how steep it is.<br/><img alt=\"Scratch - A01 - I06.jpg\" loading=\"lazy\" src=\"media/web_resources/Uploaded-Media/Scratch-A01-I06.jpg\"/></p>\n<p><em>To complete this project, you’ll need to be able to calculate the slope of a line. Hopefully, this is a familiar operation, but if you’d like a refresher please check out the following video:</em></p>\n<p><iframe allow=\"accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share\" allowfullscreen=\"allowfullscreen\" height=\"315\" loading=\"lazy\" src=\"https://www.youtube.com/embed/WkspBxrzuZo?si=g4hvjnL0KnfQWpUc\" title=\"YouTube video player\" width=\"560\"></iframe></p>\n<p><br/><br/><br/><span style=\"font-size: 18pt;\"><strong>Adding the Pen Extension:</strong></span><strong></strong></p>\n<p>For this project, you’ll need to add the pen extension as you did earlier.<br/><br/><img alt=\"Scratch - A - Extensions.png\" loading=\"lazy\" src=\"media/web_resources/Uploaded-Media/Scratch-A-Extensions.png\"/><br/><span><em>To add an extension, first, find the “add extension” button in the bottom left corner.</em></span></p>\n<p><span><em><br/><img alt=\"Scratch - A1 - Pen Extension.png\" loading=\"lazy\" src=\"media/web_resources/Uploaded-Media/Scratch-A1-Pen-Extension.png\"/><br/>Then choose the extension called “pen”.</em></span><em></em></p>\n<p><br/><br/><br/><span style=\"font-size: 18pt;\"><strong>Base Features Requirements </strong></span></p>\n<ol style=\"list-style-type: decimal;\">\n<li>Create a program that begins by asking the user for <strong>4 inputs</strong>, and stores each in its own <strong>variable:</strong>\n<ul style=\"list-style-type: disc;\">\n<li>A X-value for the first point of a line segment</li>\n<li>A Y-value for the first point of a line segment</li>\n<li>A X-value for the second point of a line segment</li>\n<li>A Y-value for the second point of a line segment<br/><br/>\n</li>\n</ul>\n</li>\n<li>Once this data has been stored, have a sprite (which can be visible <strong>or</strong> invisible) draw that particular line segment on the screen using the <strong>pen blocks.</strong><br/><br/>\n</li>\n<li>Given the line drawn, <strong>calculate the slope of this line</strong> and store it in a variable.<br/><br/>\n</li>\n<li>Have your sprite report what the line's slope is for <strong>2 seconds.</strong>\n<ul style=\"list-style-type: disc;\">\n<li>If you've used the <strong>hide block</strong>, the say block won't show up on the stage!</li>\n<li>At this point, either make sure to <strong>show</strong> the sprite, or use <strong>set ghost effect to 100</strong> instead; this hides the sprite but still allows text to be displayed.<br/><br/>\n</li>\n</ul>\n</li>\n<li>At this point, the base features are complete!<br/><br/><br/><br/>\n</li>\n</ol>\n<p><span style=\"font-size: 18pt;\"><strong>Challenge Features Requirements </strong></span><em> (Parallelogram Area Calculator)<br/><br/></em>A <strong>Parallelogram </strong>can be created with <span style=\"text-decoration: underline;\">two sets of lines</span> that are <span style=\"text-decoration: underline;\">parallel to each other</span>. Expand the program above to add a horizontal line to both endpoints of the user’s original line segment. Then, add a copy of the original line segment to the end of these horizontal segments to complete a parallelogram. Lastly, report the area of this closed shape. Some additional explanation is below:<em><br/></em></p>\n<ol style=\"list-style-type: decimal;\">\n<li><span>Draw Original Line Segment - If you've completed the <strong>base features</strong> then this is already done! See more details up there...<br/><br/></span></li>\n<li><span>Ask the user for a horizontal distance - store this value in a variable, then use it to draw two horizontal lines attached to each endpoint of the original line segment:<br/><img alt=\"Scratch- WO3 - A02 - I02.PNG\" height=\"215\" loading=\"lazy\" src=\"media/web_resources/Uploaded-Media/Scratch-WO3-A02-I02.PNG\" width=\"447\"/><br/><br/></span></li>\n<li><span>Using that value, draw two horizontal lines segments of that length from each of the two existing endpoints (Remember, you should have these (x,y) locations stored in variables already)<br/><img alt=\"Scratch- WO3 - A02 - I03.PNG\" loading=\"lazy\" src=\"media/web_resources/Uploaded-Media/Scratch-WO3-A02-I03.PNG\"/><br/><br/></span></li>\n<li><span>To finish the parallelogram, draw a line segment with the same length and slope as the first, but starting and ending at the free horizontal endpoints. (Note: the sprite that is enacting these scripts can be visible or hidden while drawing)<br/><img alt=\"Scratch- WO3 - A02 - I04a.PNG\" height=\"149\" loading=\"lazy\" src=\"media/web_resources/Uploaded-Media/Scratch-WO3-A02-I04a.PNG\" width=\"307\"/>  <img alt=\"CSCR - WO3 - A02 - I04b.PNG\" height=\"130\" loading=\"lazy\" src=\"media/web_resources/Uploaded-Media/CSCR-WO3-A02-I04b.PNG\" width=\"298\"/><br/><br/></span></li>\n<li><span>Once the shape has been drawn, calculate what the area of the parallelogram is. If you don’t have the formula memorized (I didn’t!), you may need to do an internet search to find it. It is very readily available. Calculate the area and store it in an appropriately-named variable.<br/><br/></span></li>\n<li><span>Lastly, have the sprite report what the area is. The sprite will need to be visible at this point in order for its speech bubble to be visible as well.<br/><img alt=\"Scratch - WO3 - A02 - I05.PNG\" loading=\"lazy\" src=\"media/web_resources/Uploaded-Media/Scratch-WO3-A02-I05.PNG\"/><br/></span></li>\n</ol>","position":4}]},{"id":"g64f83bde275725d4a7f26c354a42fa1e","slug":"07-scratch-04-major-project","title":"Scratch 04: Major Project","order":7,"items":[{"id":"divider-07-scratch-04-major-project-1","kind":"divider","title":"Quiz - took between 10 - 25 min","nav_title":"Quiz - took between 10 - 25 min","published":true,"position":1},{"id":"g84ab2dc974b7438429def324eb7234d4","kind":"quiz","title":"Scratch Summary Quiz","nav_title":"Scratch Summary Quiz","published":true,"content_html":"<div class=\"item-meta\"><span class=\"meta-points\"><strong>Points:</strong> 14.0</span></div><p>This quiz will test your knowledge of what we've covered in Scratch so far.</p><div class=\"qz-questions\">\n<div class=\"qz-question\"><h3 class=\"qz-qtitle\">Coordinate Systems</h3>\n<div class=\"qz-qtext\"><div>\n<span>Assuming a stage width of </span><span>4</span><span>8</span><span>0</span><span> and a stage height of </span><span>3</span><span>6</span><span>0</span><span>,</span><span> what is the current x-position of Scratch?</span><img alt=\"SQ-01-1.JPG\" loading=\"lazy\" src=\"media/web_resources/SQ-01-1.JPG\"/>\n</div></div>\n<ul class=\"qz-choices\">\n<li class=\"qz-choice qz-correct\"><span class=\"qz-mark\">&#10003;</span> 0</li>\n<li class=\"qz-choice\"><span class=\"qz-mark\"></span> 120</li>\n<li class=\"qz-choice\"><span class=\"qz-mark\"></span> -120</li>\n<li class=\"qz-choice\"><span class=\"qz-mark\"></span> -240</li>\n</ul>\n</div>\n<div class=\"qz-question\"><h3 class=\"qz-qtitle\">Keyboard Input</h3>\n<div class=\"qz-qtext\"><div><p><span>Which versions shown below provide the same functionality as the Original script, where the character will say Up Arrow Pressed for two seconds every time the up arrow key is pressed?</span></p>\n<p><img alt=\"W04 - Q01 - I00.PNG\" loading=\"lazy\" src=\"media/web_resources/Uploaded-Media/W04-Q01-I00.PNG\"/></p></div></div>\n<ul class=\"qz-choices\">\n<li class=\"qz-choice qz-correct\"><span class=\"qz-mark\">&#10003;</span> Version 2</li>\n<li class=\"qz-choice\"><span class=\"qz-mark\"></span> Version 1</li>\n<li class=\"qz-choice\"><span class=\"qz-mark\"></span> Version 3</li>\n<li class=\"qz-choice\"><span class=\"qz-mark\"></span> Version 5</li>\n<li class=\"qz-choice\"><span class=\"qz-mark\"></span> Version 4</li>\n</ul>\n</div>\n<div class=\"qz-question\"><h3 class=\"qz-qtitle\">Variables</h3>\n<div class=\"qz-qtext\"><div><p><span>L</span><span>et us say that you are trying to create a program that lets you play<span class=\"Apple-converted-space\"> </span></span><em><a href=\"http://en.wikipedia.org/wiki/Monopoly_%28game%29\">Monopoly</a></em><span><span class=\"Apple-converted-space\"> </span>on your computer. You will probably want to use a variable to keep track of how much money you have as the game progresses. In<span class=\"Apple-converted-space\"> </span></span><em>Monopoly</em><span>, each time you pass the Go square, you get $200. If you are keeping track of your money in a variable, which of the following blocks would be most appropriate for changing the amount of money you have when you pass Go?</span></p>\n<p><span>A. <img alt=\"W04 - Q01 - I03a.PNG\" height=\"103\" loading=\"lazy\" src=\"media/web_resources/Uploaded-Media/W04-Q01-I03a.PNG\" width=\"400\"/></span></p>\n<p><span>B.<img alt=\"W04 - Q01 - I03b.PNG\" height=\"93\" loading=\"lazy\" src=\"media/web_resources/Uploaded-Media/W04-Q01-I03b.PNG\" width=\"306\"/></span></p>\n<p><span>C. <img alt=\"W04 - Q01 - I03c.PNG\" height=\"85\" loading=\"lazy\" src=\"media/web_resources/Uploaded-Media/W04-Q01-I03c.PNG\" width=\"253\"/></span></p>\n<p><span>D. <img alt=\"W04 - Q01 - I03d.PNG\" height=\"94\" loading=\"lazy\" src=\"media/web_resources/Uploaded-Media/W04-Q01-I03d.PNG\" width=\"194\"/></span></p>\n<p> </p>\n<p> </p></div></div>\n<ul class=\"qz-choices\">\n<li class=\"qz-choice qz-correct\"><span class=\"qz-mark\">&#10003;</span> B</li>\n<li class=\"qz-choice\"><span class=\"qz-mark\"></span> A</li>\n<li class=\"qz-choice\"><span class=\"qz-mark\"></span> C</li>\n<li class=\"qz-choice\"><span class=\"qz-mark\"></span> D</li>\n</ul>\n</div>\n<div class=\"qz-question\"><h3 class=\"qz-qtitle\">Variables</h3>\n<div class=\"qz-qtext\"><div>In Scratch, there are two different types of data that can be stored in variables. What are these two types?</div></div>\n<p class=\"qz-fib\"><em>(No accepted answer recorded)</em></p>\n</div>\n<div class=\"qz-question\"><h3 class=\"qz-qtitle\">Broadcasting</h3>\n<div class=\"qz-qtext\"><div><p>Describe what will happen when the green flag is pressed.</p>\n<p><img alt=\"Broadcasting Question.PNG\" height=\"496\" loading=\"lazy\" src=\"media/web_resources/Uploaded-Media/Broadcasting-Question.PNG\" width=\"715\"/></p></div></div>\n<p class=\"qz-fib\"><em>(No accepted answer recorded)</em></p>\n</div>\n</div>","position":2},{"id":"g0f7ae95d99d2bfbcce76603c66eaf4f8","kind":"assignment","title":"Coolest Scratch Assignment","nav_title":"Coolest Scratch Assignment","published":true,"content_html":"<div class=\"item-meta\"><span class=\"meta-points\"><strong>Points:</strong> 16.0</span> &middot; <span class=\"meta-submission\"><strong>Submission type:</strong> online url,online upload</span> &middot; <span class=\"meta-ext\"><strong>Allowed file types:</strong> sb3,zip</span></div><p><span><img alt=\"\" data-decorative=\"true\" height=\"385\" loading=\"lazy\" src=\"media/web_resources/Scratch-Major-Project-Examples.png\" style=\"display: block; margin-left: auto; margin-right: auto;\" width=\"515\"/></span></p>\n<p> </p>\n<p><span>This is an open-ended assignment, where you will show some evidence of your learning in the class so far. There are just a couple of stipulations:</span><span><br/><br/></span></p>\n<p><span style=\"font-size: 14pt;\"><strong>Open-Ended Topic</strong></span><span><br/></span><span><br/></span><span>For this project, you should create the coolest, most interesting thing you can in Scratch with what you’ve learned so far. This could be a game, an interactive program, or some sort of productivity software (a program that helps complete a task). Be sure to choose something that you’ll find interesting to work on for a full week!</span><span><br/><br/></span></p>\n<p><span style=\"font-size: 14pt;\"><strong>Included Concepts</strong></span><span><br/></span><span><br/></span><span>This project is an opportunity to showcase all the concepts you’ve gained experience with over the past few weeks, and you must be sure to include all of the following </span><i><span>in some useful form</span></i><span>:</span><span><br/><br/></span></p>\n<ul style=\"list-style-type: disc;\">\n<li><span>Broadcasts</span></li>\n<li>Loops (must include both a <strong>condition</strong> and <strong>counting</strong> loop)</li>\n<li>Conditionals ( IF / ELSE )</li>\n<li>Variables</li>\n<li>A Function without inputs</li>\n<li>A Function with at least one input</li>\n</ul>\n<p> </p>\n<p><strong><span style=\"font-size: 14pt;\">Complexity</span></strong><span><br/></span><span><br/></span><span>As you're being given a full week to work on this project, its complexity should represent a 5-6 hours of dedicated work! Part of the grading rubric for the project will be that it’s complexity represents that amount of time commitment.</span><span><br/></span></p>\n<p>In this project, you should aim to <i>develop your skills </i>by exploring further an idea touched on in class (ie working with lists, clones), or something we didn't address at all. By the end of the project you should be able to describe something new you were able to accomplish in your program.</p>\n<p> </p>\n<p><span style=\"font-size: 14pt;\"><strong>Documentation</strong></span><br/><br/>All programs should be accompanied by some form of documentation, which explains to users what the purpose of the software is as well as how to interact correctly with it. For this project, you'll need to submit a <strong>minimum 1-page</strong> documentation/reflection. Specific requirements can be seen in the module item <a data-course-type=\"assignments\" data-item-ref=\"g6c73fc015a3d4a433bd0d4aa5a4e89a3\" data-published=\"false\" href=\"#item:g6c73fc015a3d4a433bd0d4aa5a4e89a3\" title=\"Scratch Project Documentation\">\"Scratch Project Documentation\"</a>. This is submitted separately from the Major Project, but comprises 20% of the overall project grade.<span><br/></span></p>\n<p> </p>\n<p><span style=\"font-size: 14pt;\"><strong>Your Ideas, Your Code</strong></span><span><br/></span><span><br/></span><span>Choose a topic/premise that you'll enjoy working on for several days, and I hope you'll have fun with this project! A few things:<br/><br/></span></p>\n<ul>\n<li style=\"list-style-type: none;\">\n<ul>\n<li>\n<span>This project should be of your own design. (Don't follow along with a tutorial or remix someone else's work)</span>\n<ul>\n<li><span>However, the premise can be something you've seen elsewhere. <em>(For instance, planning to recreate the game \"Battleship\" is fine, as long as your version is made by you from scratch).<br/><br/></em></span></li>\n</ul>\n</li>\n<li>\n<span>You are welcome to look at others projects on the Scratch website to get ideas and study how they have made their projects, but you shouldn't have your program open at the same time.  </span>\n<ul>\n<li><span>As well, If you take a specific idea from another project, video resource, or similar, you must attribute/cite it appropriately in your documentation. </span></li>\n<li><span><strong>Failing to do so is plagiarism</strong>, so please ensure to take care of this step if needed.</span></li>\n</ul>\n</li>\n</ul>\n</li>\n</ul>\n<p> </p>\n<p> </p>\n<p><strong>Outcomes</strong></p>\n<p>CP1, CP2, FP1, FP2, FP3</p>","position":3},{"id":"g6c73fc015a3d4a433bd0d4aa5a4e89a3","kind":"assignment","title":"Scratch Project Documentation","nav_title":"Scratch Project Documentation","published":true,"content_html":"<div class=\"item-meta\"><span class=\"meta-points\"><strong>Points:</strong> 4.0</span> &middot; <span class=\"meta-submission\"><strong>Submission type:</strong> online upload</span> &middot; <span class=\"meta-ext\"><strong>Allowed file types:</strong> txt,rtf,doc,docx</span></div><p><span>Good documentation is an important component of any computer program; it informs users how to use your software, and makes it possible for other programmers – who might be taking over a project – to understand how it works!</span></p>\n<p><span>For our class, you can use the following structure when documenting your code:</span></p>\n<p> </p>\n<p><span style=\"font-size: 18pt;\">Basic Instructions and Explanation</span></p>\n<p><span>In a text document (word, pdf, txt), address the following topics. Be thorough – you should not assume that the user has any background knowledge of your program; your documentation should allow a beginner to successfully understand and operate your software. </span><i><span>As a reference point, this should not be shorter than a page (single spaced), and will be graded according to whether this amount of length was met, and that all five sections below were reflected on appropriately. (250 words +)<br/><br/></span></i></p>\n<ol>\n<li>\n<span>       </span><strong>Basic Premise</strong>\n</li>\n</ol>\n<p><span>Explain what the program is. If it is for productivity, describe how the program will assist the user with a task. If it is a game, describe the type of game and any relevant backstory.<br/><br/></span></p>\n<ol start=\"2\">\n<li>\n<span>       </span><strong>Key Features</strong>\n</li>\n</ol>\n<p><span>A summary of the different features or capabilities of the program. If applicable, provide a breakdown description of each feature. Explain what the user needs to do to in order to make the program work correctly.<br/><br/></span></p>\n<ol start=\"3\">\n<li>\n<span>       </span><strong>Controls / Game Mechanics</strong>\n</li>\n</ol>\n<p><span>Provide a listing of the different user input controls. If a user forgets what buttons they need to press on the keyboard or what to click, they should be able to look it up.<br/><br/></span></p>\n<ol start=\"4\">\n<li>\n<span>       </span><strong>Limitations</strong>\n</li>\n</ol>\n<p><span>If there are known bugs or issues with the program (ways that the user can break the program) that you have been unable to fix, list the problems and potential workarounds.<br/><br/></span></p>\n<ol start=\"5\">\n<li>\n<strong>   </strong> <strong>Personal Comments</strong>\n</li>\n</ol>\n<p><span>As the author of the program, add a short reflection on the program. </span></p>\n<ul>\n<li><span>What new ideas or challenging aspects of the program did you tackle?</span></li>\n<li><span>If you had more time, how would you extend this program?</span></li>\n<li><span>Add any other reflections you have on your project.</span></li>\n</ul>","position":4},{"id":"gf12c6ad3df3c35cf607a8ff9ff492431","kind":"page","title":"Examples of Scratch Projects","nav_title":"Examples of Scratch Projects","published":true,"content_html":"<p><iframe allowfullscreen=\"allowfullscreen\" height=\"569\" loading=\"lazy\" mozallowfullscreen=\"mozallowfullscreen\" src=\"https://docs.google.com/presentation/d/e/2PACX-1vToCtlOVeSB7HVUsNKmWFI4Om4hXp5qaEaWuGW1JRt9B1CztndCiIBBoJ9uM3Wm6dklbNjsh_nQvpM8/embed?start=false&amp;loop=false&amp;delayms=3000\" webkitallowfullscreen=\"webkitallowfullscreen\" width=\"960\"></iframe></p>","position":5}]},{"id":"g9b4565ce52bedf85e330f0f523a733ec","slug":"08-reeborg-constrained-language","title":"Reeborg: Constrained Language","order":8,"items":[{"id":"gbbe1e448745c6c8ec1d75c6d14ceacdd","kind":"weblink","title":"Reeborg Environment","nav_title":"Reeborg Environment","published":true,"external_url":"https://reeborg.cs20.ca/?lang=en&mode=python&menu=worlds%2Fmenus%2Fsk_menu.json&name=Step%200&url=worlds%2Fsk%2Fstep0.json","position":1},{"id":"gf23e9b8ee0d89c26824e11df972a3512","kind":"weblink","title":"CS20 - Open Textbook","nav_title":"CS20 - Open Textbook","published":true,"external_url":"http://cs20.ca","position":2},{"id":"gced55dccaebccd0fd21eb4838870a6f6","kind":"assignment","title":"Reeborg Lessons 5-20","nav_title":"Reeborg Lessons 5-20","published":true,"content_html":"<div class=\"item-meta\"><span class=\"meta-points\"><strong>Points:</strong> 32.0</span> &middot; <span class=\"meta-submission\"><strong>Submission type:</strong> none</span> &middot; <span class=\"meta-ext\"><strong>Allowed file types:</strong> py,zip,png</span></div><p>You will be completing the <strong>learning steps</strong> listed on the <a href=\"http://www.cs20.ca\">CS20 Open Textbook page.</a> The first four steps will get you started in understanding what you are going to be doing. Once you reach step 5 and beyond, put your hand up when you complete the step and I'll come double check that you've got everything done correctly. Each step will be graded in this fashion.</p>\n<p>Make sure to save each step (CTRL-S) and organize them on your student folder. If I'm not free to check a step right when you complete it, <em>duplicate your tab</em> (Right-click on the Reeborg browser tab → duplicate) so that you can move ahead while still keeping the steps open that still need to be checked.</p>\n<p>Each exercise from step 5 and on will be graded as either:  <strong>Complete</strong> (full marks), or <strong>Incomplete</strong> (no marks). You may re-work and re-check any steps that aren't fully complete.</p>\n<p>Each step is given a weight of 2 marks. Since there are 16 steps being graded, the total amount of marks for the project is 32.</p>\n<p> </p>","position":4},{"id":"g6d7f897b573b63bc9356e792cb1c2b90","kind":"weblink","title":"Conditionals Demo","nav_title":"Conditionals Demo","published":true,"external_url":"https://reeborg.cs20.ca/?lang=en&mode=python&menu=worlds%2Fmenus%2Fsk_menu.json&name=Reeborg%20Conditionals&url=worlds%2Fsk%2Freeborg-conditionals.json","position":3}]},{"id":"g7991e6cc180e421e9c49ee105c184152","slug":"09-python-presentations","title":"Python Presentations","order":9,"items":[{"id":"g2a1781e965396e2348fb4b6096e527ab","kind":"file","title":"01 Python - Input, Output, Data Types.pptx","nav_title":"01 Python - Input, Output, Data Types.pptx","published":true,"media_path":"media/web_resources/01-Python-Input-Output-Data-Types.pptx","position":1},{"id":"g80a75a242bc570e4c68b30948bc3ee23","kind":"file","title":"09 Functions, Scope, and Information Sharing.pptx","nav_title":"09 Functions, Scope, and Information Sharing.pptx","published":true,"media_path":"media/web_resources/09-Functions-Scope-and-Information-Sharing.pptx","position":2},{"id":"g2bfc67e967f62c9fee8fed88a05f8930","kind":"file","title":"10 Functions - Arguments, Parameters, and Return Values.pptx","nav_title":"10 Functions - Arguments, Parameters, and Return Values.pptx","published":true,"media_path":"media/web_resources/10-Functions-Arguments-Parameters-and-Return-Values.pptx","position":3}]},{"id":"g59fdbea598c0a283e4513961ba1c095b","slug":"10-python-basics","title":"Python - Basics","order":10,"items":[{"id":"g8d6cb5557333cf3a3c92600f690ccd24","kind":"assignment","title":"Temperature Conversion","nav_title":"Temperature Conversion","published":true,"content_html":"<div class=\"item-meta\"><span class=\"meta-points\"><strong>Points:</strong> 10.0</span> &middot; <span class=\"meta-submission\"><strong>Submission type:</strong> online upload</span> &middot; <span class=\"meta-ext\"><strong>Allowed file types:</strong> py</span></div><p><img alt=\"degrees.png\" loading=\"lazy\" src=\"media/web_resources/degrees.png\"/></p>\n<p>Write a Python program that will convert between degrees Celsius to degrees Fahrenheit.</p>\n<p><strong>Base Requirements:</strong></p>\n<p><span style=\"text-decoration: underline;\">Part One:</span></p>\n<p style=\"padding-left: 30px;\">Write a function called <strong>c_to_f(), </strong>which will do the following:</p>\n<p style=\"padding-left: 60px;\">- Ask the user to input a temperature in Celsius</p>\n<p style=\"padding-left: 60px;\">- Convert that value to Fahrenheit, and store that value in a variable</p>\n<p style=\"padding-left: 60px;\">- Print a message to the console saying what the converted temperature's value is.</p>\n<p> </p>\n<p><span style=\"text-decoration: underline;\">Part Two:</span></p>\n<p style=\"padding-left: 30px;\">Write a similar function, called f<strong>_to_c(), </strong>which will do the following:</p>\n<p style=\"padding-left: 60px;\">- Ask the user to input a temperature in Fahrenheit</p>\n<p style=\"padding-left: 60px;\">- Convert that value to Celsius, and store that value in a variable</p>\n<p style=\"padding-left: 60px;\">- Print a message to the console saying what the converted temperature's value is.<br/><br/></p>\n<p><span style=\"text-decoration: underline;\">Part Three:</span></p>\n<p style=\"padding-left: 30px;\">Have your program begin by letting the user choose which type of conversion they would like to run:  <strong>f_to_c()</strong> or<strong> c_to_f()</strong> .</p>\n<p style=\"padding-left: 60px;\">- You may ask them to indicate their choice by entering a String or a numeric value.</p>\n<p style=\"padding-left: 30px;\"><br/>Call the appropriate function based on the user's selection.</p>\n<p> </p>\n<p><span style=\"text-decoration: underline;\">Style:</span></p>\n<p>Your program must include both a comment header as well as inline comments, as described below.</p>\n<p> </p>\n<p><strong>Sample Output:</strong><span> </span></p>\n<p><em>Reference the following sample output to double-check that your program yields the correct conversions:</em></p>\n<p>Type 'C' for Celsius to Fahrenheit or 'F' for the reverse: <span style=\"color: #339966;\">C</span><br/>Enter a temperature in Celcius: <span style=\"color: #339966;\">46</span><br/>That is <span style=\"color: #339966;\">114.8</span> degrees Fahrenheit</p>\n<p><span><br/>Type 'C' for Celsius to Fahrenheit or 'F' for the reverse</span><span>: </span><span style=\"color: #339966;\">C</span><br/><span>Enter a temperature in</span><span> Celcius</span><span>: </span><span style=\"color: #339966;\">0</span><br/><span>That is <span style=\"color: #339966;\">32.0</span> degrees Fahrenheit</span></p>\n<p><span><br/></span><span>Type 'C' for Celsius to Fahrenheit or 'F' for the reverse</span><span>: </span><span style=\"color: #339966;\">F</span><br/><span>Enter a temperature in</span><span> Fahrenheit</span><span>: </span><span style=\"color: #339966;\">35.6</span><br/><span>That is <span style=\"color: #339966;\">2.0</span> degrees Celsius</span></p>\n<p> </p>\n<p> </p>\n<p><strong>Additional Tips:</strong> </p>\n<p>As this is the first Python assignment you are going to submit, the following notes might be useful:</p>\n<p>- be sure to include a comment header in your code, which means your Python file should start with something like </p>\n<pre>#######################################################<br/># Stefan Scott<br/># Computer Science 20<br/># October 23, 2017<br/># <br/># Temperature Conversion Program<br/># Purpose: To convert a temperature from degrees to Fahrenheit.<br/>#######################################################<br/><br/></pre>\n<p>- make sure you save your file as a .py file. That is the only type of file you'll be able to upload for this assignment.</p>\n<p>- use <em>input()</em> to allow the user to type in the temperature that should be converted [remember that <em>input()</em> will always return string-type data]</p>\n<p> </p>\n<p><strong>Challenge Features</strong></p>\n<p> </p>\n<ul>\n<li>try to foolproof the input (in other words, make sure your program doesn't crash if I type in \"frank\" instead of 15). <em>Hint: Check out the<a href=\"https://docs.python.org/3/tutorial/errors.html\"> <strong>try</strong> and <strong>except</strong></a> keywords (read 8.3). </em>\n</li>\n<li>add the ability to convert to/from Kelvin as well (in one direction only - to either Celsius or Fahrenheit, <em>whichever you choose</em>)</li>\n</ul>","position":2},{"id":"g3b8239c67b31c7fced3ee41594dd9ebe","kind":"assignment","title":"Madlib","nav_title":"Madlib","published":true,"content_html":"<div class=\"item-meta\"><span class=\"meta-points\"><strong>Points:</strong> 10.0</span> &middot; <span class=\"meta-submission\"><strong>Submission type:</strong> online upload</span> &middot; <span class=\"meta-ext\"><strong>Allowed file types:</strong> py,txt,zip</span></div><p>To practice input/output in Python, you will make<strong> two Mad Libs</strong>. </p>\n<p>At the start of the program, you should ask the user which MadLib they want. Once the user has selected a MadLib, your program should take in input from the user, then use that input when outputting a story or poem.</p>\n<p>If you are not familiar with madlibs, you may want to investigate what they are by searching the web for a “madlibs website”. In essence, you want to take a familiar story and make it funny by randomly placing your users words into the story. Feel free to use any old school rhyme, or something of your own creation. Though it can be difficult with user input, try to make sure your story makes sense.</p>\n<p> </p>\n<div class=\"highlight-none\">\n<div class=\"highlight\">\n<pre>Humpty Dumpty sat on a wall,\nHumpty Dumpty had a great fall.\nAll the king's horses and all the king's men\nCouldn't put Humpty together again.\n</pre>\n</div>\n</div>\n<p>In your program, you could take user input:</p>\n<div class=\"highlight-none\">\n<div class=\"highlight\">\n<pre>Person's First Name: Bree\nPerson's Last Name: Janzen\nVerb (past tense action): ran\nJob Title (such as principal, electrician, etc.): plumber\nAnimal (plural): dogs\n</pre>\n</div>\n</div>\n<p>After processing the user input, your program could print out:</p>\n<div class=\"highlight-none\">\n<div class=\"highlight\">\n<pre>Bree Janzen ran on a wall,\nBree Janzen had a great fall.\nAll the plumber's dogs and all the plumber's men\nCouldn't put Bree together again.\n</pre>\n</div>\n</div>\n<p>Both of your madlibs should take in at least 5 words from the user, but no more than 10. Feel free to use any old school rhyme, or something of your own creation. Though it can be difficult with user input, try to make sure your story makes sense.</p>\n<p>Remember to use a comment header at the top of your program!</p>\n<p> </p>\n<p><span style=\"font-size: 18pt;\"><strong>Base Requirements</strong></span></p>\n<ol>\n<li>Your program must include <strong>Two different madlibs.</strong> Begin the program by asking the user which madlib they would like to try (option 1 or 2).\n<ul>\n<li>Before starting the second madlib, read the expert challenge requirements below, as the second madlib will be slightly different if you choose to tackle that challenge.</li>\n</ul>\n</li>\n<li>Each madlib should ask the user for at least 5 input words (entered by the user), but no more than 10.</li>\n<li>Comment Header at the top of the program is required, as well as some inline comments to describe the different sections to the program.<br/><em>HINT: we've looked at <span style=\"text-decoration: underline;\">formatted (f)</span></em><span style=\"text-decoration: underline;\"> strings</span>; using these may make for simple handling of multi-line text and substitutions of the user's word selections.<br/><br/>\n</li>\n</ol>\n<p><span style=\"font-size: 18pt;\"><strong>Challenge Features</strong></span></p>\n<ul class=\"simple\">\n<li>For the second madlib, instead of letting the user enter words when running the program, have your program choose the input words <strong>randomly.</strong> There are two options for how to do this, one easier and one a bit harder: <br/><em><strong>NOTE:</strong> each option has a different max mark for this section</em>\n</li>\n</ul>\n<p><span style=\"text-decoration: underline;\">Lists of Words</span> <em>[this option worth 0.5/1]</em></p>\n<p style=\"padding-left: 40px;\">Create a list of possible words, and have Python choose one of these words<span> </span><a class=\"reference external\" href=\"http://stackoverflow.com/questions/306400/how-do-i-randomly-select-an-item-from-a-list-using-python\">at random</a>.</p>\n<p><br/><span style=\"text-decoration: underline;\">Read words from External Files</span> <em>[this option worth 1/1]</em></p>\n<p style=\"padding-left: 40px;\">Create text files for each of the parts of speech that you will require (ie. nouns.txt, adjectives.txt, etc) and have the computer randomly choose one of the words from the appropriate text file to complete the madlib.</p>\n<ul>\n<li style=\"list-style-type: none;\">\n<ul>\n<li style=\"list-style-type: none;\">\n<ul class=\"simple\">\n<li>In our class demo, we look at reading data from a file and storing each line as an item in a list. If you were present for this demo I'd suggest following a similar approach where each work is stored on its own line in the text file.<br/><br/>\n</li>\n<li>Another option, however, would be to store all the words on a single line, separated by a single character (either a space, or a semicolon)<br/><br/>excited angry uncertain crazy        OR       excited;angry;uncertain;crazy<br/><br/>\n</li>\n<li>Then you have two tasks:\n<ul class=\"simple\">\n<li>to read that line from a file and store it in a variable as a string. <a href=\"https://www.w3schools.com/python/python_file_open.asp\">(see here for reading one line)</a>\n</li>\n<li>to create a list from that string that contains all the individual words <a href=\"https://www.w3schools.com/python/ref_string_split.asp\">(see here for splitting a string)</a>\n</li>\n</ul>\n</li>\n</ul>\n</li>\n</ul>\n</li>\n</ul>","position":7}]},{"id":"g5d0021aae0b53857ceb809b93d9957cf","slug":"11-python-turtle-and-micro-bit","title":"Python - Turtle and Micro:bit","order":11,"items":[{"id":"g32012ea94cbab7b028c810a77873d2c7","kind":"weblink","title":"Reference: Turtle Methods","nav_title":"Reference: Turtle Methods","published":true,"external_url":"https://docs.python.org/3/library/turtle.html#overview-of-available-turtle-and-screen-methods","position":1},{"id":"g3c0db37c3713d3169e11705f5d92d9ea","kind":"weblink","title":"HTML color names","nav_title":"HTML color names","published":true,"external_url":"https://www.w3schools.com/colors/colors_names.asp","position":2},{"id":"g984adf2a252b462ad6d948e342017d25","kind":"assignment","title":"Turtle Confusion 1","nav_title":"Turtle Confusion 1","published":true,"content_html":"<div class=\"item-meta\"><span class=\"meta-points\"><strong>Points:</strong> 10.0</span> &middot; <span class=\"meta-submission\"><strong>Submission type:</strong> online upload</span> &middot; <span class=\"meta-ext\"><strong>Allowed file types:</strong> py</span></div><p>For this turtle graphics challenge, create a program that creates uses the <strong>turtle library</strong> to draw all of the following shapes on <span style=\"color: #993300;\"><strong>in a single window</strong></span>.</p>\n<p><img alt=\"Completed Turtle 1\" height=\"198\" loading=\"lazy\" src=\"media/web_resources/turtle-confusion-1.JPG\" width=\"541\"/></p>\n<p style=\"padding-left: 30px;\"> <span style=\"color: #808080;\">You may want create a window that is bigger than the default one. To do this, you can use the .setup() function:</span></p>\n<p style=\"padding-left: 60px;\">wn = turtle.Screen()<br/>wn.setup(800,400)   <span style=\"color: #008000;\"> #makes the window 800 pixels wide and 400 pixels high</span></p>\n<p><em>Don't forget your header, inline comments, and to make sure you are using functions and loops to make your code elegant and efficient.</em></p>\n<p><img alt=\"confusion-19.png\" loading=\"lazy\" src=\"media/web_resources/confusion-19.png\"/><img alt=\"confusion-20.png\" loading=\"lazy\" src=\"media/web_resources/confusion-20.png\"/><img alt=\"confusion-21.png\" loading=\"lazy\" src=\"media/web_resources/confusion-21.png\"/><img alt=\"confusion-22.png\" loading=\"lazy\" src=\"media/web_resources/confusion-22.png\"/><img alt=\"confusion-23.png\" loading=\"lazy\" src=\"media/web_resources/confusion-23.png\"/></p>\n<p> </p>\n<p>Extra for Experts:</p>\n<p>Also include the following, more challenging image:</p>\n<p><img alt=\"confusion-35.png\" loading=\"lazy\" src=\"media/web_resources/confusion-35.png\"/></p>\n<p> </p>\n<p>Need Even More Challenges? Just to Challenge your brain:</p>\n<p><img alt=\"confusion-28.png\" loading=\"lazy\" src=\"media/web_resources/confusion-28.png\"/><img alt=\"confusion-31.png\" loading=\"lazy\" src=\"media/web_resources/confusion-31.png\"/></p>\n<p> </p>\n<details>\n<summary><span style=\"font-size: 14pt;\"><span style=\"color: #ecf0f1; background-color: #ba372a;\"><strong>HINT:</strong></span> </span> If needed, click here to see some <em>general advice</em> for how to approach this problem...</summary>\n<div style=\"padding-left: 40px;\"><span style=\"font-size: 14pt;\"><strong><br/>Planning:</strong></span></div>\n<ul>\n<li style=\"list-style-type: none;\">\n<ul>\n<li style=\"list-style-type: none;\">\n<ul style=\"list-style-type: square;\">\n<li>Identify Simple Shape</li>\n<li>Identify Pivot (common point for all simple shapes)<br/><br/></li>\n</ul>\n</li>\n</ul>\n</li>\n</ul>\n<div style=\"padding-left: 40px;\"><strong><span style=\"font-size: 14pt;\">Coding:</span></strong></div>\n<ul>\n<li style=\"list-style-type: none;\">\n<ul>\n<li style=\"list-style-type: none;\">\n<ul>\n<li><span>Move turtle to where you want to draw the shape</span></li>\n<li>Write a function to draw simple shape only\n<ul>\n<li>start/end at same spot</li>\n<li>start/end facing same direction</li>\n</ul>\n</li>\n<li>Use a loop to draw simple shape ___ times\n<ul>\n<li>rotate turtle ___ degrees after each shape</li>\n</ul>\n</li>\n</ul>\n</li>\n</ul>\n</li>\n</ul>\n</details>","position":3},{"id":"g4ad5689ccb39c873933b1dedfd92f334","kind":"assignment","title":"Micro:Bit Game","nav_title":"Micro:Bit Game","published":true,"content_html":"<div class=\"item-meta\"><span class=\"meta-points\"><strong>Points:</strong> 10.0</span> &middot; <span class=\"meta-submission\"><strong>Submission type:</strong> online upload</span> &middot; <span class=\"meta-ext\"><strong>Allowed file types:</strong> py,zip</span></div><p style=\"text-align: left;\"><img alt=\"microbit illustration.PNG\" height=\"144\" loading=\"lazy\" src=\"media/web_resources/microbit-illustration.PNG\" style=\"float: right;\" width=\"182\"/>Use the examples we’ve done as reference, and create a game that uses the Micro:bit and functions!</p>\n<p style=\"text-align: left;\"> </p>\n<p>For the type of game, choose <strong>One </strong>of the following three options:<br/><br/></p>\n<p><span style=\"font-size: 14pt;\"><strong>Option One: Bop-It!</strong></span></p>\n<p><img alt=\"bop-it image.png\" height=\"151\" loading=\"lazy\" src=\"media/web_resources/Uploaded-Media/bop-it-image.png\" width=\"151\"/></p>\n<p>Using the <strong>time library </strong>as well as the <strong>A </strong>and <strong>B buttons and Accelerometer</strong> have the micro:bit display an A, B, or S, and the user must press the <span style=\"text-decoration: underline;\">correct button</span> or <span style=\"text-decoration: underline;\">shake</span> within a set amount of time.</p>\n<ul>\n<li>If the correct button is pressed within the time limit, award a point to the user and continue the game</li>\n<li>If the incorrect button is pressed or too much time is taken, end the game and report how many points the user earned.</li>\n</ul>\n<ul class=\"simple\">\n<li>You can choose to either let the user keep playing until they make a mistake, or add a limit (the user wins the game if they get a certain number right in a row).</li>\n</ul>\n<p><strong>Challenge Features:</strong></p>\n<ul>\n<li>Make the time limit to correctly press the button get shorter the further into the game you get. You could optionally give the user some 'difficulty' choice at the start that would set if this initial time is long or short when the game begins.</li>\n<li>Add two additional actions that the user could be asked to do: <strong>Tilt Left</strong> and <strong>Tilt Right.</strong> Represent these actions on the micro:bit display using the left and right arrow icons<em> (which are built-in images) </em><strong>← →</strong>\n</li>\n</ul>\n<p><span style=\"text-decoration: underline;\"><strong>Starter Tutorial Video:</strong></span></p>\n<p>If you are finding yourself stuck or not sure how to proceed further with this project, you may refer to the following tutorial video that leads through getting started with this project.</p>\n<p><iframe allow=\"accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share\" allowfullscreen=\"allowfullscreen\" height=\"315\" loading=\"lazy\" src=\"https://www.youtube.com/embed/r6ZJ5m7p3yg?si=gS_5Drf-Zlils3Db\" title=\"YouTube video player\" width=\"560\"></iframe></p>\n<p><iframe allow=\"accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share\" allowfullscreen=\"allowfullscreen\" height=\"315\" loading=\"lazy\" src=\"https://www.youtube.com/embed/GoNQt9qLzhw?si=LAa0CsSMyfBvOe9k\" title=\"YouTube video player\" width=\"560\"></iframe></p>\n<p> </p>\n<p><span style=\"font-size: 14pt;\"><strong>Option Two: Time Guesser</strong></span></p>\n<p>Using the <strong>time library </strong>as well as the <strong>A </strong>and <strong>B buttons</strong>, create a 2-player game where a number is displayed on the micro:bit, and each user presses their button (A or B) when they think that many seconds have elapsed.</p>\n<ul>\n<li>Let the user(s) choose the number of rounds to play (using <strong>input()</strong> or <strong>FreeSimpleGUI</strong>)</li>\n<li>For each round, users should get points depending on how close to the correct time they press their button.\n<ul>\n<li>Whichever user was closer should also get some amount of bonus points for being the closest that round</li>\n</ul>\n</li>\n<li>Once all the rounds are done, display on the micro:bit the results:\n<ul>\n<li>how many points each player earned</li>\n<li>who the overall winner is</li>\n</ul>\n</li>\n</ul>\n<p><strong>Challenge Features:</strong></p>\n<ul>\n<li>Use the micro:bit only for selecting the number of rounds to play at the start of the program\n<ul>\n<li>Display the default number of rounds as 5\n<ul>\n<li>If the user presses A, decrease the number of rounds</li>\n<li>if the user presses B, increase the number of rounds</li>\n<li>if the user presses A and B together, start the game with that number of rounds.</li>\n</ul>\n</li>\n</ul>\n</li>\n</ul>\n<p> </p>\n<p><span style=\"font-size: 14pt;\"><strong>Option Three: Your Choice!</strong></span></p>\n<p>If you want to take on a more challenging option for this assignment, you can create an open-ended game project. The complexity of your game should be <em>equal to or greater than </em> the two previously outlined options.</p>\n<p>You can choose any game you'd like, but here are some possible ideas:</p>\n<ul class=\"simple\">\n<li>have an “object” (led) fall from the top of the screen. The user needs to catch the object, and can move left/right by using the buttons or accelerometer. If they do not catch the object, the game ends.</li>\n<li>create a morse code visualizer, in which the user can type in a message, and the Micro:bit will display the message by flashing the LEDs using morse code. Another option would be to have the Micro:bit flash AND play beeps on your headphones (<a class=\"reference external\" href=\"https://makecode.microbit.org/projects/hack-your-headphones/make\">see how to connect your headphones to the Micro:bit</a>)</li>\n<li>A dice-based game, where shaking the microbit will roll the dice. This could be a 2-player game where each player can take a number of rolls to get as close to 31 as possible without going over to win the round. A game would be comprised of a set number of rounds, alternating which player goes first.</li>\n<li>You could create a game combining the micro:bit with the Turtle graphics library, where the micro:bit becomes the controller for the player. If you choose this option, you need to incorporate at least 2 different types of micro:bit components <em>(accelerometer, push buttons, display)</em>\n</li>\n<li>anything else you can dream up!</li>\n</ul>\n<p>You can incorporate any of the demo code we did in class into your game, but note that the game must <strong>expand</strong> <strong>on what we built as a class</strong> in a meaningful way. </p>\n<p><strong>Challenge Feature</strong></p>\n<p>Creating a custom game (choosing option 3) will be considered to include the expert challenge component as long as the game's complexity is equal to the previous 2 options + their expert challenges. If you're unsure - just check with me!</p>\n<p><strong>Some Past Student Examples:</strong></p>\n<table border=\"0\" style=\"border-collapse: collapse; width: 75.6826%; height: 257.188px;\">\n<tbody>\n<tr style=\"text-align: center; height: 228.188px;\">\n<td style=\"width: 32.0547%; height: 228.188px;\"><img alt=\"Micro-snake gif.gif\" loading=\"lazy\" src=\"media/web_resources/Uploaded-Media/Micro-snake-gif.gif\"/></td>\n<td style=\"width: 33.9724%; height: 228.188px;\"><img alt=\"Flappy Bit.gif\" height=\"242\" loading=\"lazy\" src=\"media/web_resources/Uploaded-Media/Flappy-Bit.gif\" width=\"323\"/></td>\n<td style=\"width: 33.9729%; height: 228.188px;\"><img alt=\"space bit.gif\" height=\"240\" loading=\"lazy\" src=\"media/web_resources/Uploaded-Media/space-bit.gif\" width=\"320\"/></td>\n</tr>\n<tr style=\"height: 29px;\">\n<td style=\"width: 32.0547%; height: 29px; text-align: center;\"><em>micro:snake</em></td>\n<td style=\"width: 33.9724%; height: 29px; text-align: center;\"><em>flappy:bit</em></td>\n<td style=\"width: 33.9729%; text-align: center; height: 29px;\"><em>micro:invaders</em></td>\n</tr>\n</tbody>\n</table>\n<p> </p>","position":12},{"id":"g3167ad35b003490e8e71a7f6d87cffb7","kind":"assignment","title":"Image Manipulator","nav_title":"Image Manipulator","published":true,"content_html":"<div class=\"item-meta\"><span class=\"meta-points\"><strong>Points:</strong> 10.0</span> &middot; <span class=\"meta-submission\"><strong>Submission type:</strong> online upload</span> &middot; <span class=\"meta-ext\"><strong>Allowed file types:</strong> zip</span></div><p>We've spent several days looking at how we can load and interact with images at the pixel level in Python by using a <strong>nested loop.</strong> Now it's your chance to implement a few different image effects on your own. For this assignment, you'll be asked to create solutions to four challenges from the CS20 Open Textbook: <a href=\"https://cs20.ca/Python/MoreAboutIteration/ImageProcessingWithSelection.html\">3. Image Processing with Conditionals</a></p>\n<p><em>You'll be able to re-use much of the same base code for each project.</em></p>\n<p><strong>Complete the following four exercises (Base Features):</strong></p>\n<ul>\n<li>3.4.1 No Red Left Side<br/><br/><img alt=\"Image Processing - no red solution.PNG\" height=\"153\" loading=\"lazy\" src=\"media/web_resources/Image-Processing-no-red-solution.PNG\" width=\"231\"/><br/><br/>\n</li>\n<li>3.4.3 Change the Rooster Colour<br/><br/><img alt=\"Image Processing - Change the Rooster Color Solution.PNG\" height=\"154\" loading=\"lazy\" src=\"media/web_resources/Image-Processing-Change-the-Rooster-Color-Solution.PNG\" width=\"232\"/><br/><br/>\n</li>\n<li>3.4.4 Repeat Left Twice<br/><br/><img alt=\"Image Processing - Repeat Left Twice Solution.PNG\" height=\"150\" loading=\"lazy\" src=\"media/web_resources/Image-Processing-Repeat-Left-Twice-Solution.PNG\" width=\"228\"/><br/><br/>\n</li>\n<li>3.4.6 Mirror Vertical<br/><br/><img alt=\"Image Processing - Mirror Vertical Solution.PNG\" height=\"141\" loading=\"lazy\" src=\"media/web_resources/Image-Processing-Mirror-Vertical-Solution.PNG\" width=\"215\"/>\n</li>\n</ul>\n<p><em>Don't forget a comment header and a few inline comments for each program!</em></p>\n<p>When submitting your work, please <span style=\"text-decoration: underline;\">put all the files</span> (python files and the image files being loaded) into a <span style=\"text-decoration: underline;\">single ZIP file</span> to submit.<br/><br/></p>\n<p> </p>\n<p><strong>Extra for Experts:</strong></p>\n<p>As a class, we'll do exercise 3.4.7 (Linear Gradient). For the extra for experts challenge, solve exercise <strong>3.4.8: Radial Gradient</strong></p>\n<p> <img alt=\"Image Processing Radial Gradient Solution.png\" height=\"181\" loading=\"lazy\" src=\"media/web_resources/Image-Processing-Radial-Gradient-Solution.png\" width=\"180\"/></p>\n<p><strong>Extra for Extra-Experts:  (not required at this level, but a great challenge)</strong></p>\n<p><span style=\"text-decoration: underline;\">Average Filter (Blur)</span></p>\n<p>Create a program that will set each pixel to be the <span style=\"text-decoration: underline;\">average value</span> of <em>itself and its 8 neighbours. </em>This will create a blurring effect.</p>\n<p>for any pixel (x,y), its neighbours are the 8 pixels that surround it:</p>\n<p><img alt=\"Image Processing - Neighbours.png\" loading=\"lazy\" src=\"media/web_resources/Image-Processing-Neighbours.png\"/></p>\n<p>which include (x-1, y-1),    (x-1, y),    (x-1, y+1),   (x, y-1),   (x, y+1),   (x+1, y-1),   (x+1, y),  (x+1, y+1)</p>\n<p><strong>Hints:</strong></p>\n<ul>\n<li>You should be able to use a small nested loop to look at all nine pixels for each (x,y) position.</li>\n<li>Not all pixels will have neighbours in all directions (edge pixels). Start by only <em>blurring pixels that are not on the edge</em>\n</li>\n<li>If you are able to get that to work, think about how you could extend the logic in your loop to include edge pixels <em>(but for these, how to only look at neighbours
